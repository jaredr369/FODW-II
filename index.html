the same\nday, and any activity over about 4 hours.\nFor each flag, suggest one specific change. The tool adds readings, media, and the cohort session to\nthe activity hours and checks the week against the weekly target.\n\nReturn: {\"modules\": [{\"module\": int, \"activities\": [{\"title\": string, \"rsi\": int | null, \"reason\": string}], \"categories\": [int], \"hours\": number, \"flags\": [string]}]}\n```\n\nAI instructions (AI risk):\n\n```text\nFor each high-weight activity, judge how easily a student could complete it with a general AI\ntool and no course-specific thinking: high, medium, or low. Give a one-sentence reason based on\nwhat the activity asks for. For high and medium, suggest one change that makes the student's own\nthinking visible, using their own context, process evidence, a live part, or course-specific\nmaterial. Keep the activity's CLO and verb. Do not suggest AI detection tools.\n\nReturn: {\"assessments\": [{\"module\": int, \"activity\": string, \"risk\": \"high\" | \"medium\" | \"low\", \"why\": string, \"change\": string | null}]}\n```\n\n### Save\n\nPlanning document: Learning Activities Plan Part 1 (Canvas) and Part 2 (third-party tools) rows\nin Tables 1 and 2, one line per activity, for example \"Assignment: Feedback Conversation Script\n(CLO 2, high, RSI 2; annotated and rehearsed in cohort session)\".\nProject file: `modules[].activities` (with `rsi`, `hours`, `aiRisk`, `aiPolicy`, `aiChange`),\n`modules[].toolActivities`; in refresh, `.original`.\n\n### Go deeper (supplemental)\n\n- `src:guide-learning-activities`\n- `src:guide-rubrics`\n- `src:guide-third-party-tools`\n- `src:ext-tamu-ai-guidelines`\n- `src:ext-terry-2023`\n\n---\n\n## 4.4 A week in your student's shoes\n\nTime: about 20 minutes, a few minutes a module\nPattern: a week in your student's shoes\n\n### Learn\n\n::: purpose\n**What you'll do:** Read an AI walk-through of each module's week from a student's point of view,\nand note what feels heavy, thin, or silent.\n\n**Why it matters:** A plan can pass every check and still feel wrong to a student. Seeing the week\nas they'll live it shows problems that numbers miss.\n:::\n\nThe walk-through follows one of your students through the week: what they open on Monday, what they\nread, do, and submit, when they hear from you, and how long it takes. If something needs fixing, go\nback to step 4.3.\n\nReadings and media aren't planned yet, so the walk-through uses placeholders for them. It updates\nas you plan materials in Module 5 and media in Module 6, and Module 8 shows the full week.\n\n### See it\n\nHere's MGMT 615's Module 3 week as a student would live it, and what the instructor changed.\n\n::: figure week | MGMT 615, Module 3: a student's week\n- Mon | **Announcement:** Greg wants a formal warning for Jordan. **Perusall reading:** start annotating the feedback chapter (about 1.5 hours over two days).\n- Tue | **Perusall reading:** finish the annotations.\n- Wed | **Interactive:** coaching-or-discipline sort (30 minutes).\n- Thu | **Instructor reply:** a question in the student's Perusall thread. **Cohort session:** rehearse the opening of the conversation with a partner (90 minutes).\n- Fri |\n- Sat | **Assignment:** draft the whole feedback script and annotate each line (about 4 hours).\n- Sun |\n- Note | The heaviest point is Saturday: the whole script in one sitting. The instructor's fix: open the script on Wednesday and make it due Sunday, so students can start it after the cohort session.\n:::\n\n### Draft (full build) and Review (refresh)\n\nSelect the button below. The AI walks through each module's week as one of your students, then\nnames the heaviest point, any stretch of three or more days without hearing from you, and anything\na student might not understand the purpose of.\n\nAI instructions:\n\n```text\nWalk through the given module's week as one of the course's students, in first person and in\ntime order, using the learner description, the saved activities, the interaction statement, the\nscenario, and a 90-minute cohort session. Use [reading] and [video] placeholders where materials\naren't planned yet. Give rough hours for each part and a total. Then list, in one line each:\nthe heaviest point in the week, any stretch of three or more days with no contact from the\ninstructor, and anything a student might not understand the purpose of. Under 200 words.\n\nReturn: {\"walkthrough\": string, \"hours\": number, \"heaviest\": string, \"silent\": string | null, \"unclear\": string | null}\n```\n\nDemo response (MGMT 615):\n\n**Module 3: Performance Management and Feedback**\n\n\"Monday, an announcement picks up Dana's story: Greg wants a formal warning for Jordan. Monday and\nTuesday I spend about an hour and a half annotating the feedback chapter in Perusall. Wednesday\nnight I do the 30-minute coaching-or-discipline sort. Thursday the instructor replies to my\nPerusall thread with a question about Jordan, and in the cohort session I rehearse the opening of\nthe conversation with a partner. Saturday I draft the whole feedback script and annotate why each\nline is there, about four hours. I hear from the instructor three times this week.\"\n\n- **Total:** about 6 hours of activities, plus the 90-minute cohort session.\n- **Heaviest point:** Saturday, the whole script in one sitting.\n- **Days without contact:** none.\n- **Unclear purpose:** none.\n\n### Decide\n\nNote anything you want to change, module by module. These are your own notes, so there's no AI\nredraft here. To make a change, go back to step 4.3 and edit that module's activities.\n\n::: fields notes\n- Your notes on any week that feels heavy, thin, or silent, one module per line | Module 3: Saturday is the whole assignment. Open the script Wednesday and make it due Sunday.\n:::\n\nChecklist:\n\n- No week has one day carrying most of the work.\n- Students hear from you at least twice a week.\n\n### Checks\n\nThis step has no checks of its own. Step 4.3's checks run again whenever you change a module's\nactivities.\n\n### Save\n\nSaved with your project. Your notes stay with each module's plan for your ID to see at your\ncheck-in.\nProject file: `modules[].weekWalk` (walk-through, hours, reaction).\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Activities for all eight modules: three main assignments moved onto the storyline\", \"Module 5 Perusall: instructor replies added\", \"Module 8: summary draft moved to Module 7\", \"AI changes for three high-risk assessments\"],\n  \"keptFlags\": [],\n  \"questions\": [\"Is roughly 6 hours of activities a module the right target for this program?\", \"Should students be allowed to draft with AI on the change message if they critique the draft?\"]\n}\n```\n\nProject file: `checkins.prep.m4`.\n"}, {"id": "m5", "file": "05-materials.md", "raw": "# Module 5. Learning Materials and Responsible Use\n\nModule id: `m5`\nSteps: 2\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: the learning materials for each module, with rights status, attribution, and\nAI-use notes.\n\nRefresh checks for this module: dated sources, missing attribution, unclear rights.\n\nSources: `src:reading-m5-materials-plan`, `src:assignment-m5-materials-rights-review`,\n`src:assignment-m5-writing-attributions`, `src:guide-copyright`, `src:guide-curating-creating`,\n`src:guide-instructor-authored-reading`, `src:guide-accessibility`,\n`src:example-mgmt615-course-map`\n\nDemo data: `demo/mgmt615-materials.json`\n\n## Refresh reflection\n\n> App note: Shown once, in the refresh track only, before step 5.1. It asks only about materials the\n> course already has.\n\n::: purpose\n**What you'll do:** Answer a few questions about the materials in the last version of your course.\nAnswer whichever apply; short notes are fine.\n\n**Why it matters:** The AI uses your answers when it reviews each section in this module, so its\nsuggestions reflect what actually happened in your course.\n:::\n\n1. Which readings or videos did students skip, struggle with, or tell you were out of date?\n2. Which materials do students still bring up later in the course?\n3. Is there anything you've been meaning to replace?\n4. Which materials would you keep exactly as they are?\n\n> App note: AI instructions are the same as the Module 1 reflection instruction.\n\nDemo answers (MGMT 615): (1) \"The SBI job aid confuses people; it's a photocopy of a diagram.\"\n(2) \"The Marsh chapters.\" (3) \"Nothing specific.\" (4) \"Both Marsh chapters and the Park and Marsh\narticle.\"\n\nProject file: `reflection.m5`.\n\n---\n\n## 5.1 Materials for every module\n\nTime: about 40 minutes, about 5 minutes a module\nPattern: pick and combine, one module at a time (full build); edit in place (refresh)\n\n### Learn\n\n::: purpose\n::: full\n**What you'll do:** Plan the learning materials for each module: what students will read, watch, or\nwork with to get ready for the module's decision.\n:::\n\n::: refresh\n**What you'll do:** Review and update the learning materials for each module: what students read,\nwatch, or work with to get ready for the module's decision.\n:::\n\n**Why it matters:** Materials fill much of a student's week, so each item should earn its place by\npreparing students for a specific activity.\n:::\n\n::: refresh\nYou planned your materials in your first workshop. As you review, check that each item still\nprepares students for a named activity, that sources are current, and that each module's required\nreading stays between 5 and 25 pages. Below is what's new since then: your scenario as a material, and\nfinding sources with AI.\n\n**Too much, not too weak.** Sometimes every material is good but a module simply has more than a\nweek can hold. You don't have to cut anything: move some items to **Supplemental**. Supplemental items stay in\nthe module for students who want more, but they're optional, no activity depends on them, and they\ndon't count toward the week.\n:::\n\n::: refresher\nLearning materials are everything in a module that isn't an activity. The types below run from\nleast to most effort to produce:\n\n| Type | Effort | Use when |\n|---|---|---|\n| Curated reading (article, chapter, report, case) | Lowest | A good source exists. This is the default. |\n| Curated video | Low | An existing video covers it well, in 6 to 10 minutes or less. |\n| Instructor-authored reading (4 to 10 pages) | Several hours each | Nothing curated fits, or your own experience is the point. |\n| Interactive reading (built by your ID) | High | Complex content that benefits from short sections and knowledge checks. |\n| Instructor-recorded video | Highest | Planned in Module 6, up to 30 minutes of scripted video and audio a module. |\n:::\n\n**Your scenario is a material too.** The narrative, and any exhibits the character works from (an\nemail from a boss, a dashboard, a complaint), are created content. List them with your other\nmaterials.\n\n**Finding sources with AI.** TAMU AI Chat allows you to sign in with your university credentials and\noffers several AI models to choose from. In your request, describe the CLO, the topic, your\nstudents, and the kind of source you want. Check every suggestion before you list it. Each source should have a credible\nauthor, be current and stable, and tie to an objective. You can also search TAMU Libraries. Link to\nthe library record instead of uploading a PDF, so there's no file to manage in Canvas.\n\n::: refresher\n**Load.** Plan 5 to 25 pages of required reading per module, adjusted for how dense the reading\nis. At 6 to 10 pages\nan hour, that's about 1 to 3 hours. With up to 30 minutes of scripted video and audio, a few short\ncurated videos, roughly 6 hours of activities, and the 90-minute cohort session, the week comes to\nclose to 10 hours. Module 1 targets about 4 hours in all, so keep any reading in it light.\n:::\n\n### See it\n\n::: full\nHere's the materials plan the MGMT 615 instructor settled on for Module 4. Every item prepares\nstudents for the team diagnosis memo, and the reading comes to about 21 pages.\n:::\n\n::: refresh\nHere's MGMT 615's Module 4 after the review. A supplemental article on designing team assignments\nwas removed because it was about course design, not content for students. The reading comes to\nabout 21 pages.\n:::\n\n::: plan Learning Materials Plan, Module 4\n- Article: Park & Marsh (2024), What actually predicts team performance (11 pp.)\n- Case: The Team That Couldn't Ship, a contrast case (6 pp.)\n- Interactive reading: Diagnose the Team, Not the Person (4 pp.)\n:::\n\n### Draft (full build) and Review (refresh)\n\n::: full\nWork through your modules one at a time. Choose a module, then select the button below. The AI\nsuggests what the module's materials should cover, from its CLOs, topics, scenario, and activities.\nIt can't check that a specific source exists, so it never names one: for each curated reading it\ngives a search prompt you can paste into TAMU AI Chat or the TAMU Libraries search. Select **Use\nthese materials** to copy the list into the boxes under Decide, then replace each suggestion with\nthe source you choose.\n:::\n\n::: refresh\nWork through your modules one at a time: choose a module above, then select the button below. The\nAI reviews the materials in your box. It checks each one, says what it would keep, replace, move to\nSupplemental, or remove and why, and adds any scenario exhibits that are missing. It never names a\nnew source; for a replacement it gives a search prompt instead. Select **Apply these materials** to\nput the reviewed list in your box.\n:::\n\n::: module-picker\n:::\n\n::: current materials\n:::\n\n::: full\nAI instructions:\n\n```text\nFor the given module, using its CLOs, topics, scenario, and activities, propose a materials list.\nEach item gives: type (curated reading, curated video, instructor-authored reading, interactive\nreading, scenario exhibit), what it must cover, the activity it prepares students for, and an\nestimated page count or minutes. Prefer curated types. Always include the scenario narrative and any\nexhibits the character works from. Never name a specific article, book, author, or video. For each\ncurated item, write one search prompt the faculty member can paste into TAMU AI Chat or the TAMU\nLibraries search.\n\nReturn: {\"items\": [{\"type\": string, \"covers\": string, \"supports\": string, \"pages\": number | null, \"minutes\": number | null, \"searchPrompt\": string | null}]}\n```\n:::\n\n::: refresh\nAI instructions:\n\n```text\nFor each current material in the given module, check: it prepares students for a named activity;\nit is content for students; its date (flag anything older than 5 years unless it is a classic in\nthe field, and say so); the scenario narrative and exhibits are listed. Suggest keep, replace (say\nwhat a replacement should cover, never a specific source), supplemental, or remove, with a reason.\nIf required reading is over 25 pages (about 8 in Module 1) and the items are sound, suggest moving\nthe ones that least directly prepare students for the main activity to supplemental instead of\nremoving them, until the module is back in range. Supplemental items don't count toward the load.\nAdd missing scenario exhibits.\n\nReturn: {\"items\": [{\"original\": string, \"action\": \"keep\" | \"replace\" | \"supplemental\" | \"remove\", \"issues\": [string], \"replacementCovers\": string | null}], \"add\": [string]}\n```\n:::\n\nDemo response (MGMT 615):\n\n::: module-options\n:::\n\n### Decide\n\nYour final materials for each module go in this box. Type in it to change anything, or select\n**Redraft with AI** under it to have the AI rewrite it. To work on another module, choose it above;\nwhat you've typed is kept.\n\n::: refresh\nEach module's box starts with that module's materials from your Course Map, and the box is what's saved.\nSelect **Review with AI** below for the AI's review, then **Apply these materials** to put its version in the\nbox. **Back to my Course Map text** undoes any change.\n:::\n\nFor each item, give the type, the title, the author and year if it has them, the pages or minutes,\nand the activity it prepares students for. Start a line with \"Supplemental:\" for an optional item;\nit stays in the module but isn't counted. The required reading pages feed the week check in Module\n4.\n\n::: module-fields\n:::\n\nChecklist:\n\n- Every item prepares students for a named activity.\n- The scenario and its exhibits are listed.\n- You've checked each curated source yourself.\n\n### Checks\n\nWhen you save each module, the tool checks that:\n\n- every required item is tied to an activity;\n- required reading comes to 5 to 25 pages (about 8 or fewer in Module 1), adjusted for how dense it\n  is;\n- items older than 5 years are flagged unless they're classics;\n- the scenario and its exhibits are listed.\n\nThe week check in Module 4 then uses your real reading load instead of an estimate.\n\n### Save\n\nPlanning document: Learning Materials Plan row in Tables 1 and 2, one line per item, for example\n\"Article: Park & Marsh (2024), What actually predicts team performance (11 pp.)\". Supplemental items\nare listed last, marked \"Supplemental\".\nProject file: `modules[].materials`; in refresh, `.original`.\n\n### Go deeper (supplemental)\n\n- `src:guide-curating-creating`\n- `src:guide-instructor-authored-reading`\n- `src:guide-accessibility`\n\n---\n\n## 5.2 Rights, attribution, and AI notes\n\nTime: about 25 minutes\nPattern: spot the problem, then edit in place\n\n### Learn\n\n::: purpose\n::: full\n**What you'll do:** For each material, record its rights status, an attribution line, and a note if\nAI helped make it.\n:::\n\n::: refresh\n**What you'll do:** Review the rights status, attribution line, and AI note for each material, and\nupdate any that are missing or out of date.\n:::\n\n**Why it matters:** Using material without the right permission puts you and the university at legal\nrisk. Clear attributions and AI notes also show students the integrity you ask of them.\n:::\n\n::: refresh\nYou covered copyright and attribution in your first workshop. As you review, check that every\nmaterial still has a library link, an open license, a public link, or permission, plus an\nattribution line. Below is what's new since then: a note for anything made with AI.\n:::\n\n::: refresher\nEverything you use is protected by copyright unless it says otherwise, and the lack of a notice\ndoesn't make it free. For each material, you need one of four things. Check for them in this\norder:\n\n::: figure trace | Can I use it? Check in this order\n- 1. Is it in TAMU Libraries? | Link to the library record. Students sign in with their NetID.\n- 2. Does it have an open license, such as Creative Commons? | Use it, and name the license in your attribution.\n- 3. Is it a public page or video? | Link to it. Never download it and re-upload it.\n- 4. None of these? | Ask the owner for permission, or choose something else.\n- Credit | Based on the Mays Teaching & Learning Innovation guide to copyright and fair use.\n:::\n\nWhen you're unsure, link instead of uploading.\n\n**Fair use** can cover limited educational use, but it's a judgment on four factors: purpose,\nthe nature of the work, how much you use, and the effect on the market. It's never blanket\npermission, and paywalled content can't be uploaded for students.\n\n**Attribution** credits the creator: title, author, source, and license. Include an attribution\neven when the license doesn't require one.\n:::\n\n**AI-assisted content.** If you used AI to draft a scenario, an exhibit, an image, or part of a\nreading, tell students. Check it for accuracy and for anything that closely reproduces someone\nelse's work, and ask your ID before treating it as your own original work. The [U.S.\nCopyright Office](src:ext-copyright-office-ai) has said that purely AI-generated material isn't protected by copyright.\n\n**Spot the problem.** Before you check your own materials, practice on one. Read the item below,\nsay in a sentence or two what's wrong with it and how you'd fix it, then select **Check my\nanswer**.\n\n> Item: \"Image: diagram of the SBI feedback model, found through a web image search. Used on\n> slide 3 and in the job aid.\"\n\n::: check\n- What's wrong with this item, and how would you fix it?\nFeedback: You're right if you spotted that the rights are unclear: there's no creator or license, so\nyou can't tell whether you may use it. It's also reused in two places, so the problem doubles. Fix\nit by finding a licensed version, or by redrawing it as your own content with an attribution line\nfor the model: \"Based on the Situation-Behavior-Impact model (Center for Creative Leadership).\"\n:::\n\n### See it\n\nMGMT 615's SBI job aid was a photocopied diagram with no attribution, and the instructor's\nreflection said students found it confusing. The instructor redrew it as a one-page job aid of their\nown. Two items were drafted with AI, so each got a disclosure note.\n\n::: plan Learning Materials Plan, Module 3 (rights)\n- Book chapter: Marsh (2021), Ch. 4: Feedback That Lands (library)\n- Job aid: The SBI Feedback Model, One Page (created). Based on the Situation-Behavior-Impact model (Center for Creative Leadership).\n- Interactive reading: Script Your Feedback Conversation (created)\n:::\n\n### Draft (full build) and Review (refresh)\n\n::: full\nWork through your modules one at a time. Choose a module, then select the button below. The AI\nproposes each material's rights status, an attribution line, and, for anything made with AI help,\na disclosure note. It never invents missing details: anything you need to confirm is marked\n[check]. Select **Use these notes** to copy them into the boxes under Decide.\n:::\n\n::: refresh\nWork through your modules one at a time. Choose a module, then select the button below. The AI\nstarts from the rights notes and attributions in your Course Map. It flags any rights status that's\nunclear, any attribution that's missing or incomplete, and any AI-assisted item without a note, and\nsuggests a fix for each. It never invents missing details: anything you need to confirm is marked\n[check]. Select **Use these notes** to copy them into the boxes under Decide.\n:::\n\n::: module-picker\n:::\n\nAI instructions:\n\n```text\nFor each material, from the faculty member's answers (source, link, license if known, whether AI\nhelped create it), set rights to one of: library, open (name the license), public (linked, not\nuploaded), created, ai-assisted, unclear. Write an attribution line with creator, title, source,\nand license where known; do not invent missing details, use [check] instead. For ai-assisted\nitems, write a one-sentence disclosure note. For unclear items, suggest the safest fix: link\ninstead of upload, find a licensed alternative, or recreate it. If the Course Map already has rights\nnotes or attributions, start from them and flag what's unclear, missing, or out of date.\n\nReturn: {\"items\": [{\"title\": string, \"rights\": string, \"attribution\": string, \"aiNote\": string | null, \"fix\": string | null}]}\n```\n\nDemo response (MGMT 615):\n\n::: module-options\n:::\n\n### Decide\n\nYour final rights notes for each module go in these boxes. Type in any box to change it, or select\n**Redraft with AI** under a box to have the AI rewrite just that part. Confirm or replace anything\nmarked [check].\n\n::: module-fields\n:::\n\nChecklist:\n\n- Every item has a rights status other than unclear, or a fix you plan to make.\n- Nothing paywalled is uploaded.\n- Every AI-assisted item has a disclosure note.\n\n### Checks\n\nWhen you save each module, the tool confirms that:\n\n- no item is left unclear without a fix;\n- every item has an attribution or is your own created work;\n- every AI-assisted item has a disclosure note;\n- no library or paywalled item is marked for upload.\n\n### Save\n\nPlanning document: each material line in the Learning Materials Plan row gains its rights status\nand, for AI-assisted items, \"(AI-assisted, disclosed)\". Full attribution lines go to the project\nfile and the check-in summary.\nProject file: `modules[].materials[].rights`, `.attribution`, `.aiNote`.\n\n### Go deeper (supplemental)\n\n- `src:guide-copyright`\n- `src:ext-copyright-office-ai`\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Materials for all eight modules, about 17 to 24 pages each\", \"Scenario exhibits added in four modules\", \"SBI job aid redrawn and attributed\", \"AI disclosure on two items\"],\n  \"keptFlags\": [\"Whitfield (2019) chapters kept: no newer edition\"],\n  \"questions\": [\"Can the Learning Media Team redraw the SBI job aid, or should I?\", \"Do the created cases from earlier terms need any review before reuse?\"]\n}\n```\n\nProject file: `checkins.prep.m5`.\n"}, {"id": "m6", "file": "06-media.md", "raw": "# Module 6. Audiovisual Aspects of Storytelling\n\nModule id: `m6`\nSteps: 2\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: the media plan for each module, with each item's connection to the storyline,\nand a first script ready for the XR stage.\n\nRefresh checks for this module: dated media; required welcome, overview, and closing videos\npresent.\n\nSources: `src:reading-m6-planning-media`, `src:assignment-m6-media-planning`,\n`src:template-av-script`, `src:guide-script-writing`, `src:guide-planning-media`,\n`src:example-mgmt615-course-map`\n\nDemo data: `demo/mgmt615-media.json`\n\n## Refresh reflection\n\n> App note: Shown once, in the refresh track only, before step 6.1. It asks only about the course's\n> existing videos and graphics.\n\n::: purpose\n**What you'll do:** Answer a few questions about the videos and graphics in the last version of your\ncourse. Answer whichever apply; short notes are fine.\n\n**Why it matters:** The AI uses your answers when it reviews each section in this module, so its\nsuggestions reflect what actually happened in your course.\n:::\n\n1. Which videos do students mention, and which do they seem to skip?\n2. Which videos are out of date: wrong numbers, old examples, a different version of you?\n3. Which visuals do students need that the course doesn't have yet?\n4. Which videos would you keep exactly as they are?\n\n> App note: AI instructions are the same as the Module 1 reflection instruction.\n\nDemo answers (MGMT 615): (1) \"They mention the role-plays. Nobody mentions the discussion\nprimers.\" (2) \"None, really.\" (3) \"A picture of the shift handoff.\" (4) \"The role-plays and the feedback video.\"\n\nProject file: `reflection.m6`.\n\n---\n\n## 6.1 Media for every module\n\nTime: about 40 minutes, about 5 minutes a module\nPattern: pick and combine, one module at a time (full build); edit in place (refresh)\n\n### Learn\n\n::: purpose\n::: full\n**What you'll do:** Plan the media to be produced for each module: video, audio, and graphics,\nincluding the videos every course requires.\n:::\n\n::: refresh\n**What you'll do:** Review and update the media to be produced for each module: video, audio, and\ngraphics, including the videos every course requires.\n:::\n\n**Why it matters:** Media takes the longest to produce, so planning it now gives you and the\nLearning Media Team time to make it well.\n:::\n\n::: refresh\nYou planned media in your first workshop. As you review, check that each module still has its\noverview video, that recorded media stays within 30 minutes a module, and that each item adds\nsomething a reading can't. Below is what's new since then: media for your story, the XR stage, and One-Touch\nstudios.\n:::\n\n::: refresher\nLearning media is the video, audio, and graphics made for your course, by you and the Learning\nMedia Team. Curated videos from other sources belong in your materials plan\n(Module 5), not here.\n\n| Kind | Required? | Typical length | Who makes it |\n|---|---|---|---|\n| Welcome video | Yes, in Module 1 | About 3 minutes | Learning Media Team records you on an XR stage |\n| Module overview video | Yes, in every module | About 2 minutes | Learning Media Team records you on an XR stage |\n| Closing video | Yes, in the last module | 2 to 3 minutes | Learning Media Team records you on an XR stage |\n| Teaching video (lecture, worked example, demonstration) | No | 6 minutes or less, or split into parts | Learning Media Team records you on an XR stage, or you record in a One-Touch studio |\n| Scenario video | No | 2 to 5 minutes | Learning Media Team records you on an XR stage |\n| Audio, such as a short podcast | No | A few minutes | Learning Media Team records you in the studio |\n| Graphic, such as an infographic | No | None | A graphic designer |\n\n**Why the required videos matter.** The welcome, overview, and closing videos are how students see\nand hear you each week. They're part of your presence in the course and support RSI.\n\n**Limits.** Video and audio you script and record should total no more than 30 minutes a module.\nCurated videos from other sources (planned in Module 5) have no total limit, but each should run 6\nto 10 minutes at most, and their time counts toward the week's roughly 2 hours of readings and\nmedia. Engagement drops sharply after about six minutes of watching ([Guo, Kim, & Rubin, 2014](src:ext-guo-2014)), so\nsplit anything longer into short parts.\n\n**What to record.** Beyond the required videos, save recorded media for what text can't do well: a\ntopic too complex for many students to grasp from reading alone, a process they need to watch, or a\nmoment of tension from your story. Keep every item concise, and don't repeat what another material\nalready covers.\n:::\n\n**Media for your story.** Go through your scenarios and decide which ones need to be produced as\nvideo or audio. A scenario\nvideo opens in the character's situation and ends at the decision, before the answer, so the\nactivity that follows has something to work on. Many scenarios work fine as readings or\ndiscussion cases with no production at all.\n\n**The XR stage.** Most instructor videos are recorded on the XR stage, which places you in a\nvirtual setting, such as a studio or an office, without filming on location. Each video starts with an A/V script (you'll draft\nyour first in step 6.2), and you schedule a practice session on the stage with the Learning Media\nTeam before recording.\n\n**One-Touch studios.** These small studios let you create screen-recorded videos on your own, to\nillustrate a process or teach with your slides. Videos you make there count toward your 30 minutes\nof recorded media.\n\n### See it\n\n::: full\nHere's the media plan the MGMT 615 instructor settled on for Module 4. Every item connects to the\nstoryline, and the scripted video comes to 11 minutes, well under the 30-minute limit.\n:::\n\n::: refresh\nHere's MGMT 615's Module 4 after the review. The course had no module overview videos, so the\nreview added one to every module, all recorded in a single XR stage session. The scripted video\ncomes to 11 minutes.\n:::\n\n::: plan Learning Media Plan, Module 4\n- Overview video (XR stage): Module 4 overview, 2 min. Story: The handoff nobody owns.\n- Teaching video (XR stage): Why Some Teams Just Work, 6 min. Story: Diagnoses the two-shift handoff with the framework.\n- Graphic (Learning Media Team): The 4:45 p.m. handoff, day shift to night shift. Story: Shows what falls between the shifts.\n- Scenario video (Learning Media Team): Structural Fixes vs. Pep Talks, 3 min. Story: Greg's team-building lunch against a handoff owner.\n:::\n\n### Draft (full build) and Review (refresh)\n\n::: full\nWork through your modules one at a time. Choose a module, then select the button below. The AI\nproposes the module's media from its scenario, activities, and materials, including the required\nvideos, and checks the time. Select **Use this media plan** to copy the list into the box under\nDecide.\n:::\n\n::: refresh\nWork through your modules one at a time: choose a module above, then select the button below. The\nAI reviews the media in your box. It checks each item, says what it would keep, revise, or replace\nand why, adds any required video that's missing, and checks the time. Select **Apply this media\nplan** to put the reviewed list in your box.\n:::\n\n::: module-picker\n:::\n\n::: current media\n:::\n\n::: full\nAI instructions:\n\n```text\nFor the given module, using its scenario, activities, and materials, propose its media list.\nAlways include a module overview video of about 2 minutes; include the welcome video in Module 1\nand the closing video in the last module. For each item give: kind (welcome, overview, teaching,\nscenario, closing, graphic, audio), a working title, minutes, where it is made (xr-stage for\ninstructor videos, media-team for produced scenarios and graphics, one-touch for screen\nrecordings made in a One-Touch studio), one sentence on what it adds that a reading can't, and its connection to the\nstoryline. Keep scripted video and audio at or under 30 minutes for the module, and each video at\nor under 6 minutes unless it is split into parts.\n\nReturn: {\"items\": [{\"kind\": string, \"title\": string, \"minutes\": number, \"where\": string, \"adds\": string, \"story\": string}]}\n```\n:::\n\n::: refresh\nAI instructions:\n\n```text\nFor each current media item in the given module, check: it adds something a reading can't; it\ndoesn't repeat other content; its length (flag over 6 minutes unless split into parts); it\nconnects to the storyline or could with a small change (say what). Flag the module if it has no\noverview video, if Module 1 has no welcome video, or if the last module has no closing video.\nSuggest keep, revise (say how), or replace. Use the faculty member's reflection on dated videos.\n\nReturn: {\"items\": [{\"original\": string, \"action\": \"keep\" | \"revise\" | \"replace\", \"issues\": [string], \"suggestion\": string | null}], \"missingRequired\": [string]}\n```\n:::\n\nDemo response (MGMT 615):\n\n::: module-options\n:::\n\n### Decide\n\nYour final media plan for each module goes in this box. Type in it to change anything, or select\n**Redraft with AI** under it to have the AI rewrite it. To work on another module, choose it above;\nwhat you've typed is kept.\n\n::: refresh\nEach module's box starts with that module's media from your Course Map, and the box is what's saved.\nSelect **Review with AI** below for the AI's review, then **Apply this media plan** to put its version in the\nbox. **Back to my Course Map text** undoes any change.\n:::\n\nFor each item, give the kind, who makes it, the title, the minutes, and its connection to your\nstory. The minutes feed the week check in Module 4.\n\n::: module-fields\n:::\n\nChecklist:\n\n- The overview video is there, plus the welcome video in Module 1 and the closing video in the last\n  module.\n- Each item adds something a reading can't.\n- You know which items you'll record on the XR stage.\n\n### Checks\n\nWhen you save each module, the tool checks that:\n\n- the required videos are there;\n- scripted video and audio come to 30 minutes or less;\n- each video runs 6 minutes or less, or is split into parts;\n- every item names its connection to the storyline.\n\nThe week check in Module 4 then uses your real media time instead of an estimate.\n\n### Save\n\nPlanning document: Learning Media Plan row in Tables 1 and 2, one line per item, for example\n\"Scenario video (Learning Media Team): The First Bad Week, 2.5 min. Story: Dana's Monday report and\nGreg's email, ending at her decision.\"\nProject file: `modules[].media`; in refresh, `.original`.\n\n### Go deeper (supplemental)\n\n- `src:guide-planning-media`\n- `src:ext-guo-2014`\n\n---\n\n## 6.2 Your first script and the XR stage\n\nTime: about 25 minutes\nPattern: interview, then draft (full build); upload, then convert (refresh)\n\n### Learn\n\n::: purpose\n::: full\n**What you'll do:** Draft one A/V/E script, usually for your welcome video or your Module 1 overview.\n:::\n\n::: refresh\n**What you'll do:** Convert one of your existing A/V scripts to an A/V/E script, usually for your\nwelcome video or a module overview.\n:::\n\n::: full\n**Why it matters:** Writing one script now, with feedback, makes the rest faster during development.\nYour ID reviews it with you before your practice session on the XR stage.\n:::\n\n::: refresh\n**Why it matters:** Converting one script now, with feedback, makes the rest faster during\ndevelopment. Your ID reviews it with you before your practice session on the XR stage.\n:::\n:::\n\nEvery video you record on the XR stage starts with an A/V/E (audio, video, and environment) script,\nwritten in the Learning Media Team's\n[A/V/E script template](src:template-av-script). It\nhas three columns:\n\n- **Dialogue (Audio):** what you'll say.\n- **Graphics (Video):** what appears on screen, usually your slides.\n- **Environment:** the virtual background behind you on the XR stage.\n\nThe script runs in five parts:\n\n- **Opening:** the Flex Online intro graphic and music. There's no dialogue, and the Learning Media\n  Team fills it in.\n- **Video Introduction:** greet students and say exactly what the video covers.\n- **Video Content:** the main ideas, in short chunks of two to four sentences. Add chunks as needed.\n- **Video Conclusion:** restate what matters, give students one thing to do next, and close with\n  your concluding remarks.\n- **Closing:** the Texas A&M branding and music, also filled in for you.\n\n**Keep it simple.** Choose one background with the Learning Media Team and teach with slides. In\nthe Graphics column, note the slide or image you want with each chunk; the team builds the final\ngraphics. Anything in square brackets, such as [Close-up shot], is a note to the team, not\nsomething you say.\n\n::: refresh\n**Converting a script you already have.** Your course's existing videos were scripted in the\ntwo-column A/V template. Converting one keeps your dialogue and adds what the XR stage needs: your\nsections become the five parts, your graphics go in the Graphics column, and the Environment column\nnames the background behind you.\n\n**Adding your story.** Your current videos were scripted before your course had a character. An\noverview video works best when it follows the same rule as your story-based assignment in step 4.1:\nopen in your character's situation and stop at the decision. When the AI converts your script, it\nsuggests an opening and an ending that do this. You keep or skip each suggestion; everything else\nstays in your words.\n:::\n\n**Write for the ear.** Use contractions and full sentences, and read it aloud as you write; if a\nsentence is awkward spoken, rewrite it. Say anything a student needs to know, so nothing depends\nonly on what's on screen. Most scripts run 250 to 350 words, about 2 to 2.5 minutes spoken. An AI\ntool such as ScriptWise can help: paste in your draft and ask it to tighten the wording for the ear\nor cut it to length.\n\nYour ID and the Learning Media Team will help with the rest of your scripts during development.\n\n**Getting ready for the stage.** Send the finished script to your ID, who passes it to the Learning\nMedia Team's Writer/Producer. The Writer/Producer gets your script ready for production. Schedule a\npractice session on the XR stage with the Learning Media Team. Record your required videos in as\nfew sessions as you can; MGMT 615 recorded all eight module overviews in one.\n\n### See it\n\nHere's MGMT 615's welcome video, written in the A/V/E script template.\n\n**Title:** Welcome to MGMT 615. **Duration:** about 2.5 minutes. **Module & Section:** Getting\nStarted, welcome video.\n\n| Part | Dialogue (Audio) | Graphics (Video) | Environment |\n|---|---|---|---|\n| Opening | (No dialogue) | [Intro Graphic: Flex Online, Mays Business School, MGMT 615, Welcome to MGMT 615] [Intro Music] | |\n| Video Introduction | Howdy, and welcome to MGMT 615. Over the next eight weeks, you'll follow one manager, Dana Ortiz, through the hardest stretch of her first year running a distribution center. | [Close-up shot] Slide: course title and Dana's photo | Virtual podcast studio, chosen with the Learning Media Team |\n| Video Content | Each module puts you inside one of Dana's decisions: a shift that's falling behind, a bonus nobody wants to lose, a director who's sure he's right. You'll decide what you'd do before you find out what she did, and then we'll talk about why. | Slide: three snapshots from Dana's story | Same |\n| Video Content | Here's how a week works. You'll read and watch early in the week, post to the discussion by Wednesday, and finish the main assignment by Sunday night. From Module 2 on, we'll also meet live for a 90-minute cohort session, where you'll work through Dana's decisions with your classmates. | Slide: a typical week, Monday to Sunday | Same |\n| Video Content | You don't need management experience to do well here. You need to be willing to make a call with incomplete information and explain your reasoning. That's the job Dana has, and it's the job many of you have now or will soon. | [Dynamic zoom in] | Same |\n| Video Conclusion | Start with the Getting Started module, then meet Dana in Module 1. Read her Monday report before anything else; it's where her story begins. | Slide: Start here, then Module 1 | Same |\n| Video Conclusion | I'm glad you're here, and I'm looking forward to working through this with you. Thanks, and gig 'em! | [Close-up shot] | Same |\n| Closing | (No dialogue) | [Outro Graphic: Branding of Texas A&M University] [Outro Music] | |\n\n::: refresh\n**Converting a script.** The MGMT 615 instructor converted the Module 1 overview. A few lines,\nbefore and after:\n\n| Part | Before (A/V script) | After (A/V/E script) |\n|---|---|---|\n| Opening line | Hello, and welcome to Module 1. | Howdy. This week you meet Dana Ortiz. (story added) |\n| Coaching line | \"Your best player isn't automatically your best coach.\" | The same words, now in a Video Content chunk |\n| Slide notes | In the Video column | In the Graphics column |\n| Background | None | Virtual podcast studio, in the new Environment column |\n| Last line | See you next week. | Hold off on deciding about Jordan until you've read it. (story added) |\n\nThe full conversion is the recorded response under Draft.\n:::\n\n### Draft (full build) and Convert (refresh)\n\n::: full\nAnswer the questions, then select the button below. The AI drafts the script in the A/V/E\ntemplate, in your voice and at the planned length. Select **Use this script** to copy it into the\nscript form under Decide.\n\n::: fields\n- Which video are you scripting: your welcome video, a module overview, or a scenario video from your media plan? | The Module 1 overview, 2 minutes.\n- What should students feel or understand by the end? | That a manager's job is different from the job Dana just left, and that Greg's quick answer deserves a second look.\n- Is there a phrase or story you always use when you introduce this? | \"Your best player isn't automatically your best coach.\"\n:::\n:::\n\n::: refresh\nUpload one of your current A/V scripts as a Word file, or paste its text, usually your welcome video\nor a module overview. Then select the button below. The AI converts it to the A/V/E template: it\nkeeps your words, maps your sections to the five parts, moves your graphics into the Graphics\ncolumn, and adds the Environment column. It also suggests where your story could open and close the\nvideo, and flags anything that runs long or appears only on screen. It lists every change, so you\ncan keep or skip each one. Select **Use this script** to copy the converted script into the form\nunder Decide.\n\n::: fields\n- Your current A/V script. Upload it as a Word file, or paste the text. | MODULE 1 OVERVIEW. Intro. Audio: Hello, and welcome to Module 1. This week we look at what managers actually do, and how that's different from being great at the work yourself. Video: Title slide. Content. Audio: There's a line I've used with every new manager I've coached: your best player isn't automatically your best coach. The skills that got you promoted won't tell you how to manage. Video: Slide: individual contributor and manager, side by side. Audio: When results drop, the fastest answer is usually a person. Sometimes that's right. More often the cause sits between people, in how work gets handed off or who owns a decision. A manager looks there first. Video: Slide: person, process, handoff. Reading. Audio: This week's reading looks at how managers actually spend their time. Notice how little of it is doing the work yourself. Video: Slide: the reading's title and author. Wrap-up. Audio: Start with the reading, then the discussion, and finish the assignment by Sunday. See you next week. Video: Slide: this week's tasks.\n:::\n\n::: fold No script for this video?\nAnswer these instead, and the AI drafts a new script, as it does on the full build track.\n\n::: fields\n- Which video are you scripting, from your media plan?\n- What should students feel or understand by the end?\n- Is there a phrase or story you always use when you introduce this?\n:::\n:::\n:::\n\nAI instructions:\n\n```text\nDraft an A/V/E script for the chosen video, following the Learning Media Team's template: a title,\nthe duration in minutes, the module and section, and rows with three columns, Dialogue (Audio),\nGraphics (Video), and Environment. Use these parts: Video Introduction (greet students and say\nexactly what the video covers), Video Content in chunks of 2 to 4 sentences, and Video Conclusion\n(restate what matters and give one next step, then concluding remarks ending \"Thanks, and gig\n'em!\"). The Opening and Closing are filled in by the template. Write conversational spoken English\nwith contractions, in the faculty member's voice, using their answers. Keep to the planned minutes\nat about 140 spoken words a minute. For an overview or scenario video, open in the character's\nsituation and end at the decision without resolving it. In Graphics, suggest a slide for each\nchunk; put camera or production notes in square brackets. In Environment, name one background and\nwrite \"Same\" after that. Put everything a student needs in the dialogue; graphics only reinforce\nit. If the faculty member uploaded or pasted a current A/V script, convert it instead of starting\nover. Find which video it is from the script, and its planned minutes from the media plan (step\n6.1); if the script doesn't say, ask. keep their dialogue word for word wherever you can, map its sections to the parts above, move\nits graphics into the Graphics column, and add the Environment column. If it's an overview or\nscenario video and the script doesn't use the story, suggest a new opening line in the character's\nsituation and a closing line that stops at the module's decision, using the saved scenario (step\n3.2) and character profile (step 2.3); add story details to other chunks only where a sentence\nalready points to them. Then check it for length, spoken style, and the decision ending. List every\nchange you made, marking story additions, so the faculty member can keep or skip each one.\n\nReturn: {\"title\": string, \"minutes\": number, \"module\": string, \"rows\": [{\"part\": string, \"dialogue\": string, \"graphics\": string, \"environment\": string}], \"changed\": [string]}\n```\n\nDemo response (MGMT 615):\n\n::: refresh\n**Converted from your A/V script.** Your dialogue is kept except where a change is listed under\nthe script.\n:::\n\n**Title:** Module 1 overview: What Managers Actually Do. **Duration:** about 2 minutes. **Module &\nSection:** Module 1, overview video.\n\n| Part | Dialogue (Audio) | Graphics (Video) | Environment |\n|---|---|---|---|\n| Opening | (No dialogue) | [Intro Graphic: Flex Online, Mays Business School, MGMT 615, Module 1 overview] [Intro Music] | |\n| Video Introduction | Howdy. This week you meet Dana Ortiz. Eight months ago she was the best shift lead in her distribution center. Now she runs it, and on Monday morning the report says on-time shipping has dropped from 97 to 89 percent. Her director already has an answer. Before you agree with him, this module asks you a different question: what is a manager's job, and how is it different from the job Dana just left? | Slide: Dana's Monday report, with 89% highlighted. Slide: Greg's email, \"Jordan's shift is the problem.\" | Virtual podcast studio |\n| Video Content | There's a line I've used with every new manager I've coached: your best player isn't automatically your best coach. Dana got this job because she was great at the work. Now her job is getting the work done through other people, and the habits that made her great won't tell her how. | Slide: \"Shift lead's day\" and \"Manager's day,\" side by side | Same |\n| Video Content | Here's what to watch for. When the numbers drop, the fastest answer is usually a person: a slow picker, a weak lead, a bad shift. Sometimes that's right. More often the cause sits between people, in how work gets handed off or who owns a decision. A manager looks there first. | Slide: person, process, handoff | Same |\n| Video Content | This week's reading looks at how managers actually spend their time. Notice how little of it is doing the work yourself. As you read, keep Dana's report in mind. What would you need to know before you decide whose fault it is? | Slide: the reading's title and author | Same |\n| Video Conclusion | Start with Dana's Monday report, then the reading on what managers actually do. This week's assignment asks what you'd do with Dana's first week, so hold off on deciding about Jordan until you've read it. | Slide: This week, the report, the reading, and the assignment due Sunday | Same |\n| Video Conclusion | I'll see you in the discussion. Thanks, and gig 'em! | [Close-up shot] | Same |\n| Closing | (No dialogue) | [Outro Graphic: Branding of Texas A&M University] [Outro Music: fades out] | |\n\n**Length:** about 270 words, about 2 minutes at 140 words a minute.\n\n::: refresh\nWhat changed:\n\n- Your four sections became the Video Introduction, three Video Content chunks, and the Video\n  Conclusion, which now ends \"Thanks, and gig 'em!\" Your Video notes moved to Graphics, and the\n  Environment column names one background.\n- Story added: the introduction now opens on Dana's Monday report and Greg's email, in place of\n  \"Hello, and welcome to Module 1.\"\n- Story added: one sentence after your coaching line ties it to Dana, and one in the reading chunk\n  asks students to keep her report in mind.\n- Story added: the conclusion stops before the decision about Jordan, in place of \"See you next\n  week.\"\n- Two slides were added for the opening, and \"When results drop\" became \"Here's what to watch for.\n  When the numbers drop,\" to match the report.\n\nSkip any story addition by changing that row under Decide, or ask the AI to redraft without it.\n:::\n\n### Decide\n\nRead your script aloud, then make it yours in the form below. It follows the Learning Media Team's\nA/V/E script template. Type in any box to change it, add a content chunk when you need one, or\nselect **Redraft with AI** under the form to have the AI rewrite it, for example shorter or closer to\nhow you talk. The count under the form shows how long the dialogue runs.\n\n::: av-script\n:::\n\nChecklist:\n\n- It sounds natural read aloud.\n- It fits the planned length.\n- Nothing important appears only on screen.\n- You've chosen a background with the Learning Media Team, or asked your ID to set that up.\n- You've asked your ID to schedule an XR stage practice session.\n\n### Checks\n\nWhen you save, the tool checks that:\n\n- the spoken length is within 15 percent of the planned minutes, at about 140 words a minute;\n- every graphic has matching dialogue, so nothing important appears only on screen;\n- the Environment column names a background.\n\n### Save\n\nPlanning document: nothing new; the media line for this video gains \"script drafted.\"\nDownload: the script as a Word file in the A/V/E script template format, to share with your ID.\nThere's nothing to fill out or submit; it's there to show and share.\nProject file: `scripts[]` (video, title, minutes, module, rows, status).\n\n### Go deeper (supplemental)\n\n- `src:guide-script-writing`\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Media plan for all eight modules, 7.5 to 14 minutes each\", \"Module overview videos added for every module\", \"Discussion primers replaced with scenario videos\", \"Module 1 overview script drafted\"],\n  \"keptFlags\": [\"Module 3 teaching video at 7 minutes, in two parts\"],\n  \"questions\": [\"Can all eight overviews be recorded in one XR stage session?\", \"Which scenario videos can Learning Media produce this term?\"]\n}\n```\n\nProject file: `checkins.prep.m6`.\n"}, {"id": "m7", "file": "07-cohort-sessions.md", "raw": "# Module 7. Cohort Session Planning\n\nModule id: `m7`\nSteps: 3\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: a cohort session activity for each of Modules 2 to 8; a lesson plan, student\noutline, and slides for the first session; and that session ready to broadcast from the XR stage.\n\nRefresh checks for this module: each cohort session passes the recording test.\n\nSources: `src:reading-m7-going-live`, `src:reading-m7-active-learning-tools`,\n`src:assignment-m7-cohort-planning`, `src:assignment-m7-cohort-materials`,\n`src:guide-cohort-sessions`, `src:template-cohort-lesson-plan`, `src:template-cohort-outline`,\n`src:template-flex-slides`, `src:template-run-of-show`, `src:example-mgmt615-course-map`\n\nDemo data: `demo/mgmt615-cohort.json`\n\n## Refresh reflection\n\n> App note: Shown once, in the refresh track only, before step 7.1. It asks only about sessions the\n> course has already run.\n\n::: purpose\n**What you'll do:** Answer a few questions about the cohort sessions in the last version of your\ncourse. Answer whichever apply; short notes are fine.\n\n**Why it matters:** The AI uses your answers when it reviews each section in this module, so its\nsuggestions reflect what actually happened in your course.\n:::\n\n1. Which sessions drew the most students, and which the fewest?\n2. When did the room go quiet, and when was it hard to stop the conversation?\n3. What do students say about the sessions?\n4. Which sessions would you keep exactly as they are?\n\n> App note: AI instructions are the same as the Module 1 reflection instruction.\n\nDemo answers (MGMT 615): (1) \"The role-plays and the mock interview. The roundtables in Modules 2\nand 4 were thin.\" (2) \"Quiet when I asked open questions to the whole room.\" (3) \"They like the\nbreakouts.\" (4) \"The mock interview panel.\"\n\nProject file: `reflection.m7`.\n\n---\n\n## 7.1 Cohort session activities for Modules 2 to 8\n\nTime: about 30 minutes, about 4 minutes a module\nPattern: pick and combine, one module at a time (full build); edit in place (refresh)\n\n### Learn\n\n::: purpose\n::: full\n**What you'll do:** Choose the activity at the heart of each cohort session, a 90-minute live class\non Zoom, for Modules 2 to 8: something students can only get by being there.\n:::\n\n::: refresh\n**What you'll do:** Review and update the activity at the heart of each cohort session, a 90-minute\nlive class on Zoom, for Modules 2 to 8: something students can only get by being there.\n:::\n\n**Why it matters:** Students don't skip sessions because they're recorded; they skip sessions that\noffer nothing the recording doesn't ([Morris et al., 2019](src:ext-morris-2019)).\n:::\n\n::: refresh\nYou planned cohort sessions in your first workshop. Since then, three things are new: choosing a\nsession day and designing around it, the recording test, and tying each session to your story.\n:::\n\nMost Flex Online courses hold cohort sessions, but a few don't. Does yours?\n\n::: choose cohort\n- yes | Yes, it has cohort sessions | A 90-minute live session each week in Modules 2 to 8. Most Flex Online courses have them.\n- no | No cohort sessions | Students work on their own schedule every week.\n:::\n\nFlex Online courses hold one cohort session each week from Module 2 to Module 8; Module 1 has none.\nAttendance is optional and every session is recorded, so students decide each week whether to come\nor watch later. In this step you choose each session's main activity. In step 7.2 you'll plan one\nsession minute by minute.\n\n**The recording test.** Ask: if a student watched only the recording, what would they have\nmissed? If the answer is nothing, they'll watch it later. A session passes when at least one\npart depends on who's in the room. Students get five things live that a recording can't give\nthem:\n\n| What students get live | What it looks like |\n|---|---|\n| Feedback on their own work | Students bring a draft of the next assignment and get responses |\n| Applying the concept to their own job | Students map the week's framework onto a problem at work |\n| Practice with peers | Students rehearse a conversation, pitch, or negotiation in breakouts |\n| Your judgment on a messy case | You work through a case with no clean answer and explain your reasoning |\n| A preview of the next assessment | Students work a problem shaped like the next assignment with you there |\n\n**When your session meets.** Some cohort sessions are early in the week, on Monday or Tuesday;\nothers are later, on Wednesday or Thursday. The day changes what students have done before they\narrive, what the session is for, and how the rest of the week is laid out around it.\n\n| | Early in the week (Monday or Tuesday) | Later in the week (Wednesday or Thursday) |\n|---|---|---|\n| What students have done | Little of this week's work yet | The readings, and they've started the activities |\n| What the session is for | Close last week and launch this one | Practice and decide with what they've learned |\n| How the week builds | The materials and activities follow the session, toward Sunday's assignment | The session is the rehearsal before Sunday's assignment |\n\n**Choose your session day.** If it isn't set yet, tentatively choose the day you'd like and design\naround it. You can change it later, and the AI's drafts follow what you choose.\n\n::: choose cohortDay\n- mon | Monday | Early in the week: students haven't started this week's work.\n- tue | Tuesday | Early in the week: students haven't started this week's work.\n- wed | Wednesday | Later in the week: students have read the material.\n- thu | Thursday | Later in the week: students have read and started the activities.\n:::\n\n::: when cohortDay=\nChoose a day above to see the kind of activity that fits it.\n:::\n\n::: when cohortDay=wed,thu\n**Your story as a live decision.** Let the week's materials carry the scenario up to the\ndecision, then stop. The session's activity is where students make the call: vote on the\ncharacter's options and argue the split, role-play the hard conversation in threes (one observer\ngives hesitant students a way in), or give each group a different piece of evidence so the\npicture only comes together in the debrief.\n:::\n\n::: when cohortDay=mon,tue\n**Your story as a first call.** The session opens the story. Its activity is an introductory one:\nstudents meet the character's new problem together and make a first call, list what they'd need\nto know, or try the new skill once with your coaching. The week's materials then give them what\nthey need to test that call before Sunday's assignment.\n:::\n\n**RSI.** A session built this way counts as facilitating discussion (RSI category 4) every week,\nand often as feedback (2) or direct instruction (1) as well.\n\n### See it\n\n::: full\nHere's the activity the MGMT 615 instructor chose for Module 5. MGMT 615 meets on Thursdays, so\nstudents arrive having read the material, and the activity is where they make the call.\n:::\n\n::: refresh\nHere's MGMT 615's Module 5 activity, which passed the review as it was. The Module 2 and 4\nroundtables didn't: nothing in them depended on who was in the room, so each got a live activity.\n:::\n\n::: plan Cohort Session Activity, Module 5\n- Telling Greg He's Wrong. Decision: how Dana answers her director.\n- What students do live: role-play the conversation in threes (Dana, Greg, and an observer), then two volunteers replay it for the class.\n- What students get live: practice with peers.\n:::\n\n### Draft (full build) and Review (refresh)\n\n::: full\nWork through Modules 2 to 8 one at a time. The draft follows the session day you chose in Learn.\nChoose a module, then select the button below. The AI proposes an activity built on the module's\nscenario and activities, with what the checks will find. Select **Use this activity** to copy it\ninto the box under Decide.\n:::\n\n::: refresh\nWork through Modules 2 to 8 one at a time. The review follows the session day you chose in Learn.\nChoose a module above, then select the button below. The AI reviews the session in your box. It\napplies the recording test, says what it would keep or revise and why, and adds a live activity\nwhere one is missing. Select **Apply this activity** to put its version in your box.\n:::\n\n::: module-picker\n:::\n\n::: current cohort\n:::\n\n::: full\nAI instructions:\n\n```text\nFor the given module, using its scenario, activities, the learner profile, and the session day the\nfaculty member chose, propose the main activity for its 90-minute cohort session. Give: a title;\nthe decision or task it centers on; what students do live; which of the five live benefits it\noffers (feedback on own work, own job, practice with peers, instructor judgment, assessment\npreview); and the RSI categories it shows. For a session early in the week (Monday or Tuesday),\nmake it an introductory activity that opens the module's scenario with a first call. For a\nsession later in the week (Wednesday or Thursday), make it the decision or practice the week's\nmaterials lead up to. It must pass the recording test: name what depends on who is in the room.\n\nReturn: {\"title\": string, \"decision\": string, \"liveActivity\": string, \"live\": string, \"rsi\": [int]}\n```\n:::\n\n::: refresh\nAI instructions:\n\n```text\nFor the module's current cohort session, apply the recording test: name what a student who watched\nonly the recording would miss, or say \"nothing.\" Check it connects to the module's scenario or\nactivities and fits the session day the faculty member chose. Use the faculty member's reflection\non attendance and quiet moments. Suggest keep or revise; for a revision, keep the session's purpose\nand add one live activity.\n\nReturn: {\"original\": string, \"missed\": string, \"action\": \"keep\" | \"revise\", \"issues\": [string], \"revision\": {...same shape as full build...} | null}\n```\n:::\n\nDemo response (MGMT 615):\n\n::: module-options\n:::\n\n### Decide\n\nYour session activity for each module goes in this box. Type in it to change anything, or select\n**Redraft with AI** under it to have the AI rewrite it. To work on another module, choose it above;\nwhat you've typed is kept.\n\n::: refresh\nEach module's box starts with that module's cohort session from your Course Map, and the box is what's saved.\nSelect **Review with AI** below for the AI's review, then **Apply this activity** to put its version in the\nbox. **Back to my Course Map text** undoes any change.\n:::\n\nGive the title, the decision or task, what students do live, and what they get live that a\nrecording can't give them.\n\n::: module-fields\n:::\n\nChecklist:\n\n- You can name what a student watching the recording would miss.\n- The activity fits your session day.\n- It ties to the module's scenario or activities.\n\n### Checks\n\nWhen you save each module, the tool checks that:\n\n- the activity passes the recording test;\n- it ties to the module's scenario or activities;\n- it fits the session day: an introductory activity early in the week, or practice or a decision\n  later in the week;\n- it shows at least one RSI category.\n\nThe week walk-through in step 4.4 then includes the session.\n\n### Save\n\nPlanning document: Learning Activities Plan Part 3 (Cohort Session Activities) row in Tables 1\nand 2, for example \"Telling Greg He's Wrong: role-play in threes after a week-long poll.\"\nProject file: `course.cohortDay`, `modules[].cohort`; in refresh, `.original`.\n\n### Go deeper (supplemental)\n\n- `src:guide-cohort-sessions`\n- `src:ext-morris-2019`: why students skip sessions that offer nothing the recording doesn't.\n\n### No cohort sessions\n\n::: purpose\n**What you'll do:** Plan where students get what a cohort session would give them, since your\ncourse doesn't have one.\n\n**Why it matters:** Without a weekly session, students still need regular, substantive interaction\nwith you and practice with each other. Planning it now keeps every module's week complete.\n:::\n\nYour course details say this course has no cohort sessions. If that's not right, choose Yes and\nthis step becomes cohort session planning.\n\n::: choose cohort\n- yes | Yes, it has cohort sessions | A 90-minute live session each week in Modules 2 to 8. Most Flex Online courses have them.\n- no | No cohort sessions | Students work on their own schedule every week.\n:::\n\nA cohort session gives students five things live. Without one, plan where each can go instead:\n\n| What a session gives | Where it can go instead |\n|---|---|\n| Feedback on their own work | Feedback on a draft before the main assignment, in writing or a short video |\n| Applying the concept to their own job | A discussion prompt or reflection that asks students to use the week's framework at work |\n| Practice with peers | Peer review, a small-group discussion, or practice with an AI tutor from step 4.2 |\n| Your judgment on a messy case | A short video or announcement in which you work through the case and explain your call |\n| A preview of the next assessment | A practice problem, shaped like the next assignment, with feedback |\n\nThe 90 minutes a session would take go to activities, so check each module's week in step 4.3\nagain. Your communication plan in Module 8 also needs to carry more of your presence. If your program\nallows it, optional live office hours give students a place to ask questions face to face.\n\nSelect **Save to plan** to note that this course has no cohort sessions. Steps 7.2 and 7.3 aren't needed.\n\n---\n\n## 7.2 Cohort session lesson plan\n\nTime: about 40 minutes\nPattern: interview, then draft (full build); upload, then add your story (refresh); then the AI\ndrafts the outline and slides\n\n### Learn\n\n::: purpose\n::: full\n**What you'll do:** Plan your first cohort session, usually Module 2, minute by minute in the\nteam's lesson plan template. From your plan, the AI drafts the student-facing outline and a slide\ndeck.\n:::\n\n::: refresh\n**What you'll do:** Choose one of your cohort session lesson plans and use AI to add your story to\nit. From the updated plan, the AI drafts the student-facing outline and a slide deck.\n:::\n\n::: full\n**Why it matters:** A lesson plan keeps a 90-minute session on time and on purpose. Drafting the\noutline and slides from the same plan means all three say the same thing.\n:::\n\n::: refresh\n**Why it matters:** Your sessions were planned before your course had a character. Seeing one\nsession through your story shows you what to change in the rest. The plan, outline, and slides you\nmake here are what you'll take to the XR stage in step 7.3.\n:::\n:::\n\n::: refresh\nYou wrote a lesson plan, outline, and slides for every session when your course was first\ndeveloped. Below is what's new since then: your story in the session, a session shape for your session day,\nand drafting the outline and slides with AI. What you already know is under **Need a refresher?**\n:::\n\n::: refresher\nEvery cohort session has three documents, each from a team template:\n\n| Document | Who it's for | What's in it |\n|---|---|---|\n| [Cohort Session Lesson Plan](src:template-cohort-lesson-plan) | You | Title, overview, objectives, and main topics; how many students and how the breakouts are set up; each section with its minutes and talking points; and the materials, handouts, and room setup you need |\n| [Student-facing outline](src:template-cohort-outline) | Students | A welcome, the main topics, each topic's main points and discussion questions, and a wrap-up with what's due |\n| Slides ([Flex Online template](src:template-flex-slides)) | Everyone in the session | A title slide, the agenda, a section slide for each topic, a slide for each poll or question, breakout instructions, and a wrap-up, with your talking points as speaker notes |\n:::\n\nYou write the lesson plan. The AI drafts the outline and slides from it. You edit the outline, and\nyour ID builds the final slides or checks yours for accessibility.\n\n::: refresh\n**Your story in the session.** Adding your story usually doesn't change what students do in a\nsession. It changes what they do it for. Three moves, the same ones you used for an assignment in\nstep 4.1:\n\n- **Open where your character is this week.** Start with the report, the email, or the deadline\n  from the module's scenario, not a recap of the reading. An opening poll can ask what students\n  think the character should do.\n- **Make the activity the character's decision.** Students work on the choice your character faces,\n  with the evidence the character has, instead of a general question about the topic.\n- **Close by moving the story forward.** Give your own call and why, and connect it to Sunday's\n  assignment, where students put their decision in writing.\n\nYou can still ask students about their own work. Ask after they've worked through the character's\ndecision, so they can compare the case with what they've seen at work.\n:::\n\n::: when cohortDay=wed,thu,\n**A shape for cohort sessions that are later in the week.** Students arrive having read the\nmaterial:\n\n1. **Check understanding (about 10 minutes).** Open with a poll or a few chat questions on the\n   week's main concepts. It shows you what students took from the materials, and you can clear up\n   a misunderstanding before it spreads. Keep it short; don't re-teach the reading.\n2. **Guided practice (about 15 minutes).** Work one example with the class. You lead, students\n   supply the next step or the next move, and you coach as they go.\n3. **The live activity (most of the session).** Students practice or decide in small groups: the\n   activity you chose in step 7.1.\n4. **Debrief and preview.** Groups share, you add your judgment, and you point to what's due next.\n\n::: figure budget | A 90-minute session later in the week\n- Check understanding | about 10 minutes | 11\n- Guided practice | about 15 minutes | 17\n- The live activity | about 50 minutes | 55\n- Debrief and preview | about 15 minutes | 17\n:::\n:::\n\n::: when cohortDay=mon,tue\n**A shape for cohort sessions that are early in the week.** Students arrive with last week fresh and this week unread:\n\n1. **Recap last week (about 15 minutes).** Revisit last week's decision and what you saw in\n   students' work, and connect it to what comes next. A poll on last week's main idea eases\n   students in.\n2. **Introduce the new module (about 15 minutes).** Present the character's new problem and the\n   week's main ideas in brief, so students know what the materials will help them answer.\n3. **The introductory activity (most of the session).** The first call you chose in step 7.1, in\n   small groups, with your coaching.\n4. **Preview the week.** Point to the materials, what's due, and how today's first call feeds\n   Sunday's assignment.\n\n::: figure budget | A 90-minute session early in the week\n- Recap last week | about 15 minutes | 17\n- Introduce the new module | about 15 minutes | 17\n- The introductory activity | about 50 minutes | 55\n- Preview the week | about 10 minutes | 11\n:::\n:::\n\nWhichever day you meet, save new material for the asynchronous content instead of lecturing on it\nlive.\n\n**Quiet Zoom rooms.** Over a third of distance learners feel stressed when asked to participate live\n([Donelan et al., 2025](src:ext-donelan-2025)). The opening poll eases them in: start with a poll or the chat, then small\ngroups, then the whole room.\n\n::: refresher\n**Who runs Zoom with you.** An Instructional Technologist is a member of the Learning Delivery team\nassigned to your cohort sessions. In the weeks before the term, they meet with you to set up your\nZoom meetings: the settings, polls, pre-assigned breakout rooms, captions, and recording. During\neach session they're your co-host: they admit students, launch polls, open and close breakouts,\nand keep time, so you can focus on teaching. They can only set up what's in the plan, so your\nlesson plan spells out each poll's exact wording and options, each breakout's size and length, and\nanything to post in the chat. Your ID passes the plan along.\n\n**Accessible slides.** Your ID helps with the slides: they can build the final deck in the Flex\nOnline template from your draft, or check the deck you make for accessibility, so students using\nscreen readers, magnifiers, or captions get the same session. A few habits are yours either way:\n\n- **Say what's on the slide.** Read poll questions aloud and say what a chart shows, so students\n  who are listening, or watching the recording later, don't miss it.\n- **Say what each image is for.** Tell your ID what an image, chart, or diagram is meant to show,\n  so its alt text says that.\n- **Keep slides light.** A few words per slide, typed as real text, with the detail in your talking\n  points.\n:::\n\n::: full\nDuring development you'll plan the rest of your sessions with your ID.\n:::\n\n::: refresh\nDuring development, you and your ID add your story to your other session plans the same way,\nstarting with any session you revised in step 7.1.\n:::\n\n### See it\n\nHere's MGMT 615's Module 5 session as a lesson plan. MGMT 615 meets on Thursdays, so it follows the\nlater-week shape.\n\n| Duration | Section | Subtopics, Talking Points, and Other Details |\n|---|---|---|\n| 10 | Introduction | Check understanding: show the week's Poll Everywhere results (how should Dana answer Greg?), then one poll question on the root causes of disagreement. Clear up any mix-ups. |\n| 15 | Topic 1: Guided practice | The instructor plays Greg and a volunteer plays Dana for the opening exchange. The class coaches Dana's next line in the chat. |\n| 40 | Topic 2: Role-play in threes | Breakouts of three: Dana, Greg, and an observer. Three rounds of about 13 minutes, so everyone plays each role. The observer notes the strongest line they hear. |\n| 20 | Topic 3: Replay | Two volunteers replay their conversation for the class. Instructor feedback on what moved Greg, and what didn't. |\n| 3 | Conclusion | Preview the memo to Greg due Sunday: put the strongest line from today in writing. |\n| 2 | Buffer | Questions from the room, then close. |\n\nFrom this plan, the AI drafted a one-page student outline and a nine-slide deck.\n\n::: refresh\n**Adding the story to a plan.** The MGMT 615 instructor chose the Module 2 session, a roundtable\non motivation written before the course had Dana. A few parts, before and after:\n\n| Part | Before | After |\n|---|---|---|\n| Opening | A recap of expectancy theory and the readings | A poll on Dana's pick-rate bonus: which link in expectancy theory does it break? |\n| Main question | What motivates you at work? | Should Dana keep, adjust, or replace the bonus? |\n| Evidence | Students' own examples | What Dana has: the bonus data, Luis's record, and the crew's view |\n| Workplace question | A 15-minute share-out | Asked after groups decide for Dana |\n| Close | Questions and a preview of Sunday's assignment | The instructor's own call on the bonus, then the preview |\n\nThe full plan is the recorded response under Draft.\n:::\n\n### Draft (full build) and Update (refresh)\n\n::: when cohortDay=mon,tue\nMGMT 615 meets on Thursdays, so its lesson plans here follow the later-week shape. Yours will follow\nthe early-week shape you chose in step 7.1: recap, introduce the new module, then the introductory\nactivity.\n:::\n\n::: full\nAnswer the questions, then select the button below. The AI turns the activity you chose in step 7.1\ninto a full lesson plan. Select **Use this plan** to copy it into the lesson plan under Decide.\n\n::: fields\n- Which session are you planning? | Module 2, the first session students attend.\n- How do you want to end? | With my own call on the bonus, after two groups share theirs.\n:::\n:::\n\n::: refresh\nChoose any one of your lesson plans, for a module whose scenario you saved in step 3.2. Upload it\nas a Word file, or paste it; your ID can help you get the latest version. Then select the button\nbelow. The AI adds your story: it opens the session in your character's situation, turns the main\nactivity into the character's decision, and closes by moving the story forward. It keeps your\nactivity, timing, and wording wherever the story doesn't need a change, and lists every change.\nSelect **Use this plan** to copy the updated plan under Decide.\n\n::: fields\n- Your current lesson plan. Upload it as a Word file, or paste the text. | Diagnosing Motivation Problems Roundtable (Module 2). 20 minutes: recap of expectancy theory and the week's readings, with slides. 45 minutes: roundtable. Whole-class discussion of the module's questions: What motivates you at work? When has an incentive backfired? Are pick-rate bonuses a good incentive? 15 minutes: students share examples from their own workplaces. 10 minutes: wrap-up, questions, and a preview of the motivation diagnosis due Sunday.\n:::\n:::\n\n::: full\nAI instructions:\n\n```text\nTurn the cohort session activity the faculty member chose for this module in step 7.1 into a Cohort\nSession Lesson Plan, following the team's template: a lesson title; a two-sentence overview; the\nmodule's objectives; the main topics; the number of students and the breakout room setup; then rows\nwith the duration in minutes, the section (Introduction, Topic 1, Topic 2, and so on, then\nConclusion), and the subtopics, talking points, and other details (what the instructor says or\nasks, what students do, and setup such as poll wording and options, breakout size and length, and\nchat links). Follow the shape for the session day the faculty member chose. Durations total 90\nminutes and include a two-minute buffer before the close. Then list the materials, handouts, and\nroom setup. Use the faculty member's answers.\n\nReturn: {\"title\": string, \"overview\": string, \"objectives\": [string], \"topics\": [string], \"context\": string, \"rows\": [{\"minutes\": number, \"section\": string, \"details\": string}], \"preparation\": string}\n```\n:::\n\n::: refresh\nAI instructions:\n\n```text\nThe faculty member uploaded or pasted the lesson plan they've used for one cohort session. Find\nwhich module's session it is from the plan; if the plan doesn't say, ask. You are also given the module's saved scenario (step 3.2), the storyline premise (step 3.1), the character\nprofile (step 2.3), the module's objectives, the session activity
