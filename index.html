<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Plan Builder · Flex Online Design Workshop II</title>
<style>
:root {
  --maroon: #500000; --maroon-2: #732f2f; --ink: #1d1d1f; --muted: #5b5b60; --line: #dedbd6;
  --bg: #f7f5f2; --card: #ffffff; --tint: #f3ece9; --ok: #2e6b3a; --warn: #8a5a00; --focus: #1f5fbf;
  --ex: #2f5d73; --ex-tint: #eef4f7;
}
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
a { color: var(--maroon); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
header { background: var(--maroon); color: #fff; display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0; font-weight: 600; }
header .badge { font-size: 12px; background: rgba(255,255,255,.18); padding: 2px 8px; border-radius: 10px; }
header .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.5); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; color: #fff; border: 0; padding: 5px 10px; font: inherit; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--maroon); font-weight: 600; }
.hbtn { background: #fff; color: var(--maroon); border: 0; border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.layout { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 52px); }
nav { border-right: 1px solid var(--line); background: #fff; padding: 12px 0; overflow-y: auto; max-height: calc(100vh - 52px); position: sticky; top: 52px; }
nav h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 16px 4px; }
nav button { display: flex; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 16px; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; align-items: baseline; }
nav button:hover { background: var(--tint); }
nav button[aria-current="page"] { background: var(--tint); font-weight: 600; box-shadow: inset 3px 0 0 var(--maroon); }
nav .mark { width: 16px; flex: none; color: var(--muted); }
nav .mark.done { color: var(--ok); font-weight: 700; }
nav h2 { margin: 6px 0 0; }
nav .modhead { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; padding: 8px 16px; gap: 6px; }
nav .modhead .mt { flex: 1; }
nav .nav-toggle { justify-content: flex-end; color: var(--muted); font-size: 13px; padding: 2px 12px 6px; }
body.nav-mini .layout { grid-template-columns: 64px 1fr; }
body.nav-mini nav { padding-top: 6px; }
body.nav-mini nav .nav-toggle { justify-content: center; font-size: 18px; padding: 4px 0 10px; }
nav .mini { flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; }
nav .mini .mini-num { font-weight: 700; font-size: 15px; color: var(--ink); }
nav .mini .mini-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #b9b4ad; font-size: 11px; line-height: 12px; text-align: center; color: #fff; }
nav .mini .mini-dot.some { border-color: var(--ok); background: linear-gradient(90deg, var(--ok) 50%, transparent 50%); }
nav .mini .mini-dot.done { border-color: var(--ok); background: var(--ok); font-weight: 700; }
nav .mini.here { background: var(--tint); box-shadow: inset 3px 0 0 var(--maroon); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 28px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.pager .pg-cell { display: flex; align-items: center; gap: 10px; min-width: 0; }
.pager .pg-next { justify-content: flex-end; text-align: right; grid-column: 2; }
.pager .btn.pg { background: transparent; color: var(--maroon); border: 1px solid var(--maroon); flex: none; }
.pager .btn.pg:hover { background: var(--tint); }
.pager .pg-name { font-size: 15px; color: var(--muted); }
nav .modhead .chev { width: 12px; flex: none; }
nav .count { text-transform: none; letter-spacing: 0; font-weight: 500; white-space: nowrap; }
nav .count.all { color: var(--ok); }
nav .progress { padding: 0 16px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
nav .progress p { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
nav .bar { height: 8px; background: var(--tint); border-radius: 4px; overflow: hidden; }
nav .bar span { display: block; height: 100%; background: var(--ok); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.steps-btn { display: none; }
/* One centered column: text, tables and boxes share the same edges, and the body text is a little
   larger so the longer lines stay easy to read. */
main { padding: 24px clamp(16px, 4vw, 48px) 24px; min-width: 0; width: 100%; max-width: 1100px; margin: 0 auto; font-size: 17px; }
.main-wrap { min-width: 0; }
.credits { max-width: 1100px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 48px) 48px; font-size: 12.5px; color: var(--muted); }
.fig-credit { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); }
.crumb { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
/* Banners: an original maroon design (no logos). The large one opens the welcome page; a thin one
   names the module at the top of every step. The art is decorative; the text carries the meaning. */
.banner { position: relative; overflow: hidden; border-radius: 10px; color: #fff; background: linear-gradient(115deg, #3a0000 0%, #500000 50%, #6e2424 100%); }
.banner svg { position: absolute; top: 0; right: 0; height: 100%; width: 100%; }
.banner .txt { position: relative; }
.banner.hero { min-height: 210px; display: flex; align-items: flex-end; margin: 0 0 22px; }
.banner.hero .txt { padding: 28px 32px; max-width: 640px; }
.banner.hero .kicker { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #f1dede; }
.banner.hero h2 { margin: 6px 0 4px; font-size: 34px; line-height: 1.15; color: #fff; }
.banner.hero .sub { margin: 0; font-size: 16px; color: #f6eaea; }
.banner.thin { min-height: 122px; display: flex; align-items: center; margin: 0 0 18px; }
.banner.thin .txt { padding: 16px 26px; max-width: 75%; }
.banner.thin .kicker { margin: 0 0 2px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #f1dede; }
.banner.thin .name { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2; color: #fff; }
/* The module banner carries the larger heading; the step title sits one level below it. */
main h2.step { font-size: 26px; margin: 0 0 6px; color: var(--maroon); }
.meta { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.part { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; margin: 14px 0; }
.part > h3 { margin: 0 0 8px; font-size: 18px; display: flex; gap: 10px; align-items: center; }
.part > h3 .tag { font-size: 12px; font-weight: 600; background: var(--tint); color: var(--maroon); padding: 2px 8px; border-radius: 10px; }
.part.ai { border-color: #c9b8b3; background: #fffdfc; }
.part.example, .demo-out { background: var(--ex-tint); border: 1px solid #c7d8e0; border-left: 6px solid var(--ex); }
.plan-page { background: #fff; border: 1px solid #c7d8e0; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.08); padding: 12px 18px 4px; margin: 12px 0; }
.plan-page .plan-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ex); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin: 0 0 10px; }
.part.example > h3 .tag { background: var(--ex); color: #fff; }
.demo-out { border-radius: 8px; padding: 10px 14px; margin: 10px 0; }
.demo-out .crumb { color: var(--ex); font-weight: 600; font-size: 13px; margin: 0 0 6px; }
table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--tint); }
.scroll { overflow-x: auto; }
th.nowrap { white-space: nowrap; }
/* Tables in an example (See it, recorded AI responses) use the example's blue tones; tables on a
   planning-document page keep the document style. */
.part.example th, .part.example td, .demo-out th, .demo-out td { border-color: #c2d5de; }
.part.example th, .demo-out th { background: #dce9ef; color: var(--ex); }
.part.example .plan-page th, .part.example .plan-page td { border-color: var(--line); }
.part.example .plan-page th { background: var(--tint); color: inherit; }
pre { background: #f4f2ef; padding: 10px 12px; border-radius: 6px; white-space: pre-wrap; font-size: 13px; }
pre.prompt { font-family: inherit; font-size: 15px; line-height: 1.55; }
code { font-size: .92em; background: #f1eeea; padding: 0 3px; border-radius: 3px; }
blockquote { margin: 10px 0; padding: 8px 14px; border-left: 4px solid var(--maroon-2); background: var(--tint); }
details { margin: 10px 0; }
summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.btn { background: var(--maroon); color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
.btn.sec { background: #fff; color: var(--maroon); border: 1px solid var(--maroon); }
.btn:disabled { opacity: .5; cursor: default; }
.form { display: grid; gap: 14px; margin: 12px 0; max-width: 560px; }
.field label { display: block; font-weight: 600; margin-bottom: 4px; }
.field .req { font-weight: 400; color: var(--muted); font-size: 14px; }
.field input, .field select, .field textarea { width: 100%; font: inherit; padding: 7px 10px; border: 1px solid #b9b4ad; border-radius: 6px; background: #fff; }
.field .hint { margin: 4px 0 0; font-size: 14px; color: var(--ex); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.thinking { color: var(--muted); font-style: italic; }
.row.use { margin: 6px 0 10px; }
.use-note { color: var(--ok); font-weight: 600; margin: 4px 0 0; }
.purpose { background: var(--tint); border-left: 4px solid var(--maroon); border-radius: 6px; padding: 10px 16px; margin: 0 0 14px; }
.purpose p { margin: 6px 0; }
.flow { list-style: none; counter-reset: flow; padding: 0; margin: 10px 0 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.flow li { counter-increment: flow; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fff; font-size: 15px; }
.flow li strong { display: block; color: var(--maroon); margin-bottom: 2px; }
.flow li strong::before { content: counter(flow) ". "; }
/* Infographics */
.fig { container-type: inline-size; margin: 16px 0 18px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.fig figcaption { font-weight: 700; color: var(--maroon); margin: 0 0 12px; font-size: 16px; }
.fig-note { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.fig ol, .fig ul { list-style: none; margin: 0; padding: 0; }
/* timeline */
.tl { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 0 8px; position: relative; }
.tl::before { content: ""; position: absolute; left: 8px; right: 8px; top: 9px; height: 3px; background: #d9cfcb; }
.tl li { position: relative; padding: 26px 10px 0 0; font-size: 14px; }
.tl .dot { position: absolute; top: 2px; left: 0; width: 17px; height: 17px; border-radius: 50%; background: #fff; border: 3px solid var(--maroon); }
.tl li.here .dot { background: var(--maroon); box-shadow: 0 0 0 4px #f0dcdc; }
.tl strong { display: block; color: var(--ink); }
.tl .you { display: inline-block; margin: 2px 0; padding: 1px 7px; border-radius: 9px; background: var(--maroon); color: #fff; font-size: 12px; font-weight: 600; }
.tl .note { display: block; color: var(--muted); }
/* backward design */
.bw { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
.bw li { position: relative; background: var(--tint); border-radius: 8px; padding: 12px 14px 12px 50px; font-size: 15px; }
.bw li + li::before { content: "→"; position: absolute; left: -36px; top: 50%; transform: translateY(-50%); width: 32px; text-align: center; font-size: 30px; line-height: 1; color: var(--maroon); font-weight: 700; }
.bw .n { position: absolute; left: 12px; top: 12px; width: 28px; height: 28px; border-radius: 50%; background: var(--maroon); color: #fff; font-weight: 700; display: grid; place-items: center; }
.bw strong { display: block; }
.bw span { display: block; }
.bw em { display: block; margin-top: 6px; font-style: normal; font-weight: 600; color: var(--maroon); font-size: 14px; }
/* Bloom's staircase: each step is a little taller than the one before */
.stairs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; align-items: end; }
.stairs li { border-radius: 8px 8px 0 0; padding: 10px; font-size: 13.5px; background: #efe9e6; color: var(--ink); display: flex; flex-direction: column; justify-content: flex-start; }
.stairs li strong { font-size: 15px; margin-bottom: 4px; }
.stairs li em { font-style: normal; margin-top: 6px; font-weight: 600; font-size: 12.5px; }
.stairs .s1 { min-height: 120px; } .stairs .s2 { min-height: 145px; } .stairs .s3 { min-height: 170px; }
.stairs .s4 { min-height: 195px; } .stairs .s5 { min-height: 220px; } .stairs .s6 { min-height: 245px; }
.stairs li.aim { background: var(--maroon); color: #fff; }
.stairs li.aim em { color: #f6e3e3; }
/* When the figure itself is narrow, the staircase turns sideways (widest bar on top) and the week
   lists only the days with something on them. */
@container (max-width: 820px) {
  .stairs { display: flex; flex-direction: column-reverse; gap: 5px; }
  .stairs li { min-height: 0 !important; border-radius: 0 8px 8px 0; padding: 8px 12px; }
  .stairs .s1 { width: 50%; } .stairs .s2 { width: 60%; } .stairs .s3 { width: 70%; }
  .stairs .s4 { width: 80%; } .stairs .s5 { width: 90%; } .stairs .s6 { width: 100%; }
  .fig .week { grid-template-columns: 1fr; }
  .fig .week li { min-height: 0; }
  .fig .week li.off { display: none; }
}
@container (max-width: 520px) {
  .stairs li { width: 100% !important; }
}
.key { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; }
.key.aim { background: var(--maroon); }
/* trace */
.trace li { position: relative; padding: 0 0 14px 30px; }
.trace li::before { content: ""; position: absolute; left: 6px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--maroon); }
.trace li:not(:last-child)::after { content: ""; position: absolute; left: 11px; top: 20px; bottom: 2px; width: 2px; background: #d9cfcb; }
.trace strong { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--maroon); }
.trace span { display: block; }
/* coverage grid */
.cov-grid { border-collapse: collapse; font-size: 14px; }
.cov-grid th, .cov-grid td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; }
.cov-grid tbody th { text-align: left; font-weight: 500; }
.cov { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; }
.cov.main { background: var(--maroon); }
.cov.also { border: 3px solid var(--maroon); width: 14px; height: 14px; box-sizing: border-box; }
.fig-note .cov { margin: 0 4px 0 10px; }
.fig-note .cov:first-child { margin-left: 0; }
/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week li { border-radius: 8px; padding: 8px; min-height: 92px; font-size: 13.5px; background: #f6f3f1; }
.week li strong.day { display: block; margin-bottom: 4px; font-size: 16px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.week li.on { background: var(--tint); border-top: 4px solid var(--maroon); }
.week li.on strong.day { color: var(--maroon); }
/* relationship map */
.people { position: relative; }
.people .spokes { position: absolute; inset: 0; width: 100%; height: 100%; }
.people .spokes line { stroke: #cdbfba; stroke-width: .6; vector-effect: non-scaling-stroke; stroke-width: 2; }
.people ul { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, auto); gap: 22px 18px; }
.people li { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.people li.center { background: var(--maroon); color: #fff; border-color: var(--maroon); align-self: center; }
.people li strong { display: block; font-size: 15px; }
.people .role { display: block; color: var(--muted); }
.people li.center .role { color: #f6e3e3; }
.people .view { display: block; margin-top: 4px; }
.people .c11 { grid-area: 1 / 1; } .people .c12 { grid-area: 1 / 2; } .people .c13 { grid-area: 1 / 3; }
.people .c21 { grid-area: 2 / 1; } .people .c22 { grid-area: 2 / 2; } .people .c23 { grid-area: 2 / 3; }
.people .c31 { grid-area: 3 / 1; } .people .c32 { grid-area: 3 / 2; } .people .c33 { grid-area: 3 / 3; }
.scen-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 12px 0 16px; }
.scen-picker button { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); }
.scen-picker button:hover { border-color: var(--maroon); }
.scen-picker button[aria-pressed="true"] { border: 2px solid var(--maroon); background: var(--tint); }
.scen-picker .m { display: block; font-weight: 700; color: var(--maroon); font-size: 13px; }
.scen-picker .ok { color: var(--ok); }
.scen-picker .t { display: block; line-height: 1.3; }
.scen-for { font-weight: 700; color: var(--maroon); margin: 4px 0 8px; }
.scen-opt { border-top: 1px solid #c7d8e0; padding-top: 8px; margin-top: 8px; }
.scen-opt ul { margin: 6px 0; }
.scen-note { font-size: 14px; color: var(--muted); }
.choose { border: 0; padding: 0; margin: 10px 0 14px; display: grid; gap: 8px; }
.choose .opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; background: #fff; }
.choose .opt.on { border: 2px solid var(--maroon); background: var(--tint); }
.choose .opt input { margin-top: 4px; }
.choose .desc { display: block; font-size: 15px; color: var(--muted); }
.grid-cap { margin: 0 0 6px; }
.refresher { border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; margin: 10px 0 14px; background: #fff; }
.refresher > summary { cursor: pointer; font-weight: 600; color: var(--maroon); }
.refresher[open] > summary { margin-bottom: 8px; }
.current { border: 1px solid var(--line); border-left: 4px solid var(--ex); background: var(--ex-tint); border-radius: 6px; padding: 10px 14px; margin: 10px 0 14px; }
.current-label { margin: 0 0 6px; } .current ul { margin: 4px 0; } .current p { margin: 4px 0; }
.current-paste { margin-top: 8px; } .current-paste summary { cursor: pointer; font-size: 14px; color: var(--ex); }
.current-paste textarea { width: 100%; font: inherit; margin-top: 6px; padding: 6px 8px; border: 1px solid #b9b4ad; border-radius: 6px; }
.term { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-decoration: underline dotted #b9b4ad 2px; text-underline-offset: 3px; cursor: help; }
.term:hover, .term:focus-visible, .term[aria-expanded="true"] { text-decoration-color: var(--maroon); }
.term[aria-expanded="true"] { background: var(--tint); }
.term-nowrap { white-space: nowrap; }
.term-pop { display: block; white-space: normal; margin: 6px 0; padding: 8px 12px; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--maroon); border-radius: 6px; font-size: 15px; }
.gloss-list dt { font-weight: 700; margin-top: 14px; } .gloss-list dd { margin: 2px 0 0; } .gloss-list dt.hl { color: var(--maroon); }
.ros h4 { margin: 14px 0 6px; } .ros-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.ros-fixed { margin: 6px 0 0; color: var(--muted); } .ros-team { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; margin: 6px 0; background: var(--tint); }
.ros-team summary { cursor: pointer; font-weight: 600; } .ros-team ul { margin: 6px 0 2px; }
.linkbtn.steplink { padding: 0; font-size: inherit; vertical-align: baseline; }
.plan-summary h4 { margin: 18px 0 6px; }
.plan-summary .totals { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.plan-summary .totals li { background: var(--tint); border-radius: 6px; padding: 8px 10px; }
.plan-summary .totals strong { display: block; font-size: 22px; color: var(--maroon); }
.summary td, .summary th { font-size: 15px; vertical-align: top; }
.summary .ok { color: var(--ok); font-weight: 700; } .summary .warn, .summary td.warn { color: var(--warn); }
.open-items li { margin-bottom: 6px; }
.outline { white-space: pre-wrap; font: inherit; font-size: 15px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; max-height: 360px; overflow: auto; }
.slides { list-style: none; padding: 0; margin: 8px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.slides > li { border: 1px solid var(--line); border-top: 4px solid var(--maroon); border-radius: 6px; background: #fff; padding: 8px 10px; font-size: 14px; aspect-ratio: auto; }

<script>
const DATA = {"modules": [{"id": "gs", "file": "00-getting-started.md", "raw": "# Getting Started\n\nModule id: `gs`\nSteps: 2\nID check-in: none (first check-in follows Module 1)\n\nFaculty complete: AI connection, save folder, ID and check-in details, course details, and\ntrack. Refresh track also uploads the current Course Map or syllabus.\n\nSources: `src:reading-gs-flex-online-process`, `src:guide-course-development-process`,\n`src:tool-course-creator`, `src:example-mgmt615-course-map`\n\n---\n\n## GS.1 Set up\n\nTime: about 15 minutes\nPattern: setup (no AI draft)\n\n> App note: GS.1 is a setup page, not a planning step. It has \"Setup:\" sections in place of\n> Learn, See it, Draft, Decide, Checks, and Save, and ends with Finish setup.\n\n### Setup: How the workshop works\n\n::: purpose\n**What you'll do:** Connect the AI, choose where your work is saved, and enter your ID's name and\ncheck-in details.\n\n**Why it matters:** Every step after this one depends on these settings. The AI drafts and checks\neach section, and the files you save are how your ID sees your work.\n:::\n\nA Flex Online course is a Mays online business course built on a shared template and common\ndesign standards. In this workshop, you'll build a Course Planning Document, a working plan\nthat will guide the future development of the entire course. If your course has already been\ndeveloped and taught, you'll review and update its Course Map instead. In each module, you build\ndifferent sections of your plan. The expected pace is one module per week, with a live check-in each week by\nZoom or in person with your instructional designer (ID). Your ID is assigned to you before the\nworkshop begins and works with you through the development of your course. You can work ahead; if\nyou do, ask your ID to meet more often, so each module is reviewed before the next one builds on\nit.\n\nNew terms are underlined the first time they appear in a step; select one to see what it means. The\n**Glossary** button at the top lists them all.\n\n::: figure timeline | From this workshop to teaching your course\n- Workshop | 8 modules, about one a week, with a weekly check-in | here\n- Kick-off | Plan the development schedule with your ID\n- Development | 13 weeks\n- Quality review | 2 weeks\n- Final review | 1 week to review the course and train on grading and communicating in Canvas\n- Teach | The course is yours\n:::\n\nYou are the expert on what the course teaches; your ID is the expert on how to teach it online. For\nroles, phases, and the full process, see `src:guide-course-development-process`.\n\n**How each step works.** Throughout the workshop, AI drafts ideas for you to decide on, modify, and\nsave. Most steps after this page have five parts:\n\n::: flow\n- Learn | A short read on what the section is for. It starts with a box that says what you'll do and why it matters.\n- See it | An example from MGMT 615, a fictitious course used throughout the workshop, so you can see what you're aiming for before you start.\n- Draft or Review | The AI writes a first version of one section of your plan from your course details. If you're updating a course you already teach, it reviews your current section instead and flags what may need to change.\n- Decide | You're the expert on your course. Keep the draft, edit it, have the AI redraft it, or write your own. A short checklist shows what a finished section includes.\n- Save | The section goes into your Course Planning Document. Checks then run and flag anything to fix, or to keep with a note for your ID.\n:::\n\nSome steps end with **Go deeper (supplemental)**: readings and tools that build on the step. Use\nthem to strengthen that part of your plan.\n\nThis page is the one exception. There's nothing to draft yet, just three things to set up.\n\n### Setup: Connect TAMU AI Chat\n\nThis tool uses TAMU AI Chat to draft and check each section of the course plan. You connect it\nwith your own key, a code that works like a password and lets this tool use TAMU AI Chat for you.\nThe key stays in this browser and never goes into your project file. Every draft is a starting\npoint: you can edit it, ask for another, or write the section yourself, and nothing goes into your\nplan until you select Save.\n\nWe strongly recommend connecting TAMU AI Chat. The workshop is built around it. You can continue\nwithout it, but you will write every section yourself, without first drafts, checks on your work,\nor, if you're updating a course you already teach, a review of it. You can connect it later with\nthe Settings button at the top of every page.\n\n::: fold How to get your TAMU AI key (about a minute)\n1. Open TAMU AI Chat at [chat.tamu.ai](https://chat.tamu.ai) (it opens in a new tab) and sign in with your NetID.\n2. Select your name or profile picture in the lower-left corner, then Settings.\n3. Select Account from the options on the left. Then to the right of API keys, select Show.\n4. Select Create new secret key. If a key is already listed, you can use that one.\n5. Copy the key. It starts with `sk-`.\n6. Paste it in the box below and select Test connection.\n\nTreat the key like a password. If you don't see API keys in your settings, contact your ID.\n:::\n\n::: key\n:::\n\n> App note: Test connection sends one short request; AI instructions: Reply with {\"ok\": true}.\n> Demo mode skips the key and plays recorded responses. Continue without AI is a smaller link and\n> asks for confirmation: \"Without the AI you'll write every section of your plan yourself. You\n> won't get first drafts, checks on your work, or a review of your existing course. You can\n> connect the AI later from Settings.\" Buttons: Connect the AI (default), Continue without AI.\n\n> App note: failure messages and the AI-off banner.\n>\n> | Problem | Message shown |\n> |---|---|\n> | Key not accepted (401 or 403) | TAMU AI Chat didn't accept the key. Check that you copied all of it and that it hasn't been deleted. |\n> | Can't reach the service | Couldn't reach TAMU AI Chat. Check your internet connection. Off campus, you may need the university VPN. |\n> | Too many requests (429) | TAMU AI Chat is busy right now. Wait a moment and try again. |\n>\n> Until a key is connected, each module shows a banner, \"Your AI guide is off. Connect it to get\n> drafts and checks for this step.\", with a Connect button.\n\n> App note (from `src:tool-course-creator`, reference only): TAMU AI Chat is OpenAI-compatible.\n> Course Creator calls `https://chat.tamu.ai/api`, falls back to `https://chat-api.tamu.ai/openai`,\n> sends the key as a Bearer token, lists models from `/models`, posts to `/chat/completions`, and\n> prefers Claude Sonnet, then other Claude models, then GPT models.\n\n> Review note: key steps adapted from `src:tool-course-creator`; the key process is confirmed.\n> Still open for TAMU IT: what we can say about how TAMU AI Chat handles course content.\n\n### Setup: Choose where to save\n\nUnlike Canvas, this tool doesn't keep your work online. Your work saves in this browser as you go. When you select Save, the\ntool writes two files to a folder you choose: the planning document (Word), which your ID reads,\nand a project file, which lets you reopen your work on any computer and pick up where you left\noff. The project file is for this tool only: open it with **Open a project file** on the Welcome\npage, not in Word or another program. If possible, choose a folder your ID can see, such as a OneDrive or Teams folder you share\nwith them. This works best in Microsoft Edge or Google Chrome; in other browsers, the files go to\nDownloads, and you move them yourself.\n\n::: folder\n:::\n\n> App note: browser only: `course-plan-builder:apiKey`, `course-plan-builder:aiSkipped`,\n> `course-plan-builder:saveFolder` (folder handle).\n\n### Setup: Your ID and check-ins\n\nEnter your ID's name and the day, time, and format of your weekly check-in. Any of these can wait;\nif you don't know them yet, your ID will share them before your first check-in.\n\n| Field | Required | Example (MGMT 615) |\n|---|---|---|\n| Your ID's name | No | Taylor Brooks |\n| Check-in day | No | Tuesday |\n| Check-in time | No | 2:00 p.m. |\n| Check-in format | No | Zoom |\n\n> App note: planning document: ID name on the cover section. Project file: `course.idName`,\n> `checkins.day`, `checkins.time`, `checkins.format`, `checkins.log[]`.\n\n---\n\n## GS.2 Your course and your track\n\nTime: about 20 minutes\nPattern: setup; edit in place for the refresh upload\n\n### Learn\n\n::: purpose\n**What you'll do:** Enter your course's details and choose a track: Full build or Refresh.\n\n**Why it matters:** Every later step uses your choices. Your course details go into each AI draft,\nand your track decides whether each step drafts a new section or reviews the one you already have.\n:::\n\nChoose a track:\n\n- **Full build** if the course is new.\n- **Refresh** if your course has already been developed and taught in the Flex Online program.\n  Upload its Course Map as a Word file, or paste the text. Your ID can help you get the latest version. In each module you'll see the matching section of your Course Map with flags beside it that note what may need\n  attention. For each section, you keep it as it is, accept or edit a\n  suggested revision, or rewrite it. Each change gets a short note so your ID can see what changed and why.\n\n::: full\nA Course Map is not the same as your Course Planning Document. The Course Map is the finished,\ndetailed record of everything in a course, complete enough to rebuild the course in another\nlearning management system if it were ever lost from Canvas. The [Course Planning Document](src:template-planning-doc) is\nthe working plan you build in this workshop, a section at a time.\n:::\n\n::: refresh\nYou've been through this process once already. In your first workshop you built a Course Planning Document; during\ndevelopment your ID turned it into your course and recorded everything in the Course Map, the\nfinished, detailed record of the course, complete enough to rebuild it if it were ever lost from\nCanvas. On the Refresh track, the Course Map is your working document. You review and update it\nsection by section, and you finish with an updated Course Map and a change log for your ID.\n:::\n\nBoth tracks go through every module, and both add a storyline to your course: a recurring\ncharacter and a realistic scenario in each module, which you'll plan in Modules 2 and 3. Most\nexisting courses don't have a storyline yet, so refresh courses build one too, and it's added to\nthe Course Map as new sections.\n\n### See it\n\nHere's how the MGMT 615 instructor did this step. The course had already been developed and taught\nin the Flex Online program, so they chose Refresh and uploaded their Course Map. The tool sorted it\ninto the sections this workshop reviews and found most of them: the catalog description,\nthe course vision, five course-level objectives (CLOs) and all eight modules. A few sections weren't\nin the Course Map. The instructor wrote the learner description and added the program outcomes\nthemselves in Module 1. For the storyline, the tool drafts a first version in Modules 2 and 3,\njust as it would in a full build.\n\n### Draft (full build)\n\nFill in a few details about your course. There's no AI draft in this step.\n\n| Field | Required | Example (MGMT 615) |\n|---|---|---|\n| Course number | Yes | MGMT 615 |\n| Course title | Yes | Managing People and Performance |\n| Credit hours | Yes | 3 |\n| Degree or certificate program | Yes | MS in Management |\n| First term taught online | No | Fall 2027 |\n| Course start date | No | Aug. 24, 2026, the first day of Module 1 |\n| Weekly hours target | No | 10, unless your program director sets another |\n| Cohort sessions | No | Yes. Most Flex Online courses hold a 90-minute live session in Modules 2 to 8; a few don't |\n| Track | Yes | Refresh |\n\n### Review (refresh)\n\nNext, upload your Course Map as a Word file or paste its text. Select Sort with AI, and the AI\nsorts it into the sections this workshop reviews. Without the AI, you skip the upload\nand paste each current section when you reach it.\n\n::: fields\n- Your Course Map. Upload it as a Word file, or paste the text.\n:::\n\nAI instructions:\n\n```text\nYou are given the text of a faculty member's existing Course Map or syllabus.\nFind the content for each section below. Copy text exactly as written. Do not rewrite, fix, or\nsummarize. If a section is not in the document, return null for it. If you are unsure where\nsomething belongs, put it in \"unsorted\".\n\nSections:\n- catalogDescription\n- programOutcomes (list)\n- courseVision\n- clos (list)\n- modules (list of {number, title, closMet, topics, objectives, activities, materials, media,\n  cohortSession, overview})\n- character (any recurring person or case that runs across modules)\n- storyline\n- scenarios (list, one per module)\n- communicationPlan (announcements, feedback turnaround, instructor contact)\n- learners (who takes the course)\n\nReturn: {\"sections\": {...}, \"unsorted\": [string], \"found\": [section names], \"missing\": [section names]}\n```\n\nDemo response (MGMT 615):\n\n| Section | Result |\n|---|---|\n| Catalog description, course vision | Found |\n| CLOs | Found, 5 |\n| Modules | Found, 8, with titles, CLOs met, topics, objectives, activities, materials, media, cohort sessions, and overviews |\n| Program outcomes, learners, character, storyline and scenarios, communication plan | Missing |\n\n> Review note: the recorded JSON for this response will be generated from the MGMT 615 course map\n> when demo mode is built.\n\n### Decide\n\nCheck that your course details are correct. If you uploaded a Course Map, you'll also see each\nsection the AI found next to its label. Confirm each one, move any text that landed in the wrong\nplace, or mark a section as not in your document.\n\nChecklist:\n\n- Course number, title, and program are correct.\n- If you uploaded a Course Map: each found section is under the right label.\n- If you uploaded a Course Map: you know which sections are missing from it. You'll fill them in\n  when you reach them.\n\n### Checks\n\nNone.\n\n### Save\n\nPlanning document: course number and title in the document title; program on the cover\nsection.\nProject file: `course`, `track`, `source.sections`, `source.missing`, `source.fileName`.\n\nNext is Module 1. Your first check-in with your ID comes after it.\n"}, {"id": "m1", "file": "01-vision-and-foundation.md", "raw": "# Module 1. Creating Vision and Foundation\n\nModule id: `m1`\nSteps: 4\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: learners, catalog description, program outcomes, course vision, CLOs, module\ntitles and topics.\n\nRefresh checks for this module: CLOs are measurable, with one verb each, and line up with the\ncatalog description and program outcomes; every CLO appears in at least one module; topics are\ncurrent.\n\nSources: `src:reading-m1-setting-the-foundation`, `src:guide-course-alignment`,\n`src:guide-learning-objectives`, `src:assignment-m1-building-the-framework`,\n`src:assignment-m1-redesign-and-refine`, `src:template-planning-doc`,\n`src:example-mgmt615-course-map`\n\n## Refresh reflection\n\n> App note: shown once, in the refresh track only, before step 1.1. The answers go to the AI in\n> every Review step of this module.\n\n::: purpose\n**What you'll do:** Answer a few questions about the last time you taught this course. Answer\nwhichever apply; short notes are fine.\n\n**Why it matters:** The AI uses your answers when it reviews each section in this module, so its\nsuggestions reflect what actually happened in your course.\n:::\n\n1. Which course objectives did students struggle to meet? What did you see in their work?\n2. Were there weeks that felt overloaded or thin, or topics that came too early or too late?\n3. Is there a topic you want to add, cut, or update?\n4. What worked well enough that you want to keep it as it is?\n\nAI instructions (added to each Review step in this module):\n\n```text\nThe faculty member's reflection on the last time they taught the course is given. When a\nproblem you find matches something in the reflection, say so in the issue and connect the\nrevision to it. Do not raise problems only because the reflection mentions them; check them\nagainst the checklist first.\n```\n\nDemo answers (MGMT 615):\n\n1. \"The feedback script in Module 3 was the weakest work. Students wrote what they'd tell the\n   employee and stopped there. Few said what they expected to change.\"\n2. \"Module 4 felt thin. We spent a lot of time on team stages and never got to the handoff\n   problems students actually face.\"\n3. \"Hiring comes up every term in Module 8 and students want more of it.\"\n4. \"The diagnosis-first approach. Students tell me it's what they use most at work.\"\n\n> App note: each answer connects to the demo review: the CLO 2 revision answers the first, the\n> Module 4 topic change the second, the new hiring CLO the third, and the vision revision keeps\n> the diagnosis-first approach.\n\nProject file: `reflection.m1`.\n\n---\n\n## 1.1 Learners, catalog, and program outcomes\n\nTime: about 20 minutes\nPattern: faculty input (no AI)\n\n### Learn\n\n::: purpose\n**What you'll do:** Describe who takes your course, and record your catalog description, its\ncommitments, and the program outcomes your course supports.\n\n::: full\n**Why it matters:** These set the end point for your whole plan. Every AI draft uses your learner\ndescription, and later steps check your vision and CLOs against the catalog and program outcomes.\n:::\n\n::: refresh\n**Why it matters:** This step reminds you who your audience is, so every change you make in this\nworkshop serves them.\n:::\n:::\n\n::: refresh\nYou recorded this in your first workshop. Check that it still holds: the catalog text is the current\nofficial version, your learner description fits the students who take the course now, and your\nprogram's outcomes haven't changed. If you change your vision or CLOs, confirm the changes with your\nprogram director before Module 2.\n:::\n\n::: refresher\nFlex Online courses are planned backward (Wiggins & McTighe, 2005), and so is this workshop:\n\n::: figure backward | Planned backward: the order of this workshop\n- Outcomes | What students should be able to do at the end | Module 1\n- Evidence | How you'll see it: activities and assessments | Module 4\n- Learning | What students read, watch, and listen to | Modules 5 and 6\n- Note | Modules 2 and 3 add the story that ties them together, Module 7 plans the live sessions, and Module 8 checks the whole plan.\n- Credit | Adapted from Wiggins and McTighe (2005).\n:::\n\nStart with who the students are. They're working professionals who connect new ideas to their own\nexperience, want to know why something matters before they invest time, and want to use it soon\n(Knowles, Holton, & Swanson, 2015). Your learner description is 3 or 4 sentences about who takes\nyour course.\n\nYour catalog description is the course's public promise, so your course vision and course-level\nobjectives (CLOs), which you'll write in steps 1.2 and 1.3, stay within it. Paste the official\ntext from the TAMU course catalog (catalog.tamu.edu), word for word.\n\nThen list its commitments: each separate thing the catalog promises students will learn to do.\nThe list matters later: when you write your CLOs in step 1.3, the tool checks them against this list and flags any\npromise your course doesn't cover yet.\n\nProgram outcomes describe what students can do after the whole degree; list the two to four this\ncourse supports. Your ID can find them if you don't have them. Before Module 2, you'll confirm your\nvision and CLOs with your program director, because the storyline in Modules 2 and 3 grows out\nof them. It's worth scheduling that meeting now.\n:::\n\n### See it\n\nHere's how the MGMT 615 instructor did this step. Their students are new or soon-to-be managers,\npromoted for being good at their own jobs. The catalog description makes six commitments, from\ndiagnosing underperformance to hiring well. Later checks hold the CLOs to that list, which is how\nthe review of the existing course found that no CLO covered hiring.\n\n::: plan Learners\nStudents are working professionals in a first management role or about to step into one, most\npromoted after strong work as individual contributors. They arrive with years of workplace\nexperience and plenty of stories about good and bad managers, but little formal training in\nmanaging people. Most work full time and study in the evenings and on weekends.\n\nCatalog commitments: diagnose why employees and teams underperform; deliver feedback that changes\nbehavior; build and repair team dynamics; delegate and make decision-rights calls under pressure;\nlead a team through change; hire well.\n:::\n\n### Write (no AI)\n\nThere's no AI in this step. Everything here comes from you, the catalog, and your program.\n\n::: refresh\nIf you uploaded your Course Map in Getting Started (step GS.2), anything it included is filled in\nbelow, copied word for word. Check it, then fill in what's missing:\n\n- **Learner description:** most Course Maps don't have one, so you'll likely write it here.\n- **Catalog description:** copy it from catalog.tamu.edu. If your Course Map has it, compare it\n  with the current catalog, since the catalog may have changed since the course was built.\n- **Commitments:** most Course Maps don't list them, so you'll likely list them here.\n- **Program outcomes:** if they're missing, your ID or program director can send them to you.\n:::\n\n**Your learners.** Write 3 or 4 sentences about who takes your course. These questions can help:\n\n- What jobs do most students hold while they take the course?\n- What do they already know about the subject when they start?\n- What will they do differently at work after the course?\n- Anything about their schedules or situations the course should plan around?\n\n::: fields\n- Your learner description (3 or 4 sentences)\n:::\n\n**Your catalog description and its commitments.**\n\n::: fields\n- Paste your catalog description, word for word, from catalog.tamu.edu.\n- List each thing the catalog description promises students will learn to do, one per line, in the catalog's words. | Diagnose why employees and teams underperform; deliver feedback that changes behavior; build and repair team dynamics; delegate and make decision-rights calls under pressure; lead a team through change; hire well.\n:::\n\n**Your program outcomes.** If you don't have them, your ID or program director can send them.\n\n::: fields\n- Paste your program's outcomes.\n- Which two to four of these does your course support? | PLO 1, PLO 2, and PLO 3.\n:::\n\n### Decide\n\nChecklist:\n\n- Your learner description fits the students who actually take your course.\n- The catalog text is the current official version.\n- The commitment list includes every promise in the catalog description, and nothing extra.\n- You've listed the two to four program outcomes this course supports.\n- You've planned a meeting with your program director before Module 2.\n\n### Checks\n\nNone.\n\n### Save\n\nPlanning document: your catalog description, the program outcomes this course supports, and\nyour learner description.\nProject file: `learners.profile`, `catalog.text`, `catalog.commitments`, `programOutcomes`,\n`programDirectorReview.status`.\n\n### Go deeper (supplemental)\n\n- `src:guide-adult-learners`: how working professionals learn, and what it means for your course.\n- `src:ext-wiggins-mctighe-2005`\n- `src:ext-knowles-2015`\n- `src:ext-cast-2018`\n\n---\n\n## 1.2 Course vision\n\nTime: about 15 minutes\nPattern: interview, then draft\n\n### Learn\n\n::: purpose\n::: full\n**What you'll do:** Write your course vision: 3 or 4 sentences on what your course helps students do\nin the workplace.\n:::\n\n::: refresh\n**What you'll do:** Reread your course vision, and rewrite it if it no longer fits.\n:::\n\n::: full\n**Why it matters:** Your vision drives every later choice. Each topic, activity, and reading has to\nhelp students do what it describes.\n:::\n\n::: refresh\n**Why it matters:** Rereading your vision helps you check that everything in the course still serves\nthe purpose it was designed for. It can also bring to light opportunities for change.\n:::\n:::\n\n::: refresh\nYou wrote your vision in your first workshop. Your current vision, from your Course Map, is\nalready in the box below. Read it with two questions in mind: does it still describe what students do at work,\nnot what the course covers, and does it still fit the catalog description?\n:::\n\n::: refresher\nThink about the situations your students face at work and what your course helps them do about those\nsituations.\n\nStay within the scope of your catalog description. Describe what students do on the job, not what\nthe course covers or how it's taught.\n:::\n\n### See it\n\n::: full\nHere's the vision the MGMT 615 instructor settled on. In four sentences, it says what the course\nhelps students do at work.\n:::\n\n::: refresh\nHere's how the MGMT 615 instructor did this step. Their existing vision ran seven sentences and\nmostly described the course itself, so they cut it to four that say what the course helps\nstudents do at work.\n:::\n\n::: plan Course vision\nMGMT 615 helps new managers run a team instead of doing the team's work themselves. When someone\non their team struggles, students find out what is actually wrong before they act. They give\nfeedback that changes behavior, delegate real decisions, and have the hard conversations managers\noften avoid. They lead their teams through change and hire people who fit the work.\n:::\n\n### Draft (full build)\n\nAnswer one question. The AI uses your answer, along with your learner description and catalog\ncommitments from 1.1, to draft two versions of your vision, each worded differently. Under the\nversion you like best, select **Use this version** to copy it into the box under Decide, where\nyou'll edit it.\n\n::: fields\n- What does your course help students do in the workplace? | Stop fixing everything themselves, figure out what is really wrong with their team before reacting, and have the hard conversations managers often avoid.\n:::\n\nAI instructions:\n\n```text\nDraft two course visions of 3 or 4 sentences each from the faculty member's answer, the learner\ndescription and the catalog commitments. Describe what the course helps students do in the\nworkplace: actions on the job, not course content, activities, or teaching methods. Stay\ninside the catalog commitments. Make the two differ: one opens with the situations students will\nface at work, the other with the actions they take.\n\nReturn: {\"versions\": [string, string]}\n```\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"versions\": [\n    \"MGMT 615 prepares new managers for the moments that test them: an employee who is struggling, a team in conflict, a change no one wants. Students learn to work out what is really wrong before they react, then choose a fix that fits. They give feedback that changes behavior, delegate real decisions, and hire people who fit the work. Their teams bring them problems to solve together instead of waiting for the manager to fix everything.\",\n    \"MGMT 615 helps new managers stop fixing everything themselves and start running a team. Students diagnose why a person or team is underperforming before they act. They have the conversations managers often avoid, delegate with clear decision rights, and repair working relationships after conflict. They lead change and hire with a clear picture of what the job needs.\"\n  ]\n}\n```\n\n### Review (refresh)\n\n::: current vision\n:::\n\nThe AI reads your current vision and flags anything that doesn't fit, such as too many sentences\nor sentences that describe the course instead of what it helps students do at work. It also\nsuggests one revision that keeps your language. To start from it, select **Apply this revision**:\nit replaces the text in your box, where you can keep editing it.\n\nDemo response (MGMT 615):\n\nFlags:\n\n- Your vision has seven sentences; this workshop asks for 3 or 4.\n- Most sentences describe the course (\"sits at the center of the Flex Online people-management\n  sequence,\" \"every module asks students to…\"). A vision should describe what the course helps\n  students do at work.\n\nSuggested revision: \"MGMT 615 helps new managers run a team instead of doing the team's work themselves. When someone on their team struggles, students find out what is actually wrong before they act. They give feedback that changes behavior, delegate real decisions, and have the hard conversations managers often avoid. They lead their teams through change and hire people who fit the work.\"\n\nWhat changed: cut to four sentences, and replaced the course and program description with what\nthe course helps students do at work. The diagnosis-first idea is kept.\n\n### Decide\n\n::: full\nYour final vision goes in this box. It's what's saved to your Course Planning Document. Type in the\nbox to change anything, or select **Redraft with AI** under it to have the AI rewrite it.\n\nEdit the version you copied into your own words. You can also bring in a phrase from the other\nversion, or write your own.\n:::\n\n::: refresh\nYour current vision, from your Course Map, is in this box, and the box is what's saved. Edit it\nhere, select **Review with AI** below for flags and a suggested revision, or select **Redraft with\nAI** under the box to have the AI rewrite it. **Back to my Course Map text** undoes any change.\n:::\n\n::: fields\n- Your course vision: what your course helps students do in the workplace (3 or 4 sentences)\n:::\n\nChecklist:\n\n- Your vision is 3 or 4 sentences long.\n- It describes what the course helps students do at work, not what the course covers.\n- It fits the catalog description.\n- You'd be glad to hear a former student describe the course this way.\n\n### Checks\n\nWhen you save, the tool checks that your vision:\n\n- has 3 or 4 sentences;\n- stays within your catalog commitments;\n- describes what the course helps students do at work, not what it covers or how it's taught.\n\n### Save\n\nPlanning document: Course Vision.\nProject file: `vision.text`; in refresh, `vision.original`.\n\n---\n\n## 1.3 Course-level objectives (CLOs)\n\nTime: about 25 minutes\nPattern: spot the problem, then pick and combine (full build) or edit in place (refresh)\n\n### Learn\n\n::: purpose\n::: full\n**What you'll do:** Write 3 to 6 course-level objectives (CLOs): what students will be able to do by\nthe end of the course, in a way you can observe and grade.\n:::\n\n::: refresh\n**What you'll do:** Analyze your course-level objectives (CLOs) and update any that need it.\n:::\n\n::: full\n**Why it matters:** Everything later traces back to your CLOs. Your modules, activities, and\nmaterials are each checked against them.\n:::\n\n::: refresh\n**Why it matters:** Every module, activity, and material is checked against your CLOs, so they need\nto say what the course should achieve now.\n:::\n:::\n\n::: refresh\nYou wrote your CLOs in your first workshop, and since then you've seen how students did. As you\nreview, check that each CLO starts with one observable verb at the apply level or higher, stays\nwithin the catalog, and still says what students should be able to do.\n:::\n\n::: refresher\nTo pitch them at the right level, use Bloom's taxonomy, a widely used framework that sorts\nlearning by how much thinking it asks of students (Anderson & Krathwohl, 2001). It has six\nlevels, from least to most demanding:\n\n::: figure bloom | Bloom's taxonomy, from least to most demanding\n- Remember | Recall facts and terms. |\n- Understand | Explain ideas in your own words. |\n- Apply | Use a method or idea in a new situation. | apply, implement, solve, calculate | aim: Aim your CLOs at the four highlighted levels, mostly Analyze, Evaluate, and Create.\n- Analyze | Break a situation into parts and see how they relate. | analyze, diagnose, compare, differentiate\n- Evaluate | Judge options against criteria and defend a choice. | evaluate, assess, justify, defend\n- Create | Put ideas together into something new, such as a plan, design, or proposal. | design, develop, construct, draft\n- Credit | Adapted from Anderson and Krathwohl (2001).\n:::\n\nFor more example verbs, see Texas A&M's\n[Academic Success Center overview of Bloom's taxonomy](https://asc.tamu.edu/tutoring/bloom.html).\n\nStart each CLO with one action verb at the apply level or higher, mostly analyze, evaluate, or\ncreate. The students are experienced professionals; they need to use and judge ideas, not just\nrecall them. Avoid verbs like \"understand\" or \"know.\" You can't see them happen, so you can't grade\nthem. Describe something within the student's control.\n:::\n\nEach CLO should also suggest a decision someone in your students' role would face. In Module 2\nyou'll create a character, someone in your students' role, whose story runs through the course.\nThe decisions your CLOs suggest become that character's story.\n\n**Spot the problem.** Before you work on your own CLOs, practice on a weak one. Read the objective\nbelow, say in a sentence or two what you would change and why, then select **Check my answer**.\nThe AI tells you what you caught and adds anything you missed.\n\n> Weak objective: \"Students will understand how to give feedback that changes an employee's\n> behavior.\"\n\n::: check\n- What would you change in this objective, and why?\nFeedback: You're right that \"understand\" is the main problem: you can't see or grade it, so\nstart with a verb that shows what students do, such as \"design.\" One more problem: \"changes an\nemployee's behavior\" depends on the employee, which the student can't control. A stronger\nversion: \"Design a feedback conversation that targets a specific behavior and states the change\nexpected.\"\n:::\n\n> App note: expected points: \"understand\" can't be observed; \"changes an employee's behavior\"\n> depends on the employee, which the student can't control. The AI confirms what the faculty\n> member caught and adds what they missed, in two or three sentences, ending with a stronger\n> version.\n\n### See it\n\n::: full\nHere are the CLOs the MGMT 615 instructor settled on. The first one gives MGMT 615's character,\nDana Ortiz, a newly promoted manager you'll meet in Module 2, her first decision: is the shift\nlead the problem? The sixth covers hiring, which the catalog promises.\n:::\n\n::: refresh\nHere's how the MGMT 615 instructor did this step. Their first CLO began as \"Apply core theories of\nmotivation and performance to diagnose why an employee or team is underperforming.\" It had two\nverbs, so the refresh kept the one students are graded on (number 1, below). That CLO gives MGMT\n615's character, Dana Ortiz, a newly promoted manager you'll meet in Module 2, her first decision:\nis the shift lead the problem? The instructor also added a sixth CLO for hiring, which the catalog\npromises.\n:::\n\n::: plan Course-Level Objectives\n1. Diagnose why an employee or team is underperforming using core theories of motivation and\n   performance.\n2. Design a feedback or coaching conversation that targets a specific behavior and states the\n   change expected.\n3. Evaluate team dynamics and organizational context to select a management intervention\n   appropriate to the actual problem.\n4. Justify a delegation or decision-rights call, including the trade-offs involved.\n5. Draft a management decision message that states the decision and the next steps a direct\n   report must take.\n6. Evaluate candidates for a role using a structured interview scorecard.\n:::\n\n### Draft (full build)\n\nAfter you answer the spot-the-problem question, the AI drafts 3 to 6 CLOs from your vision and\ncatalog commitments, with the Bloom's level of each.\n\nAI instructions:\n\n```text\nDraft 4 to 6 CLOs from the vision, the catalog commitments, the supported program outcomes, and\nthe learner profile. One measurable verb per CLO, Bloom's apply or higher, mostly analyze,\nevaluate, or create; describe what the student does, within their control; together cover every\ncatalog commitment. For each give its verb, level, the commitments, and program outcomes it\ncovers, and one decision a professional in the students' role would face.\n\nReturn: {\"clos\": [{\"text\": string, \"verb\": string, \"level\": string, \"commitments\": [string], \"programOutcomes\": [string], \"decision\": string}]}\n```\n\nDemo response (MGMT 615):\n\n- CLO 1: Diagnose why an employee or team is underperforming using core theories of motivation and\n  performance. (Analyze)\n- CLO 2: Design a feedback or coaching conversation that targets a specific behavior and states\n  the change expected. (Create)\n- CLO 3: Evaluate team dynamics and organizational context to select a management intervention\n  appropriate to the actual problem. (Evaluate)\n- CLO 4: Justify a delegation or decision-rights call, including the trade-offs involved.\n  (Evaluate)\n- CLO 5: Draft a management decision message that states the decision and the next steps a\n  direct report must take. (Create)\n- CLO 6: Evaluate candidates for a role using a structured interview scorecard. (Evaluate)\n\n### Review (refresh)\n\n::: current clos\n:::\n\nThe AI marks each of your current CLOs Keep or suggests a revision, and flags any problems it\nfinds.\n\nAI instructions:\n\n```text\nCheck each current CLO: exactly one measurable verb; Bloom's apply or higher; within the\nstudent's control; fits the catalog. Keep the wording wherever it passes. For each problem,\nquote the words that cause it and suggest one revision. If a catalog commitment is uncovered,\npropose one new CLO for it. If there are more than 6, suggest which to merge.\n\nReturn: {\"clos\": [{\"original\": string, \"action\": \"keep\" | \"revise\", \"issues\": [string], \"revision\": string | null}], \"newClos\": [string]}\n```\n\nDemo response (MGMT 615):\n\n| Current | Action | Revision | Why |\n|---|---|---|---|\n| CLO 1: Apply core theories of motivation and performance to diagnose why an employee or team is underperforming. | Revise | Diagnose why an employee or team is underperforming using core theories of motivation and performance. | Dropped \"apply\" so the CLO has one verb. |\n| CLO 2: Design a feedback or coaching conversation that changes an employee's behavior, not just documents it. | Revise | Design a feedback or coaching conversation that targets a specific behavior and states the change expected. | Now graded on the conversation the student designs. Matches the reflection: scripts never said what should change. |\n| CLO 3: Evaluate team dynamics and organizational context to select a management intervention appropriate to the actual problem. | Keep | | Kept. |\n| CLO 4: Make a delegation or decision-rights call and justify the trade-offs involved. | Revise | Justify a delegation or decision-rights call, including the trade-offs involved. | Dropped \"make\" so the CLO grades the justification. |\n| CLO 5: Communicate a management decision in language a direct report can act on immediately. | Revise | Draft a management decision message that states the decision and the next steps a direct report must take. | Changed to a written message with stated next steps so it can be graded. |\n| (new) CLO 6 | Add | Evaluate candidates for a role using a structured interview scorecard. | The catalog promises hiring and Module 8 teaches it. Matches the reflection on Module 8. |\n\n### Decide\n\n::: full\nYour final CLOs go in this box. They're what's saved to your Course Planning Document. Type in the\nbox to change anything, or select **Redraft with AI** under it to have the AI rewrite it.\n:::\n\n::: full\nUnder the AI's draft, select **Use these CLOs** to copy them here. Then edit, reorder, remove, or\nadd CLOs.\n:::\n\n::: refresh\nYour current CLOs, from your Course Map, are in this box, one per line, and the box is what's\nsaved. Edit them here, or select **Review with AI** below. To use the AI's suggestions, select\n**Apply the suggested CLOs**, then keep, change, or undo each one. Keep or delete any new CLO the AI\nadded. **Back to my Course Map text** undoes every change.\n:::\n\n::: fields\n- Your CLOs, one per line, each starting with its verb. Don't number them; the tool numbers them in this order.\n:::\n\nChecklist:\n\n- You have 3 to 6 CLOs, each with one measurable verb at the apply level or above.\n- Each CLO describes what the student does.\n- Each suggests a decision someone in your students' role would face.\n\n### Checks\n\nWhen you save, the tool checks that:\n\n- you have 3 to 6 CLOs;\n- each CLO has one verb, at the apply level or above;\n- every catalog commitment is covered by a CLO;\n- every CLO supports at least one of the program outcomes you marked.\n\nIn MGMT 615, before the revisions, the commitment check flagged \"Hire well: no CLO covers it.\"\nThe new CLO 6 fixed it.\n\n### Save\n\nPlanning document: Course-Level Objectives (CLOs).\nProject file: `clos` (text, verb, level, commitments, programOutcomes, decision); in refresh,\n`clos[].original`.\n\n### Go deeper (supplemental)\n\n- `src:guide-learning-objectives`: verb tables and the case for higher-order objectives.\n- `src:ext-anderson-krathwohl-2001`\n- `src:ext-tamu-asc-bloom`: Texas A&M's overview of the levels, written for students. Useful if\n  you want to show your students what each level asks of them.\n\n---\n\n## 1.4 Module titles and topics\n\nTime: about 25 minutes\nPattern: pick and combine (full build) or edit in place (refresh)\n\n### Learn\n\n::: purpose\n::: full\n**What you'll do:** Lay out your course's weekly modules, each with a title, the one or two CLOs it\nfocuses on, and three to five topics.\n:::\n\n::: refresh\n**What you'll do:** Analyze your module titles and topics, and update any that need it.\n:::\n\n::: full\n**Why it matters:** This list is the backbone of your plan. Every later module fills in your Course\nPlanning Document one module at a time.\n:::\n\n::: refresh\n**Why it matters:** Your modules are the backbone of the plan. Titles and topics that reflect\ncurrent practice keep every later module current.\n:::\n:::\n\n::: refresh\nYou laid out your modules in your first workshop. Check each current title and topic against your\nupdated CLOs from step 1.3: every module should trace to a CLO, every title should make sense to a\nstudent on day one, and any topic students no longer need should be replaced.\n:::\n\n::: refresher\nThe plan has room for eight modules. Give each a title a student would\nunderstand on day one. Start from the CLOs: list what students need to know or practice to meet each\none, then cut any topic they don't need to meet a CLO.\n\nEvery module should trace back to your CLOs, and through them to the catalog and your program's\noutcomes. Here's one thread through MGMT 615:\n\n::: figure trace | One thread in MGMT 615, from catalog promise to modules\n- Catalog commitment | Diagnose why employees and teams underperform.\n- Program outcomes it supports | PLO 2: Analyze business problems using evidence and established frameworks. PLO 1: Lead individuals and teams to meet organizational goals.\n- Vision | \"When someone on their team struggles, students find out what is actually wrong before they act.\"\n- CLO 1 | Diagnose why an employee or team is underperforming using core theories of motivation and performance.\n- Modules | Module 1, What Managers Actually Do; Module 2, Motivating People; Module 4, Building and Leading Teams; Module 8, Hiring and Building Your Team.\n- Later in this workshop | Each of those modules gets a scenario (Module 3) and activities (Module 4) that practice CLO 1.\n:::\n:::\n\nOrder matters. In Module 3, each module becomes a scenario, a realistic situation your character\nfaces that week, so order the modules the way the decisions would come up at work: diagnosis before\ntreatment, one person before the whole team.\n\n### See it\n\n::: full\nHere's the module plan the MGMT 615 instructor settled on. Each of the eight modules focuses on\none or two CLOs and has three topics. The order follows the decisions a new manager meets, from\nunderstanding the role to building the team.\n:::\n\n::: refresh\nHere's how the MGMT 615 instructor did this step. They kept the eight modules and their order,\nreplaced one Module 4 topic, and updated the CLO numbers to match the six revised CLOs.\n:::\n\n::: plan Module titles, CLOs met, and topics\n| Module | Title | CLOs met | Topics |\n|---|---|---|---|\n| 1 | What Managers Actually Do | CLO 1, CLO 5 | What management is and isn't; from doing the work to getting work done through others; common first-90-days mistakes |\n| 2 | Motivating People | CLO 1, CLO 5 | Expectancy and self-determination theory; why incentives backfire; diagnosing a motivation problem before choosing a fix |\n| 3 | Performance Management and Feedback | CLO 2, CLO 5 | Setting expectations; the SBI feedback model; coaching vs. disciplinary conversations |\n| 4 | Building and Leading Teams | CLO 3, CLO 1 | What predicts team performance; structural vs. motivational fixes; role clarity and ownership of handoffs |\n| 5 | Managing Conflict and Difficult Conversations | CLO 3, CLO 2 | Task, process, and relationship conflict; structuring a difficult conversation; repairing a working relationship after conflict |\n| 6 | Delegation and Decision-Making | CLO 4, CLO 5 | Sorting tasks by delegation readiness; decision rights; where AI helps a management decision, and where it misleads |\n| 7 | Leading Through Change | CLO 5, CLO 3 | Why change efforts stall; sources of resistance; communicating change |\n| 8 | Hiring and Building Your Team | CLO 6, CLO 1 | Why gut-feel hiring fails; structured interviews and scorecards; proven experience vs. potential |\n:::\n\n::: figure coverage | MGMT 615 at a glance: which CLOs each module covers\n- Every CLO appears at least once, and each module focuses on one or two.\n:::\n\n### Draft (full build)\n\nThe AI drafts a title, CLOs met, and topics for each module from your CLOs, and explains the\norder it chose.\n\nAI instructions:\n\n```text\nDraft a module sequence from the CLOs, catalog commitments, and learner profile, using the number\nof modules the faculty member chose (default 8). For each module: a plain title, one primary CLO\nand at most one supporting CLO, and 3 to 5 topics. Every CLO appears at least once. Order the\nmodules the way the decisions would come up for a professional in the students' role, with a\none-sentence reason.\n\nReturn: {\"modules\": [{\"number\": int, \"title\": string, \"closMet\": [string], \"topics\": [string]}], \"orderReason\": string}\n```\n\nDemo response (MGMT 615):\n\n- Module 1: What Managers Actually Do (CLO 1, CLO 5)\n- Module 2: Motivating People (CLO 1, CLO 5)\n- Module 3: Performance Management and Feedback (CLO 2, CLO 5)\n- Module 4: Building and Leading Teams (CLO 3, CLO 1)\n- Module 5: Managing Conflict and Difficult Conversations (CLO 3, CLO 2)\n- Module 6: Delegation and Decision-Making (CLO 4, CLO 5)\n- Module 7: Leading Through Change (CLO 5, CLO 3)\n- Module 8: Hiring and Building Your Team (CLO 6, CLO 1)\n\nOrder: the modules follow the decisions a new manager meets, from understanding the role to\nbuilding the team.\n\n### Review (refresh)\n\n::: current modules\n:::\n\nThe AI marks each module Keep or suggests a revision, and flags any problems it finds. It also\nupdates the CLO numbers to match your CLOs from step 1.3.\n\nDemo response (MGMT 615):\n\n- Modules 1, 2, 3, 5, 6, and 7: keep.\n- Module 4: revise. The topic \"Designing team assignments that are accessible to every learner\"\n  is a note about designing the course; students wouldn't study it. Replacement: \"Role clarity\n  and ownership of handoffs.\" Matches the reflection that Module 4 never reached the handoff\n  problems.\n- Module 8: CLOs met change from \"CLO 4, CLO 1\" to \"CLO 6, CLO 1\".\n\n### Decide\n\n::: full\nYour final modules go in this box. They're what's saved to your Course Planning Document. Type in\nthe box to change anything, or select **Redraft with AI** under it to have the AI rewrite it.\n:::\n\n::: full\nUnder the AI's draft, select **Use these modules** to copy them here. Then edit titles, CLOs met,\nand topics, and reorder modules as needed.\n:::\n\n::: refresh\nYour current modules, from your Course Map, are in this box, one per line, and the box is what's\nsaved. Edit them here, or select **Review with AI** below. To use the AI's suggestions, select\n**Apply the suggested modules**, then keep, change, or undo each one. **Back to my Course Map\ntext** undoes every change.\n:::\n\n::: fields\n- Your modules, one per line, in order: the title, then the CLOs it meets, then its topics separated by semicolons. Don't number them; the tool numbers them in this order. | Motivating People. CLO 1, CLO 5. Expectancy and self-determination theory; Why incentives backfire; Diagnosing a motivation problem before choosing a fix.\n:::\n\nChecklist:\n\n- Each module has one or two CLOs.\n- Titles make sense to a student on day one.\n- The order follows the way the decisions would come up at work.\n\n### Checks\n\nWhen you save, the tool confirms that:\n\n- every CLO appears in at least one module;\n- each topic serves a CLO its module lists;\n- topics are content for students, not notes about designing the course.\n\nIt also notes any CLO that appears in only one module, or in more than five. In MGMT 615, the check noted \"CLO 4 and CLO 6 each appear in one module.\" The instructor\nkept the flag with the note \"Delegation and hiring are each a focused skill, practiced and assessed in\none module.\"\n\n### Save\n\nPlanning document: each module's title, CLOs met, and topics.\nProject file: `modules[].title`, `modules[].closMet`, `modules[].topics`; in refresh,\n`.original`. Other columns from an uploaded course map stay in\n`source.sections` for later modules.\n\n### Go deeper (supplemental)\n\n- `src:guide-course-alignment`\n\n---\n\n## Check-in prep\n\n> App note: shown after step 1.4.\n\nAI instructions:\n\n```text\nFrom this module's saved sections, what changed from the Course Map (Refresh), and kept flags,\nlist what's new or changed since the last check-in, the flags kept with their notes, and two questions worth raising with the ID.\nKeep it under 150 words.\n\nReturn: {\"changed\": [string], \"keptFlags\": [string], \"questions\": [string, string]}\n```\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Learners, program outcomes: new\", \"Vision: cut to four sentences\", \"CLOs: four revised, CLO 3 kept, CLO 6 added for hiring\", \"Modules: Module 4 topic replaced, Module 8 mapped to CLO 6\"],\n  \"keptFlags\": [\"CLO 4 and CLO 6 each appear in one module: focused skills, practiced and assessed in one module\"],\n  \"questions\": [\"Does adding a sixth CLO for hiring need program director approval?\", \"Is one module enough practice for delegation (CLO 4)?\"]\n}\n```\n\nProject file: `checkins.prep.m1`.\n"}, {"id": "m2", "file": "02-ai-and-rsi.md", "raw": "# Module 2. AI & RSI in Strategic Course Design\n\nModule id: `m2`\nSteps: 3\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: the syllabus statement on how and when students hear from the instructor, the\nperformance and conflict at the center of the course's story, and the character profile.\n\nRefresh checks for this module: a throughline exists, or could come from cases the course\nalready uses; the syllabus says when students hear from the instructor.\n\nNo refresh reflection in this module. The character and conflict are new work for nearly every\ncourse. Module 4 checks RSI for every module's activities.\n\nSources: `src:guide-rsi`, `src:assignment-m2-understanding-rsi`,\n`src:assignment-m2-character-conflict`, `src:guide-storytelling`, `src:example-mgmt615-character`,\n`src:example-mgmt615-course-map`\n\n---\n\n## 2.1 Your interaction statement\n\nTime: about 20 minutes\nPattern: interview, then draft (full build) or edit in place (refresh)\n\n### Learn\n\n::: purpose\n**What you'll do:** Write the statement for your syllabus that tells students how and when they'll\nhear from you.\n\n**Why it matters:** [Federal rules](src:ext-cfr-600-2) require every online course to show that the instructor is\nactively teaching, and your syllabus statement is where you commit to it.\n:::\n\nThe federal term for active teaching is regular and substantive interaction (RSI). A course that\ncan't show it is treated as a correspondence course, and its students lose eligibility for federal\nfinancial aid. Your ID's team checks for it in every course review.\n\n**Substantive** means the interaction is about teaching, learning, or assessment. An announcement explaining a concept\nhalf the class missed counts as substantive; a due-date reminder doesn't. **Regular** means\npredictable, proactive, and responsive to how students are doing. Flex Online instructors typically\nanswer student questions within 24 to 48 hours and return feedback on major assignments within 5 to\n7 days.\n\nFor the substantive test, your course needs instructor activity in at least two of these five\ncategories:\n\n| Category | Counts | Doesn't count on its own |\n|---|---|---|\n| 1. Direct instruction | Your recorded lectures, worked examples you narrate, case debriefs, guided questions | Third-party videos with no framing or follow-up, reading lists with no instructions, quizzes graded only automatically |\n| 2. Assessing or giving feedback | Comments on graded work, audio or video feedback, feedback on drafts, peer review you oversee, AI-drafted feedback you review and edit | Scores only, generic comments such as \"good job\", peer grading you never see, AI feedback you didn't review |\n| 3. Giving information or answering questions | Announcements that clear up a hard concept, content answers by email or in forums, module orientation videos that explain how the content fits together, Q&A sessions about content | Deadline reminders, automated messages, welcome videos with no later engagement, forums where only students answer |\n| 4. Facilitating discussion | Follow-up questions, summaries that connect posts to the assigned readings, live sessions about content | Posting a prompt and grading replies with no comment, office hours used only for logistics |\n| 5. Other instructional activities | Feedback on journals, simulations you debrief, debriefs after group projects | Reflections nobody reads, simulations nobody discusses |\n\nMost of the right-hand column isn't bad teaching. A good industry video helps students learn. So\ndoes an auto-graded practice quiz. They count as RSI once you add your own engagement, such as a\ntwo-minute introduction on what to watch for and a follow-up on what students noticed. Adding that\nengagement often takes only a few minutes.\n\n**Where AI fits.** AI can draft feedback, summarize discussion threads, or flag students who have\ngone quiet. The interaction counts when you review and adjust what goes to students. Feedback an\nAI writes and you release unread does not. As AI takes on more of the explaining, what students\nneed most from you is the judgment it can't supply: framing the problem, weighing evidence,\nand telling them where their reasoning went wrong (Maxwell, 2026).\n\nYou don't need to sort your activities into these categories now. Module 4 does that\nautomatically for every module.\n\n### See it\n\nHere's the statement the MGMT 615 instructor settled on. In three sentences, it says when\nstudents hear from the instructor, how soon feedback comes back, and what happens when a student\nfalls behind.\n\n::: plan Instructor Interaction\nEvery Monday I'll post an announcement that introduces the week's management decision and\nresponds to what I saw in your last assignment. You'll get written feedback on each module's main\nassignment within five days of the due date. I check activity every Wednesday, and if you've\nmissed a module's work, I'll contact you that week.\n:::\n\n::: figure week | MGMT 615's week of instructor contact\n- Mon | Announcement: the week's management decision, and what the instructor saw in the last assignment\n- Tue |\n- Wed | Activity check, and outreach to anyone who missed a module's work\n- Thu |\n- Fri |\n- Sat |\n- Sun |\n- Note | Feedback on each module's main assignment comes within five days of the due date.\n:::\n\n### Draft (full build) and Review (refresh)\n\nAnswer three questions, then select the button below. The AI turns your answers into a statement\nof 2 or 3 sentences. If it adds anything you didn't say, it marks it [check] so you can confirm or\nremove it.\n\n::: refresh\nIf your Course Map already has a statement about how students hear from you, the AI starts from\nit instead: it flags anything missing and suggests one revision that keeps your commitments. Your\nanswers fill the gaps.\n:::\n\n::: fields\n- In a normal week, when and how will students hear from you? | An announcement every Monday, and the weekly live class session.\n- How soon will students get feedback on their main assignment each module? | Within five days.\n- How will you notice a student falling behind, and what will you do? | I'm not sure yet.\n:::\n\n::: full\nAI instructions:\n\n```text\nDraft a syllabus statement of 2 or 3 sentences from the faculty member's answers. It
