saved for this module in step\n7.1, the session day, and the faculty member's reflection on past sessions. Add the story to the\nplan: open the session in the character's situation at the scenario's trigger (an opening poll can\nask what the character should do); make the main activity the character's decision, using the\nevidence the character has; ask questions about students' own work after that decision; and close\nwith the instructor's own call and its link to Sunday's assignment. If the session's activity was\nchanged in step 7.1, use the new activity. Keep the faculty member's activity, sections, timing,\nand wording wherever the story doesn't require a change. Also add any setup details the\nInstructional Technologist needs (exact poll wording and options, breakout size and length) and a\ntwo-minute buffer, and note anything that doesn't fit the shape for the session day. Write the plan\nin the team's Cohort Session Lesson Plan template (same fields as the full build draft). List what\nchanged, marking story changes, and what stayed the same.\n\nReturn: {\"plan\": {...same shape as full build...}, \"changed\": [{\"change\": string, \"story\": boolean}], \"kept\": [string]}\n```\n:::\n\nDemo response (MGMT 615):\n\n::: refresh\nYour plan with the story added:\n:::\n\n**Lesson title:** Who Gets the Bonus? (Module 2)\n\n**Overview:** Students test Dana's pick-rate bonus against three pieces of evidence and recommend\nkeeping, adjusting, or replacing it. The session turns the week's motivation theory into a call\nthey have to defend.\n\n**Objectives:** Diagnose a motivation problem before choosing a fix (CLO 1). Recommend an incentive\nchange and justify it with evidence (CLO 5).\n\n**Main topics:** Expectancy theory and the bonus; Luis's record; keeping, adjusting, or replacing\nthe bonus.\n\n**Number of students and breakout setup:** About 30 students. Breakouts of three for split\nevidence, then regrouped breakouts of three so each group holds all three pieces.\n\n| Duration | Section | Subtopics, Talking Points, and Other Details |\n|---|---|---|\n| 10 | Introduction | Welcome. Check understanding with a poll: which link in expectancy theory does the pick-rate bonus break? Clear up any mix-ups, then recap Dana's situation. |\n| 15 | Topic 1: Guided practice | Diagnose Luis together. The instructor walks through his record; students name the motivation problem in the chat, and the instructor coaches toward the evidence. |\n| 25 | Topic 2: Split evidence | Breakouts of three. Each group gets one piece of evidence: the bonus data, Luis's record, or the crew's view. Timer on screen. |\n| 25 | Topic 3: Recommend | Regroup so each new group holds all three pieces of evidence. Groups recommend keeping, adjusting, or replacing the bonus, with one reason from each piece. What would you tell Dana to do first? Have you seen an incentive like this backfire at work? |\n| 13 | Conclusion | Two groups share their recommendation, then the instructor's own call and why. Preview the motivation diagnosis due Sunday. |\n| 2 | Buffer | Last questions, then close. |\n\n**Materials, handouts, and room setup:** Slides; a concept-check poll; three evidence handouts, one\nper group. Breakouts of three for 25 minutes, then regrouped breakouts of three for 25 minutes,\nwith a timer for each round.\n\n::: refresh\nWhat changed:\n\n- Story: the session opens on Dana's pick-rate bonus. The recap of the reading became a poll on\n  which link in expectancy theory her bonus breaks; students have read it by Thursday.\n- Story: \"What motivates you at work?\" became Dana's decision. Students test her bonus against the\n  evidence she has, the bonus data, Luis's record, and the crew's view, and recommend what she\n  should do.\n- Story: your workplace question stays, now asked after groups decide for Dana. You noted the room\n  goes quiet on open questions to everyone, so groups answer it first.\n- Story: the session closes with your own call on Dana's bonus and how it feeds Sunday's motivation\n  diagnosis.\n- From step 7.1: the roundtable became the split-evidence breakouts you chose there.\n- For your Instructional Technologist: the poll's wording, breakout sizes, the regrouping, and a\n  two-minute buffer.\n\nWhat stayed the same:\n\n- The session's purpose: diagnosing a motivation problem before choosing a fix.\n- Your question about incentives that backfire at work.\n- The preview of the motivation diagnosis due Sunday, and 90 minutes in all.\n:::\n\n### Decide\n\nMake the plan yours in the form below, which follows the team's Cohort Session Lesson Plan. Type in\nany box to change it, add a section when you need one, or select **Redraft with AI** to have the AI\nrewrite part of it. The total under the plan shows whether the minutes add up to 90.\n\n::: fields\n- Lesson title\n- Overview\n- Objectives\n- Main topics\n- Number of students and breakout setup\n:::\n\n::: grid lesson\n:::\n\n::: fields\n- Materials, handouts, and room setup\n:::\n\n**Student-facing outline and slides.** When your lesson plan is ready, select the button below. The\nAI drafts the outline in the team's outline template and a deck in the Flex Online slide template,\nboth from your plan. Edit the outline here. Your ID builds the final deck from the draft, or checks\nthe one you make, for accessibility.\n\n::: derive\n:::\n\n::: fields\n- Your student-facing outline\n:::\n\nChecklist:\n\n- The minutes add up to 90, with a short buffer before the close.\n- Every poll has its exact wording and options.\n- The outline and slides say the same thing as your plan.\n- You've told your ID what each image or chart on your slides is meant to show.\n\n### Checks\n\nWhen you save, the tool checks that:\n\n- the lesson plan totals 90 minutes and follows the shape for your session day;\n- every poll and breakout has its setup details;\n- every topic in the plan appears in the outline and the slides.\n\nOn the refresh track, the tool also checks that the plan names your character and the module's\nscenario, and that the main activity centers on the character's decision.\n\n### Save\n\nPlanning document: nothing new; the session's line gains \"lesson plan drafted\" (full build) or\n\"story added to lesson plan\" (refresh).\nDownload: the lesson plan and the student-facing outline as Word files in the team's templates, and\nthe draft slides in the Flex Online slide template, to share with your ID, who builds the final deck\nor checks yours for accessibility. There's nothing to submit; they're there to show and share.\nProject file: `lessonPlans[]` (module, title, overview, objectives, topics, context, rows,\npreparation, outline, slides).\n\n### Go deeper (supplemental)\n\n- `src:guide-cohort-sessions`\n- `src:guide-accessibility`: contrast, alt text, and accessible slides and documents.\n- `src:ext-donelan-2025`: why some students don't take part in live online sessions.\n\n### No cohort sessions\n\nYour course has no cohort sessions, so there's no session to plan. Select **Save to plan** and go on to step 7.3.\nIf that's not right, choose Yes and this step returns.\n\n::: choose cohort\n- yes | Yes, it has cohort sessions | A 90-minute live session each week in Modules 2 to 8. Most Flex Online courses have them.\n- no | No cohort sessions | Students work on their own schedule every week.\n:::\n\n---\n\n## 7.3 Ready for the stage\n\nTime: about 15 minutes\nPattern: check and complete (both tracks)\n\n### Learn\n\n::: purpose\n**What you'll do:** Fill in your part of the XR Run of Show for the session you planned in step\n7.2: the session details, your background, and the assets you'll use, in order.\n\n**Why it matters:** Cohort sessions are broadcast live from the XR stage. When you choose your\nbackground and list your assets ahead of time, the stage, Zoom, polls, and breakouts can all be set\nup before you go live, and the session starts on time.\n:::\n\nThe **[XR Run of Show](src:template-run-of-show)** is the production team's plan for each session.\nIt sets the order of the session but leaves your teaching unscripted. It has six parts, and you\nfill in three:\n\n| Part | Who fills it in |\n|---|---|\n| Cohort information: course, section, date and time, location, and background | You, except the call times |\n| Team and contacts | The production team |\n| Pre-show checklist, from an hour before to the start | The production team |\n| Session assets: slides, polls, and handouts, in the order you'll use them | You |\n| Contingency plan contacts | The production team |\n| Post-session: saving the recording, a short debrief, resetting the stage | The production team |\n\n**Your assets start from your lesson plan.** The form below lists your slide deck first, then each\npoll your lesson plan in step 7.2 names. Add handouts and anything else you'll show.\n\n**Keep it simple.** Choose one background with the Learning Media Team; the one you chose for your\nvideos works well. Teach with your slides, and post handouts in Canvas so a link can go in the\nchat.\n\n**On the day.** Arrive at the call time the team gives you for a mic check and a walkthrough. Look\nat the camera lens when you speak to students; a confidence monitor shows your slides and notes. The\nteam can give you time signals, and your Instructional Technologist runs Zoom, so you can focus on\nteaching.\n\nBefore your first session, schedule a practice session on the stage with Learning Delivery. It's\nthe time to try the polls and breakouts, find where to look, and get comfortable with the setting.\n\n### See it\n\nHere's the MGMT 615 instructor's part of the XR Run of Show for the Module 5 session.\n\n**Cohort information:** MGMT 615, section 700. Thursday, Sept. 24, 6:00 to 7:30 p.m. CT, on the\nXR stage. Background environment: virtual podcast studio, the same one as the course videos.\n\n| Order | Name | Asset Type | Link (Slides in Canvas) |\n|---|---|---|---|\n| 1 | Module 5 cohort session slides | Slides | Module 5 cohort session page in Canvas |\n| 2 | How should Dana answer Greg? | Poll results | Shown from the week's poll |\n| 3 | Root causes of disagreement | Poll | Loaded by the Instructional Technologist |\n| 4 | Observer checklist | Handout | Module 5 page in Canvas, linked in the chat |\n\n### Decide\n\nFill in your part of the run of show. The parts the production team fills in are shown so you know\nwhat happens before and after the session.\n\n::: run-of-show\n:::\n\n::: grid assets\n:::\n\nChecklist:\n\n- You've chosen a background with the Learning Media Team.\n- Every poll and handout in your lesson plan is listed, in order.\n- You've asked to schedule a practice session on the XR stage with Learning Delivery.\n\n### Checks\n\nWhen you save, the tool confirms that:\n\n- the session date, time, and background are filled in;\n- the slides are listed first, and every poll and handout in the lesson plan is listed.\n\n### Save\n\nPlanning document: nothing new; the session's line gains \"ready for the stage.\"\nDownload: your part of the XR Run of Show as a Word file in the team's template, to share with your\nID.\nProject file: `stage[]` (module, course, section, date, time, background, assets).\n\n### No cohort sessions\n\nYour course has no cohort sessions, so there's no session to prepare for the stage. Select **Save to plan** and go on to Module 8.\nIf that's not right, choose Yes and this step returns.\n\n::: choose cohort\n- yes | Yes, it has cohort sessions | A 90-minute live session each week in Modules 2 to 8. Most Flex Online courses have them.\n- no | No cohort sessions | Students work on their own schedule every week.\n:::\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Cohort sessions for Modules 2 to 8\", \"Module 2 and 4 roundtables given a live moment\", \"Story added to the Module 2 lesson plan; student outline and slides drafted\", \"Background and session assets for the stage\"],\n  \"keptFlags\": [],\n  \"questions\": [\"When can I practice on the XR stage before the first session?\", \"Can the Instructional Technologist show the week's Poll Everywhere results at the start of Module 5?\"]\n}\n```\n\nProject file: `checkins.prep.m7`.\n"}, {"id": "m8", "file": "08-readiness-and-teaching.md", "raw": "# Module 8. Development Readiness and Sustainable Teaching\n\nModule id: `m8`\nSteps: 2\nID check-in: live review of the finished plan; the ID then schedules the kick-off meeting\n\nFaculty complete: a summary review of the whole Course Planning Document (Full build) or updated\nCourse Map (Refresh), and the communication and feedback plan.\n\nRefresh checks for this module: the planning document is complete and aligned; announcement and\nfeedback routines are in place.\n\nSources: `src:reading-m8-preparing-for-development`, `src:assignment-m8-course-planning-document`,\n`src:guide-online-teaching-practices`, `src:guide-grading-weight`, `src:guide-large-enrollment`,\n`src:guide-rsi`, `src:example-mgmt615-course-map`\n\n## Refresh reflection\n\n> App note: Shown once, in the refresh track only, before step 8.1. It asks only about how the\n> course was taught last time.\n\n::: purpose\n**What you'll do:** Answer a few questions about how you communicated with students and gave\nfeedback the last time you taught the course. Answer whichever apply; short notes are fine.\n\n**Why it matters:** The AI uses your answers when it reviews each section in this module, so its\nsuggestions reflect what actually happened in your course.\n:::\n\n1. How did students hear from you each week, and did it hold up in the busiest weeks?\n2. Where did grading and feedback take the most time?\n3. What did students say about feedback?\n4. Which routines would you keep exactly as they are?\n\n> App note: AI instructions are the same as the Module 1 reflection instruction.\n\nDemo answers (MGMT 615): (1) \"Monday announcements, but they slipped mid-term.\" (2) \"The\nManagement Approach Summary and the memos.\" (3) \"They wanted it faster.\" (4) \"Monday\nannouncements, when I kept them up.\"\n\nProject file: `reflection.m8`.\n\n---\n\n## 8.1 Your Course Planning Document\n\nTime: about 20 minutes\nPattern: review, then fix or note\n\n### Learn\n\n::: purpose\n**What you'll do:** Read a summary of your finished Course Planning Document, fix or note anything\nstill open, and save the final version for your ID.\n\n**Why it matters:** This document guides your course's development, and it's much easier to adjust\nthe plan now than to rebuild a module later.\n:::\n\nThe summary under Decide pulls your whole plan together:\n\n- **Your course at a glance:** the hours in each module's week, and totals for the course.\n- **The story thread:** for each module, the scenario, the main activity, the materials and media,\n  and the cohort session. Each piece should connect to the scenario's decision.\n- **Anything still open:** a week far from its target, or a piece of the thread that doesn't\n  connect. Select **Go to the step** to fix it, or keep it with a short note for your ID.\n\nThen open the whole planning document and read it once, top to bottom, the way your ID and the\ndevelopment team will.\n\n### See it\n\nMGMT 615's summary showed four open items. Module 1 came to about 5.5 hours against its 4-hour\ntarget, so the instructor made the sort optional. Module 6 ran light, at about 8 hours, so the\ninstructor added a short practice activity. Modules 6 and 7 had no scenario video or graphic; the\ninstructor kept both with a note that the teaching videos carry Dana's story.\n\n### Decide\n\n::: course-summary\n:::\n\n::: fields notes\n- Notes for your ID on anything you're keeping as it is\n:::\n\nChecklist:\n\n- Every module's story thread connects, or the gap has a note.\n- Module 1 is about 4 hours, and every other week is close to your target.\n- You've read the whole planning document once, top to bottom.\n\n### Checks\n\nWhen you save, the tool checks that nothing is left open without a fix or a note. Then **Save final\nversion** downloads the planning document as a Word file to share with your ID.\n\n### Save\n\nPlanning document: no new section. The change log (Refresh) and check-in summary are complete.\nProject file: `alignment.final`.\n\n### Go deeper (supplemental)\n\n- `src:guide-grading-weight`\n- `src:guide-large-enrollment`\n\n---\n\n## 8.2 Communication and feedback plan\n\nTime: about 25 minutes\nPattern: interview, then draft (both tracks)\n\n### Learn\n\n::: purpose\n**What you'll do:** Plan how students will hear from you each week: announcements, feedback, and\nanswers to questions.\n\n**Why it matters:** In a Flex Online course the content does the presenting; your weekly job is to\nguide, respond, and give feedback. That's also how you meet RSI week after week.\n:::\n\nPlan your communication now, so it holds up in week ten, not just week one. In the planning\ndocument, it goes with your interaction statement from Module 2.\n\n**Announcements.** Each module gets an opening announcement (where the story stands and the first\nthing to do) and a closing one (what the module added up to and the next decision). Add a midpoint\nnote on what you're seeing in student work; it can't be written ahead, because it responds to what\nstudents actually did, and that's what makes it count as RSI. If your course has cohort sessions,\nadd a short note the day before each one on what to prepare or bring. AI can draft any of these;\nedit each one so it sounds like you.\n\n**Feedback.** Students want to know what they did well, what fell short, and what to change, along\nwith the grade. A comment library, clickable rubrics, and short audio or video comments save time\nwithout thinning feedback. If AI drafts comments, read and edit each one before you release it.\n\n**Questions.** Reply within 24 to 48 hours, and answer common questions once, in an announcement or\nthe General Q&A discussion, so everyone sees the answer.\n\n### See it\n\nIn MGMT 615's plan, Monday opening announcements carry Dana's story, and Wednesday midpoints respond to\nwhat the instructor sees in the week's drafts and polls and say what to bring to Thursday's cohort\nsession. Feedback on main assignments comes within five days: a clickable rubric plus a 2-minute\nvideo comment. The instructor's reflection said Monday announcements slipped mid-term, so all\nopening and closing announcements are drafted before the term and scheduled.\n\n### Draft (full build) and Review (refresh)\n\n::: refresh\nIf your Course Map already has a communication plan or announcements, the AI starts from them. It\nchecks them against your interaction statement and the Learn section, and uses your reflection to\nfix what slipped. MGMT 615's Course Map had none, so the AI drafted a plan, and the reflection\nadded the line about scheduling announcements before the term.\n:::\n\nAnswer the questions, then select the button below. The AI drafts your plan and the Module 1\nopening announcement. Select **Use this plan** to copy them into the boxes under Decide.\n\n::: fields\n- Which kind of feedback suits you best: written, audio, or video? | Short video comments, with a rubric.\n- Which weeks of the term are your busiest outside the course? | Weeks 5 and 6, during our program's residency.\n:::\n\n::: full\n::: fields\n- Is there anything you already do in announcements, in this or another course, that you want to keep? | A Monday note that starts with a question.\n:::\n:::\n\nAI instructions:\n\n```text\nFrom the answers, the interaction statement, the cohort session day (if the course has sessions),\nthe activities, and the scenarios, draft:\n1. A communication and feedback plan of 4 to 6 short lines: announcement days, feedback format and\n   turnaround for main assignments, how AI drafting will be reviewed, how common questions are\n   answered, and how the plan holds in the faculty member's busiest weeks.\n2. The Module 1 opening announcement, under 120 words, in the faculty member's voice, carrying the\n   story forward. Module 1 has no cohort session.\nKeep every commitment consistent with the interaction statement.\n\nReturn: {\"plan\": [string], \"announcement\": string}\n```\n\nDemo response (MGMT 615):\n\nPlan:\n\n- Monday: an opening announcement that carries Dana's story and names the week's decision.\n- Wednesday: a midpoint announcement on what I'm seeing in drafts and polls, and what to bring to Thursday's cohort session.\n- Main assignments: a clickable rubric plus a 2-minute video comment, within five days.\n- AI-drafted comments are read and edited before release.\n- Common questions are answered once, in the General Q&A discussion.\n- Weeks 5 and 6: opening and closing announcements are written and scheduled before the term.\n\n**Module 1 opening announcement:** Welcome to MGMT 615. This week you meet Dana Ortiz, eight months\ninto running a distribution center, with on-time shipping down eight points and a director who's\nalready decided whose fault it is. Start with her Monday report and the Whitfield chapter. By\nSunday, you'll decide what Dana should do with her first week, and why.\n\n### Decide\n\nYour final plan goes in these boxes. Type in either box to change it, or select **Redraft with AI**\nunder a box to have the AI rewrite it.\n\n::: fields\n- Your communication and feedback plan, one commitment per line\n- Your Module 1 opening announcement\n:::\n\nChecklist:\n\n- The plan matches your interaction statement.\n- Midpoint announcements respond to real student work.\n- You can keep it up in your busiest weeks.\n\n### Checks\n\nWhen you save, the tool checks that:\n\n- every commitment matches your interaction statement, including days and turnaround;\n- each module has an opening and a closing announcement planned;\n- AI-drafted feedback has a review step.\n\n### Save\n\nPlanning document: the communication and feedback plan, added to the Instructor Interaction\nsection under your interaction statement.\nDownload: the Module 1 opening announcement as a Word file, to share with your ID.\nProject file: `communication.plan`, `communication.announcement`.\n\n### Go deeper (supplemental)\n\n- `src:guide-online-teaching-practices`\n- `src:guide-rsi`\n\n---\n\n## Check-in prep and finish\n\nSame instructions as Module 1, with one addition: the app offers Save final version once step 8.1\nhas nothing open without a fix or a note. The final version leaves out the check-in summary and, if the faculty member\nchooses, the change log. The faculty member saves it to the shared folder, and the ID schedules\nthe kick-off meeting.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Summary review: Module 1 lightened, Module 6 given a practice activity, Modules 6 and 7 media noted\", \"Communication and feedback plan\", \"Module 1 opening announcement\"],\n  \"keptFlags\": [\"Modules 6 and 7 have no scenario media: the teaching videos carry the story\"],\n  \"questions\": [\"Which scenario videos should be produced first?\", \"Can the comment library be set up in the development shell before the term?\"]\n}\n```\n\nProject file: `checkins.prep.m8`.\n"}], "demo": {"mgmt615-activities.json": {"about": "Recorded demo data for Module 4 (MGMT 615, fictional). 'activities' are the module's activities after the refresh review. Each has type, title, CLOs, weight (high, medium, low), estimated student hours, RSI category (null if it doesn't count on its own) and AI-completion risk for graded work. 'review' holds the refresh findings for steps 4.1 and 4.2. Activities from the course map are kept unless a finding says otherwise.", "modules": [{"module": 1, "activities": [{"type": "Discussion", "title": "Introductions and Your Management Story", "clos": ["CLO 1"], "weight": "low", "hours": 1, "rsi": 4, "aiRisk": "low"}, {"type": "Assignment", "title": "Case Analysis: Maria's First Ninety Days and Dana's First Ba am, a structured hire instead of a gut-feel one. These are the skills that separate someone ready to manage a bigger team from someone who's simply good at running the current one. Mastery here means producing the script, the memo, or the scorecard a student would actually use at work.", "clos": ["CLO 1: Apply core theories of motivation and performance to diagnose why an employee or team is underperforming.", "CLO 2: Design a feedback or coaching conversation that changes an employee's behavior, not just documents it.", "CLO 3: Evaluate team dynamics and organizational context to select a management intervention appropriate to the actual problem.", "CLO 4: Make a delegation or decision-rights call and justify the trade-offs involved.", "CLO 5: Communicate a management decision in language a direct report can act on immediately."], "modules": [{"module": 1, "title": "What Managers Actually Do", "clos": ["CLO 1", "CLO 5"], "topics": ["What management is (and isn't)", "The shift from doing the work to getting work done through others", "Common first-90-days mistakes", "Course orientation: how the case method works in this course"], "activities": ["Discussion: Introductions and Your Management Story", "Individual Assignment: Case Analysis, Maria's First Ninety Days", "Interactive Assignment: Manager vs. Individual Contributor Sort"], "materials": ["Book Chapter: Whitfield, D. (2019). Chapter 2: The Manager's Dilemma. Becoming the Boss: A First-Time Manager's Field Guide. Larkspur Press. (~14 pgs)", "Case: Maria's First Ninety Days [Case study]. (~4 pgs)", "Interactive Reading: Setting Your Management Baseline. (~2 pgs)", "Supplemental: Article: Okafor, T. (2024). Why new managers fail in the first year. Journal of Applied Management Practice, 12(3), 44–51."], "media": ["Video: Welcome to MGMT 615 (3:00)", "Video: Reyes, P. (2026). The Manager's Shift [Video]. Larkspur Learning Media. (7:30)", "Video: Discussion Primer: Maria's First Ninety Days (2:15)"], "cohort": null ent preview. Program outcomes are fictional.", "course": {"number": "MGMT 615", "title": "Managing People and Performance", "credits": 3, "program": "[Program name]", "idName": "[ID name]"}, "catalog": "Prepares working professionals to manage the people side of organizational performance. Students learn to diagnose why employees and teams underperform, deliver feedback that actually changes behavior, build and repair team dynamics, delegate and make decision-rights calls under pressure, lead a team through change, and hire well. 3 credit hours.", "programOutcomes": ["PLO 1: Lead individuals and teams to meet organizational goals.", "PLO 2: Analyze business problems using evidence and established frameworks.", "PLO 3: Communicate decisions clearly to varied audiences."], "vision": "MGMT 615 helps new managers run a team instead of doing the team's work themselves. When someone on their team struggles, students find out what is actually wrong before they act. They give feedback that changes behavior, delegate real decisions, and have the hard conversations managers often avoid. They lead their teams through change and hire people who fit the work.", "learners": "Students are working professionals in a first management role or about to step into one, most promoted after strong work as individual contributors. They arrive with years of workplace experience and plenty of stories about good and bad managers, but little formal training in managing people. They take the course to handle the conversations and decisions their new role puts in front of them. Most work full time and study in the evenings and on weekends.", "clos": ["CLO 1: Diagnose why an employee or team is underperforming using core theories of motivation and performance.", "CLO 2: Design a feedback or coaching conversation that targets a specific behavior and states the change expected.", "CLO 3: Evaluate team dynamics and organizational context to select a management intervention appropriate to the actual problem.", "CLO 4: Justify a delegation or decision-rights call, including the trade-offs involved.", "CLO 5: Draft a management decision message that states the decision and the next steps a direct report must take.", "CLO 6: Evaluate candidates for a role using a structured interview scorecard."], "modules": [{"title": "What Managers Actually Do", "closMet": ["CLO 1", "CLO 5"], "topics": ["What management is and isn't", "From doing the work to getting work done through others", "Common first-90-days mistakes"]}, {"title": "Motivating People", "closMet": ["CLO 1", "CLO 5"], "topics": ["Expectancy and self-determination theory", "Why incentives backfire", "Diagnosing a motivation problem before choosing a fix"]}, {"title": "Performance Management and Feedback", "closMet": ["CLO 2", "CLO 5"], "topics": ["Setting expectations", "The SBI feedback model", "Coaching vs. disciplinary conversations"]}, {"title": "Building and Leading Teams", "closMet": ["CLO 3", "CLO 1"], "topics": ["What predicts team performance", "Structural vs. motivational fixes", "Role clarity and ownership of handoffs"]}, {"title": "Managing Conflict and Difficult Conversations", "closMet": ["CLO 3", "CLO 2"], "topics": ["Task, process, and relationship conflict", "Structuring a difficult conversation", "Repairing a working relationship after conflict"]}, {"title": "Delegation and Decision-Making", "closMet": ["CLO 4", "CLO 5"], "topics": ["Sorting tasks by delegation readiness", "Decision rights", "Where AI helps a management decision, and where it misleads"]}, {"title": "Leading Through Change", "closMet": ["CLO 5", "CLO 3"], "topics": ["Why change efforts stall", "Sources of resistance", "Communicating change"]}, {"title": "Hiring and Building Your Team", "closMet": ["CLO 6", "CLO 1"], "topics": ["Why gut-feel hiring fails", "Structured interviews and scorecards", "Proven experience vs. potential"]}], "interactionStatement": "Every Monday I'll post an announcement that introduces the week's management decision and responds to what I saw in your last assignment. You'll get written feedback on each module's main assignment within five days of the due date. I check activity every Wednesday, and if you've missed a module's work, I'll contact you that week.", "character": {"premise": "A story about Dana Ortiz, a newly promoted operations manager at a regional distribution center, who struggles to find the real causes of her site's slipping performance and coach, delegate, communicate, and hire her way to a fix when leadership has already decided who to blame.", "position": "Operations manager at a regional distribution center for a mid-size home-goods retailer. Leads 3 shift leads and about 45 hourly associates and reports to a regional director. Promoted 8 months ago from day-shift lead; her first time managing managers.", "conflict": "On-time shipping has dropped from 97% to 89% six weeks before peak season, and her director has already blamed her day-shift lead. Dana sees a speed bonus and a shift handoff no one owns.", "peers": "Ray Kowalski, night-shift lead, agrees with the director. Jordan Pike, day-shift lead, senses he's being blamed. Alicia Grant, a manager at a sister site, has the data but says to replace Jordan. Luis Ferreira, an associate, keeps missing the bonus because he won't cut corners.", "valuesFears": "Values reliability, fairness, and loyalty to the floor. Fears being wrong about her boss, losing the crew's trust, and missing peak season in her first year.", "backstory": "Started as a seasonal picker. Known as the lead who \"just fixes it.\" Her first review as manager called her a bottleneck, which led her to the graduate program."}, "communicationPlan": ["Monday: opening announcement that carries Dana's story and names the week's decision.", "Wednesday: midpoint announcement responding to what I see in drafts and polls.", "Wednesday before each Thursday cohort session: what to prepare or bring.", "Main assignments: clickable rubric plus l vs. Proven: Make the Call", "pages": 4, "rights": "created", "supports": "Hiring memo"}], "review": ["Scenario exhibits were missing from the plan for Modules 1, 2, 5, and 8. Resolution: added as created content."]}]}, "mgmt615-media.json": {"about": "Recorded demo data for Module 6 (MGMT 615, fictional). 'media' is each module's produced media after the refresh: kind (welcome, overview, teaching, scenario, closing, graphic, audio), title, minutes, where it's made (xr-stage, media-team, one-touch), and its storyline connection. Curated videos belong to Module 5, not here. 'review' holds refresh flags and resolutions.", "modules": [{"module": 1, "minutes": 7.5, "media": [{"kind": "welcome", "title": "Welcome to MGMT 615", "minutes": 3, "where": "xr-stage", "story": "Introduces Dana and the drop in on-time shipping that starts the course"}, {"kind": "overview", "title": "Module 1 overview: What Managers Actually Do", "minutes": 2, "where": "xr-stage", "story": "Names Dana's first decision: work the floor or find the cause"}, {"kind": "scenario", "title": "The First Bad Week", "minutes": 2.5, "where": "media-team", "story": "Dana's Monday report and Greg's email, ending at her decision"}, {"kind": "graphic", "title": "Manager vs. individual contributor: where the time goes", "minutes": 0, "where": "media-team", "story": "Used in Dana's first-week case"}], "review": ["No module overview video in the course map for Modules 1 to 8; the first teaching video in each module partly does the job. Resolution: add a 2-minute overview per module, recorded on the XR stage in one session."]}, {"module": 2, "minutes": 10, "media": [{"kind": "overview", "title": "Module 2 overview: Motivating People", "minutes": 2, "where": "xr-stage", "story": "Picks up the bonus problem"}, {"kind": "teaching", "title": "Motivation Isn't One Thing", "minutes": 6, "where": "xr-stage", "story": "Applies expectancy theory to the pick-rate bonus"}, {"kind": "scenario", "title": "The Bonus That Backfired", "minutes": 2, "where": "media-team", "story": "Luis keeps missing the bonus he refuses to chase"}], "review": ["'Discussion Primer: The Incentive Trap' summarized an article without connecting to the story. Resolution: replaced by the scenario video."]}, {"module": 3, "minutes": 14, "media": [{"kind": "overview", "title": "Module 3 overview: Performance Management and Feedback", "minutes": 2, "where": "xr-stage", "story": "Greg wants a formal warning for Jordan"}, {"kind": "teaching", "title": "Giving Feedback That Actually Changes Behavior", "minutes": 7, "where": "xr-stage", "story": "Uses Jordan's handoff habit as the running example", "parts": 2}, {"kind": "scenario", "title": "Role-play: a coaching conversation with Jordan", "minutes": 5, "where": "media-team", "story": "Models the conversation Dana could have"}], "review": ["The 8-minute teaching video runs past 6 minutes. Resolution: kept at 7 minutes in two clearly marked parts."]}, {"module": 4, "minutes": 11, "media": [{"kind": "overview", "title": "Module 4 overview: Building and Leading Teams", "minutes": 2, "where": "xr-stage", "story": "The handoff nobody owns"}, {"kind": "teaching", "title": "Why Some Teams Just Work", "minutes": 6, "where": "xr-stage", "story": "Diagnoses the two-shift handoff with the framework"}, {"kind": "graphic", "title": "The 4:45 p.m. handoff, day shift to night shift", "minutes": 0, "where": "media-team", "story": "Shows what falls between the shifts"}, {"kind": "scenario", "title": "Structural Fixes vs. Pep Talks", "minutes": 3, "where": "media-team", "story": "Greg's team-building lunch against a handoff owner"}], "review": []}, {"module": 5, "minutes": 12, "media": [{"kind": "overview", "title": "Module 5 overview: Managing Conflict and Difficult Conversations", "minutes": 2, "where": "xr-stage", "story": "Greg wants a plan by Friday"}, {"kind": "teaching", "title": "The Conversation Managers Avoid", "minutes": 6, "where": "xr-stage", "story": "Maps Dana's disagreement with Greg to its root cause"}, {"kind": "scenario", "title": "Role-play: telling Greg he's wrong, done well and done badly", "minutes": 4, "where": "media-team", "story": "Two versions of Dana's conversation"}], "review": []}, {"module": 6, "minutes": 11.5, "media": [{"kind": "overview", "title": "Module 6 overview: Delegation and Decision-Making", "minutes": 2, "where": "xr-stage", "story": "Twelve things on Dana's list"}, {"kind": "teaching", "title": "The Delegation Trap", "minutes": 6, "where": "xr-stage", "story": "Sorts Dana's peak-season list"}, {"kind": "teaching", "title": "Where AI Helps, and Where It Doesn't, in Management Decisions", "minutes": 3.5, "where": "one-touch", "story": "The scheduling tool that says cut a shift"}], "review": []}, {"module": 7, "minutes": 12, "media": [{"kind": "overview", "title": "Module 7 overview: Leading Through Change", "minutes": 2, "where": "xr-stage", "story": "The floor is calling it a pay cut"}, {"kind": "teaching", "title": "Why Change Announcements Fall Flat", "minutes": 6, "where": "xr-stage", "story": "Uses Dana's bonus change as the case"}, {"kind": "teaching", "title": "Rewriting a Change Message, Live", "minutes": 4, "where": "xr-stage", "story": "Rewrites Dana's first draft on screen"}], "review": []}, {"module": 8, "minutes": 13.0, "media": [{"kind": "overview", "title": "Module 8 overview: Hiring and Building Your Team", "minutes": 2, "where": "xr-stage", "story": "The new shift-lead role"}, {"kind": "teaching", "title": "Stop Hiring on Gut Feel", "minutes": 6, "where": "xr-stage", "story": "Builds the scorecard for Dana's two finalists"}, {"kind": "scenario", "title": "Proven vs. Potential", "minutes": 2.5, "where": "media-team", "story": "Luis and the outside candidate"}, {"kind": "closing", "title": "Course conclusion", "minutes": 2.5, "where": "xr-stage", "story": "Where Dana's story ends and what students take into their own teams"}], "review": []}]}, "mgmt615-scenarios.json": {"about": "Recorded demo data for Module 3, steps 3.2 and 3.3 (MGMT 615, fictional). 'chosen' is the scenario the demo faculty member keeps; 'alternative' is the second option the AI offers. CLO numbers follow the revised CLOs from step 1.4.", "storylinePremise": "MGMT 615 is a story about Dana Ortiz, a newly promoted operations manager, who struggles to find and fix the real causes of her site's slipping performance before peak season, when her director has already decided who to blame.", "modules": [{"module": 1, "chosen": {"title": "The First Bad Week", "premise": "Dana struggles to step back and find out why on-time shipping has dropped, when her instinct is to work extra floor shifts and push the number back up herself.", "clos": ["CLO 1", "CLO 5"], "situation": "Eight months into her first management job, Dana runs a distribution center with three shift leads and about 45 associates. Her job now is to hit site targets through her leads.", "trigger": "The Monday report shows on-time shipping down from 97% to 89%, six weeks before peak season. Her director, Greg, has already named the cause: \"Jordan's shift is the problem.\"", "stakeholders": "Dana; shift leads Jordan Pike and Ray Kowalski; the hourly crew; Greg; customers waiting on late orders.", "decision": "How to spend her week: work the floor to recover the number, accept Greg's read and focus on Jordan, or step back and find out what is driving the drop.", "outcome": "Working the floor would lift the number for a few days and hide the cause. Separating a manager's job from a lead's job shows Dana the habit she has carried over. She pulls the error reports instead, which starts the investigation that runs through the course."}, "alternative": {"title": "The Jammed Sorter", "premise": "Dana struggles to decide whether to clear a sorter jam herself or hand it to Jordan, with trucks waiting and the crew watching."}}, {"module": 2, "chosen": {"title": "The Bonus That Backfired", "premise": "Dana struggles to figure out why a bonus her crew is hitting is making performance worse, and why Luis, one of her most accurate associates, keeps missing it.", "clos": ["CLO 1", "CLO 5"], "situation": "The site pays a pick-rate bonus for speed. The crew is hitting its targets, but on-time shipping keeps falling.", "trigger": "Mis-picks and reworked orders are climbing. Luis keeps missing the bonus because he checks the orders others rush.", "stakeholders": "Luis and the crew who count on the bonus; Jordan and Ray; Greg; customers.", "decision": "Leave the bonus alone and coach for accuracy, add an accuracy threshold, or propose replacing it before peak season.", "outcome": "Expectancy theory explains the drop: the crew believes speed earns the reward, so speed is what they deliver. Dana takes Greg a revised bonus tied to accurate, on-time orders, which sets up Module 7."}, "alternative": {"title": "Luis Checks Out", "premise": "Dana struggles to re-engage Luis, passed over for a lead role last spring, when the only reward the site offers is a bonus he refuses to chase."}}, {"module": 3, "chosen": {"title": "The Conversation With Jordan", "premise": "Dana struggles to run a coaching conversation that changes how Jordan closes out his shift, when her director wants it documented as a formal warning.", "clos": ["CLO 2", "CLO 5"], "situation": "Dana needs Jordan, her day-shift lead, to change how he hands off to night shift. He came up under her and avoids hard conversations with his crew.", "trigger": "Orders keep slipping in the hour around shift change, and Jordan has turned defensive. Greg tells Dana to issue a formal warning.", "stakeholders": "Jordan; Dana; Greg; Ray, whose shift inherits the unfinished work; the day-shift crew.", "decision": "Issue the warning Greg wants, hold a coaching conversation with no record, or coach first and document only the next steps they agree on.", "outcome": "A warning would put Jordan on record without changing how he closes out his shift. Separating coaching from discipline lets Dana name one behavior and the change she expects, while keeping a record Greg can see."}, "alternative": {"title": "The Repeated Shortcut", "premise": "Dana struggles to decide whether a repeated safety shortcut on Ray's shift calls for coaching or for discipline."}}, {"module": 4, "chosen": {"title": "The Handoff Nobody Owns", "premise": "Dana struggles to fix the broken handoff between her two shifts with a structural change, when her director is pushing a team-building lunch.", "clos": ["CLO 3", "CLO 1"], "situation": "The two shifts pass work to each other every afternoon, but no one owns the handoff. Unfinished orders and staffing gaps fall between the leads.", "trigger": "Ray and Jordan now blame each other's shifts for the late orders. Greg suggests a team-building lunch to get everyone on the same page.", "stakeholders": "Jordan and Ray; both crews; Dana; Greg; customers.", "decision": "Host the lunch, hold a joint meeting to air the tension, or change the structure: name a handoff owner and add a shared checklist and an overlap window.", "outcome": "A team-effectiveness framework shows the problem is unclear roles and process, so a lunch won't touch it. Dana proposes the structural fix and has to explain to Greg why it beats his idea."}, "alternative": {"title": "Two Shifts, Two Rulebooks", "premise": "Dana struggles to get day and night shift working from one set of procedures, when each lead insists his shift's way is the reason it performs."}}, {"module": 5, "chosen": {"title": "Telling Greg He's Wrong", "premise": "Dana struggles to disagree with her director, using evidence, before he replaces Jordan for a problem Jordan didn't cause alone.", "clos": ["CLO 3", "CLO 2"], "situation": "Dana has data from Alicia Grant's dashboard showing late orders clustered around shift change on both shifts, and mis-picks rising since the bonus started.", "trigger": "Greg emails: \"Fix him or replace him. I want a plan by Friday.\" On a follow-up call he says he doesn't need a study.", "stakeholders": "Greg; Jordan, whose job is at risk; Dana, whose credibility is on the line; Ray and Alicia, who favor replacing Jordan; the crew.", "decision": "Send the replacement plan, agree to a warning and fix the handoff quietly, or ask for 30 minutes to walk Greg through the data and propose a two-week handoff fix first.", "outcome": "Mapping the conflict shows a process problem, which changes what the conversation is about. A structured plan lets Dana open with evidence instead of defending Jordan."}, "alternative": {"title": "Ray vs. Jordan", "premise": "Dana struggles to settle a floor argument between her shift leads that looks personal but is really about a process neither one owns."}}, {"module": 6, "chosen": {"title": "Twelve Things on Dana's List", "premise": "Dana struggles to decide which of her twelve peak-season responsibilities to keep and which to hand off, after a lead gets an overtime call wrong.", "clos": ["CLO 4", "CLO 5"], "situation": "Peak season has started. Dana has twelve responsibilities, from carrier escalations to overtime approvals, and her first review called her a bottleneck.", "trigger": "In the first week of the peak push, her leads miss an overtime rule. Dana's instinct is to take every overtime call back.", "stakeholders": "Dana; Jordan and Ray; associates working overtime; Greg; Alicia, who delegates heavily.", "decision": "Sort the list into keep, hand off, and hand off with checkpoints. The hardest call is who owns the shift handoff and overtime approvals.", "outcome": "A delegation framework helps Dana hand the shift handoff to one lead with a weekly checkpoint and keep overtime approvals for now, with a date to revisit. She has to justify that trade-off to Greg."}, "alternative": {"title": "The Scheduling Tool Says Cut", "premise": "Dana struggles to decide whether to follow an AI scheduling tool's recommendation to cut a shift, with a carrier deadline in two days and no time to check its assumptions."}}, {"module": 7, "chosen": {"title": "Ending the Bonus", "premise": "Dana struggles to announce a change to the bonus in a way her crew will understand and accept, when the floor already calls it a pay cut.", "clos": ["CLO 5", "CLO 3"], "situation": "Greg has approved Dana's revised bonus, which pays for accurate, on-time orders. It starts next pay period.", "trigger": "The crew likes the old bonus, and the fastest pickers earn more under it. Before Dana says anything, she hears people calling it a pay cut.", "stakeholders": "The crew; Luis, who stands to gain; Jordan and Ray, who will field questions; Greg; Dana.", "decision": "Send a written notice, have her leads announce it at shift start, or meet each shift herself and walk through what changes and why.", "outcome": "Naming the likely sources of resistance, such as lost income and distrust of a new manager, tells Dana what her message has to answer. She drafts it in plain language: what changes, when it starts, and how to earn the new bonus."}, "alternative": {"title": "The Overlap Window", "premise": "Dana struggles to introduce a thirty-minute shift overlap that both crews see as unpaid extra work."}}, {"module": 8, "chosen": {"title": "Proven vs. Potential", "premise": "Dana struggles to choose between an experienced outside candidate and Luis, a high-potential associate, for the new shift-lead role that will own the handoff.", "clos": ["CLO 6", "CLO 1"], "situation": "Dana has approval for a new shift-lead role that owns the handoff between shifts, the permanent fix for the gap that started the story.", "trigger": "Two finalists: an outside candidate who has run shift operations elsewhere, and Luis, highly accurate but never a supervisor. Ray backs the outside hire, and the crew is watching to see whether Luis gets a shot.", "stakeholders": "Luis; the outside candidate; Ray and Jordan; the crew; Greg.", "decision": "Hire the proven candidate, hire Luis, or hire one and build a development path for the other.", "outcome": "A structured scorecard tied to skills from earlier modules, like coaching and owning a handoff, keeps Dana from deciding on experience or loyalty alone. Whichever she picks, she has to justify the trade-off."}, "alternative": {"title": "Twenty Temps in Ten Days", "premise": "Dana struggles to hire twenty seasonal associates in ten days without falling back on gut feel."}}]}}, "sources": {"coursemap-v3": {"title": "Course Map, FODW II V3"}, "template-planning-doc": {"title": "Course Planning Document template", "path": "guides/TEMPLATE -Course Planning Document - FODW.docx"}, "tool-course-creator": {"title": "Course Creator 3.1.28"}, "reading-gs-flex-online-process": {"title": "Engaging in the Flex Online Process"}, "guide-course-development-process": {"title": "Flex Online Course Development Process", "citation": "TLI. (2026). Flex Online Course Development Process [Guide].", "path": "guides/Guide - Flex Online Course Development Process.docx"}, "ext-garrison-2000": {"title": "Critical inquiry in a text-based environment", "citation": "Garrison, D. R., Anderson, T., & Archer, W. (2000). Critical inquiry in a text-based environment: Computer conferencing in higher education. The Internet and Higher Education, 2(2-3), 87-105.", "url": "https://doi.org/10.1016/S1096-7516(00)00016-6"}, "ext-richardson-swan-2003": {"title": "Examining social presence in online courses", "citation": "Richardson, J. C., & Swan, K. (2003). Examining social presence in online courses in relation to students' perceived learning and satisfaction. Journal of Asynchronous Learning Networks, 7(1), 68-88.", "url": "https://doi.org/10.24059/olj.v7i1.1864"}, "ext-pacansky-brock-2020": {"title": "How to humanize your online course", "citation": "Pacansky-Brock, M. (2020). How to humanize your online course.", "url": "https://brocansky.com/humanizing"}, "reading-m1-setting-the-foundation": {"title": "Setting the Foundation"}, "guide-course-alignment": {"title": "Course Alignment", "citation": "TLI. (2026). Course Alignment [Guide].", "path": "guides/Guide - Course Alignment.docx"}, "guide-learning-objectives": {"title": "Course-Level Learning Objectives", "citation": "TLI. (2026). Course-Level Learning Objectives [Guide].", "path": "guides/Guide - Course-Level Learning Objectives.docx"}, "assignment-m1-building-the-framework": {"title": "Building the Framework (full build)"}, "assignment-m1-redesign-and-refine": {"title": "Redesign and Refine (refresh)"}, "perusall-m1-clues-to-a-great-story": {"title": "The Clues to a Great Story"}, "ext-knowles-2015": {"title": "The adult learner", "citation": "Knowles, M. S., Holton, E. F., & Swanson, R. A. (2015). The adult learner (8th ed.). Routledge."}, "ext-wiggins-mctighe-2005": {"title": "Understanding by design", "citation": "Wiggins, G., & McTighe, J. (2005). Understanding by design (2nd ed.). ASCD."}, "ext-tamu-asc-bloom": {"title": "Bloom's taxonomy", "citation": "Academic Success Center, Texas A&M University. (n.d.). Bloom's taxonomy.", "url": "https://asc.tamu.edu/tutoring/bloom.html"}, "ext-cast-2018": {"title": "Universal Design for Learning guidelines", "citation": "CAST. (2018). Universal Design for Learning guidelines version 2.2.", "url": "https://udlguidelines.cast.org"}, "ext-anderson-krathwohl-2001": {"title": "A taxonomy for learning, teaching, and assessing", "citation": "Anderson, L. W., & Krathwohl, D. R. (Eds.). (2001). A taxonomy for learning, teaching, and assessing. Longman."}, "ext-freeman-2014": {"title": "Active learning increases student performance", "citation": "Freeman, S., Eddy, S. L., McDonough, M., Smith, M. K., Okoroafor, N., Jordt, H., & Wenderoth, M. P. (2014). Active learning increases student performance in science, engineering, and mathematics. PNAS, 111(23), 8410-8415.", "url": "https://doi.org/10.1073/pnas.1319030111"}, "guide-rsi": {"title": "Regular and Substantive Interaction (RSI)", "citation": "TLI. (2026). Regular and Substantive Interaction (R ent System. (n.d.). Google Gemini [LMS tool].", "url": "https://lms.tamu.edu/tools/lms-tools/google-gemini.html"}, "ext-rice-workload": {"title": "Course workload estimator", "citation": "Rice University Center for Teaching Excellence. (n.d.). Course workload estimator.", "url": "https://cte.rice.edu/resources/workload-estimator"}, "ext-terry-2023": {"title": "I'm a student. You have no idea how much we're using ChatGPT.", "citation": "Terry, O. K. (2023). I'm a student. You have no idea how much we're using ChatGPT. The Chronicle of Higher Education, 69(19)."}, "reading-m5-materials-plan": {"title": "Developing a Learning Materials Plan"}, "assignment-m5-materials-rights-review": {"title": "Materials and Rights Review"}, "assignment-m5-writing-attributions": {"title": "Writing Attributions"}, "guide-copyright": {"title": "Copyright and Fair Use", "citation": "TLI. (2026). Copyright and Fair Use [Guide].", "path": "guides/Guide - Copyright and Fair Use.docx"}, "guide-curating-creating": {"title": "Curating and Creating Content", "citation": "TLI. (2026). Curating and Creating Content [Guide].", "path": "guides/Guide - Curating and Creating Content.docx"}, "guide-instructor-authored-reading": {"title": "Instructor-Authored Reading", "citation": "TLI. (2026). Instructor-Authored Reading [Guide].", "path": "guides/Guide - Instructor Authored Reading.docx"}, "guide-accessibility": {"title": "Accessibility", "citation": "TLI. (2026). Accessibility [Guide].", "path": "guides/Guide - Accessibility.docx"}, "reading-m6-planning-media": {"title": "Planning Media Intentionally"}, "assignment-m6-media-planning": {"title": "Media Planning"}, "template-av-script": {"title": "A/V script template", "path": "guides/AVE_Script_Template_v1.docx"}, "guide-script-writing": {"title": "Script Writing", "citation": "TLI. (2026). Script Writing [Guide].", "path": "guides/Guide - Script Writing.docx"}, "guide-planning-media": {"title": "Planning Media Intentionally", "citation": "TLI. (2026). Planning Media Intentionally [Guide].", "path": "guides/Guide - Planning Media Intentionally.docx"}, "reading-m7-going-live": {"title": "Going Live with Cohorts"}, "reading-m7-active-learning-tools": {"title": "Active Learning Tools for Cohort Sessions (draft outline)"}, "assignment-m7-cohort-planning": {"title": "Cohort Planning"}, "assignment-m7-cohort-materials": {"title": "Cohort Session Materials"}, "guide-cohort-sessions": {"title": "Cohort Sessions", "citation": "TLI. (2026). Cohort Sessions [Guide].", "path": "guides/REVISION Guide - Cohort Sessions.docx"}, "template-cohort-lesson-plan": {"title": "Cohort Session Lesson Plan", "path": "guides/Template - Cohort Session Lesson Plan.dotx"}, "template-cohort-outline": {"title": "Cohort Session Outline (Student Facing)", "path": "guides/Template - Cohort Session Outline (Student Facing).dotx"}, "template-flex-slides": {"title": "Flex Online Slides", "path": "guides/Template - Flex Online Slides.potx"}, "template-run-of-show": {"title": "XR Run of Show", "path": "guides/Run_of_Show.docx"}, "reading-m8-preparing-for-development": {"title": "Preparing for Development"}, "assignment-m8-course-planning-document": {"title": "Course Planning Document"}, "guide-online-teaching-practices": {"title": "Best Practices for Designing and Teaching Online Courses", "citation": "TLI. (2026). Best Practices for Designing and Teaching Online Courses [Guide].", "path": "guides/Guide - Best Practices for Designing and Teaching Online Courses.docx"}, "guide-grading-weight": {"title": "Grading & Weight", "citation": "TLI. (2026). Grading & Weight [Guide].", "path": "guides/Guide - Grading & Weight.docx"}, "guide-large-enrollment": {"title": "Strategies for Large Enrollment Courses", "citation": "TLI. (2026). Strategies for Large Enrollment Courses [Guide].", "path": "guides/Guide - Strategies for Large Enrollment Courses.docx"}, "ext-copyright-office-ai": {"title": "Copyright and artificial intelligence", "citation": "U.S. Copyright Office. (2025). Copyright and artificial intelligence.", "url": "https://copyright.gov/ai/"}, "ext-guo-2014": {"title": "How video production affects student engagement", "citation": "Guo, P. J., Kim, J., & Rubin, R. (2014). How video production affects student engagement: An empirical study of MOOC videos. Proceedings of the First ACM Conference on Learning @ Scale, 41-50.", "url": "https://doi.org/10.1145/2556325.2566239"}, "tool-scriptwise": {"title": "ScriptWise"}, "ext-morris-2019": {"title": "Lecture recordings to support learning: A contested space between students and teachers", "citation": "Morris, N. P., Swinnerton, B., & Coop, T. (2019). Lecture recordings to support learning: A contested space between students and teachers. Computers & Education, 140, 103604.", "url": "https://doi.org/10.1016/j.compedu.2019.103604"}, "ext-donelan-2025": {"title": "Synchronous online learning: Why some students don't actively participate", "citation": "Donelan, H., Kear, K., Rosewell, J., Okada, A., Sheehy, K., Amor, K., Edwards, C., Mooney, A., Cuffe, P., & Elder, T. (2025). Synchronous online learning: Why some students don't actively participate. Online Learning, 29(3).", "url": "https://doi.org/10.24059/olj.v29i3.4641"}}, "glossary": [{"term": "A/V/E script", "also": ["A/V/E scripts"], "def": "The Learning Media Team's script template for videos recorded on the XR stage, in three columns: Dialogue (Audio), the words you'll say; Graphics (Video), what appears on screen; and Environment, the virtual background behind you.", "auto": true}, {"term": "AI risk", "also": [], "def": "How easily AI could do an activity for a student. A high-risk activity is redesigned so students' own judgment shows, or AI use is built into the task.", "auto": true}, {"term": "Alt text", "also": [], "def": "A short written description of an image, chart, or diagram that a screen reader reads aloud, so students who can't see it get the same information.", "auto": true}, {"term": "Asynchronous", "also": [], "def": "Work students do on their own schedule within the week, such as readings, videos, and assignments, as opposed to a live session.", "auto": true}, {"term": "Backward design", "also": ["planned backward"], "def": "Planning a course from the end: first what students should be able to do, then how you'll see it, then what they'll read, watch, and practice to get there (Wiggins & McTighe, 2005).", "auto": true}, {"term": "Bloom's taxonomy", "also": [], "def": "A framework that sorts learning by how much thinking it asks of students, from remembering facts to creating something new. CLOs aim at the higher levels: apply, analyze, evaluate, and create.", "auto": true}, {"term": "Catalog commitments", "also": ["catalog commitment"], "def": "Each separate thing the official catalog description promises students will learn to do. Your CLOs are checked against them.", "auto": true}, {"term": "Character profile", "also": ["character"], "def": "The person students follow through the course: a premise statement, their position, the conflict they face, their peers, their values and fears, and a short backstory.", "auto": true}, {"term": "Check-in", "also": ["check-ins", "weekly check-in"], "def": "Your weekly meeting with your ID, on Zoom or in person, to review the module you just finished.", "auto": true}, {"term": "CLO", "also": ["CLOs", "course-level objective", "course-level objectives"], "def": "Course-level objective: what students will be able to do by the end of the course, written so you can observe and grade it. A course has 3 to 6.", "auto": true}, {"term": "Cohort session", "also": ["cohort sessions"], "def": "A 90-minute live class on Zoom, held each week in Modules 2 to 8 in most Flex Online courses. Attendance is optional, and every session is recorded.", "auto": true}, {"term": "Confidence monitor", "also": [], "def": "A screen on the XR stage, out of the camera's view, that shows your slides and notes while you teach.", "auto": true}, {"term": "Conflict", "also": [], "def": "In your course's story, what makes the performance hard in real life, such as conflicting goals, ambiguous data, or time pressure. More information alone wouldn't settle it; it takes judgment.", "auto": false}, {"term": "Course Map", "also": ["Course Maps"], "def": "The finished, detailed record of everything in a Flex Online course, complete enough to rebuild it. Your ID creates it during development. On the Refresh track, it's your working document: you upload it in step GS.2, then review and update it section by section.", "auto": true}, {"term": "Course Planning Document", "also": [], "def": "The working plan you build on the Full Build track, a section at a time. Your ID and the development team build the course from it. Refresh courses already have one from their first workshop and update their Course Map instead.", "auto": true}, {"term": "Curated material", "also": ["curated reading", "curated video"], "def": "A reading or video from another source that you choose for your course, such as an article, chapter, or video. Curated is the default; it's the least work to produce.", "auto": true}, {"term": "Environment", "also": [], "def": "The third column of an A/V/E script: the virtual background behind you on the XR stage.", "auto": false}, {"term": "Flex Online", "also": [], "def": "Mays Business School's online course format: a shared template, weekly modules, asynchronous work, and, in most courses, weekly live cohort sessions.", "auto": true}, {"term": "Full build", "also": [], "def": "The workshop track for a new course. Each step drafts a new section.", "auto": true}, {"term": "Gem", "also": ["Gems", "Gemini Gem"], "def": "A custom Google Gemini assistant you set up with instructions and files. You can add a Gem to a Canvas module for students to use.", "auto": true}, {"term": "Grading assistant", "also": [], "def": "An AI assistant, built in TAMU AI Chat, that drafts rubric-based feedback on student work for you to review and edit. It never assigns the grade.", "auto": true}, {"term": "Guardrails", "also": [], "def": "What an AI assistant won't do, such as write a student's graded work or assign a final grade.", "auto": true}, {"term": "Guided practice", "also": [], "def": "Part of a cohort session where you work one example with the class: you lead, students supply the next step, and you coach as they go.", "auto": true}, {"term": "Hallucination", "also": [], "def": "When AI states something false with confidence. It's why you test what you build and check what AI drafts.", "auto": true}, {"term": "ID", "also": ["your ID", "IDs", "instructional designer"], "def": "Your instructional designer: the person from Mays Teaching & Learning Innovation who works with you through the workshop and development.", "auto": true}, {"term": "Instructional Technologist", "also": [], "def": "A member of the Learning Delivery team who sets up your Zoom sessions with you before the term and co-hosts each cohort session, running polls, breakouts, and timers.", "auto": true}, {"term": "Instructor-authored reading", "also": ["instructor-authored readings"], "def": "A reading you write yourself, usually 4 to 10 pages, when nothing curated fits or your own experience is the point.", "auto": true}, {"term": "Knowledge files", "also": [], "def": "Documents you attach to an AI assistant so its answers fit your course, such as assignment directions, your scenario, or a rubric.", "auto": true}, {"term": "Learning Delivery", "also": [], "def": "The Mays Teaching & Learning Innovation team that supports live teaching, including your cohort sessions and practice on the XR stage.", "auto": true}, {"term": "Learning Media Team", "also": [], "def": "The Mays Teaching & Learning Innovation team that records, edits, and produces your course's video, audio, and graphics.", "auto": true}, {"term": "Lesson plan", "also": ["lesson plans", "Cohort Session Lesson Plan"], "def": "Your minute-by-minute plan for a cohort session, in the team's template: each section with its minutes and talking points, plus materials and room setup.", "auto": true}, {"term": "Module", "also": [], "def": "One week of a Flex Online course. Most courses have eight.", "auto": false}, {"term": "One-Touch studio", "also": ["One-Touch studios"], "def": "A small studio where you record screen-recorded videos on your own, to illustrate a process or teach with your slides.", "auto": true}, {"term": "Performance", "also": [], "def": "In your course's story, the one thing students must be able to do, taken from one of your CLOs.", "auto": false}, {"term": "Perusall", "also": [], "def": "A tool for social reading: students annotate a reading together, and you can reply in their threads.", "auto": true}, {"term": "Program outcomes", "also": ["program outcome", "PLO", "PLOs"], "def": "What students can do after the whole degree. Your course supports two to four of them.", "auto": true}, {"term": "Recording test", "also": [], "def": "The question every cohort session has to pass: if a student watched only the recording, what would they have missed? If the answer is nothing, they'll watch it later.", "auto": true}, {"term": "Refresh", "also": ["Refresh track"], "def": "The workshop track for a course already developed and taught in Flex Online. Each step reviews your current section and suggests updates.", "auto": true}, {"term": "RSI", "also": ["regular and substantive interaction"], "def": "Regular and substantive interaction: the federal requirement that the instructor actively teaches an online course, through instruction, feedback, and discussion on a predictable schedule.", "auto": true}, {"term": "Rubric", "also": ["rubrics"], "def": "A scoring guide that describes what each level of performance looks like for each part of an assignment.", "auto": true}, {"term": "Run of Show", "also": ["XR Run of Show"], "def": "The production team's plan for each cohort session broadcast from the XR stage. You fill in the session details, your background, and the assets you'll use.", "auto": true}, {"term": "Scenario", "also": ["scenarios"], "def": "A specific moment in a module when your character has to make a decision that calls for that module's CLOs.", "auto": true}, {"term": "Speaker notes", "also": [], "def": "Notes under each slide that only you see, used here for your talking points.", "auto": true}, {"term": "Storyline premise", "also": ["storyline"], "def": "One sentence that sums up your course's story: who the character is, what they want, and what stands in the way.", "auto": true}, {"term": "Student-facing outline", "also": [], "def": "A short outline of a cohort session for students: its main topics, discussion questions, and what's due.", "auto": true}, {"term": "System instructions", "also": [], "def": "The standing rules that tell an AI assistant who it is, what to do, and how to respond in every conversation.", "auto": true}, {"term": "TAMU AI Chat", "also": [], "def": "Texas A&M's AI chat tool. It offers several AI models in a university-protected environment.", "auto": true}, {"term": "Workload", "also": ["week check"], "def": "The hours a module asks of students in a week: activities, readings and media, and the cohort session. The target is about 4 hours in Module 1 and close to 10 in the rest.", "auto": true}, {"term": "Writer/Producer", "also": [], "def": "The Learning Media Team member who gets your scripts ready for production.", "auto": true}, {"term": "XR stage", "also": [], "def": "A studio with an LED wall that places you in a virtual setting. You record videos and broadcast cohort sessions from it.", "auto": true}], "aiRules": "You help a Texas A&M Mays Business School faculty member plan a graduate Flex Online course.\nStudents are working professionals. The faculty member is the subject matter expert and makes\nevery decision. You draft and check; you never decide.\n\nWork only from the course details, saved sections and uploaded documents you are given. I const KEY = 'course-plan-builder:state';
// Work saved before the rename lives under the old names; move it over once.
try { [['course-plan-builder-prototype:state', 'course-plan-builder:state'], ['course-plan-builder-prototype:edits', 'course-plan-builder:edits']].forEach(([o, n]) => {
  if (localStorage.getItem(o) != null && localStorage.getItem(n) == null) localStorage.setItem(n, localStorage.getItem(o)); localStorage.removeItem(o); }); } catch (e) {}
let state = { track: null, done: {}, at: 'welcome', showAll: false, pick: {}, mods: {}, mode: 'mine', ans: {} };
// Two modes: "mine" plans the faculty member's own course; "demo" walks through MGMT 615 with its example data.
const isDemo = () => state.mode === 'demo';

function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) state = Object.assign(state, s); } catch (e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);

/* ---------- content parsing ---------- */
// Faculty never see notes for reviewers or the app's builders: "> Review note" and "> App note"
// blocks, Pattern and AI-instructions labels, and project-file or browser storage details.
function stripNotes(text) {
  const out = []; let skipping = false, label = false;
  for (const line of text.split('\n')) {
    if (/^> (Review|App) note/.test(line)) { skipping = true; continue; }
    if (skipping && line.startsWith('>')) continue;
    skipping = false;
    if (/^(Project file|Browser only):/.test(line)) { label = true; continue; }
    if (label && line.trim() && !/^[A-Z][A-Za-z ]+: /.test(line)) continue;
    label = false;
    if (/^Pattern:/.test(line) || /^AI instructions[^:]*:\s*$/.test(line)) continue;
    out.push(line);
  }
  return out.join('\n');
}
function splitBy(text, marker) {
  const parts = []; let cur = { head: null, body: [] };
  for (const line of text.split('\n')) {
    if (line.startsWith(marker)) { parts.push(cur); cur = { head: line.slice(marker.length).trim(), body: [] }; }
    else cur.body.push(line);
  }
  parts.push(cur);
  return parts.map(p => ({ head: p.head, body: p.body.join('\n').trim() }));
}
function parseModule(m) {
  const text = stripNotes(m.raw);
  const title = (text.match(/^# (.+)$/m) || [, m.id])[1];
  const top = splitBy(text, '## ');
  const mod = { id: m.id, title, intro: top[0].body.replace(/^# .+$/m, '').trim(), reflection: null, prep: null, steps: [] };
  for (const sec of top.slice(1)) {
    if (/^Refresh reflection/.test(sec.head)) mod.reflection = sec.body;
    else if (/^Check-in prep/.test(sec.head)) mod.prep = sec.body;
    else {
      const subs = splitBy(sec.body, '### ');
      // "Track: refresh" in a step's opening lines limits the step to that track.
      const tr = subs[0].body.match(/^Track: (\w+)\s*$/m), lead = subs[0].body.replace(/^Track: .*\n?/m, '');
      const step = { key: sec.head.split(' ')[0], title: sec.head, lead, track: tr ? tr[1].toLowerCase() : null, parts: {} };
      for (const s of subs.slice(1)) step.parts[s.head] = s.body;
      mod.steps.push(step);
    }
  }
  return mod;
}
let MODULES = DATA.modules.map(parseModule);

/* ---------- edit mode ----------
   Each editable block carries data-s, an index into SRC that records the exact source text it came
   from (a markdown snippet, a table row, or a JSON string). An edit replaces that snippet, so it
   can be applied to the content files by tools/apply_edits.py. A block is editable only when its
   source text occurs exactly once in its file. */
const EKEY = 'course-plan-builder:edits';
let editing = false, edits = [], SRC = [], CUR = null, noTag = 0, formId = 0;
const count = (hay, needle) => needle ? hay.split(needle).length - 1 : 0;
const norm = s => s.replace(/\s+/g, ' ');
// True when the new text is already in place (for example, applied to the files and rebuilt).
const landed = (hay, o, n) => norm(hay).includes(norm(n)) && (!hay.includes(o) || norm(n).includes(norm(o)));
function tag(kind, old, extra) {
  if (!CUR || noTag || old == null || !String(old).trim()) return '';
  const hay = CUR.demo ? JSON.stringify(DATA.demo[CUR.demo]) : CUR.mod.raw;
  if (count(hay, kind === 'json' ? JSON.stringify(old) : old) !== 1) return '';
  SRC.push(Object.assign({ file: CUR.file, kind, old }, extra));
  return ' data-s="' + (SRC.length - 1) + '"';
}
function patch(file, kind, old, nu) {
  if (file.startsWith('demo/')) {
    const name = file.slice(5);
    const hay = DATA.demo[name] ? JSON.stringify(DATA.demo[name]) : '';
    if (!hay.includes(JSON.stringify(old)) || landed(hay, JSON.stringify(old), JSON.stringify(nu))) return false;
    const fix = v => Array.isArray(v) ? v.map(fix) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fix(x)])) : v === old ? nu : v;
    DATA.demo[name] = fix(DATA.demo[name]); return true;
  }
  const m = DATA.modules.find(x => x.file === file);
  const o = kind === 'json' ? JSON.stringify(old) : old, n = kind === 'json' ? JSON.stringify(nu) : nu;
  if (!m || !m.raw.includes(o) || landed(m.raw, o, n)) return false;
  m.raw = m.raw.replace(o, () => n);
  MODULES = DATA.modules.map(parseModule); return true;
}
function loadEdits() {
  try { edits = JSON.parse(localStorage.getItem(EKEY) || '[]'); } catch (e) { edits = []; }
  // Edits already applied to the content files no longer match and are dropped.
  edits = edits.filter(e => patch(e.file, e.kind, e.old, e.new));
  saveEdits();
}
function saveEdits() { try { localStorage.setItem(EKEY, JSON.stringify(edits)); } catch (e) {} }
function toMd(el, kind) {
  if (kind === 'pre') return el.innerText.replace(/ /g, ' ').replace(/\n+$/, '');
  if (kind === 'json') return el.innerText.replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  const walk = n => [...n.childNodes].map(c => {
    if (c.nodeType === 3) return c.nodeValue;
    if (c.nodeType !== 1) return '';
    const t = c.tagName, inner = walk(c);
    if (t === 'BR') return ' ';
    if (c.dataset.cite) return '`src:' + c.dataset.cite + '`';
    if (c.dataset.src) return '[' + walk(c) + '](src:' + c.dataset.src + ')';
    if (!inner.trim()) return inner;
    if (t === 'STRONG' || t === 'B') return '**' + inner.trim() + '**';
    if (t === 'EM' || t === 'I') return '*' + inner.trim() + '*';
    if (t === 'CODE') return '`' + inner + '`';
    if (t === 'A') return '[' + inner + '](' + c.getAttribute('href') + ')';
    if (t === 'DIV' || t === 'P') return ' ' + inner + ' ';
    return inner;
  }).join('');
  return walk(el).replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
}
function recordEdit(el) {
  const s = el._s; if (!s) return;
  const now = toMd(el, s.kind);
  if (now === el.dataset.base) return;
  el.dataset.base = now;
  let nu = now;
  if (s.kind === 'row') {
    const cells = s.old.replace(/^\||\|$/g, '').split('|');
    cells[s.cell] = ' ' + now.replace(/\|/g, '/') + ' ';
    nu = '|' + cells.join('|') + '|';
  }
  if (!patch(s.file, s.kind, s.old, nu)) return;
  const prev = edits.find(e => e.file === s.file && e.kind === s.kind && e.new === s.old);
  if (prev) { prev.new = nu; if (prev.new === prev.old) edits.splice(edits.indexOf(prev), 1); }
  else edits.push({ file: s.file, kind: s.kind, old: s.old, new: nu, marker: s.marker, step: state.at });
  SRC.forEach(x => { if (x.file === s.file && x.old === s.old) x.old = nu; });
  saveEdits(); updateBar();
  if (s.kind === 'title') renderNav();
}
// Glossary: the first time a term appears in a step, it's underlined; selecting it shows the definition.
const GLOSS = (DATA.glossary || []).map((g, k) => Object.assign({ k }, g));
function glossRe(g) {
  const forms = [g.term].concat(g.also).sort((a, b) => b.length - a.length).map(f => f.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&'));

function codeBlock(lang, code, opts) {

    return '<div class="demo-out" ' + (opts.hideDemo ? 'hidden' : '') + '>' + renderValue(v) + '</div>';

// AI instructions are hard-wrapped in the content files. Join each paragraph and list item onto one
// line so it wraps to the box. The "Return:" format is for the software only, so faculty never see
// it: it and anything after it are left out of the box (apply_edits keeps it in the content file).
function reflow(code) {
  const at = code.search(/(^|\n)Return:/);
  if (at >= 0) code = code.slice(0, at);
  return code.trim().split(/\n[ \t]*\n/).map(b => {
    const out = []; let inItem = false;
    for (const l of b.split('\n')) {
      // A list item continues only on indented lines; an unindented line after it starts a new line.
      const item = /^\s*(-|\d+\.)\s/.test(l);
      if (!out.length || item || (inItem && !/^\s/.test(l))) { out.push(l.replace(/\s+$/, '')); inItem = item; }
      else out[out.length - 1] += ' ' + l.trim();
    }
    return out.join('\n');

}
function renderValue(v) {
  if (v === null || v === undefined) return '<span class="empty">none</span>';
  if (Array.isArray(v)) {
    if (!v.length) return '<span class="empty">none</span>';
    if (v.every(x => typeof x !== 'object' || x === null)) return '<ul>' + v.map(x => '<li' + (typeof x === 'string' ? tag('json', x) : '') + '>' + esc(x) + '</li>').join('') + '</ul>';
    return v.map(x => '<div class="card">' + renderValue(x) + '</div>').join('');
  }
  if (typeof v === 'object') {
    return Object.entries(v).map(([k, val]) => '<div class="kv"><div class="k">' + esc(k.replace(/([A-Z])/g, ' $1')) + '</div>' + renderValue(val) + '</div>').join('');
  }
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  return '<div' + (typeof v === 'string' ? tag('json', v) : '') + '>' + esc(v) + '</div>';
}

  const m = MODULES.find(x => x.id === mid);
  return { m, key, step: m && m.steps.find(s => s.key === key) };
}
function aiPart(title, body) {
  // Setup steps with no AI draft: GS.1's connection test lives in Decide, so the section is dropped;
  // GS.2's course details show as a plain form section, without the AI tag or Draft button.
  if (/no AI draft/i.test(body)) {
    if (/^No AI draft\./.test(body.trim())) return '';
    return '<section class="part"><h3>Your course details</h3>' + md(body.replace(/ There's no AI draft in this step\./, '')) + '</section>';
  }
  // Everything from the first "Demo response" on is the recorded AI output, revealed by the button.
  const at = body.search(/(^|\n)Demo (response|answers)/);
  const before = at < 0 ? body : body.slice(0, at);
  const after = at < 0 ? '' : body.slice(at).replace(/^\n/, '').replace(/^Demo (response|answers)(\s*\([^)]*\))?[^:\n]*:[ \t]*\n?/, '');
  const recorded = after ? '<div class="demo-out" hidden><p class="crumb">Recorded response, MGMT 615</p>' + md(after) + '</div>' : '';
  // GS.2 refresh: the AI sorts an uploaded Course Map rather than reviewing a section.
  const sorting = /upload your Course Map/.test(body);
  if (sorting) title = 'Upload your Course Map';
  let intro = md(before, { hideDemo: true }), prompt = '';
  intro = intro.replace(/<details><summary>What the AI is asked to do<\/summary>[\s\S]*?<\/details>/g, m => { prompt += m; return ''; });
  return '<section class="part ai"><h3>' + esc(title) + ' <span class="tag">AI</span></h3>' + intro + recorded +
    demoFiles(body) +
    '<div class="row"><button type="button" class="btn" data-draft' + (sorting ? ' data-sortmap' : '') + '>' + (sorting ? 'Sort with AI' : title === 'Summary for your ID' ? 'Create summary' : state.track === 'refresh' && title !== 'Draft' ? title + ' with AI' : 'Draft with AI') + '</button><span class="thinking" hidden>Working…</span></div>' + prompt + '</section>';
}
function demoFiles(body) {
  const files = [...new Set((body.match(/demo\/mgmt615-[a-z]+\.json/g) || []))];
  return files.map(f => {
    const d = DATA.demo[f.replace('demo/', '')]; if (!d) return '';
    const v = d.modules ? d.modules.map(x => { const c = Object.assign({}, x); return c; }) : d;
    const was = CUR; CUR = { file: f, demo: f.replace('demo/', '') };
    const out = '<div class="demo-out" hidden><p class="crumb">Recorded responses, MGMT 615</p>' + renderValue(v) + '</div>';
    CUR = was; return out;
  }).join('');
}
