<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Plan Builder Prototype</title>
<style>
:root {
  --maroon: #500000; --maroon-2: #732f2f; --ink: #1d1d1f; --muted: #5b5b60; --line: #dedbd6;
  --bg: #f7f5f2; --card: #ffffff; --tint: #f3ece9; --ok: #2e6b3a; --warn: #8a5a00; --focus: #1f5fbf;
  --ex: #2f5d73; --ex-tint: #eef4f7;
}
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
a { color: var(--maroon); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
header { background: var(--maroon); color: #fff; display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0; font-weight: 600; }
header .badge { font-size: 12px; background: rgba(255,255,255,.18); padding: 2px 8px; border-radius: 10px; }
header .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.5); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; color: #fff; border: 0; padding: 5px 10px; font: inherit; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--maroon); font-weight: 600; }
.hbtn { background: #fff; color: var(--maroon); border: 0; border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.layout { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 52px); }
nav { border-right: 1px solid var(--line); background: #fff; padding: 12px 0; overflow-y: auto; max-height: calc(100vh - 52px); position: sticky; top: 52px; }
nav h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 16px 4px; }
nav button { display: flex; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 16px; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; align-items: baseline; }
nav button:hover { background: var(--tint); }
nav button[aria-current="page"] { background: var(--tint); font-weight: 600; box-shadow: inset 3px 0 0 var(--maroon); }
nav .mark { width: 16px; flex: none; color: var(--muted); }
nav .mark.done { color: var(--ok); font-weight: 700; }
nav h2 { margin: 6px 0 0; }
nav .modhead { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; padding: 8px 16px; gap: 6px; }
nav .modhead .mt { flex: 1; }
nav .modhead .chev { width: 12px; flex: none; }
nav .count { text-transform: none; letter-spacing: 0; font-weight: 500; white-space: nowrap; }
nav .count.all { color: var(--ok); }
nav .progress { padding: 0 16px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
nav .progress p { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
nav .bar { height: 8px; background: var(--tint); border-radius: 4px; overflow: hidden; }
nav .bar span { display: block; height: 100%; background: var(--ok); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.steps-btn { display: none; }
/* One centered column: text, tables and boxes share the same edges, and the body text is a little
   larger so the longer lines stay easy to read. */
main { padding: 24px clamp(16px, 4vw, 48px) 24px; min-width: 0; width: 100%; max-width: 1100px; margin: 0 auto; font-size: 17px; }
.main-wrap { min-width: 0; }
.credits { max-width: 1100px; margin: 0 auto; padding: 8px clamp(16px, 4vw, 48px) 48px; font-size: 12.5px; color: var(--muted); }
.fig-credit { margin: 12px 0 0; font-size: 12.5px; color: var(--muted); }
.crumb { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
/* Banners: an original maroon design (no logos). The large one opens the welcome page; a thin one
   names the module at the top of every step. The art is decorative; the text carries the meaning. */
.banner { position: relative; overflow: hidden; border-radius: 10px; color: #fff; background: linear-gradient(115deg, #3a0000 0%, #500000 50%, #6e2424 100%); }
.banner svg { position: absolute; top: 0; right: 0; height: 100%; width: 100%; }
.banner .txt { position: relative; }
.banner.hero { min-height: 210px; display: flex; align-items: flex-end; margin: 0 0 22px; }
.banner.hero .txt { padding: 28px 32px; max-width: 640px; }
.banner.hero .kicker { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #f1dede; }
.banner.hero h2 { margin: 6px 0 4px; font-size: 34px; line-height: 1.15; color: #fff; }
.banner.hero .sub { margin: 0; font-size: 16px; color: #f6eaea; }
.banner.thin { min-height: 122px; display: flex; align-items: center; margin: 0 0 18px; }
.banner.thin .txt { padding: 16px 26px; max-width: 75%; }
.banner.thin .kicker { margin: 0 0 2px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #f1dede; }
.banner.thin .name { margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2; color: #fff; }
/* The module banner carries the larger heading; the step title sits one level below it. */
main h2.step { font-size: 26px; margin: 0 0 6px; color: var(--maroon); }
.meta { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.part { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; margin: 14px 0; }
.part > h3 { margin: 0 0 8px; font-size: 18px; display: flex; gap: 10px; align-items: center; }
.part > h3 .tag { font-size: 12px; font-weight: 600; background: var(--tint); color: var(--maroon); padding: 2px 8px; border-radius: 10px; }
.part.ai { border-color: #c9b8b3; background: #fffdfc; }
.part.example, .demo-out { background: var(--ex-tint); border: 1px solid #c7d8e0; border-left: 6px solid var(--ex); }
.plan-page { background: #fff; border: 1px solid #c7d8e0; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.08); padding: 12px 18px 4px; margin: 12px 0; }
.plan-page .plan-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--ex); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin: 0 0 10px; }
.part.example > h3 .tag { background: var(--ex); color: #fff; }
.demo-out { border-radius: 8px; padding: 10px 14px; margin: 10px 0; }
.demo-out .crumb { color: var(--ex); font-weight: 600; font-size: 13px; margin: 0 0 6px; }
table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--tint); }
.scroll { overflow-x: auto; }
/* Tables in an example (See it, recorded AI responses) use the example's blue tones; tables on a
   planning-document page keep the document style. */
.part.example th, .part.example td, .demo-out th, .demo-out td { border-color: #c2d5de; }
.part.example th, .demo-out th { background: #dce9ef; color: var(--ex); }
.part.example .plan-page th, .part.example .plan-page td { border-color: var(--line); }
.part.example .plan-page th { background: var(--tint); color: inherit; }
pre { background: #f4f2ef; padding: 10px 12px; border-radius: 6px; white-space: pre-wrap; font-size: 13px; }
pre.prompt { font-family: inherit; font-size: 15px; line-height: 1.55; }
code { font-size: .92em; background: #f1eeea; padding: 0 3px; border-radius: 3px; }
blockquote { margin: 10px 0; padding: 8px 14px; border-left: 4px solid var(--maroon-2); background: var(--tint); }
details { margin: 10px 0; }
summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.btn { background: var(--maroon); color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
.btn.sec { background: #fff; color: var(--maroon); border: 1px solid var(--maroon); }
.btn:disabled { opacity: .5; cursor: default; }
.form { display: grid; gap: 14px; margin: 12px 0; max-width: 560px; }
.field label { display: block; font-weight: 600; margin-bottom: 4px; }
.field .req { font-weight: 400; color: var(--muted); font-size: 14px; }
.field input, .field select, .field textarea { width: 100%; font: inherit; padding: 7px 10px; border: 1px solid #b9b4ad; border-radius: 6px; background: #fff; }
.field .hint { margin: 4px 0 0; font-size: 14px; color: var(--ex); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.thinking { color: var(--muted); font-style: italic; }
.row.use { margin: 6px 0 10px; }
.use-note { color: var(--ok); font-weight: 600; margin: 4px 0 0; }
.purpose { background: var(--tint); border-left: 4px solid var(--maroon); border-radius: 6px; padding: 10px 16px; margin: 0 0 14px; }
.purpose p { margin: 6px 0; }
.flow { list-style: none; counter-reset: flow; padding: 0; margin: 10px 0 14px; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
.flow li { counter-increment: flow; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fff; font-size: 15px; }
.flow li strong { display: block; color: var(--maroon); margin-bottom: 2px; }
.flow li strong::before { content: counter(flow) ". "; }
/* Infographics */
.fig { container-type: inline-size; margin: 16px 0 18px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
.fig figcaption { font-weight: 700; color: var(--maroon); margin: 0 0 12px; font-size: 16px; }
.fig-note { margin: 10px 0 0; font-size: 14px; color: var(--muted); }
.fig ol, .fig ul { list-style: none; margin: 0; padding: 0; }
/* timeline */
.tl { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); gap: 0 8px; position: relative; }
.tl::before { content: ""; position: absolute; left: 8px; right: 8px; top: 9px; height: 3px; background: #d9cfcb; }
.tl li { position: relative; padding: 26px 10px 0 0; font-size: 14px; }
.tl .dot { position: absolute; top: 2px; left: 0; width: 17px; height: 17px; border-radius: 50%; background: #fff; border: 3px solid var(--maroon); }
.tl li.here .dot { background: var(--maroon); box-shadow: 0 0 0 4px #f0dcdc; }
.tl strong { display: block; color: var(--ink); }
.tl .you { display: inline-block; margin: 2px 0; padding: 1px 7px; border-radius: 9px; background: var(--maroon); color: #fff; font-size: 12px; font-weight: 600; }
.tl .note { display: block; color: var(--muted); }
/* backward design */
.bw { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
.bw li { position: relative; background: var(--tint); border-radius: 8px; padding: 12px 14px 12px 50px; font-size: 15px; }
.bw li + li::before { content: "→"; position: absolute; left: -36px; top: 50%; transform: translateY(-50%); width: 32px; text-align: center; font-size: 30px; line-height: 1; color: var(--maroon); font-weight: 700; }
.bw .n { position: absolute; left: 12px; top: 12px; width: 28px; height: 28px; border-radius: 50%; background: var(--maroon); color: #fff; font-weight: 700; display: grid; place-items: center; }
.bw strong { display: block; }
.bw span { display: block; }
.bw em { display: block; margin-top: 6px; font-style: normal; font-weight: 600; color: var(--maroon); font-size: 14px; }
/* Bloom's staircase: each step is a little taller than the one before */
.stairs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; align-items: end; }
.stairs li { border-radius: 8px 8px 0 0; padding: 10px; font-size: 13.5px; background: #efe9e6; color: var(--ink); display: flex; flex-direction: column; justify-content: flex-start; }
.stairs li strong { font-size: 15px; margin-bottom: 4px; }
.stairs li em { font-style: normal; margin-top: 6px; font-weight: 600; font-size: 12.5px; }
.stairs .s1 { min-height: 120px; } .stairs .s2 { min-height: 145px; } .stairs .s3 { min-height: 170px; }
.stairs .s4 { min-height: 195px; } .stairs .s5 { min-height: 220px; } .stairs .s6 { min-height: 245px; }
.stairs li.aim { background: var(--maroon); color: #fff; }
.stairs li.aim em { color: #f6e3e3; }
/* When the figure itself is narrow, the staircase turns sideways (widest bar on top) and the week
   lists only the days with something on them. */
@container (max-width: 820px) {
  .stairs { display: flex; flex-direction: column-reverse; gap: 5px; }
  .stairs li { min-height: 0 !important; border-radius: 0 8px 8px 0; padding: 8px 12px; }
  .stairs .s1 { width: 50%; } .stairs .s2 { width: 60%; } .stairs .s3 { width: 70%; }
  .stairs .s4 { width: 80%; } .stairs .s5 { width: 90%; } .stairs .s6 { width: 100%; }
  .week { grid-template-columns: 1fr; }
  .week li { min-height: 0; }
  .week li.off { display: none; }
}
@container (max-width: 520px) {
  .stairs li { width: 100% !important; }
}
.key { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; }
.key.aim { background: var(--maroon); }
/* trace */
.trace li { position: relative; padding: 0 0 14px 30px; }
.trace li::before { content: ""; position: absolute; left: 6px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--maroon); }
.trace li:not(:last-child)::after { content: ""; position: absolute; left: 11px; top: 20px; bottom: 2px; width: 2px; background: #d9cfcb; }
.trace strong { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--maroon); }
.trace span { display: block; }
/* coverage grid */
.cov-grid { border-collapse: collapse; font-size: 14px; }
.cov-grid th, .cov-grid td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; }
.cov-grid tbody th { text-align: left; font-weight: 500; }
.cov { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px; }
.cov.main { background: var(--maroon); }
.cov.also { border: 3px solid var(--maroon); width: 14px; height: 14px; box-sizing: border-box; }
.fig-note .cov { margin: 0 4px 0 10px; }
.fig-note .cov:first-child { margin-left: 0; }
/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week li { border-radius: 8px; padding: 8px; min-height: 92px; font-size: 13.5px; background: #f6f3f1; }
.week li strong { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.week li.on { background: var(--tint); border-top: 4px solid var(--maroon); }
.week li.on strong { color: var(--maroon); }
/* relationship map */
.people { position: relative; }
.people .spokes { position: absolute; inset: 0; width: 100%; height: 100%; }
.people .spokes line { stroke: #cdbfba; stroke-width: .6; vector-effect: non-scaling-stroke; stroke-width: 2; }
.people ul { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, auto); gap: 22px 18px; }
.people li { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.people li.center { background: var(--maroon); color: #fff; border-color: var(--maroon); align-self: center; }
.people li strong { display: block; font-size: 15px; }
.people .role { display: block; color: var(--muted); }
.people li.center .role { color: #f6e3e3; }
.people .view { display: block; margin-top: 4px; }
.people .c11 { grid-area: 1 / 1; } .people .c12 { grid-area: 1 / 2; } .people .c13 { grid-area: 1 / 3; }
.people .c21 { grid-area: 2 / 1; } .people .c22 { grid-area: 2 / 2; } .people .c23 { grid-area: 2 / 3; }
.people .c31 { grid-area: 3 / 1; } .people .c32 { grid-area: 3 / 2; } .people .c33 { grid-area: 3 / 3; }
.scen-picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 12px 0 16px; }
.scen-picker button { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); }
.scen-picker button:hover { border-color: var(--maroon); }
.scen-picker button[aria-pressed="true"] { border: 2px solid var(--maroon); background: var(--tint); }
.scen-picker .m { display: block; font-weight: 700; color: var(--maroon); font-size: 13px; }
.scen-picker .ok { color: var(--ok); }
.scen-picker .t { display: block; line-height: 1.3; }
.scen-for { font-weight: 700; color: var(--maroon); margin: 4px 0 8px; }
.scen-opt { border-top: 1px solid #c7d8e0; padding-top: 8px; margin-top: 8px; }
.scen-opt ul { margin: 6px 0; }
.scen-note { font-size: 14px; color: var(--muted); }
.due-dates { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 12px 0; background: #fff; font-size: 15px; }
.due-dates p { margin: 4px 0; }
.due-dates ul { margin: 4px 0 6px; }
.week-check { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 12px 0; background: #fff; font-size: 15px; }
.week-check p { margin: 4px 0; }
.wl-flags { margin: 4px 0; color: var(--warn); }
.wl-ok { color: var(--ok); font-weight: 600; }
.wl-chart { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; align-items: end; }
.wl-chart li { display: flex; flex-direction: column; font-size: 13px; }
.wl-chart .col { position: relative; height: 170px; background: #faf8f6; border-radius: 6px 6px 0 0; }
.wl-chart .bar { position: absolute; left: 18%; right: 18%; bottom: 0; background: var(--maroon); border-radius: 4px 4px 0 0; }
.wl-chart li.flag .bar { background: var(--warn); }
.wl-chart .tgt { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--ink); }
.wl-chart .m { font-weight: 700; color: var(--maroon); margin-top: 4px; }
.wl-chart .v em { display: block; font-style: normal; color: var(--warn); font-weight: 600; }
.tgt-key { display: inline-block; width: 22px; border-top: 2px dashed var(--ink); vertical-align: middle; margin-right: 4px; }
@container (max-width: 560px) { .wl-chart { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 14px; } .wl-chart .col { height: 120px; } }
.act-checks { border-top: 1px solid #c7d8e0; margin-top: 10px; padding-top: 8px; font-size: 15px; }
.budget { display: flex; height: 34px; border-radius: 8px; overflow: hidden; margin: 4px 0 10px; }
.budget span, .budget-key .sw { display: block; }
.budget .b0, .budget-key .b0 { background: var(--maroon); }
.budget .b1, .budget-key .b1 { background: #b9847c; }
.budget .b2, .budget-key .b2 { background: #2f5d73; }
.budget-key { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 14px; }
.budget-key li { display: flex; align-items: center; gap: 6px; }
.budget-key .sw { width: 14px; height: 14px; border-radius: 3px; }
.arc { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; align-items: end; height: 260px; }
.arc li { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; font-size: 13px; }
.arc .bar { display: block; height: calc(var(--h) * .6); background: #e6dcd8; border-radius: 6px 6px 0 0; margin-bottom: 6px; }
.arc li.peak .bar { background: var(--maroon); }
.arc .m { font-weight: 700; color: var(--maroon); }
.arc .m em { font-style: normal; font-size: 11px; background: var(--maroon); color: #fff; border-radius: 8px; padding: 0 6px; }
.arc .t { line-height: 1.3; min-height: 3.9em; }
@container (max-width: 600px) {
  .arc { grid-template-columns: 1fr; height: auto; gap: 6px; }
  .arc li { height: auto; display: grid; grid-template-columns: minmax(9em, 40%) 1fr; column-gap: 10px; align-items: center; }
  .arc .bar { grid-column: 2; grid-row: 1 / span 2; height: 22px; width: var(--h); border-radius: 0 6px 6px 0; margin: 0; }
  .arc .m { grid-column: 1; } .arc .t { grid-column: 1; min-height: 0; font-size: 12px; }
}
.fold { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
.fold summary { cursor: pointer; font-weight: 600; }
.linkbtn { background: none; border: 0; color: var(--maroon); text-decoration: underline; font: inherit; font-size: 15px; cursor: pointer; padding: 8px 4px; }
.setup-msg { margin: 6px 0 0; font-weight: 600; color: var(--ok); }
.setup-msg.warn { color: var(--warn); }
.redraft-row { margin: 2px 0 0; }
.redraft-row .linkbtn { padding: 2px 0; font-size: 14px; }
.redraft-panel { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; margin: 6px 0 4px; }
.redraft-panel label { font-weight: 600; font-size: 15px; display: block; }
.redraft-panel input { width: 100%; max-width: 520px; font: inherit; padding: 6px 8px; border: 1px solid #b9b4ad; border-radius: 6px; }
.check-msg { color: var(--muted); }
.kv { margin: 6px 0; }
.kv > .k { font-weight: 600; color: var(--maroon-2); font-size: 13px; text-transform: capitalize; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; background: #fff; }
.checklist label { display: flex; gap: 8px; margin: 6px 0; align-items: flex-start; }
.flag { border-left: 4px solid var(--warn); background: #fff8e8; padding: 8px 12px; margin: 8px 0; border-radius: 4px; }
.flag.ok { border-color: var(--ok); background: #eef7ef; }
.cite { color: var(--maroon-2); font-weight: 600; }
.welcome { max-width: 720px; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0; }
.choice button { text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 16px; font: inherit; cursor: pointer; }
.choice button:hover, .choice button[aria-pressed="true"] { border-color: var(--maroon); }
.choice strong { display: block; color: var(--maroon); font-size: 18px; margin-bottom: 4px; }

<body>
<header>
  <h1>Course Plan Builder</h1>
  <span class="badge">Prototype · Demo mode: MGMT 615, recorded AI responses</span>
  <span class="spacer"></span>
  <div class="seg" role="group" aria-label="Track">
    <button type="button" data-track="full">Full build</button>
    <button type="button" data-track="refresh">Refresh</button>
  </div>
  <button type="button" class="hbtn" id="editBtn" aria-pressed="false">Edit</button>
  <button type="button" class="hbtn" id="docBtn" aria-expanded="false" aria-controls="doc">Planning document</button>
</header>
<div class="layout">
  <button type="button" class="steps-btn" id="stepsBtn" aria-expanded="false" aria-controls="nav">Steps</button>
  <nav id="nav" aria-label="Workshop modules"></nav>
  <div class="main-wrap"><main id="main" tabindex="-1"></main><footer class="credits" id="credits"></footer></div>
</div>
<aside class="doc" id="doc" hidden aria-label="Course Planning Document preview"></aside>
<div class="editbar" id="editbar" hidden role="region" aria-label="Edit mode">
  <span class="msg"><strong>Edit mode.</strong> Click any outlined text and type. Text without an outline can't be changed here; tell Claude instead. <span id="ecount" aria-live="polite"></span></span>
  <button type="button" class="btn" id="saveEdits">Save edits</button>
  <button type="button" class="btn sec" id="undoEdits">Undo all</button>
  <button type="button" class="btn sec" id="doneEdit">Done editing</button>
</div>

<script>
const DATA = /*DATA*/null;
const KEY = 'course-plan-builder-prototype:state';
let state = { track: null, done: {}, at: 'welcome', showAll: false, pick: {}, mods: {} };

function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) state = Object.assign(state, s); } catch (e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);

/* ---------- content parsing ---------- */
// Faculty never see notes for reviewers or the app's builders: "> Review note" and "> App note"
// blocks, Pattern and AI-instructions labels, and project-file or browser storage details.
function stripNotes(text) {
  const out = []; let skipping = false, label = false;
  for (const line of text.split('\n')) {
    if (/^> (Review|App) note/.test(line)) { skipping = true; continue; }
    if (skipping && line.startsWith('>')) continue;
    skipping = false;
    if (/^(Project file|Browser only):/.test(line)) { label = true; continue; }
    if (label && line.trim() && !/^[A-Z][A-Za-z ]+: /.test(line)) continue;
    label = false;
    if (/^Pattern:/.test(line) || /^AI instructions[^:]*:\s*$/.test(line)) continue;
    out.push(line);
  }
  return out.join('\n');
}
function splitBy(text, marker) {
  const parts = []; let cur = { head: null, body: [] };
  for (const line of text.split('\n')) {
    if (line.startsWith(marker)) { parts.push(cur); cur = { head: line.slice(marker.length).trim(), body: [] }; }
    else cur.body.push(line);
  }
  parts.push(cur);
  return parts.map(p => ({ head: p.head, body: p.body.join('\n').trim() }));
}
function parseModule(m) {
  const text = stripNotes(m.raw);
  const title = (text.match(/^# (.+)$/m) || [, m.id])[1];
  const top = splitBy(text, '## ');
  const mod = { id: m.id, title, intro: top[0].body.replace(/^# .+$/m, '').trim(), reflection: null, prep: null, steps: [] };
  for (const sec of top.slice(1)) {
    if (/^Refresh reflection/.test(sec.head)) mod.reflection = sec.body;
    else if (/^Check-in prep/.test(sec.head)) mod.prep = sec.body;
    else {
      const subs = splitBy(sec.body, '### ');
      const lead = subs[0].body;
      const step = { key: sec.head.split(' ')[0], title: sec.head, lead, parts: {} };
      for (const s of subs.slice(1)) step.parts[s.head] = s.body;
      mod.steps.push(step);
    }
  }
  return mod;
}
let MODULES = DATA.modules.map(parseModule);

/* ---------- edit mode ----------
   Each editable block carries data-s, an index into SRC that records the exact source text it came
   from (a markdown snippet, a table row, or a JSON string). An edit replaces that snippet, so it
   can be applied to the content files by tools/apply_edits.py. A block is editable only when its
   source text occurs exactly once in its file. */
const EKEY = 'course-plan-builder-prototype:edits';
let editing = false, edits = [], SRC = [], CUR = null, noTag = 0, formId = 0;
const count = (hay, needle) => needle ? hay.split(needle).length - 1 : 0;
const norm = s => s.replace(/\s+/g, ' ');
// True when the new text is already in place (for example, applied to the files and rebuilt).
const landed = (hay, o, n) => norm(hay).includes(norm(n)) && (!hay.includes(o) || norm(n).includes(norm(o)));
function tag(kind, old, extra) {
  if (!CUR || noTag || old == null || !String(old).trim()) return '';
  const hay = CUR.demo ? JSON.stringify(DATA.demo[CUR.demo]) : CUR.mod.raw;
  if (count(hay, kind === 'json' ? JSON.stringify(old) : old) !== 1) return '';
  SRC.push(Object.assign({ file: CUR.file, kind, old }, extra));
  return ' data-s="' + (SRC.length - 1) + '"';
}
function patch(file, kind, old, nu) {
  if (file.startsWith('demo/')) {
    const name = file.slice(5);
    const hay = DATA.demo[name] ? JSON.stringify(DATA.demo[name]) : '';
    if (!hay.includes(JSON.stringify(old)) || landed(hay, JSON.stringify(old), JSON.stringify(nu))) return false;
    const fix = v => Array.isArray(v) ? v.map(fix) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fix(x)])) : v === old ? nu : v;
    DATA.demo[name] = fix(DATA.demo[name]); return true;
  }
  const m = DATA.modules.find(x => x.file === file);
  const o = kind === 'json' ? JSON.stringify(old) : old, n = kind === 'json' ? JSON.stringify(nu) : nu;
  if (!m || !m.raw.includes(o) || landed(m.raw, o, n)) return false;
  m.raw = m.raw.replace(o, () => n);
  MODULES = DATA.modules.map(parseModule); return true;
}
function loadEdits() {
  try { edits = JSON.parse(localStorage.getItem(EKEY) || '[]'); } catch (e) { edits = []; }
  // Edits already applied to the content files no longer match and are dropped.
  edits = edits.filter(e => patch(e.file, e.kind, e.old, e.new));
  saveEdits();
}
function saveEdits() { try { localStorage.setItem(EKEY, JSON.stringify(edits)); } catch (e) {} }
function toMd(el, kind) {
  if (kind === 'pre') return el.innerText.replace(/ /g, ' ').replace(/\n+$/, '');
  if (kind === 'json') return el.innerText.replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  const walk = n => [...n.childNodes].map(c => {
    if (c.nodeType === 3) return c.nodeValue;
    if (c.nodeType !== 1) return '';
    const t = c.tagName, inner = walk(c);
    if (t === 'BR') return ' ';
    if (c.dataset.cite) return '`src:' + c.dataset.cite + '`';
    if (!inner.trim()) return inner;
    if (t === 'STRONG' || t === 'B') return '**' + inner.trim() + '**';
    if (t === 'EM' || t === 'I') return '*' + inner.trim() + '*';
    if (t === 'CODE') return '`' + inner + '`';
    if (t === 'A') return '[' + inner + '](' + c.getAttribute('href') + ')';
    if (t === 'DIV' || t === 'P') return ' ' + inner + ' ';
    return inner;
  }).join('');
  return walk(el).replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
}
function recordEdit(el) {
  const s = el._s; if (!s) return;
  const now = toMd(el, s.kind);
  if (now === el.dataset.base) return;
  el.dataset.base = now;
  let nu = now;
  if (s.kind === 'row') {
    const cells = s.old.replace(/^\||\|$/g, '').split('|');
    cells[s.cell] = ' ' + now.replace(/\|/g, '/') + ' ';
    nu = '|' + cells.join('|') + '|';
  }
  if (!patch(s.file, s.kind, s.old, nu)) return;
  const prev = edits.find(e => e.file === s.file && e.kind === s.kind && e.new === s.old);
  if (prev) { prev.new = nu; if (prev.new === prev.old) edits.splice(edits.indexOf(prev), 1); }
  else edits.push({ file: s.file, kind: s.kind, old: s.old, new: nu, marker: s.marker, step: state.at });
  SRC.forEach(x => { if (x.file === s.file && x.old === s.old) x.old = nu; });
  saveEdits(); updateBar();
  if (s.kind === 'title') renderNav();
}
function decorate() {
  document.body.classList.toggle('editing', editing);
  $('#editBtn').setAttribute('aria-pressed', String(editing));
  $('#editbar').hidden = !editing;
  if (!editing) return;
  $('#main').querySelectorAll('[data-s]').forEach(el => {
    el._s = SRC[el.dataset.s]; el.contentEditable = 'true'; el.spellcheck = true;
    el.dataset.base = toMd(el, el._s.kind);
  });
  updateBar();
}
function updateBar() {
  $('#ecount').textContent = edits.length ? edits.length + (edits.length === 1 ? ' change' : ' changes') + ' so far.' : 'No changes yet.';
}
function downloadEdits() {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const day = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const blob = new Blob([JSON.stringify({ saved: d.toISOString(), edits }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'fodw-edits-' + day + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- markdown ---------- */
function inline(s) {
  s = esc(s);
  s = s.replace(/`src:([a-z0-9-]+)`/g, (_, id) => {
    const src = DATA.sources[id];
    if (!src) return '<span class="cite" data-cite="' + esc(id) + '">' + esc(id) + '</span>';
    const label = esc(src.citation || src.title);
    return src.url ? '<a class="cite" data-cite="' + esc(id) + '" href="' + esc(src.url) + '" target="_blank" rel="noopener">' + label + '</a>' : '<span class="cite" data-cite="' + esc(id) + '">' + label + '</span>';
  });
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(text, opts = {}) {
  const lines = text.split('\n'); let html = ''; let i = 0;
  while (i < lines.length) {
    let line = lines[i];
    if (/^```/.test(line)) {
      const lang = line.slice(3).trim(); const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      html += codeBlock(lang, buf.join('\n'), opts); continue;
    }
    if (/^:::\s*plan/.test(line)) {
      const label = line.replace(/^:::\s*plan\s*/, ''); const buf = []; i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      html += '<div class="plan-page"><p class="plan-label">MGMT 615 Course Planning Document' + (label ? ': ' + esc(label) : '') + '</p>' + md(buf.join('\n'), opts) + '</div>';
      continue;
    }
    // ::: refresh / ::: full block: text shown on that track only.
    if (/^:::\s*(refresh|full)\s*$/.test(line)) {
      const which = line.replace(/^:::\s*/, '').trim(); const buf = []; i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++;
      if (state.track === which) html += md(buf.join('\n'), opts);
      continue;
    }
    // Steps that work one module at a time (3.2, 4.1, ...): ::: module-picker chooses the module,
    // ::: module-options shows the AI's draft for it, and ::: module-fields holds the faculty member's version.
    if (/^:::\s*module-(picker|options|fields)\s*$/.test(line)) {
      const which = line.match(/picker|options|fields/)[0], rows = []; i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) { if (/^- /.test(lines[i])) rows.push(lines[i].slice(2).split(/\s*\|\s*/)); i++; }
      i++; html += moduleBlock(which, rows, opts); continue;
    }
    // ::: week-check shows the picked module's week against the target, live; ::: workload-chart shows all eight.
    if (/^:::\s*due-dates\s*$/.test(line)) {
      i++; while (i < lines.length && !/^:::\s*$/.test(lines[i])) i++;
      i++; html += '<div class="due-dates">' + dueDates(pickOf('4.1')) + '</div>'; continue;
    }
    if (/^:::\s*(week-check|workload-chart)\s*$/.test(line)) {
      const which = line.match(/week-check|workload-chart/)[0]; i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) i++;
      i++; html += which === 'week-check' ? '<div class="week-check" role="status">' + weekCheck(pickOf('4.1')) + '</div>' : '<div class="wl-chart-wrap">' + workloadChart() + '</div>';
      continue;
    }
    // ::: figure <type> | <title> block: an infographic. Its words come from "- a | b | c" lines in the
    // content file, so they stay editable and readable by screen readers; any drawing is decorative.
    if (/^:::\s*figure\b/.test(line)) {
      const [type, title] = line.replace(/^:::\s*figure\s*/, '').split(/\s*\|\s*/), rows = []; i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) {
        if (/^- /.test(lines[i])) rows.push(lines[i].slice(2).split(/\s*\|\s*/)); else if (rows.length && lines[i].trim()) rows[rows.length - 1].push(lines[i].trim());
        i++;
      }
      i++; html += figure(type, title, rows); continue;
    }
    // ::: flow block: "- Name | what it is" lines become a numbered strip of the parts of a step.
    if (/^:::\s*flow/.test(line)) {
      const items = []; i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) {
        if (/^- /.test(lines[i])) items.push(lines[i].slice(2)); else if (items.length && lines[i].trim()) items[items.length - 1] += ' ' + lines[i].trim();
        i++;
      }
      i++; html += '<ol class="flow">' + items.map(it => { const [n, d] = it.split(' | '); return '<li><strong>' + inline(n) + '</strong><span>' + inline(d || '') + '</span></li>'; }).join('') + '</ol>'; continue;
    }
    // ::: fold <title> block: a fold-out for detail most people only need once.
    if (/^:::\s*fold\b/.test(line)) {
      const title = line.replace(/^:::\s*fold\s*/, ''), buf = []; i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++; html += '<details class="fold"><summary>' + inline(title) + '</summary>' + md(buf.join('\n'), opts) + '</details>'; continue;
    }
    // ::: key and ::: folder blocks: the setup controls on GS.1. The prototype acts them out.
    if (/^:::\s*(key|folder)\s*$/.test(line)) {
      const which = line.match(/key|folder/)[0]; i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) i++;
      i++;
      html += which === 'key'
        ? '<div class="form"><div class="field"><label for="apikey">Your TAMU AI key</label><input id="apikey" type="password" autocomplete="off" placeholder="sk-…"></div>' +
          '<div class="row"><button type="button" class="btn" data-testkey>Test connection</button><button type="button" class="linkbtn" data-noai>Continue without AI</button><span class="thinking" hidden>Testing…</span></div><p class="setup-msg" role="status"></p></div>'
        : '<div class="row"><button type="button" class="btn sec" data-folder>Choose save folder</button></div><p class="setup-msg" role="status"></p>';
      continue;
    }
    // ::: purpose block: the "What you'll do / Why it matters" opener at the top of a step.
    if (/^:::\s*purpose/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) buf.push(lines[i++]);
      i++; html += '<div class="purpose">' + md(buf.join('\n'), opts) + '</div>'; continue;
    }
    // ::: fields block: each "- Question | Example answer" line becomes a labeled answer box, with the
    // MGMT 615 answer as a hint below. Questions that ask for pasted text get a taller box.
    // ::: check block (spot the problem): "- Question" gets an answer box and a Check my answer
    // button; the "Feedback:" text is the AI's recorded reply, shown when the button is selected.
    if (/^:::\s*check/.test(line)) {
      i++; let q = '', fb = '';
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) {
        if (/^- /.test(lines[i])) q = lines[i].slice(2); else if (/^Feedback:/.test(lines[i])) fb = lines[i].replace(/^Feedback:\s*/, ''); else if (lines[i].trim()) fb ? fb += ' ' + lines[i].trim() : q += ' ' + lines[i].trim();
        i++;
      }
      i++;
      const id = 'f' + (++formId);
      html += '<div class="form"><div class="field"><label for="' + id + '">' + inline(q) + '</label><textarea id="' + id + '" rows="3"></textarea></div>' +
        '<div class="row"><button type="button" class="btn sec" data-check>Check my answer</button><span class="thinking" hidden>Working…</span><span class="check-msg" role="status"></span></div>' +
        '<div class="demo-out" hidden><p class="crumb">AI feedback (recorded response)</p><p>' + inline(fb) + '</p></div></div>';
      continue;
    }
    if (/^:::\s*fields/.test(line)) {
      // "::: fields notes" holds the faculty member's own notes, so it has no Redraft link.
      const fred = opts.redraft && !/^:::\s*fields\s+notes/.test(line);
      i++; const items = [];
      while (i < lines.length && !/^:::\s*$/.test(lines[i])) {
        if (/^- /.test(lines[i])) items.push(lines[i].slice(2)); else if (items.length && lines[i].trim()) items[items.length - 1] += ' ' + lines[i].trim();
        i++;
      }
      i++;
      html += '<div class="form">' + items.map(it => {
        const [q, hint] = it.split(' | '), id = 'f' + (++formId);
        return '<div class="field"><label for="' + id + '"' + tag('p', q) + '>' + inline(q) + '</label>' +
          '<textarea id="' + id + '" rows="' + (/paste|one per line|sentences/i.test(q) ? 5 : 2) + '"></textarea>' +
          (fred ? '<div class="redraft-row"><button type="button" class="linkbtn" data-redraft aria-expanded="false">Redraft with AI</button></div>' : '') +
          (hint ? '<p class="hint">Example (MGMT 615): <span' + tag('p', hint) + '>' + inline(hint) + '</span></p>' : '') + '</div>';
      }).join('') + '</div>';
      continue;
    }
    if (/^\|/.test(line)) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(rows[0]); const body = rows.slice(2).map(cells);
      // A "Field | Required | Example" table is a form: empty boxes, with the MGMT 615 value as a hint below.
      if (head[0] === 'Field' && /^Example/.test(head[2] || '')) {
        html += '<div class="form">' + body.map((r, j) => {
          const id = 'f' + (++formId), req = /^yes/i.test(r[1]);
          const box = /^Course start date/.test(r[0])
            ? '<input id="' + id + '" type="date" data-setting="startDate" value="' + esc(state.startDate || '') + '">'
            : /^Weekly hours target/.test(r[0])
            ? '<input id="' + id + '" type="number" min="1" max="20" step="0.5" data-setting="weeklyTarget" value="' + esc(String(weeklyTarget())) + '">'

// AI instructions are hard-wrapped in the content files. Join each paragraph and list item onto one
// line so it wraps to the box. The "Return:" format is for the software only, so faculty never see
// it: it and anything after it are left out of the box (apply_edits keeps it in the content file).
function reflow(code) {
  const at = code.search(/(^|\n)Return:/);
  if (at >= 0) code = code.slice(0, at);
  return code.trim().split(/\n[ \t]*\n/).map(b => {
    const out = []; let inItem = false;
    for (const l of b.split('\n')) {
      // A list item continues only on indented lines; an unindented line after it starts a new line.
      const item = /^\s*(-|\d+\.)\s/.test(l);
      if (!out.length || item || (inItem && !/^\s/.test(l))) { out.push(l.replace(/\s+$/, '')); inItem = item; }
      else out[out.length - 1] += ' ' + l.trim();
    }
    return out.join('\n');
  }).join('\n\n');
}
function renderValue(v) {
  if (v === null || v === undefined) return '<span class="empty">none</span>';
  if (Array.isArray(v)) {
    if (!v.length) return '<span class="empty">none</span>';
    if (v.every(x => typeof x !== 'object' || x === null)) return '<ul>' + v.map(x => '<li' + (typeof x === 'string' ? tag('json', x) : '') + '>' + esc(x) + '</li>').join('') + '</ul>';
    return v.map(x => '<div class="card">' + renderValue(x) + '</div>').join('');
  }
  if (typeof v === 'object') {
    return Object.entries(v).map(([k, val]) => '<div class="kv"><div class="k">' + esc(k.replace(/([A-Z])/g, ' $1')) + '</div>' + renderValue(val) + '</div>').join('');
  }
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  return '<div' + (typeof v === 'string' ? tag('json', v) : '') + '>' + esc(v) + '</div>';
}

  ];
  const table = (from, n) => '<div class="scroll"><table><thead><tr><th>FODW</th><th>Course Item</th>' + [0, 1, 2, 3].map(k => '<th>Module ' + (from + k + 1) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(([w, label, name, fn]) => '<tr><td>' + w + '</td><th scope="row">' + label + '</th>' + [0, 1, 2, 3].map(k => '<td>' + (shown(name) ? fn(from + k) : '<span class="empty">[Enter]</span>') + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
  const c = f.character;
  let h = '<div class="row" style="margin-top:0"><button type="button" class="btn sec" id="closeDoc">Close</button>' +
    '<label><input type="checkbox" id="showAll"' + (state.showAll ? ' checked' : '') + '> Show the finished plan</label>' +
    '<button type="button" class="btn" id="download">Download (Word)</button></div>';
  h += '<h2>' + (shown('title') ? esc(f.course.number + ' ' + f.course.title) : '[Course Name and Number]') + ' Course Planning Document</h2>';
  h += sec('catalog', 'TAMU Catalog Course Description', '<p>' + esc(f.catalog) + '</p>');
  h += sec('plos', 'Program-Level Outcomes', ul(f.programOutcomes));
  h += sec('vision', 'Course Vision', '<p>' + esc(f.vision) + '</p>');
  h += sec('learners', 'Learners', '<p>' + esc(f.learners) + '</p>');
  h += sec('clos', 'Course-Level Objectives (CLOs)', ul(f.clos));
  h += '<h3>Table 1: Course Planning Modules 1-4</h3>' + table(0) + '<h3>Table 2: Course Planning Modules 5-8</h3>' + table(4);
  h += sec('premise', 'Storyline', '<p>' + esc(DATA.demo['mgmt615-scenarios.json'].storylinePremise) + '</p>') +
    (shown('character') ? '<h4>Character Profile</h4><p><strong>Premise statement:</strong> ' + esc(c.premise) + '</p><p><strong>Position:</strong> ' + esc(c.position) + '</p><p><strong>Conflict:</strong> ' + esc(c.conflict) + '</p><p><strong>Peers:</strong> ' + esc(c.peers) + '</p><p><strong>Values and fears:</strong> ' + esc(c.valuesFears) + '</p><p><strong>Backstory:</strong> ' + esc(c.backstory) + '</p>' : '');
  h += sec('interaction', 'Instructor Interaction', '<p>' + esc(f.interactionStatement) + '</p>' + (shown('communication') ? '<h4>Communication and feedback plan</h4>' + ul(f.communicationPlan) : ''));
  return h;
}
function downloadDoc() {
  const body = $('#doc').cloneNode(true); body.querySelector('.row').remove();
  const html = '<html><head><meta charset="utf-8"><style>body{font-family:Calibri,Arial,sans-serif}table{border-collapse:collapse}td,th{border:1px solid #999;padding:4px;vertical-align:top}</style></head><body>' + body.innerHTML + '</body></html>';
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'application/msword' }));
  a.download = 'MGMT 615 Course Planning Document (prototype).doc'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- render and events ---------- */
function render() {
  document.querySelectorAll('header [data-track]').forEach(b => b.setAttribute('aria-pressed', String(state.track === b.dataset.track)));
  renderNav();
  SRC = []; CUR = null;
  $('#main').innerHTML = state.at === 'welcome' ? renderWelcome() : renderStep(state.at);
  $('#credits').innerHTML = 'Banner image: ' + credit('Storyline path', '');
  CUR = null;
  if (!$('#doc').hidden) $('#doc').innerHTML = renderDoc();
  decorate();
}
const editable = t => editing && t instanceof Element && t.closest('[data-s]');
document.addEventListener('focusout', e => { const el = editable(e.target); if (el) recordEdit(el); });
document.addEventListener('input', e => {
  if (e.target.dataset && e.target.dataset.setting) { state[e.target.dataset.setting] = e.target.value; save(); return; }
  const k = e.target.dataset && e.target.dataset.mfield; if (!k) return;
  const key = stepKey(), n = pickOf(key); state.mods = state.mods || {}; state.mods[key] = state.mods[key] || {};
  state.mods[key][n] = state.mods[key][n] || {}; state.mods[key][n][k] = e.target.value; save();
  if (key === '4.1') { const dd = document.querySelector('.due-dates'); if (dd) dd.innerHTML = dueDates(n); const wc = document.querySelector('.week-check'); if (wc) wc.innerHTML = weekCheck(n); const ch = document.querySelector('.wl-chart-wrap'); if (ch) ch.innerHTML = workloadChart(); }
});
document.addEventListener('keydown', e => {
  const el = editable(e.target);
  if (el && el._s && e.key === 'Enter' && el._s.kind !== 'pre') { e.preventDefault(); el.blur(); }
});
document.addEventListener('paste', e => {
  if (!editable(e.target)) return;
  e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
});
// In edit mode, clicking text places the cursor instead of following a link or ticking a checkbox.
document.addEventListener('click', e => { if (editable(e.target) && e.target.closest('a, label')) e.preventDefault(); }, true);
document.addEventListener('click', e => {
  const t = e.target.closest('button, input'); if (!t) return;
  if (t.dataset.track) { state.track = t.dataset.track; save(); render(); return; }
  if (t.dataset.pickmod) {
    const key = stepKey(); state.pick = state.pick || {}; state.pick[key] = +t.dataset.pickmod; save(); render();
    const pick = document.querySelector('.scen-picker'); if (pick) { pick.scrollIntoView({ block: 'start' }); window.scrollBy(0, -70); document.querySelector('[data-pickmod="' + state.pick[key] + '"]').focus({ preventScroll: true }); }
    return;
  }
  if (t.dataset.mod) { navOpen[t.dataset.mod] = t.getAttribute('aria-expanded') !== 'true'; renderNav(); $('[data-mod="' + t.dataset.mod + '"]').focus(); return; }
  if (t.id === 'stepsBtn') { const open = document.body.classList.toggle('nav-open'); t.setAttribute('aria-expanded', String(open)); return; }
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.hasAttribute('data-next')) { next(); return; }
  if (t.id === 'reset') { state = { track: null, done: {}, at: 'welcome', showAll: false, pick: {}, mods: {} }; save(); render(); return; }
  if (t.hasAttribute('data-draft')) {
    const sec = t.closest('section'); const wait = sec.querySelector('.thinking');
    t.disabled = true; wait.hidden = false;
    setTimeout(() => { wait.hidden = true; t.textContent = 'Ask for another version'; t.disabled = false;
      sec.querySelectorAll('.demo-out').forEach(d => d.hidden = false); useButtons(sec); }, 900);
    return;
  }
  // GS.1 setup controls. The prototype acts them out; nothing is sent or saved.
  if (t.hasAttribute('data-testkey') || t.hasAttribute('data-noai')) {
    const form = t.closest('.form'), msg = form.querySelector('.setup-msg'), key = form.querySelector('#apikey');
    msg.classList.remove('warn');
    if (t.hasAttribute('data-noai')) {
      if (!confirm("Without the AI you'll write every section of your plan yourself. You won't get first drafts, checks on your work, or a review of your existing course. You can connect the AI later from Settings.")) return;
      msg.classList.add('warn'); msg.textContent = 'Continuing without AI. You can connect it later from Settings.'; return;
    }
    if (!key.value.trim()) { msg.classList.add('warn'); msg.textContent = 'Paste your key first. It starts with sk-.'; key.focus(); return; }
    const wait = form.querySelector('.thinking'); t.disabled = true; wait.hidden = false;
    setTimeout(() => { wait.hidden = true; t.disabled = false; msg.textContent = "Connected to TAMU AI Chat. (Demo: the key isn't sent anywhere.)"; }, 900);
    return;
  }
  if (t.hasAttribute('data-folder')) {
    const msg = t.closest('.row').nextElementSibling;
    msg.textContent = "In the finished tool, this opens your computer's folder picker. (Demo: no folder is chosen.)";
    return;
  }
  if (t.hasAttribute('data-check')) {
    const form = t.closest('.form'), box = form.querySelector('textarea'), msg = form.querySelector('.check-msg'), wait = form.querySelector('.thinking');
    if (!box.value.trim()) { msg.textContent = 'Write your answer first.'; box.focus(); return; }
    msg.textContent = ''; t.disabled = true; wait.hidden = false;
    setTimeout(() => { wait.hidden = true; t.disabled = false; form.querySelector('.demo-out').hidden = false; }, 900);
    return;
  }
  // Redraft with AI: a short note on what should change, then a new version of that box only.
  if (t.hasAttribute('data-redraft')) {
    const row = t.closest('.redraft-row'), open = row.nextElementSibling && row.nextElementSibling.classList.contains('redraft-panel');
    if (open) { row.nextElementSibling.remove(); t.setAttribute('aria-expanded', 'false'); return; }
    const id = 'rd' + (++formId);
    row.insertAdjacentHTML('afterend', '<div class="redraft-panel"><label for="' + id + '">What should change? (optional)</label><input id="' + id + '" type="text">' +
      '<p class="hint">For example: shorter, plainer, or more about the decision.</p>' +
      '<div class="row"><button type="button" class="btn sec" data-redraft-go>Redraft</button><button type="button" class="linkbtn" data-redraft-cancel>Cancel</button><span class="thinking" hidden>Working…</span></div>' +
      '<p class="setup-msg" role="status"></p></div>');
    t.setAttribute('aria-expanded', 'true'); document.getElementById(id).focus();
    return;
  }
  if (t.hasAttribute('data-redraft-cancel')) {
    const panel = t.closest('.redraft-panel'); panel.previousElementSibling.querySelector('[data-redraft]').setAttribute('aria-expanded', 'false'); panel.remove(); return;
  }
  if (t.hasAttribute('data-redraft-go')) {
    const panel = t.closest('.redraft-panel'), box = panel.closest('.field').querySelector('textarea'), msg = panel.querySelector('.setup-msg'), wait = panel.querySelector('.thinking');
    msg.classList.remove('warn');
    if (!box.value.trim()) { msg.classList.add('warn'); msg.textContent = 'Nothing to redraft yet. Copy the AI draft into this box, or type your own, first.'; return; }
    t.disabled = true; wait.hidden = false;
    setTimeout(() => { wait.hidden = true; t.disabled = false;
      msg.textContent = "Redrafted. (Demo: recorded responses don't change, so the text stays the same. In the finished tool, the AI rewrites only this box, using your note.)"; }, 900);
    return;
  }
  if (t.dataset.use) {
    // One text fills the first box; a list of texts fills the boxes in order.
    const boxes = [...document.querySelectorAll('#decide textarea')], vals = [].concat(USE_TEXT[+t.dataset.use]), box = boxes[0];
    if (!box) return;
    if (boxes.some((b, i) => i < vals.length && b.value.trim() && b.value !== vals[i]) && !confirm('Replace what is already in your boxes under Decide?')) return;
    vals.forEach((v, i) => { const b = boxes[i]; if (b) { b.value = v; b.rows = Math.max(b.rows, v.split('\n').length + 1, Math.ceil(v.length / 90) + 1); b.dispatchEvent(new Event('input', { bubbles: true })); } });
    let note = document.querySelector('#decide .use-note');
    if (!note) { box.insertAdjacentHTML('afterend', '<p class="use-note" role="status"></p>'); note = document.querySelector('#decide .use-note'); }
    note.textContent = 'Copied. Edit it here until it says what you mean.';
    box.scrollIntoView({ behavior: 'smooth', block: 'center' }); box.focus({ preventScroll: true });
    return;
  }
  if (t.dataset.save) {
    state.done[t.dataset.save] = true; save();
    const checks = $('#checks');
    render();
    const c2 = $('#checks'); if (c2) { c2.hidden = false; c2.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    const row = document.querySelector('[data-save]').parentElement;
    if (!row.querySelector('[data-next]')) row.insertAdjacentHTML('beforeend', '<button type="button" class="btn sec" data-next>Next step</button>');
    return;
  }
  if (t.id === 'docBtn') { const d = $('#doc'); d.hidden = !d.hidden; t.setAttribute('aria-expanded', String(!d.hidden)); if (!d.hidden) { d.innerHTML = renderDoc(); d.focus(); } return; }
  if (t.id === 'closeDoc') { $('#doc').hidden = true; $('#docBtn').setAttribute('aria-expanded', 'false'); $('#docBtn').focus(); return; }
  if (t.id === 'showAll') { state.showAll = t.checked; save(); $('#doc').innerHTML = renderDoc(); return; }
  if (t.id === 'download') { downloadDoc(); return; }
  if (t.id === 'editBtn' || t.id === 'doneEdit') { editing = t.id === 'editBtn' ? !editing : false; render(); return; }
  if (t.id === 'saveEdits') { if (edits.length) downloadEdits(); else alert('No changes to save yet.'); return; }
  if (t.id === 'undoEdits') {
    if (edits.length && confirm('Undo all ' + edits.length + ' changes? This can\'t be reversed.')) { edits = []; saveEdits(); location.reload(); }
    return;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#doc').hidden) $('#closeDoc').click(); });
$('#doc').tabIndex = -1;
load(); loadEdits(); render();
</script>
