4`.\n\n---\n\n## 4.1 Activities for every module\n\nTime: about 45 minutes, about 5 minutes a module\nPattern: pick and combine, one module at a time (full build); edit in place (refresh)\n\n### Learn\n\nA learning activity moves students toward an objective and gives you evidence of whether they\ngot there. At this stage you don't write prompts or rubrics. You decide what students will do in\neach module, clearly enough that your ID can see the plan.\n\nA planned activity:\n\n- **Traces to a CLO and matches its verb.** If the CLO says evaluate, the activity has to\n  require evaluation. If you can't name the CLO, the activity may not belong.\n- **Asks students to do what professionals do**: analyze data, recommend a course of action,\n  design a process, run a conversation.\n- **Fits the week.** Flex Online courses plan for about 10 hours of student work a week,\n  including readings, videos, activities and the 90-minute cohort session. Module 1 is lighter,\n  about 4 hours, while students get oriented.\n- **Adds variety.** If every module has the same format, the course feels repetitive and the same\n  students are always at a disadvantage.\n\n**Your storyline supplies the activities.** Each scenario ends in a decision, and that is where\nthe module's main activity belongs. One decision can become an assignment where students write a\nrecommendation, a discussion where they argue what the character should do, or a short quiz that\nchecks they can find the root cause first. Not every activity has to come from the story. Use it\nwhere it fits.\n\n**Canvas offers three activity types.** Assignments are for producing something, such as an\nanalysis or a plan. Discussions are for dialogue across professional perspectives. Quizzes are\nfor low-stakes checks before harder work. Cohort sessions come in Module 7.\n\n**Weight.** Mark each activity high, medium or low. Activities that show mastery of a CLO carry\nmore weight than the practice that builds toward it. Points and rubrics are finished with your\nID during development.\n\n**Aggie Core Values.** Look for one or two places where an activity asks students to act with\nintegrity, lead or consider who their decision affects. Your character's decisions are often\nthe natural spot. You don't need all six values.\n\n**Watch the last module.** Courses often stack a final project on the module's normal work, and\nthe last week ends up twice as heavy. Start a course-wide synthesis a module early, or let it\nreplace that module's main assignment.\n\n**Design major assessments for AI.** For each high-weight activity, ask whether a student could\nhand the prompt to an AI tool and submit what comes back without doing the thinking the CLO asks\nfor. Banning AI rarely solves this, and detection tools are unreliable. Design does better. Changes\nthat make a student's own thinking visible:\n\n- **Their own context.** Students apply the concept to their own team, client or organization,\n  which an AI tool doesn't know.\n- **Process evidence.** Students submit annotations explaining their choices, a draft\n  with revisions, or a short reflection on what they changed and why.\n- **A live part.** Students defend, rehearse or present the work in a cohort session.\n- **Course-specific material.** The work depends on your storyline, data or earlier submissions.\n\nYou can also allow AI on purpose: let students draft with it, then grade their critique and\nrevision of the draft. Say clearly in the prompt what use is allowed.\n\nLow-weight practice doesn't need this check. The point of practice is the practice.\n\n**Third-party tools.** A tool earns a place when it serves an objective better than a Canvas\nactivity would. The AI may suggest one where it fits.\n\n| Tool | What it does | Fits a story-based course when |\n|---|---|---|\n| Perusall | Students annotate readings, video or web pages together; grades automatically | Students annotate a scenario and flag what they'd do before the discussion |\n| Peerceptiv | Structured peer review; students review the reviews; grades from review quality | Students compare how classmates reasoned through the same decision |\n| Poll Everywhere | Polls and open questions, live or on students' own time | Students vote on the character's choice, then argue it in the cohort session |\n\nThe checks ask six questions about any tool you choose, from privacy to your time. Automatic\nscores from these tools don't count as RSI on their own; plan what you'll add.\n\n**A grading assistant (optional).** You can also set up an AI assistant for yourself that drafts\nfeedback on student work. In Google Gemini, a Gem holds standing instructions and \"knowledge\nfiles\": you give it the assignment prompt and your rubric, then paste in one submission at a time\nand it drafts rubric-based comments. It can save real time in a large course. Three cautions:\nuse only a tool the university has approved for student data (TAMU licenses Gemini with\nenterprise privacy protection, but confirm with your ID before uploading student work); read and\nedit every comment before it goes to a student, which is also what makes it count as RSI; and\nthe grade is always yours. The build steps are under Go deeper.\n\n### See it\n\nMGMT 615 Module 3 after the refresh:\n\n| Activity | CLO | Weight | Hours |\n|---|---|---|---|\n| Assignment: Feedback Conversation Script, Dana and Jordan | CLO 2 | High | 3 |\n| Perusall: Feedback That Lands (Chapter 4) | CLO 2 | Low | 1.5 |\n| Interactive: Coaching or Discipline? Scenario Sort | CLO 2 | Low | 0.5 |\n\nThe script sits at the module's decision point: students write the conversation Dana has with\nJordan.\n\n### Draft (full build)\n\nThe AI offers two versions of each module's activity set. The faculty member picks one, combines\nthem, or writes their own.\n\nAI instructions:\n\n```text\nFor the given module, propose two versions of its activity set, each with 2 to 4\nactivities, from the module's CLOs met, topics and saved scenario. Make the main activity sit at the scenario's decision point. For each activity\ngive: type (Assignment, Discussion, Quiz), a short title, the CLOs it assesses with the verb it\nuses, weight (high, medium, low), estimated student hours, and one sentence on what students do.\nEvery module needs exactly one high-weight activity unless the faculty member's notes say\notherwise. Vary types across modules. Do not include cohort session activities.\n\nWhere a third-party tool (Perusall, Peerceptiv, Poll Everywhere) would serve an objective better\nthan a Canvas activity, include it with type set to the tool name. At most one tool per module.\n\nReturn: {\"versions\": [{\"activities\": [{\"type\": string, \"title\": string, \"clos\": [string], \"verb\": string, \"weight\": string, \"hours\": number, \"what\": string}]}]}\n```\n\nDemo response (MGMT 615, if run as a full build): each module's activities from\n`demo/mgmt615-activities.json`.\n\n### Review (refresh)\n\nThe app shows each module's current activities from the uploaded course map.\n\nAI instructions:\n\n```text\nEach module's current activities are given, with the module's CLOs met, topics and saved\nscenario. For each activity check: it traces to a CLO and matches the CLO's verb; students do\nsomething professionals do; the main activity sits at or near the scenario's decision. Keep\nwhat passes. For the rest, quote the problem and suggest one revision. Add estimated hours and\nweight to every activity. Note modules where activity types repeat the previous module.\n\nReturn: {\"modules\": [{\"module\": int, \"activities\": [{\"original\": string, \"action\": \"keep\" | \"revise\", \"issues\": [string], \"revision\": {...same shape as full build...}}]}]}\n```\n\nDemo response (MGMT 615): each module and its `review` notes from\n`demo/mgmt615-activities.json`. The main finding: three of the four main assignments used\nseparate cases or a topic of the student's choice. The review moves each to the module's\nscenario decision and keeps the original cases as readings or comparisons.\n\n### Decide\n\nFor each module the faculty member edits, adds or removes activities and marks, for each\nhigh-weight activity, the AI use allowed: not allowed, allowed with disclosure, or required as\npart of the task.\n\nChecklist (for each module):\n\n- One main activity carries the module's weight.\n- Students do something professionals in your field do.\n- Each high-weight activity says what AI use is allowed.\n\n### Checks\n\nOn save of each module:\n\n- **Alignment:** each activity traces to a CLO the module lists and uses its verb.\n- **RSI:** at least two categories of instructor activity, counting the cohort session (4) and\n  responsive weekly announcements (3) if the interaction statement promises them.\n- **Workload:** activities total about 4 to 5 hours (about 1.5 in Module 1), leaving room for\n  readings, media and the 90-minute cohort session. The last module is flagged if it runs much heavier than the others.\n- **AI risk:** each high-weight activity rated high, medium or low, with a suggested change for\n  high and medium.\n- **Tools:** each third-party tool answers the six questions (alignment, feedback quality,\n  academic integrity, access, privacy, your time); privacy shows \"check with your ID\" unless the\n  tool is approved.\n\nRSI and workload instructions:\n\n```text\nFor each module, using its saved activities, the step 2.2 RSI check, the syllabus statement and\nwhether the module has a cohort session (assume yes for modules 2 to 8 unless told otherwise):\n1. Assign each activity an RSI category or null, with a short reason. Auto-graded work and\n   student-only activities are null unless the faculty member described instructor involvement.\n2. Count the categories the module covers, including the cohort session (4) and responsive\n   weekly announcements (3) if the syllabus statement promises them.\n3. Total the activity hours.\nFlag modules with fewer than two categories, and modules whose activities exceed 5 hours (2 hours in Module 1).\nFor each flag, suggest one specific change.\n\nReturn: {\"modules\": [{\"module\": int, \"activities\": [{\"title\": string, \"rsi\": int | null, \"reason\": string}], \"categories\": [int], \"hours\": number, \"flags\": [string]}]}\n```\n\nAI-risk instructions:\n\n```text\nFor each high-weight activity, judge how easily a student could complete it with a general AI\ntool and no course-specific thinking: high, medium or low. Give a one-sentence reason based on\nwhat the activity asks for. For high and medium, suggest one change that makes the student's own\nthinking visible, using their own context, process evidence, a live part or course-specific\nmaterial. Keep the activity's CLO and verb. Do not suggest AI detection tools.\n\nReturn: {\"assessments\": [{\"module\": int, \"activity\": string, \"risk\": \"high\" | \"medium\" | \"low\", \"why\": string, \"change\": string | null}]}\n```\n\nDemo flags (MGMT 615), from `demo/mgmt615-activities.json`: Module 1, \"about 4.5 hours of\nactivities in a 4-hour week; make the sort optional and shorten the case analysis\"; Module 5, \"Perusall counts for RSI\nonly with instructor replies; apply the Module 3 fix\"; Module 8, \"about 6 hours of activities;\nmove part of the Management Approach Summary earlier\"; AI risk high for the Module 3 script, the\nModule 7 change message and the Module 8 summary, with the changes in `aiCheck`.\n\n### Save\n\nPlanning document: Learning Activities Plan Part 1 (Canvas) and Part 2 (third-party tools) rows\nin Tables 1 and 2, one line per activity, for example \"Assignment: Feedback Conversation Script\n(CLO 2, high, RSI 2; annotated and rehearsed in cohort session)\".\nProject file: `modules[].activities` (with `rsi`, `hours`, `aiRisk`, `aiPolicy`, `aiChange`),\n`modules[].toolActivities`; in refresh, `.original` and `.changeNote`.\n\n### Go deeper (optional)\n\n- `src:reading-m4-crafting-part-1`, `src:reading-m4-crafting-part-2`\n- `src:guide-learning-activities`, `src:guide-rubrics`, `src:guide-third-party-tools`\n- `src:ext-tamu-ai-guidelines`, `src:ext-terry-2023`\n- `src:assignment-m4-course-tutor` and `src:ext-bowen-watson-2025-ch15`: build an AI tutor for\n  your students, or a grading assistant for yourself, in Google Gemini, outside this tool.\n\n---\n\n## 4.2 A week in your student's shoes\n\nTime: about 20 minutes, a few minutes a module\nPattern: a week in your student's shoes\n\n### Learn\n\nA plan can pass every check and still feel wrong to a student. In this step the AI walks through\neach module's week as one of your students would live it: what they open on Monday, what they\nread, do and submit, when they hear from you, and how long it takes. You react to what feels\nheavy, thin or silent, and fix it in step 4.1 if you want to.\n\nReadings and media aren't planned yet, so the walk-through uses placeholders for them. You'll\nsee the full week again in Modules 5 and 6.\n\n### See it\n\nMGMT 615, Module 3, as a student: \"Monday, an announcement picks up Dana's story: Greg wants a\nformal warning for Jordan. I spend about an hour and a half annotating the feedback chapter in\nPerusall; on Thursday the instructor replies to my thread with a question about Jordan. Wednesday\nnight I do the 30-minute coaching-or-discipline sort. Saturday I draft the feedback script and\nannotate why each line is there, about three hours. In Tuesday's cohort session I rehearse it\nwith a partner. I hear from the instructor three times this week.\" The instructor's reaction:\n\"Saturday is the whole assignment. Move the script due date to Sunday and open it Wednesday.\"\n\n### Draft (full build) and Review (refresh)\n\nAI instructions:\n\n```text\nWalk through the given module's week as one of the course's students, in first person and in\ntime order, using the learner profile, the saved activities, the interaction statement, the\nscenario and a 90-minute cohort session. Use [reading] and [video] placeholders where materials\naren't planned yet. Give rough hours for each part and a total. Then list, in one line each:\nthe heaviest point in the week, any stretch of three or more days with no contact from the\ninstructor, and anything a student might not understand the purpose of. Under 200 words.\n\nReturn: {\"walkthrough\": string, \"hours\": number, \"heaviest\": string, \"silent\": string | null, \"unclear\": string | null}\n```\n\nDemo response (MGMT 615, Module 3): the walk-through under See it, with hours 5.5, heaviest\n\"Saturday: the whole script in one sitting\", silent null, unclear null.\n\n### Decide\n\nFor each module the faculty member selects Looks right, or writes a short note and optionally\nreturns to step 4.1 to change the module's activities.\n\nChecklist:\n\n- No week has one day carrying most of the work.\n- Students hear from you at least twice a week.\n\n### Checks\n\nNone beyond step 4.1's, which run again on any activity changes.\n\n### Save\n\nPlanning document: nothing new.\nProject file: `modules[].weekWalk` (walk-through, hours, reaction).\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Activities for all eight modules: three main assignments moved onto the storyline\", \"Module 5 Perusall: instructor replies added\", \"Module 8: summary draft moved to Module 7\", \"AI changes for three high-risk assessments\"],\n  \"keptFlags\": [],\n  \"questions\": [\"Is about 4 to 5 hours of activities a module the right target for this program?\", \"Should students be allowed to draft with AI on the change message if they critique the draft?\"]\n}\n```\n\nProject file: `checkins.prep.m4`.\n"}, {"id": "m5", "file": "05-materials.md", "raw": "# Module 5. Learning Materials and Responsible Use\n\nModule id: `m5`\nSteps: 2\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: the learning materials for each module, with rights status, attribution and\nAI-use notes.\n\nRefresh checks for this module: dated sources, missing attribution, unclear rights.\n\nSources: `src:reading-m5-materials-plan`, `src:assignment-m5-materials-rights-review`,\n`src:assignment-m5-writing-attributions`, `src:guide-copyright`, `src:guide-curating-creating`,\n`src:guide-instructor-authored-reading`, `src:guide-accessibility`,\n`src:example-mgmt615-course-map`\n\nDemo data: `demo/mgmt615-materials.json`\n\n## Refresh reflection\n\nShown once, in the refresh track only, before step 5.1. It asks only about materials the course\nalready has.\n\n1. Which readings or videos did students skip, struggle with, or tell you were out of date?\n2. Which materials do students still bring up later in the course?\n3. Is there anything you've been meaning to replace?\n4. Which materials would you keep exactly as they are?\n\nAI instructions: same as the Module 1 reflection instruction.\n\nDemo answers (MGMT 615): (1) \"The SBI job aid confuses people; it's a photocopy of a diagram.\"\n(2) \"The Marsh chapters.\" (3) \"Nothing specific.\" (4) \"Both Marsh chapters and the Park and Marsh\narticle.\"\n\nProject file: `reflection.m5`.\n\n---\n\n## 5.1 Materials for every module\n\nTime: about 40 minutes, about 5 minutes a module\nPattern: pick and combine, one module at a time (full build); edit in place (refresh)\n\n### Learn\n\nLearning materials are everything that isn't an activity: what students read, watch or work with\nto get ready for the module's decision. Every item should earn its place by preparing students\nfor a specific activity.\n\nChoose from least to most effort to produce:\n\n| Type | Effort | Use when |\n|---|---|---|\n| Curated reading (article, chapter, report, case) | Lowest | A good source exists. This is the default. |\n| Curated video | Low | An existing video covers it well. |\n| Instructor-authored reading (4 to 10 pages) | Several hours each | Nothing curated fits, or your own experience is the point. |\n| Interactive reading (built by your ID) | High | Complex content that benefits from short sections and checks. |\n| Instructor-recorded video | Highest | Planned in Module 6, up to 30 minutes a module. |\n\n**Your scenario is a material too.** The narrative, and any exhibits the character works from (an\nemail from a boss, a dashboard, a complaint), are created content. List them.\n\n**Finding sources with AI.** Perplexity is licensed through the university and cites its sources,\nwhich makes its suggestions easy to check. Describe the CLO, topic, your students and the kind\nof source you want. Check every suggestion before you list it: authored by someone credible,\ncurrent, stable, and tied to an objective. Start with TAMU Libraries, and link to the library\nrecord instead of uploading a PDF.\n\n**Load.** Aim for roughly 20 pages of required reading a module, adjusted for density. With 4 to\n5 hours of activities and a 90-minute cohort session, that keeps the week near 10 hours. Module 1\ntargets about 4 hours in all, so keep its reading to a few pages.\n\n### See it\n\nMGMT 615 Module 4, after the refresh: an 11-page article on what predicts team performance, the\nTeam That Couldn't Ship case as a contrast, and a 4-page interactive reading, \"Diagnose the Team,\nNot the Person.\" A supplemental article on designing team assignments was removed because it was\nabout course design. About 21 pages.\n\n### Draft (full build)\n\nThe AI can't verify that a specific source exists, so it never names one. It suggests what each\nmodule needs and how to find it; the faculty member enters the actual sources.\n\nAI instructions:\n\n```text\nFor the given module, using its CLOs, topics, scenario and activities, propose two versions of a\nmaterials list. Each item gives: type (curated reading, curated video, instructor-authored\nreading, interactive reading, scenario exhibit), what it must cover, the activity it prepares\nstudents for, and an estimated page count or minutes. Prefer curated types. Always include the\nscenario narrative and any exhibits the character works from. Never name a specific article,\nbook, author or video. For each curated item, write one search prompt the faculty member can\npaste into Perplexity or the TAMU Libraries search.\n\nReturn: {\"versions\": [{\"items\": [{\"type\": string, \"covers\": string, \"supports\": string, \"pages\": number | null, \"minutes\": number | null, \"searchPrompt\": string | null}]}]}\n```\n\nDemo response (MGMT 615, Module 8, if run as a full build): a curated research article on\nstructured interviews against unstructured ones (about 10 pages; search prompt \"peer-reviewed\nmeta-analysis structured versus unstructured interviews predictive validity, written for\npracticing managers\"), two candidate files as scenario exhibits, and an interactive reading on\nweighing proven experience against potential.\n\n### Review (refresh)\n\nEdit in place. The app lists each module's current materials from the upload. The faculty member\nadds anything missing.\n\nAI instructions:\n\n```text\nFor each current material in the given module, check: it prepares students for a named activity;\nit is content for students; its date (flag anything older than 5 years unless it is a classic in\nthe field, and say so); the scenario narrative and exhibits are listed. Suggest keep, replace\n(say what a replacement should cover, never a specific source), or remove, with a reason. Add\nmissing scenario exhibits.\n\nReturn: {\"items\": [{\"original\": string, \"action\": \"keep\" | \"replace\" | \"remove\", \"issues\": [string], \"replacementCovers\": string | null}], \"add\": [string]}\n```\n\nDemo response (MGMT 615): `review` notes in `demo/mgmt615-materials.json`. Main findings: the\nModule 4 course-design article removed; scenario exhibits added in four modules; the 2019 book\nchapters flagged as dated and kept after the instructor confirmed no newer edition.\n\n### Decide\n\nFor each item the faculty member enters or confirms the source (title, author, year, link).\n\nChecklist:\n\n- Every item prepares students for a named activity.\n- The scenario and its exhibits are listed.\n- You've checked each curated source yourself.\n\n### Checks\n\nOn save of each module: every item tied to an activity; required pages and minutes total (flag\nover about 25 pages, or about 8 in Module 1, adjusted for type); items older than 5 years flagged; scenario listed. After\nsaving, the week-in-your-student's-shoes walk-through for the module refreshes with the real\nreading load.\n\n### Save\n\nPlanning document: Learning Materials Plan row in Tables 1 and 2, one line per item, for example\n\"Article: Park & Marsh (2024), What actually predicts team performance (11 pp.)\".\nProject file: `modules[].materials`; in refresh, `.original`, `.changeNote`.\n\n### Go deeper (optional)\n\n- `src:guide-curating-creating`\n- `src:guide-instructor-authored-reading`\n- `src:guide-accessibility`\n\n---\n\n## 5.2 Rights, attribution and AI notes\n\nTime: about 25 minutes\nPattern: spot the problem, then edit in place\n\n### Learn\n\nEverything you use is protected by copyright unless it says otherwise, and the lack of a notice\ndoesn't make it free. For each material, you need one of four things: a library link, an open\nlicense, a public page or video you link to (never download and re-upload), or permission. When\nyou're unsure, link instead of uploading.\n\n**Fair use** can cover limited educational use, but it's a judgment on four factors: purpose,\nthe nature of the work, how much you use, and the effect on the market. It's never blanket\npermission, and paywalled content can't be uploaded for students.\n\n**Attribution** credits the creator: name, title, source and license. Use it even when the\nlicense doesn't require it.\n\n**AI-assisted content.** If you used AI to draft a scenario, an exhibit, an image or part of a\nreading, tell students. Check it for accuracy and for anything that closely reproduces someone\nelse's work, and ask your ID before treating it as your own original work. The U.S.\nCopyright Office has said that purely AI-generated material isn't protected by copyright.\n\n**Spot the problem.** The app shows one item and asks what's wrong with it:\n\n> \"Image: diagram of the SBI feedback model, found through a web image search. Used on slide 3\n> and in the job aid.\"\n\nExpected points: no creator or license, so the rights are unclear; it's reused in two places.\nFix: find a licensed version, or redraw it as your own content and attribute the model.\n\n### See it\n\nMGMT 615's SBI job aid was a photocopied diagram with no attribution, and the instructor's\nreflection said students found it confusing. The instructor redrew it as a one-page created job\naid, with the line \"Based on the Situation-Behavior-Impact model (Center for Creative\nLeadership).\" Two AI-drafted items, the Module 2 bonus sheet and the Module 6 AI job aid, got a\ndisclosure note: \"Drafted with AI assistance and reviewed by the instructor.\"\n\n### Draft (full build) and Review (refresh)\n\nSame for both tracks. The app shows every material in one table with its rights status. The\nfaculty member answers, for each item, where it came from and whether AI helped make it. The AI\nproposes the rights status, an attribution line and any AI-disclosure note.\n\nAI instructions:\n\n```text\nFor each material, from the faculty member's answers (source, link, license if known, whether AI\nhelped create it), set rights to one of: library, open (name the license), public (linked, not\nuploaded), created, ai-assisted, unclear. Write an attribution line with creator, title, source\nand license where known; do not invent missing details, use [check] instead. For ai-assisted\nitems, write a one-sentence disclosure note. For unclear items, suggest the safest fix: link\ninstead of upload, find a licensed alternative, or recreate it.\n\nReturn: {\"items\": [{\"title\": string, \"rights\": string, \"attribution\": string, \"aiNote\": string | null, \"fix\": string | null}]}\n```\n\nDemo response (MGMT 615): the `rights` values in `demo/mgmt615-materials.json`, with fixes for the\ntwo unclear items (Maria's case marked created after the instructor confirmed writing it; the SBI\njob aid redrawn) and disclosure notes on the two AI-assisted items.\n\n### Decide\n\nChecklist:\n\n- Every item has a rights status other than unclear, or a fix you'll make.\n- Nothing paywalled is uploaded.\n- Every AI-assisted item has a disclosure note.\n\n### Checks\n\nOn save: no item left unclear without a fix; every item has an attribution or is the faculty\nmember's own created work; every ai-assisted item has a note; any \"upload\" of a library or\npaywalled item is flagged.\n\n### Save\n\nPlanning document: each material line in the Learning Materials Plan row gains its rights status\nand, for AI-assisted items, \"(AI-assisted, disclosed)\". Full attribution lines go to the project\nfile and the check-in summary.\nProject file: `modules[].materials[].rights`, `.attribution`, `.aiNote`.\n\n### Go deeper (optional)\n\n- `src:guide-copyright`\n- `src:assignment-m5-writing-attributions`\n- `src:ext-copyright-office-ai`\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Materials for all eight modules, about 17 to 24 pages each\", \"Scenario exhibits added in four modules\", \"SBI job aid redrawn and attributed\", \"AI disclosure on two items\"],\n  \"keptFlags\": [\"Whitfield (2019) chapters kept: no newer edition\"],\n  \"questions\": [\"Can the Learning Media team redraw the SBI job aid, or should I?\", \"Do the created cases from earlier terms need any review before reuse?\"]\n}\n```\n\nProject file: `checkins.prep.m5`.\n"}, {"id": "m6", "file": "06-media.md", "raw": "# Module 6. Audiovisual Aspects of Storytelling\n\nModule id: `m6`\nSteps: 2\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: the media plan for each module, with each item's connection to the storyline,\nand a first script ready for the XR stage.\n\nRefresh checks for this module: dated media; required welcome, overview and closing videos\npresent.\n\nSources: `src:reading-m6-planning-media`, `src:assignment-m6-media-planning`,\n`src:template-av-script`, `src:guide-script-writing`, `src:guide-planning-media`,\n`src:example-mgmt615-course-map`\n\nDemo data: `demo/mgmt615-media.json`\n\n## Refresh reflection\n\nShown once, in the refresh track only, before step 6.1. It asks only about the course's existing\nvideos and graphics.\n\n1. Which videos do students mention, and which do they seem to skip?\n2. Which videos are out of date: wrong numbers, old examples, a different version of you?\n3. Which visuals do students need that the course doesn't have yet?\n4. Which videos would you keep exactly as they are?\n\nAI instructions: same as the Module 1 reflection instruction.\n\nDemo answers (MGMT 615): (1) \"They mention the role-plays. Nobody mentions the discussion\nprimers.\" (2) \"None, really.\" (3) \"A picture of the shift handoff.\" (4) \"The role-plays and the feedback video.\"\n\nProject file: `reflection.m6`.\n\n---\n\n## 6.1 Media for every module\n\nTime: about 40 minutes, about 5 minutes a module\nPattern: pick and combine, one module at a time (full build); edit in place (refresh)\n\n### Learn\n\nYour media plan lists what will be produced for your course: video, audio and graphics. Curated\nvideos from other sources belong in your materials plan.\n\n**Required in every course:** a welcome video, a short overview video for each module, and a\nclosing video. These are how students see and hear you each week, which is part of your presence\nand supports RSI.\n\n**Optional:** teaching videos (lecture, worked example, demonstration), scenario videos that\npresent a moment from your storyline, audio, and graphics such as an infographic of the data\nyour character works from.\n\n**Limits.** Recorded video totals no more than 30 minutes a module. Engagement drops sharply\nafter about six minutes (Guo, Kim, & Rubin, 2014), so split anything longer into short pieces,\none idea each. Every item should add something a reading can't: a process to watch, a voice and\nface, a moment of tension.\n\n**Media for your story.** Go through your scenarios and decide which need production. A scenario\nvideo opens in the character's situation and ends at the decision, before the answer, so the\nactivity that follows has something to work on. Many scenarios work fine as readings or\ndiscussion cases with no production at all.\n\n**The XR stage.** Instructor videos, including the required welcome and overview videos, are\nrecorded on the XR stage, which places you in a produced setting without filming on location.\nFor each video you fill out the A/V script template (step 6.2), and you schedule a practice\nsession on the stage with the Learning Media team before recording.\n\n### See it\n\nMGMT 615 Module 4: a 2-minute overview (\"the handoff nobody owns\"), a 6-minute teaching video\ndiagnosing the two-shift handoff, an infographic of the 4:45 p.m. handoff, and a 3-minute\nscenario video setting Greg's team-building lunch against a handoff owner. 11 minutes.\n\n### Draft (full build)\n\nAI instructions:\n\n```text\nFor the given module, using its scenario, activities and materials, propose two versions of its\nmedia list. Always include a module overview video of about 2 minutes; include the welcome video\nin Module 1 and the closing video in the last module. For each item give: kind (welcome,\noverview, teaching, scenario, closing, graphic, audio), a working title, minutes, where it is\nmade (xr-stage for instructor videos, media-team for produced scenarios and graphics,\nfaculty-self for screen recordings), one sentence on what it adds that a reading can't, and its\nconnection to the storyline. Keep video at or under 30 minutes for the module and each video at\nor under 6 minutes unless it is split into parts.\n\nReturn: {\"versions\": [{\"items\": [{\"kind\": string, \"title\": string, \"minutes\": number, \"where\": string, \"adds\": string, \"story\": string}]}]}\n```\n\nDemo response (MGMT 615, if run as a full build): each module's `media` from\n`demo/mgmt615-media.json`.\n\n### Review (refresh)\n\nEdit in place. The app lists each module's current produced media from the upload.\n\nAI instructions:\n\n```text\nFor each current media item in the given module, check: it adds something a reading can't; it\ndoesn't repeat other content; length (flag over 6 minutes unless split); it connects to the\nstoryline or could with a small change (say what). Flag the module if it has no overview video,\nif Module 1 has no welcome video, or if the last module has no closing video. Suggest keep,\nrevise (say how) or replace. Use the faculty member's reflection on dated videos.\n\nReturn: {\"items\": [{\"original\": string, \"action\": \"keep\" | \"revise\" | \"replace\", \"issues\": [string], \"suggestion\": string | null}], \"missingRequired\": [string]}\n```\n\nDemo response (MGMT 615): `review` notes in `demo/mgmt615-media.json`. Main findings: no module\noverview videos (added, all recorded in one XR session); the discussion primers didn't connect to\nthe story and, per the reflection, nobody mentioned them (replaced by scenario videos); one\nteaching video at 8 minutes (kept at 7, in two parts).\n\n### Decide\n\nChecklist (for each module):\n\n- The overview video is there.\n- Each item adds something a reading can't.\n- You know which items you'll record on the XR stage.\n\n### Checks\n\nOn save of each module: required videos present (welcome in Module 1, overview in every module,\nclosing in the last); total video at or under 30 minutes; each video at or under 6 minutes or\nsplit; every item has a storyline connection or a note. The week-in-your-student's-shoes\nwalk-through refreshes with video time.\n\n### Save\n\nPlanning document: Learning Media Plan row in Tables 1 and 2, one line per item, for example\n\"Video (XR stage): Module 4 overview, 2 min. Story: the handoff nobody owns.\"\nProject file: `modules[].media`; in refresh, `.original`, `.changeNote`.\n\n\n### Go deeper (optional)\n\n- `src:guide-planning-media`\n- `src:jobaid-media-selection-matrix`\n- `src:ext-guo-2014`\n\n---\n\n## 6.2 Your first script and the XR stage\n\nTime: about 25 minutes\nPattern: interview, then draft\n\n### Learn\n\nEvery instructor video starts with an A/V script: two columns, what you'll say (Dialogue) and\nwhat appears on screen (Graphics). The template has four parts: a branded opening, an\nintroduction where you greet students and frame the topic, the content in short chunks, and a\nconclusion with a clear next step, then a branded close. The script is what you share with the\nLearning Media team before your practice session on the XR stage.\n\nWrite for the ear. Use contractions and full sentences, and read it aloud as you write; if a\nsentence is awkward spoken, rewrite it. Say anything a student needs to know, so nothing depends\nonly on what's on screen. A 2-minute overview is about 250 to 300 spoken words.\n\nIn this step you draft one script, usually your welcome video or your Module 1 overview. Your ID\nand the Learning Media team will help with the rest during development.\n\n**Getting ready for the stage.** Send the finished script to your ID, who passes it to Learning\nMedia. Schedule a practice session on the XR stage with the Learning Media team. Record your\nrequired videos in as few sessions as you can; MGMT 615 recorded all eight module overviews in\none.\n\n### See it\n\nMGMT 615's Module 1 overview, first lines:\n\n| Dialogue | Graphics |\n|---|---|\n| Howdy. This week you meet Dana Ortiz. Eight months ago she was the best shift lead in her distribution center. Now she runs it, and on Monday morning the report says on-time shipping has dropped from 97 to 89 percent. | Dana's Monday report, with 89% highlighted |\n| Her director already has an answer. Before you agree with him, this module asks you a different question: what is a manager's job, and how is it different from the job Dana just left? | Greg's email: \"Jordan's shift is the problem.\" |\n\n### Draft (full build) and Review (refresh)\n\nThe AI asks which video to script (welcome, a module overview, or a scenario video from the media\nplan) and two questions: \"What should students feel or understand by the end?\" and \"Is there a\nphrase or story you always use when you introduce this?\" Then it drafts.\n\nAI instructions:\n\n```text\nDraft an A/V script for the chosen video in two columns, Dialogue and Graphics, with sections:\nopening (branded intro, no dialogue), introduction, content in chunks of 2 to 4 sentences,\nconclusion with one next step, closing (branded outro). Write conversational spoken English with\ncontractions, in the faculty member's voice, using their answers. Keep to the planned minutes at\nabout 140 spoken words a minute. For an overview or scenario video, open in the character's\nsituation and end at the decision without resolving it. Put everything a student needs in the\ndialogue; graphics only reinforce it.\n\nReturn: {\"title\": string, \"minutes\": number, \"rows\": [{\"section\": string, \"dialogue\": string, \"graphics\": string}]}\n```\n\nRefresh track: if an existing script is uploaded, the same instructions check it for length,\nspoken style and the decision ending, and suggest edits in place.\n\nDemo response (MGMT 615): the Module 1 overview, 2 minutes, opening as under See it and closing\nwith \"Start with Dana's Monday report, then the reading on what managers actually do. Thursday's\nassignment asks what you'd do with her first week.\"\n\n### Decide\n\nThe faculty member reads the script aloud, edits it, and marks it ready for Learning Media.\n\nChecklist:\n\n- It sounds natural read aloud.\n- It fits the planned length.\n- Nothing important appears only on screen.\n- You've asked your ID to schedule an XR stage practice session.\n\n### Checks\n\nOn save: spoken length within 15 percent of the planned minutes; every graphic has matching\ndialogue.\n\n### Save\n\nPlanning document: nothing new; the media line for this video gains \"script drafted.\"\nDownload: the script as a Word file in the A/V script template format, to share with your ID and\nLearning Media. There's nothing to fill out or submit; it's there to show and share.\nProject file: `scripts[]` (video, rows, status).\n\n\n### Go deeper (optional)\n\n- `src:guide-script-writing`\n- `src:template-av-script`\n- `src:tool-scriptwise`: an AI tool for developing scripts. Any AI tool can also help: paste in\n  your draft and ask it to tighten the wording for the ear or cut it to length.\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Media plan for all eight modules, 9.5 to 14 minutes each\", \"Module overview videos added for every module\", \"Discussion primers replaced with scenario videos\", \"Module 1 overview script drafted\"],\n  \"keptFlags\": [\"Module 3 teaching video at 7 minutes, in two parts\"],\n  \"questions\": [\"Can all eight overviews be recorded in one XR stage session?\", \"Which scenario videos can Learning Media produce this term?\"]\n}\n```\n\nProject file: `checkins.prep.m6`.\n"}, {"id": "m7", "file": "07-cohort-sessions.md", "raw": "# Module 7. Cohort Session Planning\n\nModule id: `m7`\nSteps: 2\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: a cohort session for each module, planned as a decision point, and the first\nsession ready to broadcast from the XR stage.\n\nRefresh checks for this module: each cohort session passes the recording test.\n\nSources: `src:reading-m7-going-live`, `src:reading-m7-active-learning-tools`,\n`src:assignment-m7-cohort-planning`, `src:assignment-m7-cohort-materials`,\n`src:guide-cohort-sessions`, `src:template-run-of-show`, `src:example-mgmt615-course-map`\n\nDemo data: `demo/mgmt615-cohort.json`\n\n## Refresh reflection\n\nShown once, in the refresh track only, before step 7.1. It asks only about sessions the course\nhas already run.\n\n1. Which sessions drew the most students, and which the fewest?\n2. When did the room go quiet, and when was it hard to stop the conversation?\n3. What do students say about the sessions?\n4. Which sessions would you keep exactly as they are?\n\nAI instructions: same as the Module 1 reflection instruction.\n\nDemo answers (MGMT 615): (1) \"The role-plays and the mock interview. The roundtables in Modules 2\nand 4 were thin.\" (2) \"Quiet when I asked open questions to the whole room.\" (3) \"They like the\nbreakouts.\" (4) \"The mock interview panel.\"\n\nProject file: `reflection.m7`.\n\n---\n\n## 7.1 Cohort sessions for every module\n\nTime: about 40 minutes, about 5 minutes a module\nPattern: pick and combine, one module at a time (full build); edit in place (refresh)\n\n### Learn\n\nEvery Flex Online course has a 90-minute live session on Zoom each week. Attendance is optional\nand every session is recorded, so students decide each week whether to come or watch later.\nStudents don't skip because sessions are recorded; they skip sessions that offer nothing the\nrecording doesn't (Morris et al., 2019).\n\n**The recording test.** Ask: if a student watched only the recording, what would they have\nmissed? If the answer is nothing, they'll watch it later. A session passes when at least one\npart depends on who's in the room. Students get five things live that a recording can't give\nthem:\n\n| What students get live | What it looks like |\n|---|---|\n| Feedback on their own work | Students bring a draft of the next assignment and get responses |\n| Applying the concept to their own job | Students map the week's framework onto a problem at work |\n| Practice with peers | Students rehearse a conversation, pitch or negotiation in breakouts |\n| Your judgment on a messy case | You work through a case with no clean answer and explain your reasoning |\n| A preview of the next assessment | Students work a problem shaped like the next assignment with you there |\n\nReviewing the reading or lecturing on new material belongs in the asynchronous content.\n\n**Your story as a live decision.** Let the week's materials carry the scenario up to the\ndecision, then stop. The session is where students make the call: vote on the character's\noptions and argue the split, role-play the hard conversation in threes (one observer gives\nhesitant students a way in), or give each group a different piece of evidence so the picture\nonly comes together in the debrief.\n\n**Quiet rooms.** Over a third of distance learners feel stressed when asked to participate live\n(Donelan et al., 2025). Start with a poll or the chat, then small groups, then the whole room.\n\n**RSI.** A session built this way is facilitated discussion (category 4) every week, often with\nfeedback (2) or direct instruction (1) as well.\n\n**Your Instructional Technologist** runs Zoom, polls, breakouts, captions and timers, if they know\nthe plan. Note poll wording, breakout sizes and timing, and anything to drop in the chat.\n\n### See it\n\nMGMT 615 Module 5, \"Telling Greg He's Wrong\": students voted on Poll Everywhere during the week on\nhow Dana should answer her director. The session opens with the split, runs 45 minutes of\nrole-play in threes (Dana, Greg, observer), then two volunteers replay their conversation for the\nclass and get the instructor's feedback.\n\n### Draft (full build)\n\nAI instructions:\n\n```text\nFor the given module, using its scenario, activities and the learner profile, propose two\nversions of a 90-minute cohort session. Each gives: a title; the decision it centers on; which\nof the five live benefits it offers (feedback on own work, own job, practice with peers,\ninstructor judgment, assessment preview); 3 to 5 timed segments that start low-stakes (poll or\nchat) before small groups; the RSI categories it shows; and setup needs for the Instructional\nTechnologist (poll wording, breakout sizes and timing, chat links). It must pass the recording\ntest: name the moment that depends on who is in the room.\n\nReturn: {\"versions\": [{\"title\": string, \"decision\": string, \"live\": string, \"segments\": [string], \"rsi\": [int], \"setup\": [string], \"liveMoment\": string}]}\n```\n\nDemo response (MGMT 615, if run as a full build): each module from `demo/mgmt615-cohort.json`.\n\n### Review (refresh)\n\nEdit in place. The app lists each module's current session from the upload.\n\nAI instructions:\n\n```text\nFor each current cohort session, apply the recording test: name what a student who watched only\nthe recording would miss, or say \"nothing.\" Check it connects to the module's scenario or\nactivities, starts low-stakes, and gives the Instructional Technologist enough to set up. Use\nthe faculty member's reflection on attendance and quiet moments. Suggest keep or revise; for a\nrevision, keep the session's purpose and add one live moment.\n\nReturn: {\"sessions\": [{\"module\": int, \"original\": string, \"missed\": string, \"action\": \"keep\" | \"revise\", \"issues\": [string], \"revision\": {...same shape as full build...} | null}]}\n```\n\nDemo response (MGMT 615): `review` notes in `demo/mgmt615-cohort.json`. The Module 2 and 4\nroundtables failed the recording test, matching the reflection that they were thin; both got a\nlive moment. Module 1 had no session, and one was added.\n\n### Decide\n\nChecklist (for each module):\n\n- You can name what a student watching the recording would miss.\n- The session starts with something low-stakes.\n- Setup needs are clear enough for your Instructional Technologist.\n\n### Checks\n\nOn save of each module: passes the recording test; ties to the module's scenario or activities;\nstarts with a poll, chat or small group; shows at least one RSI category; segments total about 90\nminutes. The week-in-your-student's-shoes walk-through refreshes with the session.\n\n### Save\n\nPlanning document: Learning Activities Plan Part 3 (Cohort Session Activities) row in Tables 1\nand 2, for example \"Telling Greg He's Wrong: role-play in threes after a week-long poll.\"\nProject file: `modules[].cohort`; in refresh, `.original`, `.changeNote`.\n\n### Go deeper (optional)\n\n- `src:reading-m7-going-live`: the research behind the recording test, and eight ways to use\n  your story live.\n- `src:reading-m7-active-learning-tools`\n- `src:guide-cohort-sessions`\n\n---\n\n## 7.2 Ready for the stage\n\nTime: about 25 minutes\nPattern: interview, then draft\n\n### Learn\n\nCohort sessions are broadcast live on Zoom from the XR stage. For each session you fill out a\npreparation template, the run of show, that tells Learning Delivery and your Instructional\nTechnologist what happens minute by minute: segments, slides, polls, breakouts and anything that\ngoes in the chat. You'll have 30 minutes of setup before each session.\n\nBefore your first session, schedule a practice session on the stage with Learning Delivery. It's\nthe time to try the polls and breakouts, find where to look, and get comfortable with the\nsetting.\n\nIn this step you draft the run of show for your first session. During development you'll do the\nrest with your ID, along with slides and a student-facing outline. Keep slides accessible:\nreadable contrast, real text instead of text in images, and nothing important only on a slide.\n\n### See it\n\nMGMT 615's Module 1 run of show, first rows:\n\n| Time | Segment | What happens | Setup |\n|---|---|---|---|\n| 0:00 | Welcome | Instructor greets the class, two-minute recap of Dana's Monday | Slide 1 |\n| 0:05 | Introductions | Breakouts of four: name, role, one thing you fix yourself that you shouldn't | Breakouts, 10 min |\n| 0:15 | The decision | Poll: what should Dana do this week? | Poll, three options |\n\n### Draft (full build) and Review (refresh)\n\nThe AI asks which session to prepare (usually Module 1 or the first one taught) and two\nquestions: \"Is there a point where you'll need help from your Instructional Technologist that\nisn't obvious?\" and \"How do you want to end?\"\n\nAI instructions:\n\n```text\nTurn the saved cohort session for the chosen module into a run of show: rows with start time,\nsegment, what happens (what the instructor says or asks and what students do) and setup needs\n(slides, poll with exact wording and options, breakout size and duration, chat links, timers).\nTotal 90 minutes. Include a two-minute buffer before the close. Use the faculty member's answers.\n\nReturn: {\"module\": int, \"rows\": [{\"time\": string, \"segment\": string, \"happens\": string, \"setup\": string}]}\n```\n\nRefresh track: an existing run of show or lesson plan can be uploaded and checked against the\nsame instructions.\n\nDemo response (MGMT 615): the Module 1 run of show, opening as under See it.\n\n### Decide\n\nChecklist:\n\n- The minutes add up to 90.\n- Every poll has its exact wording and options.\n- You've asked to schedule a practice session on the XR stage with Learning Delivery.\n\n### Checks\n\nOn save: total time is 90 minutes; every poll and breakout has its setup details.\n\n### Save\n\nPlanning document: nothing new; the session's line gains \"run of show drafted.\"\nDownload: the run of show as a Word file, to share with Learning Delivery and your Instructional\nTechnologist. There's nothing to fill out or submit; it's there to show and share.\nProject file: `runOfShow[]`.\n\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Cohort sessions for all eight modules\", \"Module 1 session added\", \"Module 2 and 4 roundtables given a live moment\", \"Module 1 run of show drafted\"],\n  \"keptFlags\": [],\n  \"questions\": [\"When can I practice on the XR stage before the first session?\", \"Can the Instructional Technologist show the week's Poll Everywhere results at the start of Module 5?\"]\n}\n```\n\nProject file: `checkins.prep.m7`.\n"}, {"id": "m8", "file": "08-readiness-and-teaching.md", "raw": "# Module 8. Development Readiness and Sustainable Teaching\n\nModule id: `m8`\nSteps: 2\nID check-in: live review of the finished plan; the ID then schedules the kick-off meeting\n\nFaculty complete: a final check of the whole planning document, and the communication and\nfeedback plan.\n\nRefresh checks for this module: the planning document is complete and aligned; announcement and\nfeedback routines are in place.\n\nSources: `src:reading-m8-preparing-for-development`, `src:assignment-m8-course-planning-document`,\n`src:guide-online-teaching-practices`, `src:guide-grading-weight`, `src:guide-large-enrollment`,\n`src:guide-rsi`, `src:example-mgmt615-course-map`\n\n## Refresh reflection\n\nShown once, in the refresh track only, before step 8.1. It asks only about how the course was\ntaught last time.\n\n1. How did students hear from you each week, and did it hold up in the busiest weeks?\n2. Where did grading and feedback take the most time?\n3. What did students say about feedback?\n4. Which routines would you keep exactly as they are?\n\nAI instructions: same as the Module 1 reflection instruction.\n\nDemo answers (MGMT 615): (1) \"Monday announcements, but they slipped mid-term.\" (2) \"The\nManagement Approach Summary and the memos.\" (3) \"They wanted it faster.\" (4) \"Monday\nannouncements, when I kept them up.\"\n\nProject file: `reflection.m8`.\n\n---\n\n## 8.1 Check the whole plan\n\nTime: about 25 minutes\nPattern: edit in place\n\n### Learn\n\nYour planning document is what your ID builds from, and it's much easier to adjust the plan now\nthan to rebuild a module in development. This step runs every check across the whole document at\nonce and shows the results by module.\n\nFor each module you should be able to point to the story thread: the scenario and its decision,\nthe activity where students work through it, the materials that prepare them, the media it needs,\nand how the cohort session builds on it. If a piece is missing or doesn't connect, fix it now.\n\nThen look at the whole week. With activities, materials, media and the cohort session all\nplanned, the week-in-your-student's-shoes walk-through can now show the full week: about 4 hours in\nModule 1 and about 10 in the rest.\n\n### See it\n\nMGMT 615's final check found three things. Module 1 came to about 8 hours against a 4-hour\ntarget; the instructor made the sort optional and moved the book chapter to Module 2. The Module 6 thread had no media tied to the scenario;\nthe instructor noted that the AI teaching video carries the story through the scheduling tool.\nAnd Module 8 still ran heavy at about 11 hours; the instructor cut one reading to supplemental.\n\n### Draft (full build) and Review (refresh)\n\nSame for both tracks. No drafting; the AI runs the checks.\n\nAI instructions:\n\n```text\nCheck the whole planning document. For each module, confirm the story thread: scenario and\ndecision; an activity at the decision; materials that prepare students for it; media tied to the\nscenario or a note; a cohort session that builds on it. Total the week's hours (activities,\nreading at about 6 pages an hour for dense reading, video minutes, 90-minute cohort session) and\nflag Module 1 if it is far from about 4 hours, and any other week under 8 or over 11 hours. List every section that is empty or still a placeholder,\nand every earlier flag kept without a note. Then list the three most important fixes across the\ncourse, most important first.\n\nReturn: {\"modules\": [{\"module\": int, \"thread\": {\"scenario\": boolean, \"activity\": boolean, \"materials\": boolean, \"media\": boolean, \"cohort\": boolean}, \"hours\": number, \"flags\": [string]}], \"missingSections\": [string], \"unnotedFlags\": [string], \"topFixes\": [string]}\n```\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"modules\": [\n    {\"module\": 1, \"thread\": {\"scenario\": true, \"activity\": true, \"materials\": true, \"media\": true, \"cohort\": true}, \"hours\": 8, \"flags\": [\"About 8 hours against a 4-hour target for the first week.\"]},\n    {\"module\": 6, \"thread\": {\"scenario\": true, \"activity\": true, \"materials\": true, \"media\": false, \"cohort\": true}, \"hours\": 9.5, \"flags\": [\"No media tied to the scenario 'Twelve Things on Dana's List'.\"]},\n    {\"module\": 8, \"thread\": {\"scenario\": true, \"activity\": true, \"materials\": true, \"media\": true, \"cohort\": true}, \"hours\": 11, \"flags\": [\"About 11 hours, the heaviest week.\"]}\n  ],\n  \"missingSections\": [],\n  \"unnotedFlags\": [],\n  \"topFixes\": [\"Lighten Module 1 to about 4 hours: make the sort optional and move the book chapter to Module 2.\", \"Lighten Module 8: move one reading to supplemental.\", \"Tie a Module 6 media item to Dana's list, or note why none is needed.\"]\n}\n```\n\nModules not listed passed every check.\n\n### Decide\n\nFor each flag, Fix (opens the section) or Keep with a note.\n\nChecklist:\n\n- Every module's story thread is complete, or the gap has a note.\n- Module 1 is about 4 hours, and every other week about 10.\n- No section is empty.\n\n### Checks\n\nThis step is the check. Save final version becomes available when no flag is left without a fix\nor note.\n\n### Save\n\nPlanning document: no new section. The change log (refresh) and check-in summary are complete.\nProject file: `alignment.final`.\n\n### Go deeper (optional)\n\n- `src:guide-grading-weight`\n- `src:guide-large-enrollment`\n\n---\n\n## 8.2 Communication and feedback plan\n\nTime: about 30 minutes\nPattern: interview, then draft (full build) or edit in place (refresh)\n\n### Learn\n\nIn a Flex Online course the content does the presenting; your weekly job is to guide, respond\nand give feedback. That's also how you meet RSI week after week. Plan it now, so it holds up in\nweek ten.\n\n**Announcements.** Plan a sequence for each module:\n\n- **Opening:** welcome to the module, where the story stands, the first thing to do.\n- **Midpoint:** what you're seeing in student work, and the concept people are missing.\n- **Before the cohort session:** what to prepare or bring.\n- **Closing:** what the module added up to and the next decision.\n\nThe opening and closing can be drafted ahead. The midpoint can't, because it responds to what\nstudents actually did; that's what makes it count as RSI. AI can draft any of them quickly. Edit\neach one so it sounds like you and reflects what's happening in your course.\n\n**Feedback.** Students want to know what they did well, what fell short and what to change, along\nwith the grade. SpeedGrader's comment library, markup, clickable rubrics and short audio or video\ncomments all save time without thinning feedback. If AI drafts comments, read and edit each one\nbefore release. Keep the turnaround your interaction statement promises.\n\n**Questions.** Answer common questions once, in an announcement or the General Q&A discussion, so\neveryone sees the answer.\n\n### See it\n\nMGMT 615's plan: Monday opening announcements carry Dana's story; Wednesday midpoints respond to\nwhat the instructor sees in the week's drafts and polls; a short Monday note before each Tuesday\ncohort session says what to bring. Feedback on main assignments is within five days: clickable\nrubric plus a 2-minute video comment, with a comment library built from the first term's most\ncommon notes. The instructor's reflection said Monday announcements slipped mid-term, so all\nopening and closing announcements are drafted before the term and scheduled.\n\n### Draft (full build)\n\nThe AI asks three questions, then drafts the plan and the Module 1 announcement sequence:\n\n1. Which format of feedback suits you best: written, audio or video?\n2. Which weeks of the term are your busiest outside the course?\n3. Is there anything you already do in announcements that you want to keep?\n\nAI instructions:\n\n```text\nFrom the answers, the interaction statement, the activities and the scenarios, draft:\n1. A communication and feedback plan of 5 to 8 short lines: announcement days, feedback format and\n   turnaround for main assignments, how AI drafting will be reviewed, how common questions are\n   answered, and how the plan holds in the faculty member's busiest weeks.\n2. The Module 1 announcement sequence: opening, midpoint (as a template with [what I'm seeing]\n   placeholders, since it must respond to real work), before-session note, closing. Each under\n   120 words, in the faculty member's voice, carrying the story forward.\nKeep every commitment consistent with the interaction statement.\n\nReturn: {\"plan\": [string], \"announcements\": [{\"type\": string, \"day\": string, \"text\": string}]}\n```\n\nDemo response (MGMT 615): the plan under See it, and a Module 1 opening announcement:\n\"Welcome to MGMT 615. This week you meet Dana Ortiz, eight months into running a distribution\ncenter, with on-time shipping down eight points and a director who's already decided whose fault\nit is. Start with her Monday report and the Whitfield chapter, then join us Tuesday at 6:00,\nwhere you'll decide what Dana should do with her first week.\"\n\n### Review (refresh)\n\nEdit in place. Existing announcements, feedback practices and communication notes from the upload\nare checked against the interaction statement and the Learn section; the reflection points the\nAI at what slipped.\n\nDemo response (MGMT 615): the course map has no communication plan, so the full build runs. The\nreflection note about announcements slipping mid-term adds the line \"Opening and closing\nannouncements drafted before the term and scheduled.\"\n\n### Decide\n\nChecklist:\n\n- The plan matches your interaction statement.\n- Midpoint announcements respond to real student work.\n- You can keep it up in your busiest weeks.\n\n### Checks\n\nOn save: every commitment matches the interaction statement (days and turnaround); each module\nhas an opening and a closing announcement planned; AI-drafted feedback has a review step.\n\n### Save\n\nPlanning document: the communication and feedback plan, added to the Instructor Interaction\nsection under the syllabus statement.\nDownload: the Module 1 announcement sequence as a Word file. There's nothing to fill out or submit; it's there to show and share.\nProject file: `communication.plan`, `communication.announcements`.\n\n### Go deeper (optional)\n\n- `src:reading-m8-preparing-for-development`\n- `src:guide-online-teaching-practices`\n- `src:guide-rsi`\n\n---\n\n## Check-in prep and finish\n\nSame instructions as Module 1, with one addition: the app offers Save final version once step 8.1\nhas no open flags. The final version leaves out the check-in summary and, if the faculty member\nchooses, the change log. The faculty member saves it to the shared folder, and the ID schedules\nthe kick-off meeting.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Final check: Modules 1 and 8 lightened, Module 6 media noted\", \"Communication and feedback plan\", \"Module 1 announcement sequence\"],\n  \"keptFlags\": [\"Module 6 has no scenario media: the AI teaching video carries the story\"],\n  \"questions\": [\"Which scenario videos should be produced first?\", \"Can the comment library be set up in the development shell before the term?\"]\n}\n```\n\nProject file: `checkins.prep.m8`.\n"}], "demo": {"mgmt615-activities.json": {"about": "Recorded demo data for Module 4 (MGMT 615, fictional). 'activities' are the module's activities after the refresh review. Each has type, title, CLOs, weight (high, medium, low), estimated student hours, RSI category (null if it doesn't count on its own) and AI-completion risk for graded work. 'review' holds the refresh findings for steps 4.1 and 4.2. Activities from the course map are kept unless a finding says otherwise.", "modules": [{"module": 1, "activities": [{"type": "Discussion", "title": "Introductions and Your Management Story", "clos": ["CLO 1"], "weight": "low", "hours": 1, "rsi": 4, "aiRisk": "low"}, {"type": "Assignment", "title": "Case Analysis: Maria's First Ninety Days and Dana's First Bad Week", "clos": ["CLO 1"], "weight": "medium", "hours": 3, "rsi": 2, "aiRisk": "medium"}, {"type": "Quiz", "title": "Manager vs. Individual Contributor Sort", "clos": ["CLO 1"], "weight": "low", "hours": 0.5, "rsi": null, "aiRisk": "low"}], "review": ["Case analysis: keep, and add Dana's first bad week as the comparison case so the assignment sits at the storyline's first decision.", "The sort is auto-graded, so it doesn't count for RSI. The module still has two categories from the discussion and the case feedback.", "About 4.5 hours of activities in a 4-hour first week. Resolution: the Manager vs. Individual Contributor Sort becomes optional practice, and the case analysis is shortened."]}, {"module": 2, "activities": [{"type": "Assignment", "title": "Motivation Diagnosis Memo: Why the Bonus Backfired", "clos": ["CLO 1"], "weight": "high", "hours": 3, "rsi": 2, "aiRisk": "medium"}, {"type": "Quiz", "title": "Motivation Theory Check", "clos": ["CLO 1"], "weight": "low", "hours": 0.5, "rsi": null, "aiRisk": "low"}, {"type": "Interactive", "title": "Fix the Incentive", "clos": ["CLO 5"], "weight": "low", "hours": 0.5, "rsi": null, "aiRisk": "low"}], "review": ["Motivation memo: tie it to Dana's bonus decision. It was a general memo on a problem of the student's choice; students can still add their own team as a second case."]}, {"module": 3, "activities": [{"type": "Assignment", "title": "Feedback Conversation Script: Dana and Jordan", "clos": ["CLO 2"], "weight": "high", "hours": 3, "rsi": 2
