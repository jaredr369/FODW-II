 in which your character faces a decision that\ncalls for that module's CLOs. Every scenario follows the pattern you're using here: something the\ncharacter needs to do, and a conflict that makes it hard. Getting the course-level performance and\nconflict right now makes each module's scenario easier to plan.\n\n### See it\n\nHere's what the MGMT 615 instructor chose.\n\n**Performance:** Diagnose why a team is underperforming before choosing a fix (from CLO 1).\n\n**Conflict:** The quick fix against the right fix. Six weeks before peak season, a director has\nalready blamed one shift lead, while the evidence points to a speed bonus and a shift handoff no\none owns. Fixing the real causes takes longer and means questioning the boss.\n\nThe conflict is a judgment problem, not missing information: the manager can see the evidence,\nbut acting on it is costly. It also comes back in later modules, in feedback, delegation, and\nhiring decisions.\n\n### Draft (full build) and Review (refresh)\n\nAnswer two questions, then select the button below. The AI suggests two or three performance\nand conflict pairs. Under the pair you like best, select **Use this pair**.\n\n::: refresh\nThe AI first looks through your Course Map for a **throughline**: a company, person, case, or\nproject that appears in more than one module. If it finds one, it says whether it could become\nyour course's story. Either way, it suggests pairs that fit what your course already teaches.\n:::\n\n::: fields\n- Which CLO names the decision your students will face most often? | CLO 1: Diagnose why an employee or team is underperforming using core theories of motivation and performance.\n- Describe a moment from your field when a capable professional got this decision wrong, or nearly did. | A new manager I worked with fired a supervisor for a slump that turned out to be caused by a bonus that rewarded speed over accuracy.\n:::\n\n::: full\nAI instructions:\n\n```text\nFrom the CLOs, the learner description, and the faculty member's answers, propose two or three\nperformance and conflict pairs for a course storyline. Each performance is one sentence tied to\na named CLO. Each conflict pushes directly against that performance and is a judgment problem,\nnot missing information. Prefer pairs that can recur across most modules. For each pair, list\nthe CLOs the conflict would put pressure on.\n\nReturn: {\"pairs\": [{\"performance\": string, \"clo\": string, \"conflict\": string, \"closTouched\": [string]}]}\n```\n:::\n\n::: refresh\nAI instructions:\n\n```text\nThe faculty member's existing modules, activities, and materials are given. Look for a\nthroughline: a company, person, case, or project that appears in more than one module. Report\nwhat you found and in which modules. Then say whether one of the existing cases could become\nthe course's central story, or whether the course needs a new character, and why. Finally\npropose one or two performance and conflict pairs, as on the full build, that fit what the\ncourse already teaches.\n\nReturn: {\"throughline\": {\"found\": boolean, \"items\": [{\"name\": string, \"modules\": [int]}]}, \"recommendation\": string, \"pairs\": [...]}\n```\n:::\n\nDemo response (MGMT 615):\n\n::: full\n**Pair 1** (from CLO 1; also puts pressure on CLO 2 to CLO 6)\n\n- **Performance:** Diagnose why a team is underperforming before choosing a fix.\n- **Conflict:** Six weeks before peak season, the director has already blamed one shift lead. The evidence points to a speed bonus and a shift handoff no one owns, which take longer to fix and mean questioning the director.\n\n**Pair 2** (from CLO 4; also puts pressure on CLO 3 and CLO 6)\n\n- **Performance:** Justify a delegation call under time pressure.\n- **Conflict:** A new manager who was promoted for fixing problems personally is now the bottleneck, and handing work off risks a visible failure in her first year.\n:::\n\n::: refresh\n**Throughline:** none found. Four cases each appear in one module, with a different company each\ntime: Maria's First Ninety Days (Module 1), The Sales Contest That Backfired (Module 2), The Team\nThat Couldn't Ship (Module 4) and The Reorg Nobody Saw Coming (Module 7).\n\n**Recommendation:** None of these cases can carry eight modules, but they share a situation: a\nnew manager under pressure whose first answer is wrong. Build one new character in that\nsituation. The existing cases can stay as contrasts in their modules.\n\n**Pair 1** (from CLO 1; also puts pressure on CLO 2 to CLO 6)\n\n- **Performance:** Diagnose why a team is underperforming before choosing a fix.\n- **Conflict:** Leadership has already decided who to blame, and the real causes take longer to fix and mean questioning the boss.\n:::\n\n### Decide\n\nYour final performance and conflict go in these boxes. The next step uses them to help draft your\ncharacter. Type in any box to change it, or select **Redraft with AI** under a box to have the AI\nrewrite just that part.\n\nUnder the pair you like best, select **Use this pair** to copy it here, then edit it into your\nown words.\n\n::: fields\n- Your performance (one sentence, from a CLO)\n- Your conflict (what makes the performance hard)\n:::\n\nChecklist:\n\n- The performance comes from one of your CLOs.\n- More information alone wouldn't settle the conflict; it takes judgment.\n- The conflict could come back in most of your modules.\n\n### Checks\n\nWhen you save, the tool checks that:\n\n- the performance comes from a CLO;\n- the conflict pushes against the performance and isn't resolved by more information.\n\n### Save\n\nSaved with your project. Step 2.3 uses your performance and conflict to draft your character,\nand Module 3 builds your storyline on them.\nProject file: `story.performance`, `story.conflict`; in refresh, `story.throughline`.\n\n### Go deeper (supplemental)\n\n- `src:guide-storytelling`\n- `src:ext-greene-2020`\n\n---\n\n## 2.3 Character profile\n\nTime: about 20 minutes\nPattern: draft, then edit in place\n\n### Learn\n\n::: purpose\n**What you'll do:** Build a profile of the character your students will follow through the course.\n\n**Why it matters:** Your students meet this person in every module. A believable character makes\neach scenario feel like a real decision, not a textbook exercise.\n:::\n\nYour character is someone in a role your students could hold in the near future, with enough\nauthority to feel the decision and facing the constraints your students face. The character lives\ninside the conflict you named in step 2.2.\n\nThe profile has six parts:\n\n1. **Premise statement:** \"A story about [name, role] who struggles to [performance] when\n   [conflict].\"\n2. **Position:** title, type of organization, team size, and experience.\n3. **Conflict:** the step 2.2 conflict, made specific to this person.\n4. **Peers:** two to four people who see the problem differently.\n5. **Values and fears:** what the character cares about and what they're afraid of.\n6. **Backstory:** three or four points that explain how they got here.\n\nIf one character doesn't fit your course, you can rotate characters within one setting, keep one\nrecurring problem, or use a narrator. Your ID reviews the character at this module's check-in,\nbefore Module 3 builds scenarios on it.\n\n### See it\n\nHere's the character profile the MGMT 615 instructor settled on.\n\n::: plan Character Profile\n**Premise statement:** A story about Dana Ortiz, a newly promoted operations manager at a\nregional distribution center, who struggles to find the real causes of her site's slipping\nperformance and coach, delegate, communicate, and hire her way to a fix when leadership has\nalready decided who to blame.\n\n**Position:** Operations manager at a regional distribution center for a mid-size home-goods\nretailer. Leads 3 shift leads and about 45 hourly associates and reports to a regional director.\nPromoted 8 months ago from day-shift lead; her first time managing managers.\n\n**Conflict:** On-time shipping has dropped from 97% to 89% six weeks before peak season, and her\ndirector has already blamed her day-shift lead. Dana sees a speed bonus and a shift handoff no one\nowns.\n\n**Peers:** Ray Kowalski, night-shift lead, agrees with the director. Jordan Pike, day-shift lead,\nsenses he's being blamed. Alicia Grant, a manager at a sister site, has the data but says to\nreplace Jordan. Luis Ferreira, an associate, keeps missing the bonus because he won't cut\ncorners.\n\n**Values and fears:** Values reliability, fairness, and loyalty to the floor. Fears being wrong\nabout her boss, losing the crew's trust, and missing peak season in her first year.\n\n**Backstory:** Started as a seasonal picker. Known as the lead who \"just fixes it.\" Her first\nreview as manager called her a bottleneck, which led her to the graduate program.\n:::\n\n::: figure people | Dana's working relationships\n- Greg Halvorsen | Regional director, Dana's boss | \"Jordan's shift is the problem. Fix him or replace him.\" | above\n- Ray Kowalski | Night-shift lead | Agrees it's Jordan's fault.\n- Jordan Pike | Day-shift lead | Senses he's being blamed.\n- Dana Ortiz | Operations manager | Sees a speed bonus and a handoff no one owns. | center\n- Alicia Grant | Manager at a sister site | Has the data, but says to replace Jordan.\n- Luis Ferreira | Associate | Keeps missing the bonus because he won't cut corners.\n:::\n\n### Draft (full build) and Review (refresh)\n\nThe AI drafts a profile from your performance and conflict (step 2.2), your CLOs, and your learner\ndescription. Answer the optional question if you want a say in the setting, then select the\nbutton below. Under the draft, select **Use this profile** to copy it into the boxes under Decide.\n\n::: refresh\nIf your Course Map already has a character or a recurring case, the AI checks it against the\nLearn section instead, keeps what works, suggests additions, and fills in any missing parts.\n:::\n\n::: fields\n- Anything the character should be or have, such as an industry or a role? (optional) | A distribution center, since many of my students work in operations.\n:::\n\n::: full\nAI instructions:\n\n```text\nDraft a character profile from the chosen performance and conflict, the CLOs, and the learner\ndescription. Include: premise statement in the form \"A story about [name, role] who struggles to\n[performance] when [conflict].\", position (title, organization type, team size, experience),\nconflict (specific to this person), 2 to 4 peers with contrasting views of the problem, 2 or 3\nvalues, 2 or 3 fears, and 3 or 4 backstory points. The role must be one the students could hold\nin the near future. The conflict must force the character to use the skills in the CLOs. Avoid\nreal company names. Keep the whole profile under 400 words.\n\nReturn: {\"premise\": string, \"position\": string, \"conflict\": string, \"peers\": [string], \"valuesFears\": string, \"backstory\": [string]}\n```\n:::\n\n::: refresh\nAI instructions:\n\n```text\nThe faculty member's existing character or recurring case, if any, is given. If there is none,\ndraft a profile as on the full build. If there is one, check it against this checklist: a\nrealistic role students could hold soon; enough authority to feel the decision; faces\nconstraints students will face; the conflict pushes against a CLO-based performance; stakes are\nvisible; more than one reasonable option. Keep what passes. For each gap, quote the problem and\nsuggest a specific addition. Then fill any missing profile parts.\n\nReturn: {\"passes\": boolean, \"issues\": [string], \"profile\": {...same shape as the full build...}}\n```\n:::\n\nDemo response (MGMT 615):\n\n::: refresh\nMGMT 615's Course Map had no character or recurring case, so the AI drafted one.\n:::\n\n**Premise statement:** A story about Dana Ortiz, a newly promoted operations manager at a\nregional distribution center, who struggles to find the real causes of her site's slipping\nperformance and coach, delegate, communicate, and hire her way to a fix when leadership has\nalready decided who to blame.\n\n**Position:** Operations manager at a regional distribution center for a mid-size home-goods\nretailer. Leads 3 shift leads and about 45 hourly associates across two shifts and reports to a\nregional director. 9 years in operations; promoted 8 months ago from top-performing day-shift\nlead; her first time managing managers.\n\n**Conflict:** Six weeks before peak season, on-time shipping has dropped from 97% to 89%. Her\ndirector, Greg Halvorsen, has named the cause: \"Jordan's shift is the problem. Fix him or replace\nhim.\" Dana sees more. A pick-rate bonus rewards speed over accuracy, the handoff between shifts\nhas no owner, and Jordan avoids hard calls with his crew. Blaming Jordan would satisfy Greg\nquickly. Fixing the causes takes longer, means questioning her boss, and requires changes the\ncrew won't like.\n\n**Peers:**\n\n- Ray Kowalski, night-shift lead, 22 years on the floor: agrees it's Jordan's fault, partly because the handoff problems make night shift look good.\n- Jordan Pike, day-shift lead, promoted 14 months ago under Dana: capable and well liked, but avoids hard conversations with his crew. Senses he's being blamed.\n- Alicia Grant, operations manager at a sister site: has the dashboards that show the handoff problem, but thinks Dana should replace Jordan and move on.\n- Luis Ferreira, associate, six years at the site: one of the most accurate pickers. Keeps missing the speed bonus because he won't cut corners.\n\n**Values and fears:** Values reliability (the trucks leave on time), fairness (decisions based on\nevidence, not on who's easiest to blame) and loyalty to the floor (she remembers being managed\nbadly). Fears pushing back on Greg and being wrong, losing the crew's trust when she changes a\nbonus they like, and missing peak season in her first year.\n\n**Backstory:**\n\n- Started as a seasonal picker while finishing her degree and stayed because she liked solving floor problems.\n- Known as the lead who \"just fixes it,\" which got her promoted and now tempts her to fix symptoms.\n- Her first review as manager called her a bottleneck who wasn't growing her leads, which led her to the graduate program.\n- Early in her career she watched a coworker get blamed and let go for a problem that turned out to be a broken process.\n\n### Decide\n\nYour final profile goes in these boxes. It's what's saved to your Course Planning Document. Type in\nany box to change it, or select **Redraft with AI** under a box to have the AI rewrite just that\npart.\n\nUnder the AI's draft, select **Use this profile** to copy each part into its box.\n\n::: fields\n- Premise statement\n- Position\n- Conflict\n- Peers, one per line: name, role, and how they see the problem\n- Values and fears\n- Backstory, one point per line\n:::\n\nChecklist:\n\n- Your students could hold this role in the near future.\n- There's more than one reasonable choice, so students ask \"What would I do?\"\n- All characters, companies, and places are fictional.\n\n### Checks\n\nWhen you save, the tool checks that your profile:\n\n- has all six parts;\n- has visible stakes for the character;\n- uses no real company names.\n\n### Save\n\nPlanning document: Character Profile, in the Storyline section after Tables 1 and 2. Module 3\nadds the storyline premise and the Scenario rows.\nProject file: `story.character`.\n\n### Go deeper (supplemental)\n\n- `src:guide-storytelling`\n- `src:jobaid-media-selection-matrix`\n- `src:ext-greene-2020`\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Interaction statement: new, with a Wednesday activity check added\", \"Performance and conflict: the quick fix against the right fix (CLO 1)\", \"Character: Dana Ortiz, new\"],\n  \"keptFlags\": [],\n  \"questions\": [\"Is the Wednesday check on inactive students realistic during heavy grading weeks?\", \"Does Dana's disagreement with her director need any care in how it's framed for students?\"]\n}\n```\n\nProject file: `checkins.prep.m2`.\n"}, {"id": "m3", "file": "03-scenario-planning.md", "raw": "# Module 3. Scenario Planning and the Learner's Journey\n\nModule id: `m3`\nSteps: 2\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: the course storyline premise and one scenario per module.\n\nRefresh checks for this module: each scenario calls for that module's objectives; pressure builds\nacross modules.\n\nNo refresh reflection in this module. Scenarios are new work for nearly every course. In the\nrefresh track, the AI builds scenarios from cases and examples the course already uses where\nthey fit.\n\nSources: `src:assignment-m3-identifying-scenarios`, `src:guide-storytelling`,\n`src:example-mgmt615-scenarios`, `src:example-mgmt615-episodes`, `src:example-mgmt615-character`,\n`src:example-mgmt615-course-map`\n\nDemo data: `demo/mgmt615-scenarios.json`\n\n---\n\n## 3.1 Your storyline\n\nTime: about 15 minutes\nPattern: interview, then draft (full build) or edit in place (refresh)\n\n### Learn\n\n::: purpose\n**What you'll do:** Draft your course's storyline: a one-sentence premise and the arc of decisions\nyour character faces from the first module to the last.\n\n**Why it matters:** Because the same person keeps coming back, students see how a decision in one\nmodule shapes what's possible later, which is how the skills connect on the job.\n:::\n\nIn Module 2 you built a character and named the conflict at the center of your course. This module\nturns them into a story.\n\nAt the course level, the character has one long-term goal, and it lines up with your CLOs. Each\nmodule then puts a new obstacle or decision in the way. Some decisions move the character closer to\nthe goal, and some set them back.\n\nA storyline premise keeps it focused. It's one sentence:\n\n\"[Course] is a story about [character, role] who struggles to [long-term goal] when [the\nconflict].\"\n\nA storyline works when:\n\n- **Pressure builds.** Early modules can start small. By the last few, more is at stake and the\n  character has fewer easy options.\n- **Every CLO gets a turn.** Each CLO should drive at least one module's decision.\n- **The details hold.** Names, numbers, and relationships stay the same from module to module.\n- **The setting changes at least once.** A student who follows one character through one company\n  learns to reason about that company. To help students apply the thinking elsewhere, put at\n  least one scenario in a different setting, such as a sister site, a client, or the character's\n  past job (Gick & Holyoak, 1983).\n\n### See it\n\n::: full\nHere's the storyline the MGMT 615 instructor settled on.\n:::\n\n::: refresh\nMGMT 615's Course Map had no storyline, so the instructor built one, as on the full build. Here's\nwhat they settled on.\n:::\n\n::: plan Storyline premise\nMGMT 615 is a story about Dana Ortiz, a newly promoted operations manager, who struggles to find\nand fix the real causes of her site's slipping performance before peak season, when her director\nhas already decided who to blame.\n:::\n\n::: figure arc | MGMT 615's arc: pressure rises toward peak season\n- 1 | The First Bad Week | 1\n- 2 | The Bonus That Backfired | 2\n- 3 | The Conversation With Jordan | 2\n- 4 | The Handoff Nobody Owns | 3\n- 5 | Telling Greg He's Wrong | 5 | peak\n- 6 | Twelve Things on Dana's List | 4\n- 7 | Ending the Bonus | 4\n- 8 | Proven vs. Potential | 4\n- Note | Pressure peaks in Module 5, when Dana has to tell her director he's wrong. Peak season starts in Module 6, so the stakes stay high to the end.\n:::\n\n### Draft (full build) and Review (refresh)\n\nAnswer the optional question if you want a say in where the story goes, then select the button\nbelow. The AI drafts a premise and an arc: one line per module with a working episode title and the\ndecision your character faces, built from your character, conflict, CLOs, and modules. Under the\ndraft, select **Use this storyline** to copy it into the boxes under Decide.\n\n::: refresh\nIf your Course Map already has a storyline or a case that runs through several modules, the AI\nstarts from it instead: it checks it against the Learn section, keeps what works, and suggests\nfixes.\n:::\n\n::: fields\n- What does your character want by the end of the course? (optional) | To get her site running well without fixing everything herself, and to keep her team through peak season.\n:::\n\n::: full\nAI instructions:\n\n```text\nDraft a storyline for the course from the character profile, the conflict (step 2.2), the CLOs,\nand the module titles and topics. Include:\n1. A storyline premise in the form \"[Course] is a story about [character, role] who struggles\n   to [long-term goal] when [conflict].\"\n2. An arc: one line per module giving a working episode title and the decision the character\n   faces, in module order. Each decision must call for that module's CLOs. Pressure should rise\n   across the modules.\n3. A one-sentence note on where pressure peaks.\nUse the character profile exactly as written. Do not change names, numbers, or relationships.\nIf the faculty member described the character's long-term goal, use it.\n\nReturn: {\"premise\": string, \"arc\": [{\"module\": int, \"title\": string, \"decision\": string, \"clos\": [string]}], \"peak\": string}\n```\n:::\n\n::: refresh\nAI instructions:\n\n```text\nThe faculty member's existing storyline or recurring case, if any, is given. If there is none,\ndraft a storyline as on the full build. If there is one, check it against this checklist: a\npremise names the character, the long-term goal, and the conflict; pressure builds across\nmodules; every CLO drives at least one module; details stay consistent. Keep what passes. For\neach gap, quote the problem and suggest a fix. Then give a premise and arc as on the full build.\n\nReturn: {\"passes\": boolean, \"issues\": [string], \"premise\": string, \"arc\": [...], \"peak\": string}\n```\n:::\n\nDemo response (MGMT 615):\n\n::: refresh\nMGMT 615's Course Map had no storyline, so the AI drafted one.\n:::\n\n**Premise:** MGMT 615 is a story about Dana Ortiz, a newly promoted operations manager, who\nstruggles to find and fix the real causes of her site's slipping performance before peak season,\nwhen her director has already decided who to blame.\n\n**Arc:**\n\n- Module 1, The First Bad Week: work the floor to recover the number, or step back and find out what is driving the drop.\n- Module 2, The Bonus That Backfired: leave the pick-rate bonus alone, add an accuracy threshold, or propose replacing it.\n- Module 3, The Conversation With Jordan: issue the warning Greg wants, coach with no record, or coach and document the agreed next steps.\n- Module 4, The Handoff Nobody Owns: host Greg's team lunch, hold a joint meeting, or name a handoff owner and change the structure.\n- Module 5, Telling Greg He's Wrong: send Greg's replacement plan, or ask for 30 minutes to walk him through the data.\n- Module 6, Twelve Things on Dana's List: decide what to keep, what to hand off, and what to hand off with checkpoints.\n- Module 7, Ending the Bonus: announce the change in writing, through her leads, or to each shift in person.\n- Module 8, Proven vs. Potential: hire the proven candidate, hire Luis, or hire one and develop the other.\n\n**Where pressure peaks:** Module 5, when Dana has to challenge her director with a week until his\ndeadline.\n\n### Decide\n\nYour final premise and arc go in these boxes. Type in any box to change it, or select **Redraft\nwith AI** under a box to have the AI rewrite just that part.\n\nUnder the AI's draft, select **Use this storyline** to copy it here, then edit it into your own\nwords. Episode titles are working titles; you can change them in step 3.2.\n\n::: fields\n- Your storyline premise (one sentence)\n- Your arc, one module per line: episode title and the decision your character faces\n:::\n\nChecklist:\n\n- The premise names the character, the goal, and the conflict.\n- Pressure rises across the modules.\n- Every CLO drives at least one module's decision.\n- At least one module is in a different setting, so students practice applying the skills\n  somewhere new.\n\n### Checks\n\nWhen you save, the tool checks that:\n\n- the premise names the character, the goal, and the conflict;\n- every CLO drives at least one module in the arc.\n\n### Save\n\nPlanning document: Storyline premise, at the start of the Storyline section. Step 3.2 turns each\nline of your arc into a full scenario.\nProject file: `story.premise`, `story.arc`.\n\n### Go deeper (supplemental)\n\n- `src:guide-storytelling`: Building Your Storyline, and the options for courses where one\n  character doesn't fit.\n- `src:ext-gick-holyoak-1983`\n\n---\n\n## 3.2 Scenarios for every module\n\nTime: about 45 minutes, about 5 minutes a module\nPattern: pick and combine, one module at a time (full build); edit in place (refresh)\n\n### Learn\n\n::: purpose\n**What you'll do:** Plan a scenario for each module: a specific moment when your character has to\nmake a decision that calls for that module's CLOs.\n\n**Why it matters:** A clear scenario now saves work later. The same moment can anchor the module's\noverview video, discussion, assignment, and cohort session.\n:::\n\nA scenario follows the pattern you practiced in step 2.2: something the character needs to do, and a\nconflict that makes it hard. It doesn't need to be dramatic. It needs to be specific.\n\nLook for turning points. Reasonable professionals disagree about a decision. A plan looks sound\nuntil reality exposes a weakness. New data, or a stakeholder, forces a change in approach. A\nmistake is easy to make and costly to fix.\n\nEach scenario answers five questions:\n\n::: flow\n- Situation | What's the setting, and what was supposed to happen?\n- Trigger | What went wrong or became uncertain, and what new pressure appeared?\n- Stakeholders | Who is affected, and who else has something at stake?\n- Decision | What has to be decided, and which options are realistically on the table?\n- Outcome and learning | What changes at the end, and which idea from this module would have improved the outcome?\n:::\n\nA good scenario can't be handled well without the module's skills, and its options are ones a\nprofessional could defend. If one option is obviously right, students learn to spot the answer\nthe course wants instead of making a judgment.\n\nWork one module at a time, in order. The second half is usually where pressure peaks, and earlier\ndecisions can come back: in MGMT 615, the bonus Dana questions in Module 2 is the change she\nannounces in Module 7. A scenario that depends on an earlier decision shows students that the\nskills build on each other.\n\n### See it\n\nHere's one of the eight scenarios the MGMT 615 instructor planned, for Module 4. Its title and\npremise go into the Course Planning Document; the five parts guide the activities, media, and\ncohort session you'll plan in Modules 4 to 7.\n\n::: plan Scenario, Module 4\n**The Handoff Nobody Owns.** Dana struggles to fix the broken handoff between her two shifts with a\nstructural change, when her director is pushing a team-building lunch.\n:::\n\n| Part | MGMT 615, Module 4 |\n|---|---|\n| Situation | The two shifts pass work to each other every afternoon, but no one owns the handoff. |\n| Trigger | The shift leads now blame each other for the late orders. Greg, the director, suggests a team-building lunch. |\n| Stakeholders | Both shift leads and their crews, Dana, Greg, customers. |\n| Decision | Host the lunch, hold a joint meeting to air the tension, or change the structure: name a handoff owner and add a shared checklist and an overlap window. |\n| Outcome and learning | A team-effectiveness framework shows the problem is unclear roles, so a lunch won't touch it. Dana has to explain to Greg why the structural fix beats his idea. |\n\n### Draft (full build) and Review (refresh)\n\nWork through your modules one at a time. Choose a module, then select the button below. The AI\nproposes two scenarios for that module from your storyline arc (step 3.1), your character, and the\nmodule's CLOs and topics. The first follows your arc; the second takes a different angle. Under the\none you like better, select **Use this scenario** to copy it into the boxes under Decide.\n\n::: refresh\nThe AI also looks at your Course Map's existing cases and examples for each module. Where one\nfits, it builds an option from it and names the case.\n:::\n\n::: module-picker\n:::\n\n::: full\nAI instructions:\n\n```text\nPropose two scenario options for the given module, using the storyline arc (step 3.1), the\ncharacter profile, the CLOs, and the module's title, CLOs met, and topics. Each option puts the\ncharacter in a moment of decision that calls for that module's CLOs. Use the character profile\nexactly as written. For each option give: a short episode title; a premise in the form\n\"[Character] struggles to [decision] when [complication].\"; the CLOs it supports; situation;\ntrigger; stakeholders; decision with 2 or 3 realistic options a professional could defend;\noutcome and learning, naming the module concept that improves the outcome. Keep each element to\none or two sentences. The first option should follow the arc; the second can depart from it. For\nmodules after the first, where it fits, connect a scenario to a decision the character made in an\nearlier module, and say which one.\n\nReturn: {\"module\": int, \"options\": [{\"title\": string, \"premise\": string, \"clos\": [string], \"situation\": string, \"trigger\": string, \"stakeholders\": string, \"decision\": string, \"outcome\": string}]}\n```\n:::\n\n::: refresh\nAI instructions:\n\n```text\nThe faculty member's existing scenario for the given module is given, if any, along with the\nmodule's current activities and materials. For an existing scenario, check: the decision calls for\nthat module's CLOs; the options are ones a professional could defend; the stakes are visible;\ncharacter details match the profile. Keep what passes and suggest fixes for the rest. If there is\nno scenario, propose two options as on the full build. Where an existing case or example fits,\nbuild an option from it and name the case.\n\nReturn: {\"module\": int, \"existing\": {\"passes\": boolean, \"issues\": [string]} | null, \"options\": [...]}\n```\n:::\n\nDemo response (MGMT 615):\n\n::: module-options\n- 1 | refresh | Your Course Map's existing case, Maria's First Ninety Days, covers the same moment at another company. Keep it as a contrast: students compare Maria's first quarter with Dana's first bad week.\n:::\n\n### Decide\n\nYour final scenario for each module goes in these boxes. Type in any box to change it, or select\n**Redraft with AI** under a box to have the AI rewrite just that part. To work on another module,\nchoose it above; what you've typed is kept.\n\n::: module-fields\n:::\n\nChecklist (for each scenario):\n\n- The decision can't be made well without this module's skills.\n- There are two or three options a professional could defend.\n- The stakes are visible.\n- Names, numbers, and relationships match your character profile.\n\n### Checks\n\nWhen you save each scenario, the tool checks that:\n\n- the decision calls for the module's CLOs;\n- there are two or three defensible options;\n- character details match your profile.\n\nWhen all your scenarios are saved, a storyline check looks across them: pressure rises, every\nCLO drives a decision, details stay consistent, no two scenarios turn on the same decision, and at\nleast one uses a different setting. Flags appear on the modules involved.\n\nIn MGMT 615, the storyline check passed four checks and flagged one: every scenario takes place at\nDana's site. The instructor kept it with a note: \"Module 5 uses data from a sister site, and the\nexisting cases in Modules 1, 2, 4, and 7 give students other companies to compare.\"\n\nAI instructions:\n\n```text\nCheck the saved scenarios as one storyline against the character profile and the CLOs:\n1. Pressure rises across the modules.\n2. Every CLO drives at least one scenario's decision.\n3. Names, numbers, and relationships match the profile and each other.\n4. No two scenarios turn on the same decision.\n5. At least one scenario uses a different setting.\nGive one result per check: pass, or issue with the module(s) involved and a one-sentence fix.\n\nReturn: {\"checks\": [{\"check\": string, \"result\": \"pass\" | \"issue\", \"modules\": [int], \"detail\": string | null}]}\n```\n\n### Save\n\nPlanning document: the Scenario row in Tables 1 and 2 (episode title and premise).\nProject file: `modules[].scenario` (all five elements, title, premise, and CLOs); `alignment.m3`.\n\n> Review note: the MGMT 615 scenarios now use the revised CLO numbers from step 1.3. Module 8\n> maps to CLO 6 (hiring) instead of CLO 4. Module 2's alternative (\"Luis Checks Out\"), Module 4's\n> (\"Two Shifts, Two Rulebooks\") and Module 7's (\"The Overlap Window\") are new, written to give the\n> AI two options in every module. The other alternatives are the side plots from\n> `src:example-mgmt615-character`. Demo data: `demo/mgmt615-scenarios.json` gives each module's\n> `chosen` option in full and the `alternative` as title and premise only.\n\n### Go deeper (supplemental)\n\n- `src:guide-storytelling`: includes scenario planning, which you'll do with your ID during\n  development for scenarios that need production.\n- `src:jobaid-media-selection-matrix`\n- `src:guide-active-learning`\n- `src:guide-adult-learners`\n- `src:ext-mayer-2021`\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Storyline premise: new\", \"Scenarios for all eight modules: new\"],\n  \"keptFlags\": [\"Every scenario is at Dana's site: Module 5 uses sister-site data, and existing cases give other companies to compare\"],\n  \"questions\": [\"Which scenarios are worth producing as video, and which work as readings or discussion cases?\", \"Does the Module 5 scenario, where Dana challenges her director, need framing for students?\"]\n}\n```\n\nProject file: `checkins.prep.m3`.\n"}, {"id": "m4", "file": "04-activities-and-ai.md", "raw": "# Module 4. Intentional AI Implementation for Engagement & Feedback\n\nModule id: `m4`\nSteps: 2\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: learning activities for every module, including third-party tools, checked\nautomatically for RSI, workload, and AI risk, and a week-in-your-student's-shoes review of each\nmodule.\n\nRefresh checks for this module: at least two RSI categories of instructor activity per module;\nclose to 10 hours of student work a week; major assessments that AI could complete without student\nthinking.\n\nSources: `src:reading-m4-crafting-part-1`, `src:reading-m4-crafting-part-2`,\n`src:assignment-m4-assessment-interaction-plan`, `src:assignment-m4-course-tutor`,\n`src:guide-learning-activities`, `src:guide-rubrics`, `src:guide-third-party-tools`,\n`src:example-mgmt615-course-map`\n\nDemo data: `demo/mgmt615-activities.json`\n\n## Refresh reflection\n\n> App note: Shown once, in the refresh track only, before step 4.1. It asks only about activities\n> and assessments the course already has. AI and XR, which most courses are adding for the first\n> time, are left out.\n\n::: purpose\n**What you'll do:** Answer a few questions about the activities and assessments in the last version\nof your course. Answer whichever apply; short notes are fine.\n\n**Why it matters:** The AI uses your answers when it reviews each section in this module, so its\nsuggestions reflect what actually happened in your course.\n:::\n\n1. Which activities gave you the best evidence of what students could do? Which gave you the\n   weakest?\n2. Where did grading take more time than it was worth?\n3. Have you seen work that looked like a student let AI do the thinking? On which activities?\n4. Which activities would you keep exactly as they are?\n\n> App note: AI instructions are the same as the Module 1 reflection instruction.\n\nDemo answers (MGMT 615):\n\n1. \"The feedback scripts were the weakest. The team memo was the strongest because students had\n   to pick a fix and defend it.\"\n2. \"The Management Approach Summary in the last week. Forty reflections, and most said the same\n   things.\"\n3. \"The feedback scripts again. Several read like they came from the same template.\"\n4. \"The cohort roundtables and the delegation memo.\"\n\nProject file: `reflection.m4`.\n\n---\n\n## 4.1 Activities for every module\n\nTime: about 45 minutes, about 5 minutes a module\nPattern: pick and combine, one module at a time (full build); edit in place (refresh)\n\n### Learn\n\n::: purpose\n**What you'll do:** Plan the learning activities for each module: what students will do, which CLO\neach activity serves, how much it weighs, and how long it takes.\n\n**Why it matters:** Activities are where students practice and show what they've learned. They give\nyou the evidence of whether students met your CLOs.\n:::\n\nAt this stage you don't write prompts or rubrics. Plan clearly enough that your ID can see what\nstudents will do.\n\nA planned activity:\n\n- **Traces to a CLO and matches its verb.** If the CLO says evaluate, the activity has to\n  require evaluation. If you can't name the CLO, the activity may not belong.\n- **Asks students to do what professionals do**: analyze data, recommend a course of action,\n  design a process, run a conversation.\n- **Fits the week.** Activities are one part of a student's week, so they need room for the rest.\n- **Adds variety.** If every module has the same format, the course feels repetitive and the same\n  students are always at a disadvantage.\n\n::: figure budget | A typical week in Modules 2 to 8: close to 10 hours\n- Activities | about 5 to 6 hours | 56\n- Readings and media | about 2 to 3 hours | 29\n- Cohort session | 90 minutes, live or recorded | 15\n- Note | Module 1 is different: about 4 hours in all, with no cohort session, while students get oriented.\n:::\n\n**Your storyline supplies the activities.** Each scenario ends in a decision, and that is where\nthe module's main activity belongs. One decision can become an assignment where students write a\nrecommendation, a discussion where they argue what the character should do, or a short quiz that\nchecks they can find the root cause first. Not every activity has to come from the story. Use it\nwhere it fits.\n\n**Canvas offers three activity types.** Assignments are for producing something, such as an\nanalysis or a plan. Discussions are for dialogue across professional perspectives. Quizzes are\nfor low-stakes checks before harder work. Cohort sessions come in Module 7.\n\n**Weight.** Mark each activity high, medium, or low. Activities that show mastery of a CLO carry\nmore weight than the practice that builds toward it. As a guide, finished work such as analyses,\nplans, and projects makes up 70 to 90 percent of the grade, and practice and participation 10 to 30\npercent. Points and rubrics are finished with your ID during development.\n\n**Watch the last module.** Courses often stack a final project on the module's normal work, and\nthe last week ends up twice as heavy. Start a course-wide synthesis a module early, or let it\nreplace that module's main assignment.\n\n**Design major assessments for AI.** For each high-weight activity, ask whether a student could\nhand the prompt to an AI tool and submit what comes back without doing the thinking the CLO asks\nfor. Banning AI rarely solves this, and detection tools are unreliable. Design does better. Changes\nthat make a student's own thinking visible:\n\n- **Their own context.** Students apply the concept to their own team, client, or organization,\n  which an AI tool doesn't know.\n- **Process evidence.** Students submit annotations explaining their choices, a draft\n  with revisions, or a short reflection on what they changed and why.\n- **A live part.** Students defend, rehearse, or present the work in a cohort session.\n- **Course-specific material.** The work depends on your storyline, data, or earlier submissions.\n\nYou can also allow AI on purpose: let students draft with it, then grade their critique and\nrevision of the draft. Say clearly in the prompt what use is allowed. Low-weight practice doesn't\nneed this check. The point of practice is the practice.\n\n**Aggie Core Values.** Look for one or two places where an activity asks students to act with\nintegrity, lead, or consider who their decision affects. Your character's decisions are often\nthe natural spot. You don't need all six values.\n\n::: fold Third-party tools: Perusall, Peerceptiv, and Poll Everywhere\nA tool earns a place when it serves an objective better than a Canvas activity would. The AI may\nsuggest one where it fits.\n\n| Tool | What it does | Fits a story-based course when |\n|---|---|---|\n| Perusall | Students annotate readings, video, or web pages together; grades automatically | Students annotate a scenario and flag what they'd do before the discussion |\n| Peerceptiv | Structured peer review; students review the reviews; grades from review quality | Students compare how classmates reasoned through the same decision |\n| Poll Everywhere | Polls and open questions, live or on students' own time | Students vote on the character's choice, then argue it in the cohort session |\n\nThe checks ask six questions about any tool you choose, from privacy to your time. Automatic\nscores from these tools don't count as RSI on their own; plan what you'll add, such as replies in\nthe tool's threads.\n:::\n\n::: fold A grading assistant for you (optional)\nYou can set up an AI assistant for yourself that drafts feedback on student work. In Google Gemini,\na Gem holds standing instructions and \"knowledge files\": you give it the assignment prompt and your\nrubric, then paste in one submission at a time and it drafts rubric-based comments. It can save\nreal time in a large course.\n\nThree cautions: use only a tool the university has approved for student data (TAMU licenses Gemini\nwith enterprise privacy protection, but confirm with your ID before uploading student work); read\nand edit every comment before it goes to a student, which is also what makes it count as RSI; and\nthe grade is always yours. The build steps are under Go deeper.\n:::\n\n### See it\n\n::: full\nHere are the activities the MGMT 615 instructor planned for Module 3. The script sits at the\nmodule's decision point: students write the conversation Dana has with Jordan.\n:::\n\n::: refresh\nHere are MGMT 615's Module 3 activities after the review. The script sits at the module's decision\npoint: students write the conversation Dana has with Jordan. The Perusall reading now counts for RSI\nbecause the instructor replies in its threads each Thursday.\n:::\n\n| Activity | CLO | Weight | Hours |\n|---|---|---|---|\n| Assignment: Feedback Conversation Script, Dana and Jordan | CLO 2 | High | 3 |\n| Perusall: Feedback That Lands (Chapter 4) | CLO 2 | Low | 1.5 |\n| Interactive: Coaching or Discipline? Scenario Sort | CLO 2 | Low | 0.5 |\n\n### Draft (full build) and Review (refresh)\n\nWork through your modules one at a time. Choose a module, then select the button below. The AI\ndrafts the module's activities from its CLOs, topics, and scenario, and shows what the checks will\nfind: the hours, the RSI categories, and the AI risk of each high-weight activity. Select **Use\nthese activities** to copy them into the boxes under Decide.\n\n::: refresh\nThe AI starts from your Course Map's current activities for the module. It keeps what works, says\nwhat it would change and why, and adds hours and weight to each activity.\n:::\n\n::: module-picker\n:::\n\n::: full\nAI instructions:\n\n```text\nFor the given module, propose an activity set of 2 to 4 activities from the module's CLOs met,\ntopics, and saved scenario. Make the main activity sit at the scenario's decision point. For each\nactivity give: type (Assignment, Discussion, Quiz), a short title, the CLOs it assesses with the\nverb it uses, weight (high, medium, low), estimated student hours, and one sentence on what\nstudents do. Every module needs exactly one high-weight activity unless the faculty member's notes\nsay otherwise. Vary types across modules. Do not include cohort session activities. Where a\nthird-party tool (Perusall, Peerceptiv, Poll Everywhere) would serve an objective better than a\nCanvas activity, include it with type set to the tool name. At most one tool per module.\n\nReturn: {\"activities\": [{\"type\": string, \"title\": string, \"clos\": [string], \"verb\": string, \"weight\": string, \"hours\": number, \"what\": string}]}\n```\n:::\n\n::: refresh\nAI instructions:\n\n```text\nThe module's current activities are given, with its CLOs met, topics, and saved scenario. For each\nactivity check: it traces to a CLO and matches the CLO's verb; students do something\nprofessionals do; the main activity sits at or near the scenario's decision. Keep what passes.\nFor the rest, quote the problem and suggest one revision. Add estimated hours and weight to every\nactivity. Note when activity types repeat the previous module.\n\nReturn: {\"module\": int, \"activities\": [{\"original\": string, \"action\": \"keep\" | \"revise\", \"issues\": [string], \"revision\": {...same shape as full build...}}]}\n```\n:::\n\nDemo response (MGMT 615):\n\n::: module-options\n:::\n\n### Decide\n\nYour final activities for each module go in these boxes. Type in any box to change it, or select\n**Redraft with AI** under a box to have the AI rewrite just that part. To work on another module,\nchoose it above; what you've typed is kept.\n\nFor each high-weight activity, decide what AI use is allowed and say so in the second box.\n\n::: module-fields\n:::\n\nChecklist (for each module):\n\n- One main activity carries the module's weight.\n- Students do something professionals in your field do.\n- Each high-weight activity says what AI use is allowed.\n\n### Checks\n\nWhen you save each module, the tool checks:\n\n- **Alignment:** each activity traces to a CLO the module lists and uses its verb.\n- **RSI:** at least two categories of instructor activity, counting the cohort session and\n  responsive weekly announcements if your interaction statement promises them.\n- **Workload:** activities total about 5 to 6 hours (about 1.5 to 2 in Module 1). The last module is\n  flagged if it runs much heavier than the others.\n- **AI risk:** each high-weight activity is rated high, medium, or low, with a suggested change for\n  high and medium.\n- **Tools:** each third-party tool answers six questions: alignment, feedback quality, academic\n  integrity, access, privacy, and your time. Privacy shows \"check with your ID\" unless the tool is\n  approved.\n\nIn MGMT 615, the checks flagged Module 1's workload (the sort became optional practice), the\nModule 5 Perusall reading for RSI (the instructor added Thursday replies), and Module 8's workload\n(the summary's first draft moved to Module 7). They rated three assessments high for AI risk and\nsuggested the changes shown with each module's draft.\n\nAI instructions (RSI and workload):\n\n```text\nFor each module, using its saved activities, the syllabus statement (step 2.1), and whether the\nmodule has a cohort session (assume yes for modules 2 to 8 unless told otherwise):\n1. Assign each activity an RSI category or null, with a short reason. Auto-graded work and\n   student-only activities are null unless the faculty member described instructor involvement.\n2. Count the categories the module covers, including the cohort session (4) and responsive weekly\n   announcements (3) if the syllabus statement promises them.\n3. Total the activity hours.\nFlag modules with fewer than two categories, and modules whose activities exceed 6 hours (2 hours\nin Module 1). For each flag, suggest one specific change.\n\nReturn: {\"modules\": [{\"module\": int, \"activities\": [{\"title\": string, \"rsi\": int | null, \"reason\": string}], \"categories\": [int], \"hours\": number, \"flags\": [string]}]}\n```\n\nAI instructions (AI risk):\n\n```text\nFor each high-weight activity, judge how easily a student could complete it with a general AI\ntool and no course-specific thinking: high, medium, or low. Give a one-sentence reason based on\nwhat the activity asks for. For high and medium, suggest one change that makes the student's own\nthinking visible, using their own context, process evidence, a live part, or course-specific\nmaterial. Keep the activity's CLO and verb. Do not suggest AI detection tools.\n\nReturn: {\"assessments\": [{\"module\": int, \"activity\": string, \"risk\": \"high\" | \"medium\" | \"low\", \"why\": string, \"change\": string | null}]}\n```\n\n### Save\n\nPlanning document: Learning Activities Plan Part 1 (Canvas) and Part 2 (third-party tools) rows\nin Tables 1 and 2, one line per activity, for example \"Assignment: Feedback Conversation Script\n(CLO 2, high, RSI 2; annotated and rehearsed in cohort session)\".\nProject file: `modules[].activities` (with `rsi`, `hours`, `aiRisk`, `aiPolicy`, `aiChange`),\n`modules[].toolActivities`; in refresh, `.original` and `.changeNote`.\n\n### Go deeper (supplemental)\n\n- `src:reading-m4-crafting-part-1`, `src:reading-m4-crafting-part-2`\n- `src:guide-learning-activities`, `src:guide-rubrics`, `src:guide-third-party-tools`\n- `src:ext-tamu-ai-guidelines`, `src:ext-terry-2023`\n- `src:assignment-m4-course-tutor` and `src:ext-bowen-watson-2025-ch15`: build an AI tutor for\n  your students, or a grading assistant for yourself, in Google Gemini, outside this tool.\n\n---\n\n## 4.2 A week in your student's shoes\n\nTime: about 20 minutes, a few minutes a module\nPattern: a week in your student's shoes\n\n### Learn\n\n::: purpose\n**What you'll do:** Read an AI walk-through of each module's week from a student's point of view,\nand note what feels heavy, thin, or silent.\n\n**Why it matters:** A plan can pass every check and still feel wrong to a student. Seeing the week\nas they'll live it shows problems that numbers miss.\n:::\n\nThe walk-through follows one of your students through the week: what they open on Monday, what they\nread, do, and submit, when they hear from you, and how long it takes. If something needs fixing, go\nback to step 4.1.\n\nReadings and media aren't planned yet, so the walk-through uses placeholders for them. It updates\nas you plan materials in Module 5 and media in Module 6, and Module 8 shows the full week.\n\n### See it\n\nHere's MGMT 615's Module 3 week as a student would live it, and what the instructor changed.\n\n::: figure week | MGMT 615, Module 3: a student's week\n- Mon | Announcement: Greg wants a formal warning for Jordan. Start the Perusall reading (about 1.5 hours over two days).\n- Tue | Finish the Perusall annotations.\n- Wed | Coaching-or-discipline sort (30 minutes).\n- Thu | The instructor replies in Perusall. Cohort session: rehearse the opening of the conversation with a partner.\n- Fri |\n- Sat | Draft the whole feedback script and annotate each line (about 3 hours).\n- Sun |\n- Note | The heaviest point is Saturday: the whole script in one sitting. The instructor's fix: open the script on Wednesday and make it due Sunday, so students can start it after the cohort session.\n:::\n\n### Draft (full build) and Review (refresh)\n\nSelect the button below. The AI walks through each module's week as one of your students, then\nnames the heaviest point, any stretch of three or more days without hearing from you, and anything\na student might not understand the purpose of.\n\nAI instructions:\n\n```text\nWalk through the given module's week as one of the course's students, in first person and in\ntime order, using the learner description, the saved activities, the interaction statement, the\nscenario, and a 90-minute cohort session. Use [reading] and [video] placeholders where materials\naren't planned yet. Give rough hours for each part and a total. Then list, in one line each:\nthe heaviest point in the week, any stretch of three or more days with no contact from the\ninstructor, and anything a student might not understand the purpose of. Under 200 words.\n\nReturn: {\"walkthrough\": string, \"hours\": number, \"heaviest\": string, \"silent\": string | null, \"unclear\": string | null}\n```\n\nDemo response (MGMT 615):\n\n**Module 3: Performance Management and Feedback**\n\n\"Monday, an announcement picks up Dana's story: Greg wants a formal warning for Jordan. Monday and\nTuesday I spend about an hour and a half annotating the feedback chapter in Perusall. Wednesday\nnight I do the 30-minute coaching-or-discipline sort. Thursday the instructor replies to my\nPerusall thread with a question about Jordan, and in the cohort session I rehearse the opening of\nthe conversation with a partner. Saturday I draft the whole feedback script and annotate why each\nline is there, about three hours. I hear from the instructor three times this week.\"\n\n- **Total:** about 5 hours of activities, plus the 90-minute cohort session.\n- **Heaviest point:** Saturday, the whole script in one sitting.\n- **Days without contact:** none.\n- **Unclear purpose:** none.\n\n### Decide\n\nNote anything you want to change, module by module. These are your own notes, so there's no AI\nredraft here. To make a change, go back to step 4.1 and edit that module's activities.\n\n::: fields notes\n- Your notes on any week that feels heavy, thin, or silent, one module per line | Module 3: Saturday is the whole assignment. Open the script Wednesday and make it due Sunday.\n:::\n\nChecklist:\n\n- No week has one day carrying most of the work.\n- Students hear from you at least twice a week.\n\n### Checks\n\nNone beyond step 4.1's, which run again when you change any activities.\n\n### Save\n\nSaved with your project. Your notes stay with each module's plan for your ID to see at your\ncheck-in.\nProject file: `modules[].weekWalk` (walk-through, hours, reaction).\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Activities for all eight modules: three main assignments moved onto the storyline\", \"Module 5 Perusall: instructor replies added\", \"Module 8: summary draft moved to Module 7\", \"AI changes for three high-risk assessments\"],\n  \"keptFlags\": [],\n  \"questions\": [\"Is about 5 to 6 hours of activities a module the right target for this program?\", \"Should students be allowed to draft with AI on the change message if they critique the draft?\"]\n}\n```\n\nProject file: `checkins.prep.m4`.\n"}, {"id": "m5", "file": "05-materials.md", "raw": "# Module 5. Learning Materials and Responsible Use\n\nModule id: `m5`\nSteps: 2\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: the learning materials for each module, with rights status, attribution, and\nAI-use notes.\n\nRefresh checks for this module: dated sources, missing attribution, unclear rights.\n\nSources: `src:reading-m5-materials-plan`, `src:assignment-m5-materials-rights-review`,\n`src:assignment-m5-writing-attributions`, `src:guide-copyright`, `src:guide-curating-creating`,\n`src:guide-instructor-authored-reading`, `src:guide-accessibility`,\n`src:example-mgmt615-course-map`\n\nDemo data: `demo/mgmt615-materials.json`\n\n## Refresh reflection\n\n> App note: Shown once, in the refresh track only, before step 5.1. It asks only about materials the\n> course already has.\n\n::: purpose\n**What you'll do:** Answer a few questions about the materials in the last version of your course.\nAnswer whichever apply; short notes are fine.\n\n**Why it matters:** The AI uses your answers when it reviews each section in this module, so its\nsuggestions reflect what actually happened in your course.\n:::\n\n1. Which readings or videos did students skip, struggle with, or tell you were out of date?\n2. Which materials do students still bring up later in the course?\n3. Is there anything you've been meaning to replace?\n4. Which materials would you keep exactly as they are?\n\n> App note: AI instructions are the same as the Module 1 reflection instruction.\n\nDemo answers (MGMT 615): (1) \"The SBI job aid confuses people; it's a photocopy of a diagram.\"\n(2) \"The Marsh chapters.\" (3) \"Nothing specific.\" (4) \"Both Marsh chapters and the Park and Marsh\narticle.\"\n\nProject file: `reflection.m5`.\n\n---\n\n## 5.1 Materials for every module\n\nTime: about 40 minutes, about 5 minutes a module\nPattern: pick and combine, one module at a time (full build); edit in place (refresh)\n\n### Learn\n\n::: purpose\n**What you'll do:** Plan the learning materials for each module: what students will read, watch, or\nwork with to get ready for the module's decision.\n\n**Why it matters:** Materials fill much of a student's week, so each item should earn its place by\npreparing students for a specific activity.\n:::\n\nLearning materials are everything in a module that isn't an activity.\n\nChoose from least to most effort to produce:\n\n| Type | Effort | Use when |\n|---|---|---|\n| Curated reading (article, chapter, report, case) | Lowest | A good source exists. This is the default. |\n| Curated video | Low | An existing video covers it well. |\n| Instructor-authored reading (4 to 10 pages) | Several hours each | Nothing curated fits, or your own experience is the point. |\n| Interactive reading (built by your ID) | High | Complex content that benefits from short sections and checks. |\n| Instructor-recorded video | Highest | Planned in Module 6, up to 30 minutes of scripted video and audio a module. |\n\n**Your scenario is a material too.** The narrative, and any exhibits the character works from (an\nemail from a boss, a dashboard, a complaint), are created content. List them.\n\n**Finding sources with AI.** Perplexity is licensed through the university and cites its sources,\nwhich makes its suggestions easy to check. Describe the CLO, topic, your students, and the kind\nof source you want. Check every suggestion before you list it: authored by someone credible,\ncurrent, stable, and tied to an objective. Start with TAMU Libraries, and link to the library\nrecord instead of uploading a PDF.\n\n**Load.** Plan 5 to 25 pages of required reading a module, adjusted for density. At 6 to 10 pages an\nhour, that's about 1 to 3 hours. With up to 30 minutes of scripted video and audio, a few short\ncurated videos, 5 to 6 hours of activities, and the 90-minute cohort session, the week stays close\nto 10 hours. Module 1 targets about 4 hours in all, so keep its reading to a few pages.\n\n### See it\n\nMGMT 615 Module 4, after the refresh: an 11-page article on what predicts team performance, the\nTeam That Couldn't Ship case as a contrast, and a 4-page interactive reading, \"Diagnose the Team,\nNot the Person.\" A supplemental article on designing team assignments was removed because it was\nabout course design. About 21 pages.\n\n### Draft (full build)\n\nThe AI can't verify that a specific source exists, so it never names one. It suggests what each\nmodule needs and how to find it; the faculty member enters the actual sources.\n\nAI instructions:\n\n```text\nFor the given module, using its CLOs, topics, scenario, and activities, propose two versions of a\nmaterials list. Each item gives: type (curated reading, curated video, instructor-authored\nreading, interactive reading, scenario exhibit), what it must cover, the activity it prepares\nstudents for, and an estimated page count or minutes. Prefer curated types. Always include the\nscenario narrative and any exhibits the character works from. Never name a specific article,\nbook, author, or video. For each curated item, write one search prompt the faculty member can\npaste into Perplexity or the TAMU Libraries search.\n\nReturn: {\"versions\": [{\"items\": [{\"type\": string, \"covers\": string, \"supports\": string, \"pages\": number | null, \"minutes\": number | null, \"searchPrompt\": string | null}]}]}\n```\n\nDemo response (MGMT 615, Module 8, if run as a full build): a curated research article on\nstructured interviews against unstructured ones (about 10 pages; search prompt \"peer-reviewed\nmeta-analysis structured versus unstructured interviews predictive validity, written for\npracticing managers\"), two candidate files as scenario exhibits, and an interactive reading on\nweighing proven experience against potential.\n\n### Review (refresh)\n\nEdit in place. The app lists each module's current materials from the upload. The faculty member\nadds anything missing.\n\nAI instructions:\n\n```text\nFor each current material in the given module, check: it prepares students for a named activity;\nit is content for students; its date (flag anything older than 5 years unless it is a classic in\nthe field, and say so); the scenario narrative and exhibits are listed. Suggest keep, replace\n(say what a replacement should cover, never a specific source), or remove, with a reason. Add\nmissing scenario exhibits.\n\nReturn: {\"items\": [{\"original\": string, \"action\": \"keep\" | \"replace\" | \"remove\", \"issues\": [string], \"replacementCovers\": string | null}], \"add\": [string]}\n```\n\nDemo response (MGMT 615): `review` notes in `demo/mgmt615-materials.json`. Main findings: the\nModule 4 course-design article removed; scenario exhibits added in four modules; the 2019 book\nchapters flagged as dated and kept after the instructor confirmed no newer edition.\n\n### Decide\n\nFor each item the faculty member enters or confirms the source (title, author, year, link).\n\nChecklist:\n\n- Every item prepares students for a named activity.\n- The scenario and its exhibits are listed.\n- You've checked each curated source yourself.\n\n### Checks\n\nOn save of each module: every item tied to an activity; required pages and minutes total (flag\nunder 5 or over about 25 pages, or over about 8 in Module 1, adjusted for type); items older than 5 years flagged; scenario listed. After\nsaving, the week-in-your-student's-shoes walk-through for the module refreshes with the real\nreading load.\n\n### Save\n\nPlanning document: Learning Materials Plan row in Tables 1 and 2, one line per item, for example\n\"Article: Park & Marsh (2024), What actually predicts team performance (11 pp.)\".\nProject file: `modules[].materials`; in refresh, `.original`, `.changeNote`.\n\n### Go deeper (supplemental)\n\n- `src:guide-curating-creating`\n- `src:guide-instructor-authored-reading`\n- `src:guide-accessibility`\n\n---\n\n## 5.2 Rights, attribution, and AI notes\n\nTime: about 25 minutes\nPattern: spot the problem, then edit in place\n\n### Learn\n\n::: purpose\n**What you'll do:** For each material, record its rights status, an attribution line, and a note if\nAI helped make it.\n\n**Why it matters:** Using material without the right permission puts you and the university at legal\nrisk. Clear attributions and AI notes also show students the integrity you ask of them.\n:::\n\nEverything you use is protected by copyright unless it says otherwise, and the lack of a notice\ndoesn't make it free. For each material, you need one of four things: a library link, an open\nlicense, a public page or video you link to (never download and re-upload), or permission. When\nyou're unsure, link instead of uploading.\n\n**Fair use** can cover limited educational use, but it's a judgment on four factors: purpose,\nthe nature of the work, how much you use, and the effect on the market. It's never blanket\npermission, and paywalled content can't be uploaded for students.\n\n**Attribution** credits the creator: name, title, source, and license. Use it even when the\nlicense doesn't require it.\n\n**AI-assisted content.** If you used AI to draft a scenario, an exhibit, an image, or part of a\nreading, tell students. Check it for accuracy and for anything that closely reproduces someone\nelse's work, and ask your ID before treating it as your own original work. The U.S.\nCopyright Office has said that purely AI-generated material isn't protected by copyright.\n\n**Spot the problem.** The app shows one item and asks what's wrong with it:\n\n> \"Image: diagram of the SBI feedback model, found through a web image search. Used on slide 3\n> and in the job aid.\"\n\nExpected points: no creator or license, so the rights are unclear; it's reused in two places.\nFix: find a licensed version, or redraw it as your own content and attribute the model.\n\n### See it\n\nMGMT 615's SBI job aid was a photocopied diagram with no attribution, and the instructor's\nreflection said students found it confusing. The instructor redrew it as a one-page created job\naid, with the line \"Based on the Situation-Behavior-Impact model (Center for Creative\nLeadership).\" Two AI-drafted items, the Module 2 bonus sheet and the Module 6 AI job aid, got a\ndisclosure note: \"Drafted with AI assistance and reviewed by the instructor.\"\n\n### Draft (full build) and Review (refresh)\n\nSame for both tracks. The app shows every material in one table with its rights status. The\nfaculty member answers, for each item, where it came from and whether AI helped make it. The AI\nproposes the rights status, an attribution line, and any AI-disclosure note.\n\nAI instructions:\n\n```text\nFor each material, from the faculty member's answers (source, link, license if known, whether AI\nhelped create it), set rights to one of: library, open (name the license), public (linked, not\nuploaded), created, ai-assisted, unclear. Write an attribution line with creator, title, source,\nand license where known; do not invent missing details, use [check] instead. For ai-assisted\nitems, write a one-sentence disclosure note. For unclear items, suggest the safest fix: link\ninstead of upload, find a licensed alternative, or recreate it.\n\nReturn: {\"items\": [{\"title\": string, \"rights\": string, \"attribution\": string, \"aiNote\": string | null, \"fix\": string | null}]}\n```\n\nDemo response (MGMT 615): the `rights` values in `demo/mgmt615-materials.json`, with fixes for the\ntwo unclear items (Maria's case marked created after the instructor confirmed writing it; the SBI\njob aid redrawn) and disclosure notes on the two AI-assisted items.\n\n### Decide\n\nChecklist:\n\n- Every item has a rights status other than unclear, or a fix you'll make.\n- Nothing paywalled is uploaded.\n- Every AI-assisted item has a disclosure note.\n\n### Checks\n\nOn save: no item left unclear without a fix; every item has an attribution or is the faculty\nmember's own created work; every ai-assisted item has a note; any \"upload\" of a library or\npaywalled item is flagged.\n\n### Save\n\nPlanning document: each material line in the Learning Materials Plan row gains its rights status\nand, for AI-assisted items, \"(AI-assisted, disclosed)\". Full attribution lines go to the project\nfile and the check-in summary.\nProject file: `modules[].materials[].rights`, `.attribution`, `.aiNote`.\n\n### Go deeper (supplemental)\n\n- `src:guide-copyright`\n- `src:assignment-m5-writing-attributions`\n- `src:ext-copyright-office-ai`\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Materials for all eight modules, about 17 to 24 pages each\", \"Scenario exhibits added in four modules\", \"SBI job aid redrawn and attributed\", \"AI disclosure on two items\"],\n  \"keptFlags\": [\"Whitfield (2019) chapters kept: no newer edition\"],\n  \"questions\": [\"Can the Learning Media team redraw the SBI job aid, or should I?\", \"Do the created cases from earlier terms need any review before reuse?\"]\n}\n```\n\nProject file: `checkins.prep.m5`.\n"}, {"id": "m6", "file": "06-media.md", "raw": "# Module 6. Audiovisual Aspects of Storytelling\n\nModule id: `m6`\nSteps: 2\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: the media plan for each module, with each item's connection to the storyline,\nand a first script ready for the XR stage.\n\nRefresh checks for this module: dated media; required welcome, overview, and closing videos\npresent.\n\nSources: `src:reading-m6-planning-media`, `src:assignment-m6-media-planning`,\n`src:template-av-script`, `src:guide-script-writing`, `src:guide-planning-media`,\n`src:example-mgmt615-course-map`\n\nDemo data: `demo/mgmt615-media.json`\n\n## Refresh reflection\n\n> App note: Shown once, in the refresh track only, before step 6.1. It asks only about the course's\n> existing videos and graphics.\n\n::: purpose\n**What you'll do:** Answer a few questions about the videos and graphics in the last version of your\ncourse. Answer whichever apply; short notes are fine.\n\n**Why it matters:** The AI uses your answers when it reviews each section in this module, so its\nsuggestions reflect what actually happened in your course.\n:::\n\n1. Which videos do students mention, and which do they seem to skip?\n2. Which videos are out of date: wrong numbers, old examples, a different version of you?\n3. Which visuals do students need that the course doesn't have yet?\n4. Which videos would you keep exactly as they are?\n\n> App note: AI instructions are the same as the Module 1 reflection instruction.\n\nDemo answers (MGMT 615): (1) \"They mention the role-plays. Nobody mentions the discussion\nprimers.\" (2) \"None, really.\" (3) \"A picture of the shift handoff.\" (4) \"The role-plays and the feedback video.\"\n\nProject file: `reflection.m6`.\n\n---\n\n## 6.1 Media for every module\n\nTime: about 40 minutes, about 5 minutes a module\nPattern: pick and combine, one module at a time (full build); edit in place (refresh)\n\n### Learn\n\n::: purpose\n**What you'll do:** Plan the media to be produced for each module: video, audio, and graphics,\nincluding the videos every course requires.\n\n**Why it matters:** Media takes the longest to produce, so planning it now gives you and the\nLearning Media team time to make it well.\n:::\n\nCurated videos from other sources belong in your materials plan, not here.\n\n**Required in every course:** a welcome video, a short overview video for each module, and a\nclosing video. These are how students see and hear you each week, which is part of your presence\nand supports RSI.\n\n**Optional:** teaching videos (lecture, worked example, demonstration), scenario videos that\npresent a moment from your storyline, audio, and graphics such as an infographic of the data\nyour character works from.\n\n**Limits.** Video and audio you script and record total no more than 30 minutes a module. Curated\nvideos from other sources should run no more than 6 to 10 minutes each. Engagement drops sharply\nafter about six minutes (Guo, Kim, & Rubin, 2014), so split anything longer into short pieces, one\nidea each. Every item should add something a reading can't: a process to watch, a voice and face, a\nmoment of tension.\n\n**Media for your story.** Go through your scenarios and decide which need production. A scenario\nvideo opens in the character's situation and ends at the decision, before the answer, so the\nactivity that follows has something to work on. Many scenarios work fine as readings or\ndiscussion cases with no production at all.\n\n**The XR stage.** Instructor videos, including the required welcome and overview videos, are\nrecorded on the XR stage, which places you in a produced setting without filming on location.\nFor each video you fill out the A/V script template (step 6.2), and you schedule a practice\nsession on the stage with the Learning Media team before recording.\n\n### See it\n\nMGMT 615 Module 4: a 2-minute overview (\"the handoff nobody owns\"), a 6-minute teaching video\ndiagnosing the two-shift handoff, an infographic of the 4:45 p.m. handoff, and a 3-minute\nscenario video setting Greg's team-building lunch against a handoff owner. 11 minutes.\n\n### Draft (full build)\n\nAI instructions:\n\n```text\nFor the given module, using its scenario, activities, and materials, propose two versions of its\nmedia list. Always include a module overview video of about 2 minutes; include the welcome video\nin Module 1 and the closing video in the last module. For each item give: kind (welcome,\noverview, teaching, scenario, closing, graphic, audio), a working title, minutes, where it is\nmade (xr-stage for instructor videos, media-team for produced scenarios and graphics,\nfaculty-self for screen recordings), one sentence on what it adds that a reading can't, and its\nconnection to the storyline. Keep scripted video and audio at or under 30 minutes for\nthe module and each video at\nor under 6 minutes unless it is split into parts.\n\nReturn: {\"versions\": [{\"items\": [{\"kind\": string, \"title\": string, \"minutes\": number, \"where\": string, \"adds\": string, \"story\": string}]}]}\n```\n\nDemo response (MGMT 615, if run as a full build): each module's `media` from\n`demo/mgmt615-media.json`.\n\n### Review (refresh)\n\nEdit in place. The app lists each module's current produced media from the upload.\n\nAI instructions:\n\n```text\nFor each current media item in the given module, check: it adds something a reading can't; it\ndoesn't repeat other content; length (flag over 6 minutes unless split); it connects to the\nstoryline or could with a small change (say what). Flag the module if it has no overview video,\nif Module 1 has no welcome video, or if the last module has no closing video. Suggest keep,\nrevise (say how) or replace. Use the faculty member's reflection on dated videos.\n\nReturn: {\"items\": [{\"original\": string, \"action\": \"keep\" | \"revise\" | \"replace\", \"issues\": [string], \"suggestion\": string | null}], \"missingRequired\": [string]}\n```\n\nDemo response (MGMT 615): `review` notes in `demo/mgmt615-media.json`. Main findings: no module\noverview videos (added, all recorded in one XR session); the discussion primers didn't connect to\nthe story and, per the reflection, nobody mentioned them (replaced by scenario videos); one\nteaching video at 8 minutes (kept at 7, in two parts).\n\n### Decide\n\nChecklist (for each module):\n\n- The overview video is there.\n- Each item adds something a reading can't.\n- You know which items you'll record on the XR stage.\n\n### Checks\n\nOn save of each module: required videos present (welcome in Module 1, overview in every module,\nclosing in the last); scripted video and audio at or under 30 minutes\nin total; each video at or under 6 minutes or\nsplit; every item has a storyline connection or a note. The week-in-your-student's-shoes\nwalk-through refreshes with video time.\n\n### Save\n\nPlanning document: Learning Media Plan row in Tables 1 and 2, one line per item, for example\n\"Video (XR stage): Module 4 overview, 2 min. Story: the handoff nobody owns.\"\nProject file: `modules[].media`; in refresh, `.original`, `.changeNote`.\n\n\n### Go deeper (supplemental)\n\n- `src:guide-planning-media`\n- `src:jobaid-media-selection-matrix`\n- `src:ext-guo-2014`\n\n---\n\n## 6.2 Your first script and the XR stage\n\nTime: about 25 minutes\nPattern: interview, then draft\n\n### Learn\n\n::: purpose\n**What you'll do:** Draft one A/V script, usually for your welcome video or your Module 1 overview.\n\n**Why it matters:** Writing one script now, with feedback, makes the rest faster during development.\nThe script is also what you share with the Learning Media team before your practice session on the\nXR stage.\n:::\n\nEvery instructor video starts with an A/V script: two columns, what you'll say (Dialogue) and what\nappears on screen (Graphics). The template has four parts: a branded opening, an introduction where\nyou greet students and frame the topic, the content in short chunks, and a conclusion with a clear\nnext step, then a branded close.\n\nWrite for the ear. Use contractions and full sentences, and read it aloud as you write; if a\nsentence is awkward spoken, rewrite it. Say anything a student needs to know, so nothing depends\nonly on what's on screen. Most scripts run 250 to 350 words, about 2 to 2.5 minutes spoken.\n\nYour ID and the Learning Media team will help with the rest of your scripts during development.\n\n**Getting ready for the stage.** Send the finished script to your ID, who passes it to Learning\nMedia. Schedule a practice session on the XR stage with the Learning Media team. Record your\nrequired videos in as few sessions as you can; MGMT 615 recorded all eight module overviews in\none.\n\n### See it\n\nMGMT 615's Module 1 overview, first lines:\n\n| Dialogue | Graphics |\n|---|---|\n| Howdy. This week you meet Dana Ortiz. Eight months ago she was the best shift lead in her distribution center. Now she runs it, and on Monday morning the report says on-time shipping has dropped from 97 to 89 percent. | Dana's Monday report, with 89% highlighted |\n| Her director already has an answer. Before you agree with him, this module asks you a different question: what is a manager's job, and how is it different from the job Dana just left? | Greg's email: \"Jordan's shift is the problem.\" |\n\n### Draft (full build) and Review (refresh)\n\nThe AI asks which video to script (welcome, a module overview, or a scenario video from the media\nplan) and two questions: \"What should students feel or understand by the end?\" and \"Is there a\nphrase or story you always use when you introduce this?\" Then it drafts.\n\nAI instructions:\n\n```text\nDraft an A/V script for the chosen video in two columns, Dialogue and Graphics, with sections:\nopening (branded intro, no dialogue), introduction, content in chunks of 2 to 4 sentences,\nconclusion with one next step, closing (branded outro). Write conversational spoken English with\ncontractions, in the faculty member's voice, using their answers. Keep to the planned minutes at\nabout 140 spoken words a minute. For an overview or scenario video, open in the character's\nsituation and end at the decision without resolving it. Put everything a student needs in the\ndialogue; graphics only reinforce it.\n\nReturn: {\"title\": string, \"minutes\": number, \"rows\": [{\"section\": string, \"dialogue\": string, \"graphics\": string}]}\n```\n\nRefresh track: if an existing script is uploaded, the same instructions check it for length,\nspoken style, and the decision ending, and suggest edits in place.\n\nDemo response (MGMT 615): the Module 1 overview, 2 minutes, opening as under See it and closing\nwith \"Start with Dana's Monday report, then the reading on what managers actually do. Thursday's\nassignment asks what you'd do with her first week.\"\n\n### Decide\n\nThe faculty member reads the script aloud, edits it, and marks it ready for Learning Media.\n\nChecklist:\n\n- It sounds natural read aloud.\n- It fits the planned length.\n- Nothing important appears only on screen.\n- You've asked your ID to schedule an XR stage practice session.\n\n### Checks\n\nOn save: spoken length within 15 percent of the planned minutes; every graphic has matching\ndialogue.\n\n### Save\n\nPlanning document: nothing new; the media line for this video gains \"script drafted.\"\nDownload: the script as a Word file in the A/V script template format, to share with your ID and\nLearning Media. There's nothing to fill out or submit; it's there to show and share.\nProject file: `scripts[]` (video, rows, status).\
