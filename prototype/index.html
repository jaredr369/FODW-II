 "aiRisk": "low"}], "review": []}, {"module": 7, "activities": [{"type": "Assignment", "title": "Change-Communication Draft and Resistance Map: Ending the Bonus", "clos": ["CLO 5"], "weight": "high", "hours": 3, "rsi": 2, "aiRisk": "high"}, {"type": "Discussion", "title": "A Change That Was Announced Badly", "clos": ["CLO 5"], "weight": "low", "hours": 1, "rsi": 4, "aiRisk": "low"}], "review": []}, {"module": 8, "activities": [{"type": "Assignment", "title": "Interview Scorecard and Hiring Decision Memo: Proven vs. Potential", "clos": ["CLO 6"], "weight": "high", "hours": 3, "rsi": 2, "aiRisk": "medium"}, {"type": "Assignment", "title": "Management Approach Summary", "clos": ["CLO 1", "CLO 2", "CLO 3", "CLO 4", "CLO 5", "CLO 6"], "weight": "high", "hours": 3, "rsi": 2, "aiRisk": "high"}], "review": ["Two high-stakes assignments in the last week, about 6 hours before readings and the cohort session. Consider moving the Management Approach Summary's first draft into Module 7 or shortening it."]}], "aiCheck": [{"module": 3, "activity": "Feedback Conversation Script", "risk": "high", "why": "A general AI tool writes a plausible SBI feedback script from the scenario alone, with no student judgment visible.", "change": "Students annotate their own script with why each line is there, and rehearse it with a partner in the cohort session. The annotations and the rehearsal are graded."}, {"module": 7, "activity": "Change-Communication Draft and Resistance Map", "risk": "high", "why": "Drafting an announcement from a brief is a strength of AI tools.", "change": "Grade the resistance map first and require the message to answer each mapped source of resistance, then hold a table read in the cohort session where classmates play the crew."}, {"module": 8, "activity": "Management Approach Summary", "risk": "high", "why": "A general reflection on management approach can be produced without the course.", "change": "Students build it from their own earlier submissions, quoting at least three of them and saying what they would now do differently."}, {"module": 2, "activity": "Motivation Diagnosis Memo", "risk": "medium", "why": "AI can apply expectancy theory to the bonus case, but the second case from the student's own team needs their knowledge.", "change": "Keep the student's own team as a required second case."}]}, "mgmt615-cohort.json": {"about": "Recorded demo data for Module 7 (MGMT 615, fictional). Each module's 90-minute cohort session after the refresh: title, the decision it centers on, what students get live (feedback, own job, practice, instructor judgment, assessment preview), segments, the RSI moments and setup needs for the Instructional Technologist. 'review' holds refresh flags and resolutions.", "modules": [{"module": 1, "title": "Dana's First Week: What Would You Do Monday?", "decision": "Work the floor, accept Greg's read, or find the cause", "live": "Applying the concept to their own job", "segments": ["10 min: welcome and introductions in breakouts of four", "25 min: poll on Dana's three options, then debate the split", "35 min: groups map one habit each brought from their own individual-contributor job", "20 min: debrief and preview of Module 2"], "rsi": [4, 1], "setup": ["Poll: three options, exact wording in the lesson plan", "Breakouts of four, 25 minutes"], "review": ["No cohort session was planned for Module 1. Resolution: added, since it's the first time students meet each other and the instructor live."]}, {"module": 2, "title": "Who Gets the Bonus?", "decision": "Keep, adjust or replace the pick-rate bonus", "live": "Your judgment on a messy case", "segments": ["10 min: recap of Dana's situation", "30 min: each breakout gets one piece of evidence (bonus data, Luis's record, the crew's view)", "35 min: groups combine evidence and recommend", "15 min: instructor's call and why"], "rsi": [4, 1], "setup": ["Three different breakout handouts", "Timer for each round"], "review": ["'Diagnosing Motivation Problems Roundtable' named no live moment and failed the recording test as written. Resolution: split-evidence breakouts added."]}, {"module": 3, "title": "Rehearse the Conversation With Jordan", "decision": "Coach, warn, or coach and document", "live": "Practice with peers", "segments": ["10 min: setup", "50 min: breakouts of three, rotating Dana, Jordan and observer", "20 min: observers report the strongest line they heard", "10 min: preview"], "rsi": [4, 2], "setup": ["Breakouts of three, three 15-minute rounds", "Observer checklist in the chat"], "review": []}, {"module": 4, "title": "Fix the Handoff", "decision": "Lunch, joint meeting, or a structural fix", "live": "Applying the concept to their own job", "segments": ["10 min: the 4:45 p.m. handoff", "25 min: poll and debate", "40 min: groups design a handoff fix for a team they know", "15 min: debrief"], "rsi": [4, 1], "setup": ["Poll", "Breakouts of four"], "review": ["'Team Diagnosis Roundtable' repeated the memo prompt. Resolution: students design a fix for a team they know."]}, {"module": 5, "title": "Telling Greg He's Wrong", "decision": "How Dana answers her director", "live": "Practice with peers", "segments": ["10 min: Poll Everywhere results from the week", "45 min: role-play in threes, Dana, Greg, observer", "25 min: two volunteers replay for the class; instructor feedback", "10 min: preview"], "rsi": [4, 2], "setup": ["Show the asynchronous poll results", "Breakouts of three"], "review": []}, {"module": 6, "title": "Twelve Things on the List", "decision": "Which peak-season tasks Dana keeps", "live": "A preview of the next assessment", "segments": ["10 min: setup", "40 min: groups sort Dana's list, then their own", "30 min: groups defend one decision-rights call", "10 min: preview"], "rsi": [4, 1], "setup": ["Shared sorting board link in the chat"], "review": []}, {"module": 7, "title": "Table Read: Ending the Bonus", "decision": "How Dana announces the change", "live": "Feedback on their own work", "segments": ["10 min: setup", "50 min: students read drafts aloud in breakouts; peers play the crew", "20 min: two drafts revised live with the class", "10 min: preview"], "rsi": [4, 2], "setup": ["Breakouts of four", "Students bring their draft"], "review": []}, {"module": 8, "title": "Mock Interview Panel", "decision": "Luis or the outside candidate", "live": "Practice with peers", "segments": ["10 min: setup", "50 min: panels of four interview a volunteer candidate with their scorecards", "20 min: panels compare scores", "10 min: course close"], "rsi": [4, 2], "setup": ["Breakouts of four", "Candidate briefs for volunteers"], "review": []}]}, "mgmt615-foundation.json": {"about": "MGMT 615 (fictional) foundation sections after the refresh, used by the prototype's planning document preview. Program outcomes are fictional.", "course": {"number": "MGMT 615", "title": "Managing People and Performance", "credits": 3, "program": "[Program name]", "idName": "[ID name]"}, "catalog": "MGMT 615 prepares working professionals to manage the people side of organizational performance. Students learn to diagnose why employees and teams underperform, deliver feedback that actually changes behavior, build and repair team dynamics, delegate and make decision-rights calls under pressure, lead a team through change, and hire well. 3 credit hours.", "programOutcomes": ["PLO 1: Lead individuals and teams to meet organizational goals.", "PLO 2: Analyze business problems using evidence and established frameworks.", "PLO 3: Communicate decisions clearly to varied audiences."], "vision": "MGMT 615 turns people who are good at their jobs into people who are good at running a team. Every module asks students to work out what is actually wrong before they choose a fix, and to defend that call to peers in a live cohort session. Students leave with work they can use on the job: a feedback script, a delegation memo, a change announcement and a structured interview scorecard. They finish ready to manage a larger team and to explain the reasoning behind each call.", "learners": "Students are working professionals in a first management role or about to step into one, most promoted after strong work as individual contributors. They arrive with years of workplace experience and plenty of stories about good and bad managers, but little formal training in managing people. They take the course to handle the conversations and decisions their new role puts in front of them. Most work full time and study in the evenings and on weekends.", "clos": ["CLO 1: Diagnose why an employee or team is underperforming using core theories of motivation and performance.", "CLO 2: Design a feedback or coaching conversation that targets a specific behavior and states the change expected.", "CLO 3: Evaluate team dynamics and organizational context to select a management intervention appropriate to the actual problem.", "CLO 4: Justify a delegation or decision-rights call, including the trade-offs involved.", "CLO 5: Draft a management decision message that states the decision and the next steps a direct report must take.", "CLO 6: Evaluate candidates for a role using a structured interview scorecard."], "modules": [{"title": "What Managers Actually Do", "closMet": ["CLO 1", "CLO 5"], "topics": ["What management is and isn't", "From doing the work to getting work done through others", "Common first-90-days mistakes"]}, {"title": "Motivating People", "closMet": ["CLO 1", "CLO 5"], "topics": ["Expectancy and self-determination theory", "Why incentives backfire", "Diagnosing a motivation problem before choosing a fix"]}, {"title": "Performance Management and Feedback", "closMet": ["CLO 2", "CLO 5"], "topics": ["Setting expectations", "The SBI feedback model", "Coaching vs. disciplinary conversations"]}, {"title": "Building and Leading Teams", "closMet": ["CLO 3", "CLO 1"], "topics": ["What predicts team performance", "Structural vs. motivational fixes", "Role clarity and ownership of handoffs"]}, {"title": "Managing Conflict and Difficult Conversations", "closMet": ["CLO 3", "CLO 2"], "topics": ["Task, process and relationship conflict", "Structuring a difficult conversation"]}, {"title": "Delegation and Decision-Making", "closMet": ["CLO 4", "CLO 5"], "topics": ["Sorting tasks by delegation readiness", "Decision rights", "Where AI helps a management decision, and where it misleads"]}, {"title": "Leading Through Change", "closMet": ["CLO 5", "CLO 3"], "topics": ["Why change efforts stall", "Sources of resistance", "Communicating change"]}, {"title": "Hiring and Building Your Team", "closMet": ["CLO 6", "CLO 1"], "topics": ["Why gut-feel hiring fails", "Structured interviews and scorecards", "Proven experience vs. potential"]}], "interactionStatement": "Every Monday I'll post an announcement that picks up Dana's story, names the week's decision and responds to what I saw in your last assignment. You'll get written feedback on each module's main assignment within five days of the due date. I check activity every Wednesday, and if you've missed a module's work, I'll contact you that week.", "character": {"premise": "A story about Dana Ortiz, a newly promoted operations manager at a regional distribution center, who struggles to find the real causes of her site's slipping performance and coach, delegate, communicate and hire her way to a fix when leadership has already decided who to blame.", "position": "Operations manager at a regional distribution center for a mid-size home-goods retailer; leads 3 shift leads and about 45 associates; promoted 8 months ago from day-shift lead.", "conflict": "The quick fix against the right fix. Six weeks before peak season, on-time shipping has dropped from 97% to 89%, and her director has already blamed one shift lead. Dana sees a speed bonus and a handoff no one owns.", "peers": "Ray Kowalski, night-shift lead; Jordan Pike, day-shift lead; Alicia Grant, manager at a sister site; Luis Ferreira, associate.", "valuesFears": "Values reliability, fairness and loyalty to the floor. Fears being wrong about her boss, losing the crew's trust, and missing peak season in her first year.", "backstory": "Started as a seasonal picker; known as the lead who \"just fixes it\"; her first review called her a bottleneck."}, "communicationPlan": ["Monday: opening announcement that carries Dana's story and names the week's decision.", "Wednesday: midpoint announcement responding to what I see in drafts and polls.", "Monday before each Tuesday cohort session: what to prepare or bring.", "Main assignments: clickable rubric plus a 2-minute video comment within five days.", "AI-drafted comments are read and edited before release.", "Opening and closing announcements drafted before the term and scheduled, so they hold up mid-term."]}, "mgmt615-materials.json": {"about": "Recorded demo data for Module 5 (MGMT 615, fictional; every source below is fictional). 'materials' are each module's required materials after the refresh. 'rights' values: library (link to TAMU Libraries record), open (open license, named), public (publicly available web page or video, linked), created (made for the course), ai-assisted (created with AI help; needs a disclosure note), unclear. 'review' holds refresh flags and the faculty member's resolution.", "modules": [{"module": 1, "pages": 20, "materials": [{"type": "Book chapter", "title": "Whitfield (2019), Ch. 2: The Manager's Dilemma", "pages": 14, "rights": "library", "supports": "Case analysis"}, {"type": "Case", "title": "Maria's First Ninety Days", "pages": 4, "rights": "unclear", "supports": "Case analysis"}, {"type": "Scenario exhibit", "title": "Dana's Monday report and Greg's email", "pages": 1, "rights": "created", "supports": "Case analysis"}, {"type": "Interactive reading", "title": "Setting Your Management Baseline", "pages": 2, "rights": "created", "supports": "Discussion"}], "review": ["Maria's First Ninety Days has no author or source listed, so its rights are unclear. Resolution: the instructor wrote it in 2022; marked created.", "Whitfield (2019) is seven years old. Resolution: kept; the instructor confirmed no newer edition."]}, {"module": 2, "pages": 24, "materials": [{"type": "Book chapter", "title": "Whitfield (2019), Ch. 5: What People Actually Want From Work", "pages": 16, "rights": "library", "supports": "Motivation memo"}, {"type": "Article", "title": "Han & Okafor (2023), The incentive trap", "pages": 6, "rights": "library", "supports": "Motivation memo"}, {"type": "Scenario exhibit", "title": "Pick-rate bonus sheet and mis-pick report", "pages": 1, "rights": "ai-assisted", "supports": "Motivation memo"}], "review": ["The bonus sheet was drafted with AI. Resolution: disclosure note added and numbers checked against the scenario."]}, {"module": 3, "pages": 19, "materials": [{"type": "Book chapter", "title": "Marsh (2021), Ch. 4: Feedback That Lands", "pages": 13, "rights": "library", "supports": "Perusall and feedback script"}, {"type": "Job aid", "title": "The SBI Feedback Model, One Page", "pages": 1, "rights": "unclear", "supports": "Feedback script"}, {"type": "Interactive reading", "title": "Script Your Feedback Conversation", "pages": 4, "rights": "created", "supports": "Feedback script"}], "review": ["The SBI job aid copies a published model diagram with no attribution. Resolution: redraw it as created content with an attribution line for the model."]}, {"module": 4, "pages": 21, "materials": [{"type": "Article", "title": "Park & Marsh (2024), What actually predicts team performance", "pages": 11, "rights": "library", "supports": "Team diagnosis memo"}, {"type": "Case", "title": "The Team That Couldn't Ship", "pages": 6, "rights": "created", "supports": "Contrast case for the memo"}, {"type": "Interactive reading", "title": "Diagnose the Team, Not the Person", "pages": 4, "rights": "created", "supports": "Team diagnosis memo"}], "review": ["Supplemental article 'Designing team assignments every learner can do' is a course-design reading, not content for students. Resolution: removed."]}, {"module": 5, "pages": 18, "materials": [{"type": "Book chapter", "title": "Marsh (2021), Ch. 7: The Conversation You're Avoiding", "pages": 12, "rights": "library", "supports": "Perusall and conflict plan"}, {"type": "Scenario exhibit", "title": "Alicia's handoff dashboard", "pages": 1, "rights": "created", "supports": "Conflict plan"}, {"type": "Interactive reading", "title": "Root-Cause the Conflict", "pages": 3, "rights": "created", "supports": "Conflict plan"}], "review": []}, {"module": 6, "pages": 20, "materials": [{"type": "Article", "title": "Han (2025), The delegation trap", "pages": 9, "rights": "library", "supports": "Delegation memo"}, {"type": "Job aid", "title": "Where AI Helps (and Where It Doesn't) in a Management Decision", "pages": 2, "rights": "ai-assisted", "supports": "Delegation memo"}, {"type": "Interactive reading", "title": "Sort the Tasks", "pages": 5, "rights": "created", "supports": "Delegation memo"}], "review": ["The AI job aid was drafted with AI and has no disclosure. Resolution: disclosure note added."]}, {"module": 7, "pages": 17, "materials": [{"type": "Book chapter", "title": "Whitfield (2019), Ch. 9: Announcing Change Without Losing the Room", "pages": 11, "rights": "library", "supports": "Change message"}, {"type": "Case", "title": "The Reorg Nobody Saw Coming", "pages": 4, "rights": "created", "supports": "Discussion"}, {"type": "Interactive reading", "title": "Draft Your Change Message", "pages": 2, "rights": "created", "supports": "Change message"}], "review": []}, {"module": 8, "pages": 19, "materials": [{"type": "Article", "title": "Han & Diallo (2023), Structured interviews outperform gut feel", "pages": 10, "rights": "library", "supports": "Scorecard and hiring memo"}, {"type": "Scenario exhibit", "title": "Two candidate files: Luis and the outside finalist", "pages": 2, "rights": "created", "supports": "Scorecard and hiring memo"}, {"type": "Interactive reading", "title": "Potential vs. Proven: Make the Call", "pages": 4, "rights": "created", "supports": "Hiring memo"}], "review": ["Scenario exhibits were missing from the plan for Modules 1, 2, 5 and 8. Resolution: added as created content."]}]}, "mgmt615-media.json": {"about": "Recorded demo data for Module 6 (MGMT 615, fictional). 'media' is each module's produced media after the refresh: kind (welcome, overview, teaching, scenario, closing, graphic, audio), title, minutes, where it's made (xr-stage, media-team, faculty-self), and its storyline connection. Curated videos belong to Module 5, not here. 'review' holds refresh flags and resolutions.", "modules": [{"module": 1, "minutes": 9.5, "media": [{"kind": "welcome", "title": "Welcome to MGMT 615", "minutes": 3, "where": "xr-stage", "story": "Introduces Dana and the drop in on-time shipping that starts the course"}, {"kind": "overview", "title": "Module 1 overview: What Managers Actually Do", "minutes": 2, "where": "xr-stage", "story": "Names Dana's first decision: work the floor or find the cause"}, {"kind": "scenario", "title": "The First Bad Week", "minutes": 2.5, "where": "media-team", "story": "Dana's Monday report and Greg's email, ending at her decision"}, {"kind": "graphic", "title": "Manager vs. individual contributor: where the time goes", "minutes": 0, "where": "media-team", "story": "Used in Dana's first-week case"}], "review": ["No module overview video in the course map for Modules 1 to 8; the first teaching video in each module partly does the job. Resolution: add a 2-minute overview per module, recorded on the XR stage in one session."]}, {"module": 2, "minutes": 10, "media": [{"kind": "overview", "title": "Module 2 overview: Motivating People", "minutes": 2, "where": "xr-stage", "story": "Picks up the bonus problem"}, {"kind": "teaching", "title": "Motivation Isn't One Thing", "minutes": 6, "where": "xr-stage", "story": "Applies expectancy theory to the pick-rate bonus"}, {"kind": "scenario", "title": "The Bonus That Backfired", "minutes": 2, "where": "media-team", "story": "Luis keeps missing the bonus he refuses to chase"}], "review": ["'Discussion Primer: The Incentive Trap' summarized an article without connecting to the story. Resolution: replaced by the scenario video."]}, {"module": 3, "minutes": 14, "media": [{"kind": "overview", "title": "Module 3 overview: Performance Management and Feedback", "minutes": 2, "where": "xr-stage", "story": "Greg wants a formal warning for Jordan"}, {"kind": "teaching", "title": "Giving Feedback That Actually Changes Behavior", "minutes": 7, "where": "xr-stage", "story": "Uses Jordan's handoff habit as the running example"}, {"kind": "scenario", "title": "Role-play: a coaching conversation with Jordan", "minutes": 5, "where": "media-team", "story": "Models the conversation Dana could have"}], "review": ["The 8-minute teaching video runs past 6 minutes. Resolution: kept at 7 minutes in two clearly marked parts."]}, {"module": 4, "minutes": 11, "media": [{"kind": "overview", "title": "Module 4 overview: Building and Leading Teams", "minutes": 2, "where": "xr-stage", "story": "The handoff nobody owns"}, {"kind": "teaching", "title": "Why Some Teams Just Work", "minutes": 6, "where": "xr-stage", "story": "Diagnoses the two-shift handoff with the framework"}, {"kind": "graphic", "title": "The 4:45 p.m. handoff, day shift to night shift", "minutes": 0, "where": "media-team", "story": "Shows what falls between the shifts"}, {"kind": "scenario", "title": "Structural Fixes vs. Pep Talks", "minutes": 3, "where": "media-team", "story": "Greg's team-building lunch against a handoff owner"}], "review": []}, {"module": 5, "minutes": 12, "media": [{"kind": "overview", "title": "Module 5 overview: Managing Conflict and Difficult Conversations", "minutes": 2, "where": "xr-stage", "story": "Greg wants a plan by Friday"}, {"kind": "teaching", "title": "The Conversation Managers Avoid", "minutes": 6, "where": "xr-stage", "story": "Maps Dana's disagreement with Greg to its root cause"}, {"kind": "scenario", "title": "Role-play: telling Greg he's wrong, done well and done badly", "minutes": 4, "where": "media-team", "story": "Two versions of Dana's conversation"}], "review": []}, {"module": 6, "minutes": 11.5, "media": [{"kind": "overview", "title": "Module 6 overview: Delegation and Decision-Making", "minutes": 2, "where": "xr-stage", "story": "Twelve things on Dana's list"}, {"kind": "teaching", "title": "The Delegation Trap", "minutes": 6, "where": "xr-stage", "story": "Sorts Dana's peak-season list"}, {"kind": "teaching", "title": "Where AI Helps, and Where It Doesn't, in Management Decisions", "minutes": 3.5, "where": "faculty-self", "story": "The scheduling tool that says cut a shift"}], "review": []}, {"module": 7, "minutes": 12, "media": [{"kind": "overview", "title": "Module 7 overview: Leading Through Change", "minutes": 2, "where": "xr-stage", "story": "The floor is calling it a pay cut"}, {"kind": "teaching", "title": "Why Change Announcements Fall Flat", "minutes": 6, "where": "xr-stage", "story": "Uses Dana's bonus change as the case"}, {"kind": "teaching", "title": "Rewriting a Change Message, Live", "minutes": 4, "where": "xr-stage", "story": "Rewrites Dana's first draft on screen"}], "review": []}, {"module": 8, "minutes": 13, "media": [{"kind": "overview", "title": "Module 8 overview: Hiring and Building Your Team", "minutes": 2, "where": "xr-stage", "story": "The new shift-lead role"}, {"kind": "teaching", "title": "Stop Hiring on Gut Feel", "minutes": 6, "where": "xr-stage", "story": "Builds the scorecard for Dana's two finalists"}, {"kind": "scenario", "title": "Proven vs. Potential", "minutes": 2.5, "where": "media-team", "story": "Luis and the outside candidate"}, {"kind": "closing", "title": "Course conclusion", "minutes": 2.5, "where": "xr-stage", "story": "Where Dana's story ends and what students take into their own teams"}], "review": []}]}, "mgmt615-scenarios.json": {"about": "Recorded demo data for Module 3, steps 3.2 and 3.3 (MGMT 615, fictional). 'chosen' is the scenario the demo faculty member keeps; 'alternative' is the second option the AI offers. CLO numbers follow the revised CLOs from step 1.4.", "storylinePremise": "MGMT 615 is a story about Dana Ortiz, a newly promoted operations manager, who struggles to find and fix the real causes of her site's slipping performance before peak season, when her director has already decided who to blame.", "modules": [{"module": 1, "chosen": {"title": "The First Bad Week", "premise": "Dana struggles to step back and find out why on-time shipping has dropped, when her instinct is to work extra floor shifts and push the number back up herself.", "clos": ["CLO 1", "CLO 5"], "situation": "Eight months into her first management job, Dana runs a distribution center with three shift leads and about 45 associates. Her job now is to hit site targets through her leads.", "trigger": "The Monday report shows on-time shipping down from 97% to 89%, six weeks before peak season. Her director, Greg, has already named the cause: \"Jordan's shift is the problem.\"", "stakeholders": "Dana; shift leads Jordan Pike and Ray Kowalski; the hourly crew; Greg; customers waiting on late orders.", "decision": "How to spend her week: work the floor to recover the number, accept Greg's read and focus on Jordan, or step back and find out what is driving the drop.", "outcome": "Working the floor would lift the number for a few days and hide the cause. Separating a manager's job from a lead's job shows Dana the habit she has carried over. She pulls the error reports instead, which starts the investigation that runs through the course."}, "alternative": {"title": "The Jammed Sorter", "premise": "Dana struggles to decide whether to clear a sorter jam herself or hand it to Jordan, with trucks waiting and the crew watching."}}, {"module": 2, "chosen": {"title": "The Bonus That Backfired", "premise": "Dana struggles to figure out why a bonus her crew is hitting is making performance worse, and why Luis, one of her most accurate associates, keeps missing it.", "clos": ["CLO 1", "CLO 5"], "situation": "The site pays a pick-rate bonus for speed. The crew is hitting its targets, but on-time shipping keeps falling.", "trigger": "Mis-picks and reworked orders are climbing. Luis keeps missing the bonus because he checks the orders others rush.", "stakeholders": "Luis and the crew who count on the bonus; Jordan and Ray; Greg; customers.", "decision": "Leave the bonus alone and coach for accuracy, add an accuracy threshold, or propose replacing it before peak season.", "outcome": "Expectancy theory explains the drop: the crew believes speed earns the reward, so speed is what they deliver. Dana takes Greg a revised bonus tied to accurate, on-time orders, which sets up Module 7."}, "alternative": {"title": "Luis Checks Out", "premise": "Dana struggles to re-engage Luis, passed over for a lead role last spring, when the only reward the site offers is a bonus he refuses to chase."}}, {"module": 3, "chosen": {"title": "The Conversation With Jordan", "premise": "Dana struggles to run a coaching conversation that changes how Jordan closes out his shift, when her director wants it documented as a formal warning.", "clos": ["CLO 2", "CLO 5"], "situation": "Dana needs Jordan, her day-shift lead, to change how he hands off to night shift. He came up under her and avoids hard conversations with his crew.", "trigger": "Orders keep slipping in the hour around shift change, and Jordan has turned defensive. Greg tells Dana to issue a formal warning.", "stakeholders": "Jordan; Dana; Greg; Ray, whose shift inherits the unfinished work; the day-shift crew.", "decision": "Issue the warning Greg wants, hold a coaching conversation with no record, or coach first and document only the next steps they agree on.", "outcome": "A warning would put Jordan on record without changing how he closes out his shift. Separating coaching from discipline lets Dana name one behavior and the change she expects, while keeping a record Greg can see."}, "alternative": {"title": "The Repeated Shortcut", "premise": "Dana struggles to decide whether a repeated safety shortcut on Ray's shift calls for coaching or for discipline."}}, {"module": 4, "chosen": {"title": "The Handoff Nobody Owns", "premise": "Dana struggles to fix the broken handoff between her two shifts with a structural change, when her director is pushing a team-building lunch.", "clos": ["CLO 3", "CLO 1"], "situation": "The two shifts pass work to each other every afternoon, but no one owns the handoff. Unfinished orders and staffing gaps fall between the leads.", "trigger": "Ray and Jordan now blame each other's shifts for the late orders. Greg suggests a team-building lunch to get everyone on the same page.", "stakeholders": "Jordan and Ray; both crews; Dana; Greg; customers.", "decision": "Host the lunch, hold a joint meeting to air the tension, or change the structure: name a handoff owner and add a shared checklist and an overlap window.", "outcome": "A team-effectiveness framework shows the problem is unclear roles and process, so a lunch won't touch it. Dana proposes the structural fix and has to explain to Greg why it beats his idea."}, "alternative": {"title": "Two Shifts, Two Rulebooks", "premise": "Dana struggles to get day and night shift working from one set of procedures, when each lead insists his shift's way is the reason it performs."}}, {"module": 5, "chosen": {"title": "Telling Greg He's Wrong", "premise": "Dana struggles to disagree with her director, using evidence, before he replaces Jordan for a problem Jordan didn't cause alone.", "clos": ["CLO 3", "CLO 2"], "situation": "Dana has data from Alicia Grant's dashboard showing late orders clustered around shift change on both shifts, and mis-picks rising since the bonus started.", "trigger": "Greg emails: \"Fix him or replace him. I want a plan by Friday.\" On a follow-up call he says he doesn't need a study.", "stakeholders": "Greg; Jordan, whose job is at risk; Dana, whose credibility is on the line; Ray and Alicia, who favor replacing Jordan; the crew.", "decision": "Send the replacement plan, agree to a warning and fix the handoff quietly, or ask for 30 minutes to walk Greg through the data and propose a two-week handoff fix first.", "outcome": "Mapping the conflict shows a process problem, which changes what the conversation is about. A structured plan lets Dana open with evidence instead of defending Jordan."}, "alternative": {"title": "Ray vs. Jordan", "premise": "Dana struggles to settle a floor argument between her shift leads that looks personal but is really about a process neither one owns."}}, {"module": 6, "chosen": {"title": "Twelve Things on Dana's List", "premise": "Dana struggles to decide which of her twelve peak-season responsibilities to keep and which to hand off, after a lead gets an overtime call wrong.", "clos": ["CLO 4", "CLO 5"], "situation": "Peak season has started. Dana has twelve responsibilities, from carrier escalations to overtime approvals, and her first review called her a bottleneck.", "trigger": "In the first week of the peak push, her leads miss an overtime rule. Dana's instinct is to take every overtime call back.", "stakeholders": "Dana; Jordan and Ray; associates working overtime; Greg; Alicia, who delegates heavily.", "decision": "Sort the list into keep, hand off, and hand off with checkpoints. The hardest call is who owns the shift handoff and overtime approvals.", "outcome": "A delegation framework helps Dana hand the shift handoff to one lead with a weekly checkpoint and keep overtime approvals for now, with a date to revisit. She has to justify that trade-off to Greg."}, "alternative": {"title": "The Scheduling Tool Says Cut", "premise": "Dana struggles to decide whether to follow an AI scheduling tool's recommendation to cut a shift, with a carrier deadline in two days and no time to check its assumptions."}}, {"module": 7, "chosen": {"title": "Ending the Bonus", "premise": "Dana struggles to announce a change to the bonus in a way her crew will understand and accept, when the floor already calls it a pay cut.", "clos": ["CLO 5", "CLO 3"], "situation": "Greg has approved Dana's revised bonus, which pays for accurate, on-time orders. It starts next pay period.", "trigger": "The crew likes the old bonus, and the fastest pickers earn more under it. Before Dana says anything, she hears people calling it a pay cut.", "stakeholders": "The crew; Luis, who stands to gain; Jordan and Ray, who will field questions; Greg; Dana.", "decision": "Send a written notice, have her leads announce it at shift start, or meet each shift herself and walk through what changes and why.", "outcome": "Naming the likely sources of resistance, such as lost income and distrust of a new manager, tells Dana what her message has to answer. She drafts it in plain language: what changes, when it starts and how to earn the new bonus."}, "alternative": {"title": "The Overlap Window", "premise": "Dana struggles to introduce a thirty-minute shift overlap that both crews see as unpaid extra work."}}, {"module": 8, "chosen": {"title": "Proven vs. Potential", "premise": "Dana struggles to choose between an experienced outside candidate and Luis, a high-potential associate, for the new shift-lead role that will own the handoff.", "clos": ["CLO 6", "CLO 1"], "situation": "Dana has approval for a new shift-lead role that owns the handoff between shifts, the permanent fix for the gap that started the story.", "trigger": "Two finalists: an outside candidate who has run shift operations elsewhere, and Luis, highly accurate but never a supervisor. Ray backs the outside hire, and the crew is watching to see whether Luis gets a shot.", "stakeholders": "Luis; the outside candidate; Ray and Jordan; the crew; Greg.", "decision": "Hire the proven candidate, hire Luis, or hire one and build a development path for the other.", "outcome": "A structured scorecard tied to skills from earlier modules, like coaching and owning a handoff, keeps Dana from deciding on experience or loyalty alone. Whichever she picks, she has to justify the trade-off."}, "alternative": {"title": "Twenty Temps in Ten Days", "premise": "Dana struggles to hire twenty seasonal associates in ten days without falling back on gut feel."}}]}}, "sources": {"coursemap-v3": {"title": "Course Map, FODW II V3"}, "template-planning-doc": {"title": "Course Planning Document template"}, "tool-course-creator": {"title": "Course Creator 3.1.28"}, "reading-gs-flex-online-process": {"title": "Engaging in the Flex Online Process"}, "guide-course-development-process": {"title": "Flex Online Course Development Process", "citation": "TLI. (2026). Flex Online Course Development Process [Guide]."}, "ext-garrison-2000": {"title": "Critical inquiry in a text-based environment", "citation": "Garrison, D. R., Anderson, T., & Archer, W. (2000). Critical inquiry in a text-based environment: Computer conferencing in higher education. The Internet and Higher Education, 2(2-3), 87-105."}, "ext-richardson-swan-2003": {"title": "Examining social presence in online courses", "citation": "Richardson, J. C., & Swan, K. (2003). Examining social presence in online courses in relation to students' perceived learning and satisfaction. Journal of Asynchronous Learning Networks, 7(1), 68-88."}, "ext-pacansky-brock-2020": {"title": "How to humanize your online course", "citation": "Pacansky-Brock, M. (2020). How to humanize your online course.", "url": "https://brocansky.com/humanizing"}, "reading-m1-setting-the-foundation": {"title": "Setting the Foundation"}, "guide-course-alignment": {"title": "Course Alignment", "citation": "TLI. (2026). Course Alignment [Guide]."}, "guide-learning-objectives": {"title": "Course-Level Learning Objectives", "citation": "TLI. (2026). Course-Level Learning Objectives [Guide]."}, "assignm const KEY = 'course-plan-builder-prototype:state';
let state = { track: null, done: {}, at: 'welcome', showAll: false };

function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) state = Object.assign(state, s); } catch (e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);

/* ---------- content parsing ---------- */
function stripNotes(text) {
  const out = []; let skipping = false;
  for (const line of text.split('\n')) {
    if (line.startsWith('> Review note')) { skipping = true; continue; }
    if (skipping && line.startsWith('>')) continue;
    skipping = false; out.push(line);
  }
  return out.join('\n');
}
function splitBy(text, marker) {
  const parts = []; let cur = { head: null, body: [] };
  for (const line of text.split('\n')) {
    if (line.startsWith(marker)) { parts.push(cur); cur = { head: line.slice(marker.length).trim(), body: [] }; }
    else cur.body.push(line);
  }
  parts.push(cur);
  return parts.map(p => ({ head: p.head, body: p.body.join('\n').trim() }));
}
function parseModule(m) {
  const text = stripNotes(m.raw);
  const title = (text.match(/^# (.+)$/m) || [, m.id])[1];
  const top = splitBy(text, '## ');
  const mod = { id: m.id, title, intro: top[0].body.replace(/^# .+$/m, '').trim(), reflection: null, prep: null, steps: [] };
  for (const sec of top.slice(1)) {
    if (/^Refresh reflection/.test(sec.head)) mod.reflection = sec.body;
    else if (/^Check-in prep/.test(sec.head)) mod.prep = sec.body;
    else {
      const subs = splitBy(sec.body, '### ');
      const lead = subs[0].body;
      const step = { key: sec.head.split(' ')[0], title: sec.head, lead, parts: {} };
      for (const s of subs.slice(1)) step.parts[s.head] = s.body;
      mod.steps.push(step);
    }
  }
  return mod;
}
let MODULES = DATA.modules.map(parseModule);

/* ---------- edit mode ----------
   Each editable block carries data-s, an index into SRC that records the exact source text it came
   from (a markdown snippet, a table row, or a JSON string). An edit replaces that snippet, so it
   can be applied to the content files by tools/apply_edits.py. A block is editable only when its
   source text occurs exactly once in its file. */
const EKEY = 'course-plan-builder-prototype:edits';
let editing = false, edits = [], SRC = [], CUR = null, noTag = 0;
const count = (hay, needle) => needle ? hay.split(needle).length - 1 : 0;
const norm = s => s.replace(/\s+/g, ' ');
// True when the new text is already in place (for example, applied to the files and rebuilt).
const landed = (hay, o, n) => norm(hay).includes(norm(n)) && (!hay.includes(o) || norm(n).includes(norm(o)));
function tag(kind, old, extra) {
  if (!CUR || noTag || old == null || !String(old).trim()) return '';
  const hay = CUR.demo ? JSON.stringify(DATA.demo[CUR.demo]) : CUR.mod.raw;
  if (count(hay, kind === 'json' ? JSON.stringify(old) : old) !== 1) return '';
  SRC.push(Object.assign({ file: CUR.file, kind, old }, extra));
  return ' data-s="' + (SRC.length - 1) + '"';
}
function patch(file, kind, old, nu) {
  if (file.startsWith('demo/')) {
    const name = file.slice(5);
    const hay = DATA.demo[name] ? JSON.stringify(DATA.demo[name]) : '';
    if (!hay.includes(JSON.stringify(old)) || landed(hay, JSON.stringify(old), JSON.stringify(nu))) return false;
    const fix = v => Array.isArray(v) ? v.map(fix) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fix(x)])) : v === old ? nu : v;
    DATA.demo[name] = fix(DATA.demo[name]); return true;
  }
  const m = DATA.modules.find(x => x.file === file);
  const o = kind === 'json' ? JSON.stringify(old) : old, n = kind === 'json' ? JSON.stringify(nu) : nu;
  if (!m || !m.raw.includes(o) || landed(m.raw, o, n)) return false;
  m.raw = m.raw.replace(o, () => n);
  MODULES = DATA.modules.map(parseModule); return true;
}
function loadEdits() {
  try { edits = JSON.parse(localStorage.getItem(EKEY) || '[]'); } catch (e) { edits = []; }
  // Edits already applied to the content files no longer match and are dropped.
  edits = edits.filter(e => patch(e.file, e.kind, e.old, e.new));
  saveEdits();
}
function saveEdits() { try { localStorage.setItem(EKEY, JSON.stringify(edits)); } catch (e) {} }
function toMd(el, kind) {
  if (kind === 'pre') return el.innerText.replace(/ /g, ' ').replace(/\n+$/, '');
  if (kind === 'json') return el.innerText.replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
  const walk = n => [...n.childNodes].map(c => {
    if (c.nodeType === 3) return c.nodeValue;
    if (c.nodeType !== 1) return '';
    const t = c.tagName, inner = walk(c);
    if (t === 'BR') return ' ';
    if (c.dataset.cite) return '`src:' + c.dataset.cite + '`';
    if (!inner.trim()) return inner;
    if (t === 'STRONG' || t === 'B') return '**' + inner.trim() + '**';
    if (t === 'EM' || t === 'I') return '*' + inner.trim() + '*';
    if (t === 'CODE') return '`' + inner + '`';
    if (t === 'A') return '[' + inner + '](' + c.getAttribute('href') + ')';
    if (t === 'DIV' || t === 'P') return ' ' + inner + ' ';
    return inner;
  }).join('');
  return walk(el).replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
}
function recordEdit(el) {
  const s = el._s; if (!s) return;
  const now = toMd(el, s.kind);
  if (now === el.dataset.base) return;
  el.dataset.base = now;
  let nu = now;
  if (s.kind === 'row') {
    const cells = s.old.replace(/^\||\|$/g, '').split('|');
    cells[s.cell] = ' ' + now.replace(/\|/g, '/') + ' ';
    nu = '|' + cells.join('|') + '|';
  }
  if (!patch(s.file, s.kind, s.old, nu)) return;
  const prev = edits.find(e => e.file === s.file && e.kind === s.kind && e.new === s.old);
  if (prev) { prev.new = nu; if (prev.new === prev.old) edits.splice(edits.indexOf(prev), 1); }
  else edits.push({ file: s.file, kind: s.kind, old: s.old, new: nu, marker: s.marker, step: state.at });
  SRC.forEach(x => { if (x.file === s.file && x.old === s.old) x.old = nu; });
  saveEdits(); updateBar();
  if (s.kind === 'title') renderNav();
}
function decorate() {
  document.body.classList.toggle('editing', editing);
  $('#editBtn').setAttribute('aria-pressed', String(editing));
  $('#editbar').hidden = !editing;
  if (!editing) return;
  $('#main').querySelectorAll('[data-s]').forEach(el => {
    el._s = SRC[el.dataset.s]; el.contentEditable = 'true'; el.spellcheck = true;
    el.dataset.base = toMd(el, el._s.kind);
  });

}
function updateBar() {
  $('#ecount').textContent = edits.length ? edits.length + (edits.length === 1 ? ' change' : ' changes') + ' so far.' : 'No changes yet.';
}
function downloadEdits() {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const day = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const blob = new Blob([JSON.stringify({ saved: d.toISOString(), edits }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);

/* ---------- markdown ---------- */
function inline(s) {
  s = esc(s);
  s = s.replace(/`src:([a-z0-9-]+)`/g, (_, id) => {
    const src = DATA.sources[id];
    if (!src) return '<span class="cite" data-cite="' + esc(id) + '">' + esc(id) + '</span>';
    const label = esc(src.citation || src.title);
    return src.url ? '<a class="cite" data-cite="' + esc(id) + '" href="' + esc(src.url) + '" target="_blank" rel="noopener">' + label + '</a>' : '<span class="cite" data-cite="' + esc(id) + '">' + label + '</span>';
  });
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(text, opts = {}) {
  const lines = text.split('\n'); let html = ''; let i = 0;
  while (i < lines.length) {
    let line = lines[i];
    if (/^```/.test(line)) {
      const lang = line.slice(3).trim(); const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      html += codeBlock(lang, buf.join('\n'), opts); continue;
    }
    if (/^\|/.test(line)) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = cells(rows[0]); const body = rows.slice(2).map(cells);
      const cell = (el, r, k, c) => '<' + el + tag('row', rows[r], { cell: k }) + '>' + inline(c) + '</' + el + '>';
      html += '<div class="scroll"><table><thead><tr>' + head.map((h, k) => cell('th', 0, k, h)).join('') + '</tr></thead><tbody>' +
        body.map((r, j) => '<tr>' + r.map((c, k) => cell('td', j + 2, k, c)).join('') + '</tr>').join('') + '</tbody></table></div>';
      continue;
    }
    if (/^>/.test(line)) {
      const buf = []; while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      noTag++; html += '<blockquote>' + md(buf.join('\n')) + '</blockquote>'; noTag--; continue;
    }
    if (/^\s*(-|\d+\.)\s/.test(line)) {
      const ordered = /^\s*\d+\./.test(line); const items = [];
      while (i < lines.length && (/^\s*(-|\d+\.)\s/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const mk = lines[i].match(/^\s*(-|\d+\.)\s/);
        if (mk) items.push({ text: lines[i].slice(mk[0].length), src: lines[i].slice(mk[0].length), marker: mk[0] });
        else { const it = items[items.length - 1]; it.text += ' ' + lines[i].trim(); it.src += '\n' + lines[i]; }
        i++;
      }
      const el = ordered ? 'ol' : 'ul';
      html += '<' + el + '>' + items.map(t => '<li' + tag('li', t.src, { marker: t.marker }) + '>' + inline(t.text) + '</li>').join('') + '</' + el + '>'; continue;
    }
    if (/^#{3,6}\s/.test(line)) { html += '<h4' + tag('h', line.replace(/^#+\s/, '')) + '>' + inline(line.replace(/^#+\s/, '')) + '</h4>'; i++; continue; }
    if (/^---\s*$/.test(line) || !line.trim()) { i++; continue; }
    const buf = []; while (i < lines.length && lines[i].trim() && !/^(```|\||>|\s*(-|\d+\.)\s|#{3,6}\s)/.test(lines[i])) buf.push(lines[i++]);
    html += '<p' + tag('p', buf.join('\n')) + '>' + inline(buf.join(' ')) + '</p>';
  }
  return html;
}
function codeBlock(lang, code, opts) {
  if (lang === 'json') {
    let v; try { v = JSON.parse(code); } catch (e) { return '<pre>' + esc(code) + '</pre>'; }
    return '<div class="demo-out" ' + (opts.hideDemo ? 'hidden' : '') + '>' + renderValue(v) + '</div>';
  }
  if (lang === 'text') return '<details><summary>What the AI is asked to do</summary><pre' + tag('pre', code) + '>' + esc(code) + '</pre></details>';
  return '<pre' + tag('pre', code) + '>' + esc(code) + '</pre>';
}
function renderValue(v) {
  if (v === null || v === undefined) return '<span class="empty">none</span>';
  if (Array.isArray(v)) {
    if (!v.length) return '<span class="empty">none</span>';
    if (v.every(x => typeof x !== 'object' || x === null)) return '<ul>' + v.map(x => '<li' + (typeof x === 'string' ? tag('json', x) : '') + '>' + esc(x) + '</li>').join('') + '</ul>';
    return v.map(x => '<div class="card">' + renderValue(x) + '</div>').join('');
  }
  if (typeof v === 'object') {
    return Object.entries(v).map(([k, val]) => '<div class="kv"><div class="k">' + esc(k.replace(/([A-Z])/g, ' $1')) + '</div>' + renderValue(val) + '</div>').join('');
  }
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  return '<div' + (typeof v === 'string' ? tag('json', v) : '') + '>' + esc(v) + '</div>';
}

const STEP_DOC = { 'GS.2': ['title'], '1.1': ['catalog', 'plos', 'learners'], '1.2': ['vision'], '1.3': ['clos'], '1.4': ['modules'],
  '2.1': ['interaction'], '2.2': ['character'], '3.1': ['premise'], '3.2': ['scenario'], '4.1': ['activities', 'tools'],
  '5.1': ['materials'], '6.1': ['media'], '7.1': ['cohort'], '8.2': ['communication'] };
function shown(section) {
  if (state.showAll) return true;
  return Object.entries(STEP_DOC).some(([k, v]) => v.includes(section) && state.done[k]);
}

function renderNav() {
  let h = '<button type="button" data-go="welcome"' + (state.at === 'welcome' ? ' aria-current="page"' : '') + '><span class="mark"></span>Welcome</button>';
  for (const m of MODULES) {

    if (m.reflection && state.track === 'refresh') h += navBtn(m.id + ':reflection', 'Reflection', state.done[m.id + ':reflection']);
    for (const s of m.steps) h += navBtn(m.id + ':' + s.key, s.title.replace(/\s*\(optional\)/, ''), state.done[s.key]);
    if (m.prep) h += navBtn(m.id + ':prep', 'Check-in prep', state.done[m.id + ':prep']);

}
function navBtn(go, label, done) {
  return '<button type="button" data-go="' + esc(go) + '"' + (state.at === go ? ' aria-current="page"' : '') + '><span class="mark" aria-hidden="true">' + (done ? '✓' : '') + '</span><span>' + esc(label) + (done ? '<span class="sr-only" style="position:absolute;left:-9999px"> (done)</span>' : '') + '</span></button>';
}
function order() {
  const list = ['welcome'];
  for (const m of MODULES) {
    if (m.reflection && state.track === 'refresh') list.push(m.id + ':reflection');
    for (const s of m.steps) list.push(m.id + ':' + s.key);
    if (m.prep) list.push(m.id + ':prep');
  }
  return list;
}
function go(where) { state.at = where; save(); render(); $('#main').focus(); window.scrollTo(0, 0); }
function next() { const o = order(); const i = o.indexOf(state.at); if (i < o.length - 1) go(o[i + 1]); }

function renderWelcome() {
  return '<div class="welcome"><p class="crumb">Flex Online Design Workshop II</p><h2 class="step">Plan your Flex Online course</h2>' +
    '<p>This prototype walks through the workshop with MGMT 615: Managing People and Performance, a fictional course, and plays back recorded AI responses so the demo never depends on a live connection. Every step builds or reviews one section of the Course Planning Document; open it any time with <strong>Planning document</strong>.</p>' +
    '<h3>Choose a track</h3><div class="choice">' +
    '<button type="button" data-track="full" aria-pressed="' + (state.track === 'full') + '"><strong>Full build</strong>A new course, or a course rebuilt from the beginning. Each step drafts its section from your course details.</button>' +
    '<button type="button" data-track="refresh" aria-pressed="' + (state.track === 'refresh') + '"><strong>Refresh</strong>A course that already runs online. You upload your course map, and each step reviews your current section with flags and suggested revisions.</button></div>' +
    '<div class="row"><button type="button" class="btn" data-next ' + (state.track ? '' : 'disabled') + '>Start</button>' +
    '<button type="button" class="btn sec" id="reset">Reset the demo</button></div></div>';
}
function findStep(go) {
  const [mid, key] = go.split(':');
  const m = MODULES.find(x => x.id === mid);
  return { m, key, step: m && m.steps.find(s => s.key === key) };
}
function aiPart(title, body) {
  // Everything from the first "Demo response" on is the recorded AI output, revealed by the button.
  const at = body.search(/(^|\n)Demo (response|answers)/);
  const before = at < 0 ? body : body.slice(0, at);
  const after = at < 0 ? '' : body.slice(at).replace(/^\n/, '');
  const recorded = after ? '<div class="demo-out" hidden><p class="crumb">Recorded response, MGMT 615</p>' + md(after) + '</div>' : '';
  return '<section class="part ai"><h3>' + esc(title) + ' <span class="tag">AI</span></h3>' + md(before, { hideDemo: true }) + recorded +
    demoFiles(body) +
    '<div class="row"><button type="button" class="btn" data-draft>' + (state.track === 'refresh' ? 'Review with AI' : 'Draft with AI') + '</button><span class="thinking" hidden>Working…</span></div></section>';
}
function demoFiles(body) {
  const files = [...new Set((body.match(/demo\/mgmt615-[a-z]+\.json/g) || []))];
  return files.map(f => {
    const d = DATA.demo[f.replace('demo/', '')]; if (!d) return '';
    const v = d.modules ? d.modules.map(x => { const c = Object.assign({}, x); return c; }) : d;
    const was = CUR; CUR = { file: f, demo: f.replace('demo/', '') };
    const out = '<div class="demo-out" hidden><p class="crumb">Recorded responses, MGMT 615</p>' + renderValue(v) + '</div>';
    CUR = was; return out;
  }).join('');
}
function renderStep(goKey) {
  const { m, key, step } = findStep(goKey);
  const src = DATA.modules.find(x => x.id === m.id);
  CUR = { file: src.file, mod: src };
  const crumb = '<p class="crumb">' + esc(m.title) + '</p>';
  if (key === 'reflection' || key === 'prep') {
    const body = key === 'reflection' ? m.reflection : m.prep;
    const t = key === 'reflection' ? 'Refresh reflection' : 'Check-in prep';
    const done = state.done[goKey];
    return crumb + '<h2 class="step">' + t + '</h2>' +
      (key === 'prep' ? aiPart('Summary for your ID', body) : '<section class="part">' + md(body) + '</section>') +
      '<div class="row"><button type="button" class="btn" data-save="' + esc(goKey) + '">' + (key === 'prep' ? 'Ready for check-in' : 'Save answers') + '</button>' + (done ? '<span class="done-note">Saved</span>' : '') + '</div>';
  }
  const p = step.parts;
  let h = crumb + '<h2 class="step"' + tag('title', step.title) + '>' + esc(step.title) + '</h2><div class="meta">' + md(step.lead) + '</div>';
  if (p['Learn']) h += '<section class="part"><h3>Learn</h3>' + md(p['Learn']) + '</section>';
  if (p['See it']) h += '<section class="part"><h3>See it <span class="tag">MGMT 615</span></h3>' + md(p['See it']) + '</section>';
  const both = p['Draft (full build) and Review (refresh)'];
  if (both) h += aiPart(state.track === 'refresh' ? 'Review' : 'Draft', both);
  else if (state.track === 'refresh' && p['Review (refresh)']) h += aiPart('Review', p['Review (refresh)']);
  else if (p['Draft (full build)']) h += aiPart('Draft', p['Draft (full build)']);
  if (p['Decide']) {
    const dec = p['Decide'].replace(/(^|\n)- (.+)/g, '$1[[CHK]]$2');
    const parts = dec.split('\n'); let txt = [], checks = [];
    for (const l of parts) (l.startsWith('[[CHK]]') ? checks : txt).push(l.replace('[[CHK]]', ''));
    h += '<section class="part"><h3>Decide</h3>' + md(txt.join('\n').replace(/Checklist[^:\n]*:/, '')) +
      (checks.length ? '<div class="checklist" role="group" aria-label="Checklist">' + checks.map((c, i) => '<label><input type="checkbox" id="c' + i + '"> <span' + tag('li', c, { marker: '- ' }) + '>' + inline(c) + '</span></label>').join('') + '</div>' : '') + '</section>';
  }
  if (p['Checks']) h += '<section class="part" id="checks" hidden><h3>Checks <span class="tag">ran on save</span></h3>' + md(p['Checks']) +
    '<div class="flag ok">Every flag is fixed or has a note. This section is ready for your ID.</div></section>';
  if (p['Save']) h += '<section class="part"><h3>Save</h3>' + md(p['Save']) + '</section>';
  if (p['Go deeper (optional)']) h += '<details class="part"><summary>Go deeper (optional)</summary>' + md(p['Go deeper (optional)']) + '</details>';
  h += '<div class="row"><button type="button" class="btn" data-save="' + esc(key) + '">Save to plan</button>' + (state.done[key] ? '<span class="done-note">Saved to your planning document</span>' : '') + '</div>';
  return h;
}

/* ---------- planning document ---------- */
function renderDoc() {
  const f = DATA.demo['mgmt615-foundation.json'];
  const by = name => (DATA.demo[name] || { modules: [] }).modules;
  const sc = DATA.demo['mgmt615-scenarios.json'].modules, act = by('mgmt615-activities.json'), mat = by('mgmt615-materials.json'), med = by('mgmt615-media.json'), coh = by('mgmt615-cohort.json');
  const empty = '<p class="empty">Not filled in yet.</p>';
  const sec = (name, title, body) => '<h3>' + title + '</h3>' + (shown(name) ? body : empty);
  const ul = arr => '<ul>' + arr.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
  const isTool = a => /Perusall|Peerceptiv|Poll/i.test(a.type);
  const rows = [
    ['M1', 'Module Titles', 'modules', i => esc(f.modules[i].title)],
    ['M1', 'CLOs met', 'modules', i => esc(f.modules[i].closMet.join(', '))],
    ['M1', 'Module Topics', 'modules', i => ul(f.modules[i].topics)],
    ['M3', 'Scenario', 'scenario', i => '<strong>' + esc(sc[i].chosen.title) + '.</strong> ' + esc(sc[i].chosen.premise)],
    ['M4', 'Learning Activities Plan Part 1 (Canvas Assignments)', 'activities', i => ul(act[i].activities.filter(a => !isTool(a)).map(a => a.type + ': ' + a.title + ' (' + a.clos.join(', ') + ', ' + a.weight + (a.rsi ? ', RSI ' + a.rsi : '') + ')'))],
    ['M4', 'Learning Activities Plan Part 2 (Third-Party Tool Activities)', 'tools', i => { const t = act[i].activities.filter(isTool); return t.length ? ul(t.map(a => a.type + ': ' + a.title)) : '<span class="empty">None</span>'; }],
    ['M5', 'Learning Materials Plan', 'materials', i => ul(mat[i].materials.map(x => x.type + ': ' + x.title + ' (' + x.pages + ' pp., ' + x.rights + ')'))],
    ['M6', 'Learning Media Plan', 'media', i => ul(med[i].media.map(x => x.kind + ': ' + x.title + (x.minutes ? ', ' + x.minutes + ' min' : '') + (x.where === 'xr-stage' ? ' (XR stage)' : '')))],
    ['M7', 'Learning Activities Plan Part 3 (Cohort Session Activities)', 'cohort', i => esc(coh[i].title + ': ' + coh[i].live.toLowerCase())]
  ];
  const table = (from, n) => '<div class="scroll"><table><thead><tr><th>FODW</th><th>Course Item</th>' + [0, 1, 2, 3].map(k => '<th>Module ' + (from + k + 1) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(([w, label, name, fn]) => '<tr><td>' + w + '</td><th scope="row">' + label + '</th>' + [0, 1, 2, 3].map(k => '<td>' + (shown(name) ? fn(from + k) : '<span class="empty">[Enter]</span>') + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
  const c = f.character;
  let h = '<div class="row" style="margin-top:0"><button type="button" class="btn sec" id="closeDoc">Close</button>' +
    '<label><input type="checkbox" id="showAll"' + (state.showAll ? ' checked' : '') + '> Show the finished plan</label>' +
    '<button type="button" class="btn" id="download">Download (Word)</button></div>';
  h += '<h2>' + (shown('title') ? esc(f.course.number + ' ' + f.course.title) : '[Course Name and Number]') + ' Course Planning Document</h2>';
  h += sec('catalog', 'TAMU Catalog Course Description', '<p>' + esc(f.catalog) + '</p>');
  h += sec('plos', 'Program-Level Outcomes', ul(f.programOutcomes));
  h += sec('vision', 'Course Vision', '<p>' + esc(f.vision) + '</p>');
  h += sec('learners', 'Learners', '<p>' + esc(f.learners) + '</p>');
  h += sec('clos', 'Course-Level Objectives (CLOs)', ul(f.clos));
  h += '<h3>Table 1: Course Planning Modules 1-4</h3>' + table(0) + '<h3>Table 2: Course Planning Modules 5-8</h3>' + table(4);
  h += sec('premise', 'Storyline', '<p>' + esc(DATA.demo['mgmt615-scenarios.json'].storylinePremise) + '</p>') +
    (shown('character') ? '<h4>Character Profile</h4><p><strong>Premise:</strong> ' + esc(c.premise) + '</p><p><strong>Position:</strong> ' + esc(c.position) + '</p><p><strong>Conflict:</strong> ' + esc(c.conflict) + '</p><p><strong>Peers:</strong> ' + esc(c.peers) + '</p><p><strong>Values and fears:</strong> ' + esc(c.valuesFears) + '</p><p><strong>Backstory:</strong> ' + esc(c.backstory) + '</p>' : '');
  h += sec('interaction', 'Instructor Interaction', '<p>' + esc(f.interactionStatement) + '</p>' + (shown('communication') ? '<h4>Communication and feedback plan</h4>' + ul(f.communicationPlan) : ''));
  return h;
}
function downloadDoc() {
  const body = $('#doc').cloneNode(true); body.querySelector('.row').remove();
  const html = '<html><head><meta charset="utf-8"><style>body{font-family:Calibri,Arial,sans-serif}table{border-collapse:collapse}td,th{border:1px solid #999;padding:4px;vertical-align:top}</style></head><body>' + body.innerHTML + '</body></html>';
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'application/msword' }));
  a.download = 'MGMT 615 Course Planning Document (prototype).doc'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- render and events ---------- */
function render() {
  document.querySelectorAll('header [data-track]').forEach(b => b.setAttribute('aria-pressed', String(state.track === b.dataset.track)));
  renderNav();
  SRC = []; CUR = null;
  $('#main').innerHTML = state.at === 'welcome' ? renderWelcome() : renderStep(state.at);
  CUR = null;
  if (!$('#doc').hidden) $('#doc').innerHTML = renderDoc();
  decorate();
}
const editable = t => editing && t instanceof Element && t.closest('[data-s]');
document.addEventListener('focusout', e => { const el = editable(e.target); if (el) recordEdit(el); });
document.addEventListener('keydown', e => {
  const el = editable(e.target);
  if (el && el._s && e.key === 'Enter' && el._s.kind !== 'pre') { e.preventDefault(); el.blur(); }
});
document.addEventListener('paste', e => {
  if (!editable(e.target)) return;
  e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
});
// In edit mode, clicking text places the cursor instead of following a link or ticking a checkbox.
document.addEventListener('click', e => { if (editable(e.target) && e.target.closest('a, label')) e.preventDefault(); }, true);
document.addEventListener('click', e => {
  const t = e.target.closest('button, input'); if (!t) return;
  if (t.dataset.track) { state.track = t.dataset.track; save(); render(); return; }
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.hasAttribute('data-next')) { next(); return; }
  if (t.id === 'reset') { state = { track: null, done: {}, at: 'welcome', showAll: false }; save(); render(); return; }
  if (t.hasAttribute('data-draft')) {
    const sec = t.closest('section'); const wait = sec.querySelector('.thinking');
    t.disabled = true; wait.hidden = false;
    setTimeout(() => { wait.hidden = true; t.textContent = 'Ask for another version'; t.disabled = false;
      sec.querySelectorAll('.demo-out').forEach(d => d.hidden = false); }, 900);
    return;
  }
  if (t.dataset.save) {
    state.done[t.dataset.save] = true; save();
    const checks = $('#checks');
    render();
    const c2 = $('#checks'); if (c2) { c2.hidden = false; c2.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    const row = document.querySelector('[data-save]').parentElement;
    if (!row.querySelector('[data-next]')) row.insertAdjacentHTML('beforeend', '<button type="button" class="btn sec" data-next>Next step</button>');
    return;
  }
  if (t.id === 'docBtn') { const d = $('#doc'); d.hidden = !d.hidden; t.setAttribute('aria-expanded', String(!d.hidden)); if (!d.hidden) { d.innerHTML = renderDoc(); d.focus(); } return; }
  if (t.id === 'closeDoc') { $('#doc').hidden = true; $('#docBtn').setAttribute('aria-expanded', 'false'); $('#docBtn').focus(); return; }
  if (t.id === 'showAll') { state.showAll = t.checked; save(); $('#doc').innerHTML = renderDoc(); return; }
  if (t.id === 'download') { downloadDoc(); return; }
  if (t.id === 'editBtn' || t.id === 'doneEdit') { editing = t.id === 'editBtn' ? !editing : false; render(); return; }
  if (t.id === 'saveEdits') { if (edits.length) downloadEdits(); else alert('No changes to save yet.'); return; }
  if (t.id === 'undoEdits') {
    if (edits.length && confirm('Undo all ' + edits.length + ' changes? This can\'t be reversed.')) { edits = []; saveEdits(); location.reload(); }
    return;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#doc').hidden) $('#closeDoc').click(); });
$('#doc').tabIndex = -1;
load(); loadEdits(); render();
</script>
</body>
</html>
