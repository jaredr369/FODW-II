<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Course Plan Builder Prototype</title>
<style>
:root {
  --maroon: #500000; --maroon-2: #732f2f; --ink: #1d1d1f; --muted: #5b5b60; --line: #dedbd6;
  --bg: #f7f5f2; --card: #ffffff; --tint: #f3ece9; --ok: #2e6b3a; --warn: #8a5a00; --focus: #1f5fbf;
}
* { box-sizing: border-box; }
body { margin: 0; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
a { color: var(--maroon); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
header { background: var(--maroon); color: #fff; display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 17px; margin: 0; font-weight: 600; }
header .badge { font-size: 12px; background: rgba(255,255,255,.18); padding: 2px 8px; border-radius: 10px; }
header .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid rgba(255,255,255,.5); border-radius: 6px; overflow: hidden; }
.seg button { background: transparent; color: #fff; border: 0; padding: 5px 10px; font: inherit; font-size: 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--maroon); font-weight: 600; }
.hbtn { background: #fff; color: var(--maroon); border: 0; border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.layout { display: grid; grid-template-columns: 290px 1fr; min-height: calc(100vh - 52px); }
nav { border-right: 1px solid var(--line); background: #fff; padding: 12px 0; overflow-y: auto; max-height: calc(100vh - 52px); position: sticky; top: 52px; }
nav h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 16px 4px; }
nav button { display: flex; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 6px 16px; font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; align-items: baseline; }
nav button:hover { background: var(--tint); }
nav button[aria-current="page"] { background: var(--tint); font-weight: 600; box-shadow: inset 3px 0 0 var(--maroon); }
nav .mark { width: 16px; flex: none; color: var(--ok); }
main { padding: 24px clamp(16px, 4vw, 48px) 80px; max-width: 900px; }
.crumb { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
main h2.step { font-size: 28px; margin: 0 0 6px; color: var(--maroon); }
.meta { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
.part { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 22px; margin: 14px 0; }
.part > h3 { margin: 0 0 8px; font-size: 18px; display: flex; gap: 10px; align-items: center; }
.part > h3 .tag { font-size: 12px; font-weight: 600; background: var(--tint); color: var(--maroon); padding: 2px 8px; border-radius: 10px; }
.part.ai { border-color: #c9b8b3; background: #fffdfc; }
table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 14px; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--tint); }
.scroll { overflow-x: auto; }
pre { background: #f4f2ef; padding: 10px 12px; border-radius: 6px; white-space: pre-wrap; font-size: 13px; }
code { font-size: .92em; background: #f1eeea; padding: 0 3px; border-radius: 3px; }
blockquote { margin: 10px 0; padding: 8px 14px; border-left: 4px solid var(--maroon-2); background: var(--tint); }
details { margin: 10px 0; }
summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.btn { background: var(--maroon); color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
.btn.sec { background: #fff; color: var(--maroon); border: 1px solid var(--maroon); }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.thinking { color: var(--muted); font-style: italic; }
.kv { margin: 6px 0; }
.kv > .k { font-weight: 600; color: var(--maroon-2); font-size: 13px; text-transform: capitalize; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; background: #fff; }
.checklist label { display: flex; gap: 8px; margin: 6px 0; align-items: flex-start; }
.flag { border-left: 4px solid var(--warn); background: #fff8e8; padding: 8px 12px; margin: 8px 0; border-radius: 4px; }
.flag.ok { border-color: var(--ok); background: #eef7ef; }
.cite { color: var(--maroon-2); font-weight: 600; }
.welcome { max-width: 720px; }
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0; }
.choice button { text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 16px; font: inherit; cursor: pointer; }
.choice button:hover, .choice button[aria-pressed="true"] { border-color: var(--maroon); }
.choice strong { display: block; color: var(--maroon); font-size: 18px; margin-bottom: 4px; }
.doc { position: fixed; inset: 52px 0 0 auto; width: min(860px, 100%); background: #fff; border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.08); overflow-y: auto; padding: 24px 32px 60px; z-index: 6; }
.doc[hidden] { display: none; }
.doc h2 { color: var(--maroon); margin-top: 0; }
.doc h3 { margin: 22px 0 6px; font-size: 17px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.doc .empty { color: var(--muted); font-style: italic; }
.doc td ul { margin: 0; padding-left: 16px; }
.done-note { color: var(--ok); font-weight: 600; }
.meta p { margin: 0 0 4px; }
header .hbtn[aria-pressed="true"] { background: #fff8e8; box-shadow: 0 0 0 2px #fff; }
body.editing [data-s] { outline: 1px dashed #b9a29b; outline-offset: 2px; border-radius: 2px; cursor: text; }
body.editing [data-s]:hover { background: #fffbe6; }
body.editing [data-s]:focus { outline: 2px solid var(--focus); background: #fffbe6; }
body.editing .demo-out[hidden], body.editing #checks[hidden] { display: block; }
body.editing main { padding-bottom: 140px; }
.editbar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff8e8; border-top: 2px solid var(--warn); padding: 10px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 7; font-size: 15px; }
.editbar[hidden] { display: none; }
.editbar .msg { flex: 1; min-width: 240px; }
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  nav { position: static; max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); }
  header { position: static; }
  .doc { inset: 0; }
  .choice { grid-template-columns: 1fr; }
  .doc { padding: 18px 16px; }
}
</style>
</head>

<script>
const DATA = {"modules": [{"id": "gs", "file": "00-getting-started.md", "raw": "# Getting Started\n\nModule id: `gs`\nSteps: 2\nID check-in: none (first check-in follows Module 1)\n\nFaculty complete: AI connection, save folder, ID and check-in details, course details and\ntrack. Refresh track also uploads the current Course Map or syllabus.\n\nSources: `src:reading-gs-flex-online-process`, `src:guide-course-development-process`,\n`src:tool-course-creator`, `src:example-mgmt615-course-map`\n\n---\n\n## GS.1 Set up\n\nTime: about 15 minutes\nPattern: setup (no AI draft)\n\n### Learn\n\n**How this workshop works.** A Flex Online course is an online business course built on a shared\ntemplate and common design standards. In this workshop, you'll build your Course Planning\nDocument, a working plan that grows module by module and will guide the future development of\nthe entire course. Each module in this workshop will have you building different sections of your\ncourse plan. The expected pace is one module a week, with a live check-in each week, by Zoom or in\nperson, with your instructional designer (ID). Your ID is assigned to you before the workshop\nbegins and works with you through the development of your course. You can work ahead; if you do, ask your ID to meet\nmore often, so each module is reviewed before the next one builds on it.\n\n**How each step works.** Throughout the workshop, AI drafts ideas for you to decide on, modify and\nsave. Each step opens with **Learn**, a short read on what the section is for, and **See it**, an\nexample from MGMT 615. Then:\n\n- **Draft.** Select Draft with AI, and the AI writes a first version of one section of your plan\n  from your course details. If you're updating a course you already teach, Review with AI checks\n  your current section instead and flags what may need to change.\n- **Decide.** You're the expert on your course. Keep the draft, edit it, ask for another version,\n  or write your own. A short checklist shows what a finished section includes.\n- **Save.** Select Save to plan, and the section goes into your Course Planning Document. Quick\n  checks run as it saves and flag anything to fix, or to keep with a note for your ID.\n\nSome steps add **Go deeper**: optional readings and tools if you want more.\n\nAfter the workshop comes a kick-off meeting with your ID to plan the development schedule, then 13\nweeks of development, when you and the team build the course in Canvas from your plan, 2 weeks of\nquality review, and a final week to review the course and train on grading and communicating in\nCanvas. Then the course is yours to teach. You are the expert on what the course teaches; your ID is\nthe expert on how to teach it online.\n\n**The AI.** This tool uses TAMU AI Chat to draft and check each section of the course plan. You\nconnect it with your own key, a code that works like a password and lets this tool use TAMU AI\nChat for you. The key stays in this browser and never goes into your project file.\nEvery draft is a starting point: you can edit it, ask for another, or write the section yourself,\nand nothing goes into your plan until you select Save.\n\nWe strongly recommend connecting TAMU AI. The workshop is built around it. You can continue without\nit, but you will write every section yourself, without first drafts, checks on your work, or, if\nyou're updating a course you already teach, a review of it. You can connect it later with the\nSettings button at the top of every page.\n\nHow to get your key (about a minute):\n\n1. Open TAMU AI Chat at chat.tamu.ai in a new tab and sign in with your NetID.\n2. Select your name or profile picture in the lower-left corner, then Settings.\n3. Select Account. Next to API keys, select Show.\n4. Select Create new secret key. If a key is already listed, you can use that one.\n5. Copy the key. It starts with `sk-`.\n6. Paste it below and select Test connection.\n\nTreat the key like a password. If you don't see API keys in your settings, contact your ID.\n\n**Saving and sharing.** This tool is not like Canvas. Your work saves in this browser as you go.\nWhen you select Save, the tool writes two files to a folder you choose: 1. the planning document\n(Word), which your ID reads, and 2. a project file, which lets you reopen your work later, on any\ncomputer, and pick up where you left off. Choose a folder your ID can see, such as a OneDrive or Teams folder you share with\nthem. This works best in Microsoft Edge or Google Chrome; in other browsers, the files go to\nDownloads, and you move them yourself.\n\n> Review note: key steps adapted from `src:tool-course-creator`; the key process is confirmed.\n> Still open for TAMU IT: what we can say about how TAMU AI Chat handles course content.\n\n### See it\n\nThroughout the workshop, you will see examples from a fictitious course titled, \"MGMT 615\". In it,\nthe instructor connected a key, chose a OneDrive folder shared with their ID, and set a Tuesday\ncheck-in. They finished Modules 1 and 2 in the first week and asked their ID for a second meeting\nthat week.\n\n### Draft (full build) and Review (refresh)\n\nNo AI draft. Test connection sends one short request.\n\nAI instructions:\n\n```text\nReply with {\"ok\": true}.\n```\n\nDemo response: `{\"ok\": true}`. Demo mode skips the key and plays recorded responses.\n\nApp notes (from `src:tool-course-creator`, reference only): TAMU AI Chat is OpenAI-compatible.\nCourse Creator calls `https://chat.tamu.ai/api`, falls back to `https://chat-api.tamu.ai/openai`,\nsends the key as a Bearer token, lists models from `/models`, posts to `/chat/completions`, and\nprefers Claude Sonnet, then other Claude models, then GPT models.\n\n### Decide\n\nThe faculty member:\n\n1. Pastes the key and selects Test connection, or selects Continue without AI (a smaller link),\n   which asks for confirmation: \"Without the AI you'll write every section of your plan yourself.\n   You won't get first drafts, checks on your work, or a review of your existing course. You can\n   connect the AI later from Settings.\" Buttons: Connect the AI (default), Continue without AI.\n2. Selects Choose save folder.\n3. Enters their ID's name and the weekly check-in day, time and format. Any of these can wait.\n\nIf the test fails, the app shows the cause and offers Try again:\n\n| Problem | Message shown |\n|---|---|\n| Key not accepted (401 or 403) | TAMU AI Chat didn't accept the key. Check that you copied all of it and that it hasn't been deleted. |\n| Can't reach the service | Couldn't reach TAMU AI Chat. Check your internet connection. Off campus, you may need the university VPN. |\n| Too many requests (429) | TAMU AI Chat is busy right now. Wait a moment and try again. |\n\nUntil a key is connected, each module shows a banner, \"Your AI guide is off. Connect it to get\ndrafts and checks for this step.\", with a Connect button.\n\nChecklist:\n\n- The AI is connected, or you chose to continue without it.\n- Your files save to a folder your ID can see.\n- You have a weekly check-in time, or know who to ask.\n\n### Checks\n\nNone.\n\n### Save\n\nPlanning document: ID name on the cover section.\nBrowser only: `course-plan-builder:apiKey`, `course-plan-builder:aiSkipped`,\n`course-plan-builder:saveFolder` (folder handle).\nProject file: `course.idName`, `checkins.day`, `checkins.time`, `checkins.format`,\n`checkins.log[]`.\n\n### Go deeper (optional)\n\n- `src:guide-course-development-process`: roles, phases and the full development process.\n\n---\n\n## GS.2 Your course and your track\n\nTime: about 20 minutes\nPattern: setup; edit in place for the refresh upload\n\n### Learn\n\nChoose a track:\n\n- **Full build** if the course is new or you're rebuilding it from the beginning. Each module\n  drafts its sections from your course details.\n- **Refresh** if the course already runs online. Upload its Course Map as a Word file, or paste\n  the text. A syllabus works too, with more sections missing. In each module you'll see your\n  current section with flags beside it: notes on what may need attention. You keep the section,\n  accept or edit a suggested revision, or rewrite it. Each change gets a short note so your ID can\n  see what changed and why.\n\nA Course Map is not the same as your Course Planning Document. The Course Map is the finished,\ndetailed record of everything in a course, complete enough to rebuild the course in another\nlearning management system if it were ever lost from Canvas. The Course Planning Document is the\nworking plan you build in this workshop, a section at a time.\n\nBoth tracks go through every module. The workshop adds a storyline to your course: a recurring\ncharacter and a realistic scenario in each module, which you'll plan in Modules 2 and 3. Most\nexisting courses don't have these yet. In the refresh track, when your Course Map doesn't have a\nsection, the tool drafts it from scratch.\n\n### See it\n\nThe MGMT 615 instructor chose Refresh and uploaded the Course Map. The tool found the catalog\ndescription, the course vision, five course-level objectives (CLOs) and all eight modules with\ntheir activities, materials and media. It found no program outcomes, character, storyline,\nscenarios or communication plan, so the tool drafted those from scratch in later modules. You'll\nlearn what each of these is when you reach it.\n\n### Draft (full build)\n\nThe faculty member fills in a form. No AI call.\n\n| Field | Required | Example (MGMT 615) |\n|---|---|---|\n| Course number | Yes | MGMT 615 |\n| Course title | Yes | Managing People and Performance |\n| Credit hours | Yes | 3 |\n| Program (the degree or certificate the course belongs to) | Yes | MS in Management |\n| First term taught online | No | [Term] |\n| Track | Yes | Refresh |\n\n### Review (refresh)\n\nThe same form, then the faculty member uploads a .docx or pastes text. The AI sorts it into the\nplanning document's sections. Without AI, the upload is skipped and the faculty member pastes\neach current section when they reach it.\n\nAI instructions:\n\n```text\nYou are given the text of a faculty member's existing Course Map or syllabus.\nFind the content for each section below. Copy text exactly as written. Do not rewrite, fix or\nsummarize. If a section is not in the document, return null for it. If you are unsure where\nsomething belongs, put it in \"unsorted\".\n\nSections:\n- catalogDescription\n- programOutcomes (list)\n- courseVision\n- clos (list)\n- modules (list of {number, title, closMet, topics, objectives, activities, materials, media,\n  cohortSession, overview})\n- character (any recurring person or case that runs across modules)\n- storyline\n- scenarios (list, one per module)\n- communicationPlan (announcements, feedback turnaround, instructor contact)\n- learners (who takes the course)\n\nReturn: {\"sections\": {...}, \"unsorted\": [string], \"found\": [section names], \"missing\": [section names]}\n```\n\nDemo response (MGMT 615, from `src:example-mgmt615-course-map`):\n\n| Section | Result |\n|---|---|\n| Catalog description, course vision | Found |\n| CLOs | Found, 5 |\n| Modules | Found, 8, with titles, CLOs met, topics, objectives, activities, materials, media, cohort sessions and overviews |\n| Program outcomes, learners, character, storyline and scenarios, communication plan | Missing |\n\n> Review note: the recorded JSON for this response will be generated from the MGMT 615 course map\n> when demo mode is built.\n\n### Decide\n\nThe tool shows each found section next to its label. The faculty member confirms each, moves\nmisplaced text, or marks a section as not in the document.\n\nChecklist:\n\n- Course number, title and program are correct.\n- Each found section is under the right label.\n- You know which sections the tool will draft from scratch.\n\n### Checks\n\nNone.\n\n### Save\n\nPlanning document: course number and title in the document title; program on the cover\nsection.\nProject file: `course`, `track`, `source.sections`, `source.missing`, `source.fileName`.\n\nGetting Started ends without check-in prep; the first check-in follows Module 1.\n"}, {"id": "m1", "file": "01-vision-and-foundation.md", "raw": "# Module 1. Creating Vision and Foundation\n\nModule id: `m1`\nSteps: 4\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: learners, catalog description, program outcomes, course vision, CLOs, module\ntitles and topics.\n\nRefresh checks for this module: CLOs are measurable, with one verb each, and line up with the\ncatalog description and program outcomes; every CLO appears in at least one module; topics are\ncurrent.\n\nSources: `src:reading-m1-setting-the-foundation`, `src:guide-course-alignment`,\n`src:guide-learning-objectives`, `src:assignment-m1-building-the-framework`,\n`src:assignment-m1-redesign-and-refine`, `src:template-planning-doc`,\n`src:example-mgmt615-course-map`\n\n## Refresh reflection\n\nShown once, in the refresh track only, before step 1.1. The answers go to the AI in every Review\nstep of this module.\n\nPrompt shown: \"Think about the last time you taught this course. Answer whichever of these\napply. Short notes are fine.\"\n\n1. Which course objectives did students struggle to meet? What did you see in their work?\n2. Were there weeks that felt overloaded or thin, or topics that came too early or too late?\n3. Is there a topic you want to add, cut or update?\n4. What worked well enough that you want to keep it as it is?\n\nAI instructions (added to each Review step in this module):\n\n```text\nThe faculty member's reflection on the last time they taught the course is given. When a\nproblem you find matches something in the reflection, say so in the issue and connect the\nrevision to it. Do not raise problems only because the reflection mentions them; check them\nagainst the checklist first.\n```\n\nDemo answers (MGMT 615):\n\n1. \"The feedback script in Module 3 was the weakest work. Students wrote what they'd tell the\n   employee and stopped there. Few said what they expected to change.\"\n2. \"Module 4 felt thin. We spent a lot of time on team stages and never got to the handoff\n   problems students actually face.\"\n3. \"Hiring comes up every term in Module 8 and students want more of it.\"\n4. \"The diagnosis-first approach. Students tell me it's what they use most at work.\"\n\nEach answer connects to the demo review: the CLO 2 revision answers the first, the Module 4\ntopic change the second, the new hiring CLO the third, and the vision revision keeps the\ndiagnosis-first approach.\n\nProject file: `reflection.m1`.\n\n---\n\n## 1.1 Learners, catalog and program outcomes\n\nTime: about 20 minutes\nPattern: interview, then draft\n\n### Learn\n\nFlex Online courses are planned backward: decide what students should be able to do at the end,\nthen how you'll see it, then what they'll read and watch (Wiggins & McTighe, 2005). That's the\norder of this workshop. Module 1 sets the end point.\n\nStart with who the students are. They're working professionals who connect new ideas to their\nown experience, want to know why something matters before they invest time, and want to use it\nsoon (Knowles, Holton, & Swanson, 2015). Every AI draft from here on uses the learner profile\nyou write in this step.\n\nYour catalog description is the course's public promise, so your vision and CLOs stay inside it.\nPaste the official text; the AI won't write or change it. Program outcomes describe what students\ncan do after the whole degree; mark the two to four this course supports. Your ID can find them\nif you don't have them. Before you start Module 2, confirm your vision and CLOs with your program\ndirector, since your character and scenarios build on them.\n\n### See it\n\nMGMT 615's students are new or soon-to-be managers, promoted for being good at their own jobs.\nIts catalog description makes six commitments, from diagnosing underperformance to hiring well.\nLater checks hold the CLOs to that list, which is how the refresh found that no CLO covered\nhiring.\n\n### Draft (full build)\n\nThe AI asks four questions, then drafts a learner profile:\n\n1. What jobs do most students hold while they take the course?\n2. What do they already know about the subject when they start?\n3. What will they do differently at work after the course?\n4. Anything about their schedules or situations the course should plan around?\n\nThen the faculty member pastes the catalog description and program outcomes.\n\nAI instructions:\n\n```text\n1. Write a learner profile of 3 or 4 sentences from the faculty member's answers, using only\n   what they said, and name one design implication from adult learning (self-directed,\n   experience-rich, goal-oriented, practically motivated).\n2. List each distinct thing the catalog description commits the course to, in the catalog's own\n   words where possible. Do not rewrite the catalog description.\n3. For each program outcome, say whether this course likely supports it, with a reason under 20\n   words based on the catalog description.\n\nReturn: {\"profile\": string, \"implication\": string, \"commitments\": [string], \"programOutcomes\": [{\"outcome\": string, \"supports\": boolean, \"reason\": string}]}\n```\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"profile\": \"Students are working professionals in a first management role or about to step into one, most promoted after strong work as individual contributors. They arrive with years of workplace experience and plenty of stories about good and bad managers, but little formal training in managing people. They take the course to handle the conversations and decisions their new role puts in front of them. Most work full time and study in the evenings and on weekends.\",\n  \"implication\": \"Ask students to bring a current problem from their own team into each module's main assignment, so the work pays off at their job the same week.\",\n  \"commitments\": [\"Diagnose why employees and teams underperform\", \"Deliver feedback that changes behavior\", \"Build and repair team dynamics\", \"Delegate and make decision-rights calls under pressure\", \"Lead a team through change\", \"Hire well\"],\n  \"programOutcomes\": [\n    {\"outcome\": \"PLO 1: Lead individuals and teams to meet organizational goals.\", \"supports\": true, \"reason\": \"The whole course is about managing people toward performance targets.\"},\n    {\"outcome\": \"PLO 2: Analyze business problems using evidence and established frameworks.\", \"supports\": true, \"reason\": \"Diagnosing underperformance with motivation and team frameworks is central.\"},\n    {\"outcome\": \"PLO 3: Communicate decisions clearly to varied audiences.\", \"supports\": true, \"reason\": \"Feedback, change messages and delegation calls are communication tasks.\"},\n    {\"outcome\": \"PLO 4: Apply quantitative methods to financial decisions.\", \"supports\": false, \"reason\": \"The catalog description does not mention financial analysis.\"}\n  ]\n}\n```\n\n\n### Review (refresh)\n\nEdit in place. The app shows the learner description, catalog description and program outcomes\nfound in the upload. Missing parts run as the full build. The AI lists the catalog commitments\nand checks the learner description names students' roles, what they bring and what they need.\n\nDemo response (MGMT 615): learners and program outcomes are missing, so those run as the full\nbuild; the catalog is found and its commitments match the list above. The app asks the faculty\nmember to confirm the catalog text is the current official version.\n\n### Decide\n\nChecklist:\n\n- The profile describes the students who actually take your course.\n- The catalog text is the current official version.\n- The commitment list covers everything the catalog promises.\n- You've marked the program outcomes this course supports.\n- You've planned a meeting with your program director before Module 2.\n\n### Checks\n\nNone on save. The commitments and program outcomes feed the checks in steps 1.2 to 1.4.\n\n### Save\n\nPlanning document: Catalog Course Description; Program-Level Outcomes (supported only);\nLearners (new paragraph, after Course Vision).\nProject file: `learners.profile`, `catalog.text`, `catalog.commitments`, `programOutcomes`,\n`programDirectorReview.status`.\n\n### Go deeper (optional)\n\n- `src:reading-m1-setting-the-foundation`: the principles behind Flex Online design.\n- `src:ext-wiggins-mctighe-2005`, `src:ext-knowles-2015`, `src:ext-cast-2018`\n\n---\n\n## 1.2 Course vision\n\nTime: about 15 minutes\nPattern: interview, then draft\n\n### Learn\n\nYour vision says what students will be able to do, and who they'll become, because they took\nyour course. Try this: a student runs into you a year after the course. What do you hope they\ntell you they now do differently at work? That answer is the core of your vision.\n\nWrite 3 or 4 sentences about what students do in their professional setting, inside the catalog\ndescription, and say what sets the course apart. A vision drives every later choice: each topic,\nactivity and reading has to help students get there.\n\n### See it\n\nMGMT 615: \"MGMT 615 turns people who are good at their jobs into people who are good at running\na team. Every module asks students to work out what is actually wrong before they choose a fix,\nand to defend that call to peers in a live cohort session. Students leave with work they can use\non the job: a feedback script, a delegation memo, a change announcement and a structured\ninterview scorecard. They finish ready to manage a larger team and to explain the reasoning\nbehind each call.\"\n\n### Draft (full build)\n\nThe AI asks one question, \"What do you hope a student tells you a year after the course?\", then\ndrafts two versions with different emphasis. The faculty member picks one, combines them or\nwrites their own.\n\nAI instructions:\n\n```text\nDraft two course visions of 3 or 4 sentences each from the faculty member's answer, the learner\nprofile and the catalog commitments. Describe what students will do in their professional\nsetting, stay inside the catalog commitments, and say what sets the course apart. Make the two\ndiffer in emphasis: one on skills, one on the professional the student becomes.\n\nReturn: {\"versions\": [string, string]}\n```\n\nDemo response (MGMT 615), from the answer \"That they stopped fixing everything themselves, figured\nout what was really wrong with their team before reacting, and had the conversation they were\navoiding\":\n\n```json\n{\n  \"versions\": [\n    \"MGMT 615 prepares new managers to figure out why a person or team is struggling before they act. Students practice the work that follows a good diagnosis, from feedback and delegation to change announcements and hiring, and defend each call to peers in live cohort sessions. Every major assignment produces something they can use with their own team. Students finish ready to stop fixing problems themselves and start building a team that can.\",\n    \"Students arrive at MGMT 615 good at their own jobs and leave able to run a team. Module after module, the course asks them to look past the obvious explanation for a performance problem and find the real cause. They rehearse the hard conversations in scripts and cohort sessions, so they're ready to have them at work. A year later they should be the manager their team trusts to diagnose before deciding.\"\n  ]\n}\n```\n\n### Review (refresh)\n\nEdit in place. The current vision appears with flags from the checks below and one suggested\nrevision that keeps the faculty member's language.\n\nDemo response (MGMT 615): two flags. \"Seven sentences; the planning document asks for 3 or 4.\"\nAnd \"The first two sentences describe the program ('sits at the center of the Flex Online\npeople-management sequence'). A vision should describe what students will do.\" Suggested\nrevision: the four-sentence vision under See it. Demo change note: \"Cut to four sentences.\nRemoved the program description; kept the diagnosis-first approach and the deliverables.\"\n\n### Decide\n\nChecklist:\n\n- 3 or 4 sentences.\n- Describes what students do at work.\n- Fits the catalog description.\n- You'd be glad to hear a former student describe the course this way.\n\n### Checks\n\nOn save: sentence count (3 or 4); every claim fits a catalog commitment; it describes student\nactions instead of course coverage.\n\n### Save\n\nPlanning document: Course Vision.\nProject file: `vision.text`; in refresh, `vision.original`, `vision.changeNote`.\n\n---\n\n## 1.3 Course-Level Objectives (CLOs)\n\nTime: about 25 minutes\nPattern: spot the problem, then pick and combine (full build) or edit in place (refresh)\n\n### Learn\n\nCLOs say what students will be able to do by the end of the course, in a way you can observe and\ngrade. Everything later traces back to them. Write 3 to 6. Start each with one action verb at\nBloom's apply level or higher, mostly analyze, evaluate or create, since your students are\nexperienced professionals (Anderson & Krathwohl, 2001). Describe something within the student's\ncontrol.\n\n| Level | Example verbs |\n|---|---|\n| Apply | apply, implement, solve, calculate |\n| Analyze | analyze, diagnose, compare, differentiate |\n| Evaluate | evaluate, assess, justify, defend |\n| Create | design, develop, construct, draft |\n\nEach CLO should also suggest a decision someone in your students' role would face. In Module 2\nthose decisions become your character's story.\n\n**Spot the problem.** Before drafting, the app shows one weak objective and asks, \"What would\nyou change, and why?\" in a sentence.\n\n> Example: \"Students will understand how to give feedback that changes an employee's behavior.\"\n\nExpected points: \"understand\" can't be observed; \"changes an employee's behavior\" depends on the\nemployee, which the student can't control. A stronger version: \"Design a feedback conversation that targets a\nspecific behavior and states the change expected.\" The AI confirms what the faculty member\ncaught and adds what they missed, in two sentences.\n\n### See it\n\nMGMT 615's first CLO began as \"Apply core theories of motivation and performance to diagnose why\nan employee or team is underperforming.\" Two verbs. The refresh kept the one students are graded\non: \"Diagnose why an employee or team is underperforming using core theories of motivation and\nperformance.\" It gives Dana Ortiz her first decision in Module 2: is the shift lead the problem?\n\n### Draft (full build)\n\nAI instructions:\n\n```text\nDraft 4 to 6 CLOs from the vision, the catalog commitments, the supported program outcomes and\nthe learner profile. One measurable verb per CLO, Bloom's apply or higher, mostly analyze,\nevaluate or create; describe what the student does, within their control; together cover every\ncatalog commitment. For each give its verb, level, the commitments and program outcomes it\ncovers, and one decision a professional in the students' role would face.\n\nReturn: {\"clos\": [{\"text\": string, \"verb\": string, \"level\": string, \"commitments\": [string], \"programOutcomes\": [string], \"decision\": string}]}\n```\n\nDemo response (MGMT 615, if run as a full build): the six revised CLOs listed under Review.\n\n### Review (refresh)\n\nEdit in place. Each current CLO shows Keep or a suggested revision, with flags.\n\nAI instructions:\n\n```text\nCheck each current CLO: exactly one measurable verb; Bloom's apply or higher; within the\nstudent's control; fits the catalog. Keep the wording wherever it passes. For each problem,\nquote the words that cause it and suggest one revision. If a catalog commitment is uncovered,\npropose one new CLO for it. If there are more than 6, suggest which to merge.\n\nReturn: {\"clos\": [{\"original\": string, \"action\": \"keep\" | \"revise\", \"issues\": [string], \"revision\": string | null}], \"newClos\": [string]}\n```\n\nDemo response (MGMT 615):\n\n| Current | Action | Revision | Change note |\n|---|---|---|---|\n| CLO 1: Apply core theories of motivation and performance to diagnose why an employee or team is underperforming. | Revise | Diagnose why an employee or team is underperforming using core theories of motivation and performance. | Dropped \"apply\" so the CLO has one verb. |\n| CLO 2: Design a feedback or coaching conversation that changes an employee's behavior, not just documents it. | Revise | Design a feedback or coaching conversation that targets a specific behavior and states the change expected. | Now graded on the conversation the student designs. Matches the reflection: scripts never said what should change. |\n| CLO 3: Evaluate team dynamics and organizational context to select a management intervention appropriate to the actual problem. | Keep | | Kept. |\n| CLO 4: Make a delegation or decision-rights call and justify the trade-offs involved. | Revise | Justify a delegation or decision-rights call, including the trade-offs involved. | Dropped \"make\" so the CLO grades the justification. |\n| CLO 5: Communicate a management decision in language a direct report can act on immediately. | Revise | Draft a management decision message that states the decision and the next steps a direct report must take. | Changed to a written message with stated next steps so it can be graded. |\n| (new) CLO 6 | Add | Evaluate candidates for a role using a structured interview scorecard. | The catalog promises hiring and Module 8 teaches it. Matches the reflection on Module 8. |\n\n### Decide\n\nFull build: pick, edit, reorder, remove or add. Refresh: for each CLO, keep, accept, edit or\nrewrite; accept, edit or reject each new CLO.\n\nChecklist:\n\n- 3 to 6 CLOs, one measurable verb each, at apply or above.\n- Each describes what the student does.\n- Each suggests a decision someone in your students' role would face.\n\n### Checks\n\nOn save: one verb per CLO; level apply or above; count 3 to 6; every catalog commitment covered\nby a CLO; every CLO supports at least one supported program outcome. Demo: all pass after the\nrevisions; before them, the commitment check flags \"Hire well: no CLO covers it.\"\n\n### Save\n\nPlanning document: Course-Level Objectives (CLOs).\nProject file: `clos` (text, verb, level, commitments, programOutcomes, decision); in refresh,\n`clos[].original`, `clos[].changeNote`.\n\n### Go deeper (optional)\n\n- `src:guide-learning-objectives`: verb tables and the case for higher-order objectives.\n- `src:ext-anderson-krathwohl-2001`\n\n---\n\n## 1.4 Module titles and topics\n\nTime: about 25 minutes\nPattern: pick and combine (full build) or edit in place (refresh)\n\n### Learn\n\nLay out the weekly modules; the planning document has room for eight. Each gets a title a\nstudent would understand on day one, one primary CLO and at most one supporting CLO, and three\nto five topics. Start from the CLOs: list what students need to know or practice to meet each\none, then cut anything whose removal wouldn't stop anyone from meeting a CLO.\n\nOrder matters. In Module 3 each module becomes one scenario in your character's story, so order\nthe modules the way the decisions would come up at work: diagnosis before treatment, one person\nbefore the whole team.\n\n### See it\n\n| Module | Title | CLOs met |\n|---|---|---|\n| 1 | What Managers Actually Do | CLO 1, CLO 5 |\n| 2 | Motivating People | CLO 1, CLO 5 |\n| 3 | Performance Management and Feedback | CLO 2, CLO 5 |\n| 4 | Building and Leading Teams | CLO 3, CLO 1 |\n| 5 | Managing Conflict and Difficult Conversations | CLO 3, CLO 2 |\n| 6 | Delegation and Decision-Making | CLO 4, CLO 5 |\n| 7 | Leading Through Change | CLO 5, CLO 3 |\n| 8 | Hiring and Building Your Team | CLO 6, CLO 1 |\n\n### Draft (full build)\n\nAI instructions:\n\n```text\nDraft a module sequence from the CLOs, catalog commitments and learner profile, using the number\nof modules the faculty member chose (default 8). For each module: a plain title, one primary CLO\nand at most one supporting CLO, and 3 to 5 topics. Every CLO appears at least once. Order the\nmodules the way the decisions would come up for a professional in the students' role, with a\none-sentence reason.\n\nReturn: {\"modules\": [{\"number\": int, \"title\": string, \"closMet\": [string], \"topics\": [string]}], \"orderReason\": string}\n```\n\nDemo response (MGMT 615, if run as a full build): the eight modules above with the topics from\nthe MGMT 615 course map, including the Module 4 change below.\n\n### Review (refresh)\n\nEdit in place. Each module shows Keep or a suggested revision, with flags. CLO numbers are\nupdated to match step 1.3.\n\nDemo response (MGMT 615):\n\n- Modules 1, 2, 3, 5, 6 and 7: keep.\n- Module 4: revise. The topic \"Designing team assignments that are accessible to every learner\"\n  is a note about designing the course; students wouldn't study it. Replacement: \"Role clarity\n  and ownership of handoffs.\" Matches the reflection that Module 4 never reached the handoff\n  problems.\n- Module 8: CLOs met change from \"CLO 4, CLO 1\" to \"CLO 6, CLO 1\".\n\n### Decide\n\nA table with one column per module: edit titles, CLOs met and topics, and drag to reorder.\nRefresh: keep, accept, edit or rewrite each module.\n\nChecklist:\n\n- Each module has one or two CLOs.\n- Titles make sense to a student on day one.\n- The order follows the way the decisions would come up at work.\n\n### Checks\n\nOn save: every CLO appears in at least one module; each topic serves a CLO its module lists;\ntopics are content for students; CLOs appearing in only one module, or in more than five, are\nnoted. Demo flag (MGMT 615): \"CLO 4 and CLO 6 each appear in one module.\" Demo kept note:\n\"Delegation and hiring are each a focused skill, practiced and assessed in one module.\"\n\n### Save\n\nPlanning document: Module Titles, CLOs met and Module Topics rows in Tables 1 and 2 (see\n`export.md`).\nProject file: `modules[].title`, `modules[].closMet`, `modules[].topics`; in refresh,\n`.original` and `.changeNote`. Other columns from an uploaded course map stay in\n`source.sections` for later modules.\n\n### Go deeper (optional)\n\n- `src:guide-course-alignment`\n\n---\n\n## Check-in prep\n\nShown after step 1.4.\n\nAI instructions:\n\n```text\nFrom this module's saved sections, change notes and kept flags, list what's new or changed since\nthe last check-in, the flags kept with their notes, and two questions worth raising with the ID.\nKeep it under 150 words.\n\nReturn: {\"changed\": [string], \"keptFlags\": [string], \"questions\": [string, string]}\n```\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Learners, program outcomes: new\", \"Vision: cut to four sentences\", \"CLOs: four revised, CLO 3 kept, CLO 6 added for hiring\", \"Modules: Module 4 topic replaced, Module 8 mapped to CLO 6\"],\n  \"keptFlags\": [\"CLO 4 and CLO 6 each appear in one module: focused skills, practiced and assessed in one module\"],\n  \"questions\": [\"Does adding a sixth CLO for hiring need program director approval?\", \"Is one module enough practice for delegation (CLO 4)?\"]\n}\n```\n\nProject file: `checkins.prep.m1`.\n"}, {"id": "m2", "file": "02-ai-and-rsi.md", "raw": "# Module 2. AI & RSI in Strategic Course Design\n\nModule id: `m2`\nSteps: 2\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: the syllabus statement on how and when students hear from the instructor, and\nthe course character and conflict.\n\nRefresh checks for this module: a throughline exists, or could come from cases the course\nalready uses; the syllabus says when students hear from the instructor.\n\nNo refresh reflection in this module. The character and conflict are new work for nearly every\ncourse. Module 4 checks RSI for every module's activities.\n\nSources: `src:guide-rsi`, `src:assignment-m2-understanding-rsi`,\n`src:assignment-m2-character-conflict`, `src:guide-storytelling`, `src:example-mgmt615-character`,\n`src:example-mgmt615-course-map`\n\n---\n\n## 2.1 Your interaction statement\n\nTime: about 20 minutes\nPattern: interview, then draft (full build) or edit in place (refresh)\n\n### Learn\n\nEvery Flex Online course has to show that the instructor is actively teaching. The federal term\nis regular and substantive interaction (RSI). A course that can't show it is treated as a\ncorrespondence course, and its students lose eligibility for federal financial aid. TLI checks\nfor it in every course review.\n\n**Substantive** means about teaching, learning or assessment: an announcement explaining the\nconcept half the class missed counts; a due-date reminder doesn't. **Regular** means\npredictable, proactive and responsive to how students are doing. Your syllabus has to say how and\nwhen students will hear from you. That statement is what you write in this step.\n\nFor the substantive test, your course needs instructor activity in at least two of these five\ncategories:\n\n| Category | Counts | Doesn't count on its own |\n|---|---|---|\n| 1. Direct instruction | Your recorded lectures, worked examples you narrate, case debriefs, guided questions | Third-party videos with no framing or follow-up, reading lists with no instructions, quizzes graded only automatically |\n| 2. Assessing or giving feedback | Comments on graded work, audio or video feedback, feedback on drafts, peer review you oversee, AI-drafted feedback you review and edit | Scores only, generic comments such as \"good job\", peer grading you never see, AI feedback you didn't review |\n| 3. Giving information or answering questions | Announcements that clear up a hard concept, content answers by email or in forums, module orientation videos that explain how the content fits together, Q&A sessions about content | Deadline reminders, automated messages, welcome videos with no later engagement, forums where only students answer |\n| 4. Facilitating discussion | Follow-up questions, summaries that connect posts to the readings, live sessions about content | Posting a prompt and grading replies with no comment, office hours used only for logistics |\n| 5. Other instructional activities | Feedback on journals, simulations you debrief, debriefs after group projects | Reflections nobody reads, simulations nobody discusses |\n\nMost of the right-hand column isn't bad teaching. A good industry video helps students learn.\nSo does an auto-graded practice quiz. They count as RSI once you add your own engagement, such\nas a two-minute introduction on what to watch for and a follow-up on what students noticed. The\nfix often takes about ten minutes.\n\n**Where AI fits.** AI can draft feedback, summarize discussion threads or flag students who have\ngone quiet. The interaction counts when you review and adjust what goes to students. Feedback an\nAI writes and you release unread does not. As AI takes on more of the explaining, what students\nneed most from you is the judgment it can't supply: framing the problem, weighing evidence,\nand telling them where their reasoning went wrong (Maxwell, 2026).\n\nYou don't need to sort your activities into these categories now. Module 4 does that\nautomatically for every module.\n\n### See it\n\nMGMT 615's statement: \"Every Monday I'll post an announcement that picks up Dana's story, names\nthe week's decision and responds to what I saw in your last assignment. You'll get written\nfeedback on each module's main assignment within five days of the due date. I check activity\nevery Wednesday, and if you've missed a module's work, I'll contact you that week.\"\n\n### Draft (full build)\n\nThe AI asks three questions, then drafts:\n\n1. In a normal week, when and how will students hear from you?\n2. How soon will students get feedback on their main assignment each module?\n3. How will you notice a student falling behind, and what will you do?\n\nAI instructions:\n\n```text\nDraft a syllabus statement of 2 or 3 sentences from the faculty member's answers. It must name\nhow students hear from the instructor, on which days or within what time, and how the instructor\nnotices and responds when a student falls behind. Use only commitments the faculty member\ndescribed or that follow directly from them. If something is missing, add it and mark it [check]\nso the faculty member confirms it.\n\nReturn: {\"statement\": string, \"added\": [string]}\n```\n\nDemo response (MGMT 615), from the answers \"Weekly announcement and the cohort session,\" \"Within\nfive days,\" and \"I'm not sure\":\n\n```json\n{\n  \"statement\": \"Every Monday I'll post an announcement that picks up Dana's story, names the week's decision and responds to what I saw in your last assignment. You'll get written feedback on each module's main assignment within five days of the due date. I check activity every Wednesday, and if you've missed a module's work, I'll contact you that week [check].\",\n  \"added\": [\"Wednesday activity check and outreach to students who miss work, since your answer didn't say how you'd notice a student falling behind.\"]\n}\n```\n\n### Review (refresh)\n\nEdit in place. If the upload has a statement about instructor contact, it appears with flags and\none suggested revision that keeps the faculty member's commitments. If not, the full build runs.\n\nDemo response (MGMT 615): no statement in the course map, so the full build runs.\n\n### Decide\n\nChecklist:\n\n- You can keep this up during the busiest week of the term.\n- Anything marked [check] is confirmed or removed.\n\n### Checks\n\nOn save: names how students hear from you; names days or turnaround times (\"regularly\" and\n\"promptly\" are flagged); says how you notice and respond when a student falls behind.\n\n### Save\n\nPlanning document: Instructor Interaction (near the end; see `export.md`). Module 8 adds the\ncommunication and feedback plan to the same section.\nProject file: `rsi.statement`; in refresh, `rsi.original`, `rsi.changeNote`.\n\n### Go deeper (optional)\n\n- `src:guide-rsi`: full tables for each category, and the rules behind them.\n- `src:article-maxwell-2026`: what students need from a professor once AI can explain the\n  content. About 9 minutes.\n\n---\n\n## 2.2 Character and conflict\n\nTime: about 30 minutes\nPattern: interview, then pick and combine, then draft\n\n### Learn\n\nThe rest of the workshop builds a story through your course: a character who faces a decision\nin each module. A story earns its place when it gives busy professionals a reason to care about\na concept now, and a place to file what they learn (Mayer, 2021).\n\nStart with the performance: one sentence, from a CLO, saying what students should be able to do.\nThen the conflict that makes it hard, pushing directly against it: conflicting goals, ambiguous\ndata, misaligned incentives or time pressure. If more information would settle it, it isn't a\nconflict yet.\n\nThen the character: someone in a role your students could hold within a few years, with enough\nauthority to feel the decision, facing the constraints your students face. The profile has a\npremise statement (\"A story about [name, role] who struggles to [performance] when\n[conflict].\"), position, conflict, two to four peers who see the problem differently, values and\nfears, and a short backstory.\n\nIf one character doesn't fit your course, you can rotate characters within one setting, keep one\nrecurring problem, or use a narrator. Your ID reviews the character at this module's check-in,\nbefore Module 3 builds scenarios on it.\n\n### See it\n\nMGMT 615's performance: \"Diagnose why a team is underperforming before choosing a fix\" (CLO 1).\nThe conflict: the quick fix against the right fix. Six weeks before peak season, a director has\nalready blamed one shift lead, while the evidence points to a speed bonus and a shift handoff\nnobody owns.\n\nMGMT 615's premise statement: \"A story about Dana Ortiz, a newly promoted operations manager at a\nregional distribution center, who struggles to find the real causes of her site's slipping\nperformance and coach, delegate, communicate and hire her way to a fix when leadership has\nalready decided who to blame.\"\n\nDana leads three shift leads and about 45 associates. She was promoted eight months ago from\ntop-performing day-shift lead, and this is her first time managing managers. Her peers each see\nthe problem differently. Her night-shift lead agrees with the director, partly because the\nbroken handoff makes night shift look good. Her day-shift lead, Jordan, is capable but avoids\nhard calls and is getting defensive. A manager at a sister site has the data that shows the\nhandoff problem but thinks Dana should replace Jordan anyway. Dana values fairness and remembers\nwhat it was like to be managed badly. She fears pushing back on her director and being wrong.\n\n### Draft (full build)\n\nTwo AI calls. First the AI asks \"Which CLO names the decision your students will face most\noften?\" and \"Describe a moment from your field where a capable professional got this decision\nwrong, or nearly did,\" then offers performance and conflict pairs to pick from. Then it drafts\nthe profile from the chosen pair.\n\nPerformance and conflict, AI instructions and demo:\n\nAI instructions:\n\n```text\nFrom the CLOs, the learner profile and the faculty member's answers, propose two or three\nperformance and conflict pairs for a course storyline. Each performance is one sentence tied to\na named CLO. Each conflict pushes directly against that performance and is a judgment problem,\nnot missing information. Prefer pairs that can recur across most modules. For each pair, list\nthe CLOs the conflict would put pressure on.\n\nReturn: {\"pairs\": [{\"performance\": string, \"clo\": string, \"conflict\": string, \"closTouched\": [string]}]}\n```\n\nDemo response (MGMT 615, if run as a full build):\n\n```json\n{\n  \"pairs\": [\n    {\"performance\": \"Diagnose why a team is underperforming before choosing a fix.\", \"clo\": \"CLO 1\", \"conflict\": \"Six weeks before peak season, the director has already blamed one shift lead. The evidence points to a speed bonus and an unowned shift handoff, which take longer to fix and mean questioning the director.\", \"closTouched\": [\"CLO 1\", \"CLO 2\", \"CLO 3\", \"CLO 4\", \"CLO 5\", \"CLO 6\"]},\n    {\"performance\": \"Justify a delegation call under time pressure.\", \"clo\": \"CLO 4\", \"conflict\": \"A new manager who was promoted for fixing problems personally is now the bottleneck, and handing work off risks a visible failure in her first year.\", \"closTouched\": [\"CLO 3\", \"CLO 4\", \"CLO 6\"]}\n  ]\n}\n```\n\nCharacter profile, AI instructions and demo:\n\nBoth tracks draft the character from scratch unless the uploaded document already has one. If\nit does, the refresh track checks it with the instructions under Review.\n\nAI instructions (draft):\n\n```text\nDraft a character profile from the chosen performance and conflict , the CLOs and the\nlearner profile. Include: premise statement in the form \"A story about [name, role] who\nstruggles to [performance] when [conflict].\", position (title, organization type, team size,\nexperience), conflict (specific to this person), 2 to 4 peers with contrasting views of the\nproblem, 2 or 3 values, 2 or 3 fears, and 3 or 4 backstory points. The role must be one the\nstudents could hold within a few years. The conflict must force the character to use the skills\nin the CLOs. Avoid real company names. Keep the whole profile under 400 words.\n\nReturn: {\"premise\": string, \"position\": [string], \"conflict\": string, \"peers\": [{\"name\": string, \"role\": string, \"view\": string}], \"values\": [string], \"fears\": [string], \"backstory\": [string]}\n```\n\nAI instructions (refresh, when a character exists):\n\n```text\nThe faculty member's existing character or recurring case is given. Check it against this\nchecklist: realistic role students could hold soon; enough authority to feel the decision;\nfaces constraints students will face; conflict pushes against a CLO-based performance; stakes\nare visible; more than one reasonable option. Keep what passes. For each gap, quote the\nproblem and suggest a specific addition. Then fill any missing profile parts.\n\nReturn: {\"passes\": boolean, \"issues\": [string], \"profile\": {...same shape as draft...}}\n```\n\nDemo response (MGMT 615): the course map has no character, so this step runs as a full build.\n\n```json\n{\n  \"premise\": \"A story about Dana Ortiz, a newly promoted operations manager at a regional distribution center, who struggles to find the real causes of her site's slipping performance and coach, delegate, communicate and hire her way to a fix when leadership has already decided who to blame.\",\n  \"position\": [\n    \"Operations manager, regional distribution center for a mid-size home-goods retailer\",\n    \"Leads 3 shift leads and about 45 hourly associates across two shifts; reports to a regional director\",\n    \"9 years in operations; promoted 8 months ago from top-performing day-shift lead; first time managing managers\"\n  ],\n  \"conflict\": \"Six weeks before peak season, on-time shipping has dropped from 97% to 89%. Her director, Greg Halvorsen, has named the cause: \\\"Jordan's shift is the problem. Fix him or replace him.\\\" Dana sees more. A pick-rate bonus rewards speed over accuracy, the handoff between shifts has no owner, and Jordan avoids hard calls with his crew. Blaming Jordan would satisfy Greg quickly. Fixing the causes takes longer, means questioning her boss and requires changes the crew won't like.\",\n  \"peers\": [\n    {\"name\": \"Ray Kowalski\", \"role\": \"Night-shift lead, 22 years on the floor\", \"view\": \"Agrees it's Jordan's fault, partly because the handoff problems make night shift look good.\"},\n    {\"name\": \"Jordan Pike\", \"role\": \"Day-shift lead, promoted 14 months ago under Dana\", \"view\": \"Capable and well liked, but avoids hard conversations with his crew. Senses he's being blamed.\"},\n    {\"name\": \"Alicia Grant\", \"role\": \"Operations manager at a sister site\", \"view\": \"Has the dashboards that show the handoff problem, but thinks Dana should replace Jordan and move on.\"},\n    {\"name\": \"Luis Ferreira\", \"role\": \"Associate, six years at the site\", \"view\": \"One of the most accurate pickers. Keeps missing the speed bonus because he won't cut corners.\"}\n  ],\n  \"values\": [\"Reliability: the trucks leave on time\", \"Fairness: decisions based on evidence, not on who's easiest to blame\", \"Loyalty to the floor: she remembers being managed badly\"],\n  \"fears\": [\"Pushing back on Greg and being wrong\", \"Losing the crew's trust when she changes a bonus they like\", \"Missing peak season in her first year and confirming doubts about her promotion\"],\n  \"backstory\": [\n    \"Started as a seasonal picker while finishing her degree and stayed because she liked solving floor problems\",\n    \"Known as the lead who \\\"just fixes it,\\\" which got her promoted and now tempts her to fix symptoms\",\n    \"Her first review as manager called her a bottleneck who wasn't growing her leads, which led her to the graduate program\",\n    \"Early in her career she watched a coworker get blamed and let go for a problem that turned out to be a broken process\"\n  ]\n}\n```\n\n### Review (refresh)\n\nEdit in place. The AI first looks for a throughline in the uploaded course map. If a character\nexists it is checked; if not, the full build runs.\n\nAI instructions:\n\n```text\nThe faculty member's existing modules, activities and materials are given. Look for a\nthroughline: a company, person, case or project that appears in more than one module. Report\nwhat you found and in which modules. Then say whether one of the existing cases could become\nthe course's central story, or whether the course needs a new character, and why. Finally\npropose one or two performance and conflict pairs, as in the full build, that fit what the\ncourse already teaches.\n\nReturn: {\"throughline\": {\"found\": boolean, \"items\": [{\"name\": string, \"modules\": [int]}]}, \"recommendation\": string, \"pairs\": [...]}\n```\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"throughline\": {\n    \"found\": false,\n    \"items\": [\n      {\"name\": \"Maria's First Ninety Days (case)\", \"modules\": [1]},\n      {\"name\": \"The Sales Contest That Backfired (case)\", \"modules\": [2]},\n      {\"name\": \"The Team That Couldn't Ship (case)\", \"modules\": [4]},\n      {\"name\": \"The Reorg Nobody Saw Coming (case)\", \"modules\": [7]}\n    ]\n  },\n  \"recommendation\": \"Each case appears in one module, with a different company each time. None can carry eight modules, but they share a situation: a new manager under pressure whose first answer is wrong. Build one new character in that situation. The existing cases can stay as contrasts in their modules.\",\n  \"pairs\": [\n    {\"performance\": \"Diagnose why a team is underperforming before choosing a fix.\", \"clo\": \"CLO 1\", \"conflict\": \"Leadership has already decided who to blame, and the real causes take longer to fix and mean questioning the boss.\", \"closTouched\": [\"CLO 1\", \"CLO 2\", \"CLO 3\", \"CLO 4\", \"CLO 5\", \"CLO 6\"]}\n  ]\n}\n```\n\n### Decide\n\nThe faculty member picks a pair, then edits each part of the profile. Any one part can be\nredrafted without the rest.\n\nChecklist:\n\n- Your students could hold this role within a few years.\n- There's more than one reasonable choice, so students ask \"What would I do?\"\n- All characters, companies and places are fictional.\n\n### Checks\n\nOn save: the performance comes from a CLO; the conflict pushes against it and isn't resolved by\nmore information; stakes are visible; the profile has all six parts; no real company names. In\nrefresh, the throughline finding is shown beside the character.\n\n### Save\n\nPlanning document: Character Profile in the Storyline section, after Tables 1 and 2 (see\n`export.md`). Module 3 adds the storyline premise and the Scenario rows.\nProject file: `story.performance`, `story.conflict`, `story.character`; in refresh,\n`story.throughline`.\n\n### Go deeper (optional)\n\n- `src:guide-storytelling`\n- `src:jobaid-media-selection-matrix`\n- `src:ext-greene-2020`\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Interaction statement: new, with a Wednesday activity check added\", \"Character and conflict: Dana Ortiz, new\"],\n  \"keptFlags\": [],\n  \"questions\": [\"Is the Wednesday check on inactive students realistic during heavy grading weeks?\", \"Does Dana's disagreement with her director need any care in how it's framed for students?\"]\n}\n```\n\nProject file: `checkins.prep.m2`.\n"}, {"id": "m3", "file": "03-scenario-planning.md", "raw": "# Module 3. Scenario Planning and the Learner's Journey\n\nModule id: `m3`\nSteps: 2\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: the course storyline premise and one scenario per module.\n\nRefresh checks for this module: each scenario calls for that module's objectives; pressure builds\nacross modules.\n\nNo refresh reflection in this module. Scenarios are new work for nearly every course. In the\nrefresh track, the AI builds scenarios from cases and examples the course already uses where\nthey fit.\n\nSources: `src:assignment-m3-identifying-scenarios`, `src:guide-storytelling`,\n`src:example-mgmt615-scenarios`, `src:example-mgmt615-episodes`, `src:example-mgmt615-character`,\n`src:example-mgmt615-course-map`\n\nDemo data: `demo/mgmt615-scenarios.json`\n\n---\n\n## 3.1 Your storyline\n\nTime: about 15 minutes\nPattern: interview, then draft (full build) or edit in place (refresh)\n\n### Learn\n\nIn Module 2 you built a character and named the conflict at the center of your course. The\nstoryline is what happens to that character from the first module to the last.\n\nAt the course level, the character has one long-term goal, and it lines up with your CLOs. Each\nmodule then puts a new obstacle or decision in the way. Some decisions move the character\ncloser to the goal, and some set them back. Because the same person keeps coming back, students\nsee how a decision in Module 2 shapes what is possible in Module 7, which is how the skills\nconnect on the job.\n\nA storyline premise keeps it focused. It's one sentence:\n\n\"[Course] is a story about [character, role] who struggles to [long-term goal] when [the\nconflict].\"\n\nA storyline works when:\n\n- **Pressure builds.** Early modules can start small. By the last few, more is at stake and the\n  character has fewer easy options.\n- **Every CLO gets a turn.** Each CLO should drive at least one module's decision.\n- **The details hold.** Names, numbers and relationships stay the same from module to module.\n- **The setting changes at least once.** A student who follows one character through one company\n  learns to reason about that company. To help students apply the thinking elsewhere, put at\n  least one scenario in a different setting, such as a sister site, a client or the character's\n  past job (Gick & Holyoak, 1983).\n\n### See it\n\nMGMT 615's storyline premise: \"MGMT 615 is a story about Dana Ortiz, a newly promoted operations\nmanager, who struggles to find and fix the real causes of her site's slipping performance before\npeak season, when her director has already decided who to blame.\"\n\nThe arc runs from Dana's first bad week in Module 1, when on-time shipping drops, to Module 8,\nwhen she hires the shift lead who will own the broken handoff for good. The pressure rises as\npeak season gets closer. By Module 5 she has to tell her director he's wrong, and by Module 6\npeak season has started.\n\n### Draft (full build)\n\nAI instructions:\n\n```text\nDraft a storyline for the course from the character profile, the conflict (step 2.4), the CLOs\nand the module titles and topics. Return:\n1. A storyline premise in the form \"[Course] is a story about [character, role] who struggles\n   to [long-term goal] when [conflict].\"\n2. An arc: one line per module giving a working episode title and the decision the character\n   faces, in module order. Each decision must call for that module's CLOs. Pressure should rise\n   across the modules.\n3. A one-sentence note on where pressure peaks.\nUse the character profile exactly as written. Do not change names, numbers or relationships.\n\nReturn: {\"premise\": string, \"arc\": [{\"module\": int, \"title\": string, \"decision\": string, \"clos\": [string]}], \"peak\": string}\n```\n\nDemo response (MGMT 615): the premise above, and the arc from the episode titles in\n`demo/mgmt615-scenarios.json`. Peak note: \"Pressure peaks in Module 5, when Dana has to\nchallenge her director with a week until his deadline.\"\n\n### Review (refresh)\n\nIf the uploaded document has a storyline, the app shows it and checks it. If not, this step runs\nas a full build.\n\nAI instructions:\n\n```text\nThe faculty member's existing storyline is given. Check it against this checklist: a premise\nnames the character, the long-term goal and the conflict; pressure builds across modules; every\nCLO drives at least one module; details stay consistent. Keep what passes. For each gap, quote\nthe problem and suggest a fix. Then return a premise and arc as in the full build.\n\nReturn: {\"passes\": boolean, \"issues\": [string], \"premise\": string, \"arc\": [...], \"peak\": string}\n```\n\nDemo response (MGMT 615): no storyline in the course map, so this step runs as a full build.\n\n### Decide\n\nThe faculty member edits the premise and the arc. Episode titles stay working titles until step\n3.2.\n\nChecklist:\n\n- The premise names the character, the goal and the conflict.\n- Pressure rises across the modules.\n- Every CLO drives at least one module's decision.\n- At least one module is in a different setting, if transfer matters for your course.\n\n### Checks\n\nOn save: the premise names the character, the goal and the conflict; every CLO drives at least\none module in the arc.\n\n### Save\n\nPlanning document: storyline premise at the start of the Storyline section.\nProject file: `story.premise`, `story.arc`.\n\n### Go deeper (optional)\n\n- `src:guide-storytelling`: Building Your Storyline, and the options for courses where one\n  character doesn't fit.\n- `src:ext-gick-holyoak-1983`\n\n---\n\n## 3.2 Scenarios for every module\n\nTime: about 45 minutes, about 5 minutes a module\nPattern: pick and combine, one module at a time (full build); edit in place (refresh)\n\n### Learn\n\nA scenario is one specific moment in your storyline: your character has to make a decision that\ncalls for that module's objectives. It doesn't need to be dramatic. It needs to be specific.\n\nLook for turning points. Reasonable professionals disagree about a decision. A plan looks sound\nuntil reality exposes a weakness. New data, or a stakeholder, forces a change in approach. A\nmistake is easy to make and costly to fix.\n\nEach scenario answers five questions:\n\n- **Situation.** What's the setting, and what was supposed to happen?\n- **Trigger.** What went wrong or became uncertain, and what new pressure appeared?\n- **Stakeholders.** Who is affected, and who else has something at stake?\n- **Decision.** What has to be decided, and which options are realistically on the table?\n- **Outcome and learning.** What changes at the end, and which idea from this module would have\n  improved the outcome?\n\nA good scenario can't be handled well without the module's skills, and its options are ones a\nprofessional could defend. If one option is obviously right, students learn to spot the answer\nthe course wants instead of making a judgment.\n\nA clear scenario now saves work later. The same moment can anchor a module overview, a\ndiscussion, an assignment and a cohort session.\n\nWork one module at a time, in order. The second half is usually where pressure peaks, and earlier\ndecisions can come back: in MGMT 615, the bonus Dana questions in Module 2 is the change she\nannounces in Module 7. A scenario that depends on an earlier decision shows students that the\nskills build on each other.\n\n### See it\n\nMGMT 615, Module 4, \"The Handoff Nobody Owns\":\n\n| | |\n|---|---|\n| Situation | The two shifts pass work to each other every afternoon, but no one owns the handoff. |\n| Trigger | The shift leads now blame each other for the late orders. Greg, the director, suggests a team-building lunch. |\n| Stakeholders | Both shift leads and their crews, Dana, Greg, customers. |\n| Decision | Host the lunch, hold a joint meeting to air the tension, or change the structure: name a handoff owner and add a shared checklist and an overlap window. |\n| Outcome and learning | A team-effectiveness framework shows the problem is unclear roles, so a lunch won't touch it. Dana has to explain to Greg why the structural fix beats his idea. |\n\n### Draft (full build)\n\nThe AI proposes two scenarios for each module. The faculty member picks one per module, edits it,\nor writes their own.\n\nAI instructions:\n\n```text\nPropose two scenario options for each of the given modules, using the storyline arc (step 3.1),\nthe character profile, the CLOs and each module's title, CLOs met and topics. Each option puts\nthe character in a moment of decision that calls for that module's CLOs. Use the character\nprofile exactly as written. For each option give: a short episode title; a premise in the form\n\"[Character] struggles to [decision] when [complication].\"; the CLOs it supports; situation;\ntrigger; stakeholders; decision with 2 or 3 realistic options a professional could defend;\noutcome and learning, naming the module concept that improves the outcome. Keep each element to\none or two sentences. The first option should follow the arc; the second can depart from it.\n\nReturn: {\"modules\": [{\"module\": int, \"options\": [{\"title\": string, \"premise\": string, \"clos\": [string], \"situation\": string, \"trigger\": string, \"stakeholders\": string, \"decision\": string, \"outcome\": string}]}]}\n```\n\nFor modules after the first, add:\n\n```text\nWhere it fits, connect a scenario to a decision the character made in an earlier module, and\nsay which one.\n```\n\nDemo response (MGMT 615): each module from `demo/mgmt615-scenarios.json`, with `chosen` as the\nfirst option and `alternative` as the second.\n\n### Review (refresh)\n\nIf the uploaded document has scenarios for these modules, the app checks them. Either way, the\nAI draws on the course's existing cases and examples.\n\nAI instructions:\n\n```text\nThe faculty member's existing scenarios for these modules are given, if any, along with each\nmodule's current activities and materials. For existing scenarios, check: the decision calls for\nthat module's CLOs; the options are ones a professional could defend; the stakes are visible;\ncharacter details match the profile. Keep what passes and suggest fixes for the rest.\nFor modules with no scenario, propose two options as in the full build. Where an existing case\nor example fits, build an option from it and name the case.\n\nReturn: {\"modules\": [{\"module\": int, \"existing\": {\"passes\": boolean, \"issues\": [string]} | null, \"options\": [...]}]}\n```\n\nDemo response (MGMT 615): no scenarios in the course map, so the full-build options play, with\none note added to Module 1: \"Your existing case, Maria's First Ninety Days, covers the same\nmoment from another company. Keep it as a contrast: students compare Maria's first quarter with\nDana's first bad week.\"\n\n### Decide\n\nFor each module the faculty member picks an option, edits it, or writes their own. They can ask\nfor new options for one module without redoing the others.\n\nChecklist (for each scenario):\n\n- The decision can't be made well without this module's skills.\n- There are two or three options a professional could defend.\n- The stakes are visible.\n- Names, numbers and relationships match your character profile.\n\n### Checks\n\nOn save of each scenario: the decision calls for the module's CLOs; two or three defensible\noptions; character details match the profile.\n\nWhen all scenarios are saved, a storyline check runs across them and shows flags on the modules\ninvolved.\n\nAI instructions:\n\n```text\nCheck the eight saved scenarios as one storyline against the character profile and the CLOs:\n1. Pressure rises across the modules.\n2. Every CLO drives at least one scenario's decision.\n3. Names, numbers and relationships match the profile and each other.\n4. No two scenarios turn on the same decision.\n5. At least one scenario uses a different setting.\nReturn one result per check: pass, or issue with the module(s) involved and a one-sentence fix.\n\nReturn: {\"checks\": [{\"check\": string, \"result\": \"pass\" | \"issue\", \"modules\": [int], \"detail\": string | null}]}\n```\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"checks\": [\n    {\"check\": \"Pressure rises\", \"result\": \"pass\", \"modules\": [], \"detail\": null},\n    {\"check\": \"Every CLO drives a decision\", \"result\": \"pass\", \"modules\": [], \"detail\": null},\n    {\"check\": \"Details are consistent\", \"result\": \"pass\", \"modules\": [], \"detail\": null},\n    {\"check\": \"No repeated decisions\", \"result\": \"pass\", \"modules\": [], \"detail\": null},\n    {\"check\": \"A different setting\", \"result\": \"issue\", \"modules\": [1, 2, 3, 4, 5, 6, 7, 8], \"detail\": \"Every scenario takes place at Dana's site. Consider setting one, such as Module 6, at the sister site Alicia runs.\"}\n  ]\n}\n```\n\nDemo kept note: MGMT 615's check passed with one note: every scenario takes place at Dana's site. The instructor\nkept it, with the note \"Module 5 uses data from a sister site, and the existing cases in Modules\n1, 2, 4 and 7 give students other companies to compare.\"\n\n### Save\n\nPlanning document: the Scenario row in Tables 1 and 2 (episode title and premise).\nProject file: `modules[].scenario` (all five elements, title, premise and CLOs); `alignment.m3`.\n\n> Review note: the MGMT 615 scenarios now use the revised CLO numbers from step 1.3. Module 8\n> maps to CLO 6 (hiring) instead of CLO 4. Module 2's alternative (\"Luis Checks Out\"), Module 4's\n> (\"Two Shifts, Two Rulebooks\") and Module 7's (\"The Overlap Window\") are new, written to give the\n> AI two options in every module. The other alternatives are the side plots from\n> `src:example-mgmt615-character`.\n\n### Go deeper (optional)\n\n- `src:guide-storytelling`: includes scenario planning, which you'll do with your ID during\n  development for scenarios that need production.\n- `src:jobaid-media-selection-matrix`\n- `src:guide-active-learning`\n- `src:guide-adult-learners`\n- `src:ext-mayer-2021`\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Storyline premise: new\", \"Scenarios for all eight modules: new\"],\n  \"keptFlags\": [\"Every scenario is at Dana's site: Module 5 uses sister-site data, and existing cases give other companies to compare\"],\n  \"questions\": [\"Which scenarios are worth producing as video, and which work as readings or discussion cases?\", \"Does the Module 5 scenario, where Dana challenges her director, need framing for students?\"]\n}\n```\n\nProject file: `checkins.prep.m3`.\n"}, {"id": "m4", "file": "04-activities-and-ai.md", "raw": "# Module 4. Intentional AI Implementation for Engagement & Feedback\n\nModule id: `m4`\nSteps: 2\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: learning activities for every module, including third-party tools, checked\nautomatically for RSI, workload and AI risk, and a week-in-your-student's-shoes review of each\nmodule.\n\nRefresh checks for this module: at least two RSI categories of instructor activity per module;\nabout 10 hours of student work a week; major assessments that AI could complete without student\nthinking.\n\nSources: `src:reading-m4-crafting-part-1`, `src:reading-m4-crafting-part-2`,\n`src:assignment-m4-assessment-interaction-plan`, `src:assignment-m4-course-tutor`,\n`src:guide-learning-activities`, `src:guide-rubrics`, `src:guide-third-party-tools`,\n`src:example-mgmt615-course-map`\n\nDemo data: `demo/mgmt615-activities.json`\n\n## Refresh reflection\n\nShown once, in the refresh track only, before step 4.1. It asks only about activities and\nassessments the course already has. AI and XR, which most courses are adding for the first\ntime, are left out.\n\nPrompt shown: \"Think about the activities and assessments in the last version of this course.\nAnswer whichever of these apply.\"\n\n1. Which activities gave you the best evidence of what students could do? Which gave you the\n   weakest?\n2. Where did grading take more time than it was worth?\n3. Have you seen work that looked like a student let AI do the thinking? On which activities?\n4. Which activities would you keep exactly as they are?\n\nAI instructions (added to each Review step in this module): same as the Module 1 reflection\ninstruction.\n\nDemo answers (MGMT 615):\n\n1. \"The feedback scripts were the weakest. The team memo was the strongest because students had\n   to pick a fix and defend it.\"\n2. \"The Management Approach Summary in the last week. Forty reflections, and most said the same\n   things.\"\n3. \"The feedback scripts again. Several read like they came from the same template.\"\n4. \"The cohort roundtables and the delegation memo.\"\n\nProject file: `reflection.m
