n\n\n### Go deeper (supplemental)\n\n- `src:guide-script-writing`\n- `src:template-av-script`\n- `src:tool-scriptwise`: an AI tool for developing scripts. Any AI tool can also help: paste in\n  your draft and ask it to tighten the wording for the ear or cut it to length.\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Media plan for all eight modules, 9.5 to 14 minutes each\", \"Module overview videos added for every module\", \"Discussion primers replaced with scenario videos\", \"Module 1 overview script drafted\"],\n  \"keptFlags\": [\"Module 3 teaching video at 7 minutes, in two parts\"],\n  \"questions\": [\"Can all eight overviews be recorded in one XR stage session?\", \"Which scenario videos can Learning Media produce this term?\"]\n}\n```\n\nProject file: `checkins.prep.m6`.\n"}, {"id": "m7", "file": "07-cohort-sessions.md", "raw": "# Module 7. Cohort Session Planning\n\nModule id: `m7`\nSteps: 2\nID check-in: live review of this module's sections, at the end of the week or sooner\n\nFaculty complete: a cohort session for each of Modules 2 to 8, planned as a decision point, and the\nfirst session ready to broadcast from the XR stage.\n\nRefresh checks for this module: each cohort session passes the recording test.\n\nSources: `src:reading-m7-going-live`, `src:reading-m7-active-learning-tools`,\n`src:assignment-m7-cohort-planning`, `src:assignment-m7-cohort-materials`,\n`src:guide-cohort-sessions`, `src:template-run-of-show`, `src:example-mgmt615-course-map`\n\nDemo data: `demo/mgmt615-cohort.json`\n\n## Refresh reflection\n\n> App note: Shown once, in the refresh track only, before step 7.1. It asks only about sessions the\n> course has already run.\n\n::: purpose\n**What you'll do:** Answer a few questions about the cohort sessions in the last version of your\ncourse. Answer whichever apply; short notes are fine.\n\n**Why it matters:** The AI uses your answers when it reviews each section in this module, so its\nsuggestions reflect what actually happened in your course.\n:::\n\n1. Which sessions drew the most students, and which the fewest?\n2. When did the room go quiet, and when was it hard to stop the conversation?\n3. What do students say about the sessions?\n4. Which sessions would you keep exactly as they are?\n\n> App note: AI instructions are the same as the Module 1 reflection instruction.\n\nDemo answers (MGMT 615): (1) \"The role-plays and the mock interview. The roundtables in Modules 2\nand 4 were thin.\" (2) \"Quiet when I asked open questions to the whole room.\" (3) \"They like the\nbreakouts.\" (4) \"The mock interview panel.\"\n\nProject file: `reflection.m7`.\n\n---\n\n## 7.1 Cohort sessions for Modules 2 to 8\n\nTime: about 40 minutes, about 5 minutes a module\nPattern: pick and combine, one module at a time (full build); edit in place (refresh)\n\n### Learn\n\n::: purpose\n**What you'll do:** Plan a cohort session, a 90-minute live class on Zoom, for each of Modules 2 to\n8, with at least one part students can only get by being there.\n\n**Why it matters:** Students don't skip sessions because they're recorded; they skip sessions that\noffer nothing the recording doesn't (Morris et al., 2019).\n:::\n\nFlex Online courses hold one each week from Module 2 to Module 8; Module 1 has none. Attendance is\noptional and every session is recorded, so students decide each week whether to come or watch later.\n\n**The recording test.** Ask: if a student watched only the recording, what would they have\nmissed? If the answer is nothing, they'll watch it later. A session passes when at least one\npart depends on who's in the room. Students get five things live that a recording can't give\nthem:\n\n| What students get live | What it looks like |\n|---|---|\n| Feedback on their own work | Students bring a draft of the next assignment and get responses |\n| Applying the concept to their own job | Students map the week's framework onto a problem at work |\n| Practice with peers | Students rehearse a conversation, pitch, or negotiation in breakouts |\n| Your judgment on a messy case | You work through a case with no clean answer and explain your reasoning |\n| A preview of the next assessment | Students work a problem shaped like the next assignment with you there |\n\nReviewing the reading or lecturing on new material belongs in the asynchronous content.\n\n**Your story as a live decision.** Let the week's materials carry the scenario up to the\ndecision, then stop. The session is where students make the call: vote on the character's\noptions and argue the split, role-play the hard conversation in threes (one observer gives\nhesitant students a way in), or give each group a different piece of evidence so the picture\nonly comes together in the debrief.\n\n**Quiet rooms.** Over a third of distance learners feel stressed when asked to participate live\n(Donelan et al., 2025). Start with a poll or the chat, then small groups, then the whole room.\n\n**RSI.** A session built this way is facilitated discussion (category 4) every week, often with\nfeedback (2) or direct instruction (1) as well.\n\n**Your Instructional Technologist** runs Zoom, polls, breakouts, captions, and timers, if they know\nthe plan. Note poll wording, breakout sizes and timing, and anything to drop in the chat.\n\n### See it\n\nMGMT 615 Module 5, \"Telling Greg He's Wrong\": students voted on Poll Everywhere during the week on\nhow Dana should answer her director. The session opens with the split, runs 45 minutes of\nrole-play in threes (Dana, Greg, observer), then two volunteers replay their conversation for the\nclass and get the instructor's feedback.\n\n### Draft (full build)\n\nAI instructions:\n\n```text\nFor the given module, using its scenario, activities, and the learner profile, propose two\nversions of a 90-minute cohort session. Each gives: a title; the decision it centers on; which\nof the five live benefits it offers (feedback on own work, own job, practice with peers,\ninstructor judgment, assessment preview); 3 to 5 timed segments that start low-stakes (poll or\nchat) before small groups; the RSI categories it shows; and setup needs for the Instructional\nTechnologist (poll wording, breakout sizes and timing, chat links). It must pass the recording\ntest: name the moment that depends on who is in the room.\n\nReturn: {\"versions\": [{\"title\": string, \"decision\": string, \"live\": string, \"segments\": [string], \"rsi\": [int], \"setup\": [string], \"liveMoment\": string}]}\n```\n\nDemo response (MGMT 615, if run as a full build): each module from `demo/mgmt615-cohort.json`.\n\n### Review (refresh)\n\nEdit in place. The app lists each module's current session from the upload.\n\nAI instructions:\n\n```text\nFor each current cohort session, apply the recording test: name what a student who watched only\nthe recording would miss, or say \"nothing.\" Check it connects to the module's scenario or\nactivities, starts low-stakes, and gives the Instructional Technologist enough to set up. Use\nthe faculty member's reflection on attendance and quiet moments. Suggest keep or revise; for a\nrevision, keep the session's purpose and add one live moment.\n\nReturn: {\"sessions\": [{\"module\": int, \"original\": string, \"missed\": string, \"action\": \"keep\" | \"revise\", \"issues\": [string], \"revision\": {...same shape as full build...} | null}]}\n```\n\nDemo response (MGMT 615): `review` notes in `demo/mgmt615-cohort.json`. The Module 2 and 4\nroundtables failed the recording test, matching the reflection that they were thin; both got a\nlive moment.\n\n### Decide\n\nChecklist (for each module):\n\n- You can name what a student watching the recording would miss.\n- The session starts with something low-stakes.\n- Setup needs are clear enough for your Instructional Technologist.\n\n### Checks\n\nOn save of each module: passes the recording test; ties to the module's scenario or activities;\nstarts with a poll, chat, or small group; shows at least one RSI category; segments total about 90\nminutes. The week-in-your-student's-shoes walk-through refreshes with the session.\n\n### Save\n\nPlanning document: Learning Activities Plan Part 3 (Cohort Session Activities) row in Tables 1\nand 2, for example \"Telling Greg He's Wrong: role-play in threes after a week-long poll.\"\nProject file: `modules[].cohort`; in refresh, `.original`, `.changeNote`.\n\n### Go deeper (supplemental)\n\n- `src:reading-m7-going-live`: the research behind the recording test, and eight ways to use\n  your story live.\n- `src:reading-m7-active-learning-tools`\n- `src:guide-cohort-sessions`\n\n---\n\n## 7.2 Ready for the stage\n\nTime: about 25 minutes\nPattern: interview, then draft\n\n### Learn\n\n::: purpose\n**What you'll do:** Draft the run of show for your first cohort session: a minute-by-minute plan for\nthe people who run the session with you.\n\n**Why it matters:** Sessions are broadcast live from the XR stage. The run of show is how Learning\nDelivery and your Instructional Technologist set up polls, breakouts, and slides before you go live.\n:::\n\nThe run of show is a preparation template. It lists what happens minute by minute: segments, slides,\npolls, breakouts, and anything that goes in the chat. You'll have 30 minutes of setup before each\nsession.\n\nBefore your first session, schedule a practice session on the stage with Learning Delivery. It's\nthe time to try the polls and breakouts, find where to look, and get comfortable with the\nsetting.\n\nDuring development you'll do the rest with your ID, along with slides and a student-facing outline.\nKeep slides accessible: readable contrast, real text instead of text in images, and nothing\nimportant only on a slide.\n### See it\n\nMGMT 615's Module 2 run of show, first rows:\n\n| Time | Segment | What happens | Setup |\n|---|---|---|---|\n| 0:00 | Welcome | Instructor greets the class and recaps Dana's situation: the bonus, the error rates, and Luis | Slide 1 |\n| 0:10 | Split evidence | Breakouts of three. Each group gets one piece of evidence: the bonus data, Luis's record, or the crew's view | Three breakout handouts; 30 minutes, with a timer |\n| 0:40 | Recommend | Groups combine their evidence and recommend: keep, adjust, or replace the bonus | Regroup breakouts; 35 minutes |\n\n### Draft (full build) and Review (refresh)\n\nThe AI asks which session to prepare (usually Module 2, the first session students attend) and two\nquestions: \"Is there a point where you'll need help from your Instructional Technologist that\nisn't obvious?\" and \"How do you want to end?\"\n\nAI instructions:\n\n```text\nTurn the saved cohort session for the chosen module into a run of show: rows with start time,\nsegment, what happens (what the instructor says or asks and what students do) and setup needs\n(slides, poll with exact wording and options, breakout size and duration, chat links, timers).\nTotal 90 minutes. Include a two-minute buffer before the close. Use the faculty member's answers.\n\nReturn: {\"module\": int, \"rows\": [{\"time\": string, \"segment\": string, \"happens\": string, \"setup\": string}]}\n```\n\nRefresh track: an existing run of show or lesson plan can be uploaded and checked against the\nsame instructions.\n\nDemo response (MGMT 615): the Module 2 run of show, opening as under See it.\n\n### Decide\n\nChecklist:\n\n- The minutes add up to 90.\n- Every poll has its exact wording and options.\n- You've asked to schedule a practice session on the XR stage with Learning Delivery.\n\n### Checks\n\nOn save: total time is 90 minutes; every poll and breakout has its setup details.\n\n### Save\n\nPlanning document: nothing new; the session's line gains \"run of show drafted.\"\nDownload: the run of show as a Word file, to share with Learning Delivery and your Instructional\nTechnologist. There's nothing to fill out or submit; it's there to show and share.\nProject file: `runOfShow[]`.\n\n\n---\n\n## Check-in prep\n\nSame instructions as Module 1.\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"changed\": [\"Cohort sessions for Modules 2 to 8\", \"Module 2 and 4 roundtables given a live moment\", \"Module 2 run of show drafted\"],\n  \"keptFlags\": [],\n  \"questions\": [\"When can I practice on the XR stage before the first session?\", \"Can the Instructional Technologist show the week's Poll Everywhere results at the start of Module 5?\"]\n}\n```\n\nProject file: `checkins.prep.m7`.\n"}, {"id": "m8", "file": "08-readiness-and-teaching.md", "raw": "# Module 8. Development Readiness and Sustainable Teaching\n\nModule id: `m8`\nSteps: 2\nID check-in: live review of the finished plan; the ID then schedules the kick-off meeting\n\nFaculty complete: a final check of the whole planning document, and the communication and\nfeedback plan.\n\nRefresh checks for this module: the planning document is complete and aligned; announcement and\nfeedback routines are in place.\n\nSources: `src:reading-m8-preparing-for-development`, `src:assignment-m8-course-planning-document`,\n`src:guide-online-teaching-practices`, `src:guide-grading-weight`, `src:guide-large-enrollment`,\n`src:guide-rsi`, `src:example-mgmt615-course-map`\n\n## Refresh reflection\n\n> App note: Shown once, in the refresh track only, before step 8.1. It asks only about how the\n> course was taught last time.\n\n::: purpose\n**What you'll do:** Answer a few questions about how you communicated with students and gave\nfeedback the last time you taught the course. Answer whichever apply; short notes are fine.\n\n**Why it matters:** The AI uses your answers when it reviews each section in this module, so its\nsuggestions reflect what actually happened in your course.\n:::\n\n1. How did students hear from you each week, and did it hold up in the busiest weeks?\n2. Where did grading and feedback take the most time?\n3. What did students say about feedback?\n4. Which routines would you keep exactly as they are?\n\n> App note: AI instructions are the same as the Module 1 reflection instruction.\n\nDemo answers (MGMT 615): (1) \"Monday announcements, but they slipped mid-term.\" (2) \"The\nManagement Approach Summary and the memos.\" (3) \"They wanted it faster.\" (4) \"Monday\nannouncements, when I kept them up.\"\n\nProject file: `reflection.m8`.\n\n---\n\n## 8.1 Check the whole plan\n\nTime: about 25 minutes\nPattern: edit in place\n\n### Learn\n\n::: purpose\n**What you'll do:** Run every check across your whole planning document and fix what it flags,\nmodule by module.\n\n**Why it matters:** Your ID builds the course from this document, and it's much easier to adjust the\nplan now than to rebuild a module in development.\n:::\n\nThe checks run across the whole document at once and show the results by module.\n\nFor each module you should be able to point to the story thread: the scenario and its decision,\nthe activity where students work through it, the materials that prepare them, the media it needs,\nand, in Modules 2 to 8, how the cohort session builds on it. If a piece is missing or doesn't connect, fix it now.\n\nThen look at the whole week. With activities, materials, media, and the cohort session all\nplanned, the week-in-your-student's-shoes walk-through can now show the full week: about 4 hours in\nModule 1 and close to 10 in the rest.\n\n### See it\n\nMGMT 615's final check found three things. Module 1 came to about 6.5 hours against a 4-hour\ntarget; the instructor made the sort optional and moved the book chapter to Module 2. The Module 6 thread had no media tied to the scenario;\nthe instructor noted that the AI teaching video carries the story through the scheduling tool.\nAnd Module 8 still ran heavy at about 11 hours; the instructor cut one reading to supplemental.\n\n### Draft (full build) and Review (refresh)\n\nSame for both tracks. No drafting; the AI runs the checks.\n\nAI instructions:\n\n```text\nCheck the whole planning document. For each module, confirm the story thread: scenario and\ndecision; an activity at the decision; materials that prepare students for it; media tied to the\nscenario or a note; a cohort session that builds on it. Total the week's hours (activities,\nreading at about 6 pages an hour for dense reading, video minutes, 90-minute cohort session) and\nflag Module 1 if it is far from about 4 hours, and any other week under 8 or over 11 hours. List every section that is empty or still a placeholder,\nand every earlier flag kept without a note. Then list the three most important fixes across the\ncourse, most important first.\n\nReturn: {\"modules\": [{\"module\": int, \"thread\": {\"scenario\": boolean, \"activity\": boolean, \"materials\": boolean, \"media\": boolean, \"cohort\": boolean}, \"hours\": number, \"flags\": [string]}], \"missingSections\": [string], \"unnotedFlags\": [string], \"topFixes\": [string]}\n```\n\nDemo response (MGMT 615):\n\n```json\n{\n  \"modules\": [\n    {\"module\": 1, \"thread\": {\"scenario\": true, \"activity\": true, \"materials\": true, \"media\": true, \"cohort\": null}, \"hours\": 6.5, \"flags\": [\"About 6.5 hours against a 4-hour target for the first week.\"]},\n    {\"module\": 6, \"thread\": {\"scenario\": true, \"activity\": true, \"materials\": true, \"media\": false, \"cohort\": true}, \"hours\": 9.5, \"flags\": [\"No media tied to the scenario 'Twelve Things on Dana's List'.\"]},\n    {\"module\": 8, \"thread\": {\"scenario\": true, \"activity\": true, \"materials\": true, \"media\": true, \"cohort\": true}, \"hours\": 11, \"flags\": [\"About 11 hours, the heaviest week.\"]}\n  ],\n  \"missingSections\": [],\n  \"unnotedFlags\": [],\n  \"topFixes\": [\"Lighten Module 1 to about 4 hours: make the sort optional and move the book chapter to Module 2.\", \"Lighten Module 8: move one reading to supplemental.\", \"Tie a Module 6 media item to Dana's list, or note why none is needed.\"]\n}\n```\n\nModules not listed passed every check.\n\n### Decide\n\nFor each flag, Fix (opens the section) or Keep with a note.\n\nChecklist:\n\n- Every module's story thread is complete, or the gap has a note.\n- Module 1 is about 4 hours, and every other week close to 10.\n- No section is empty.\n\n### Checks\n\nThis step is the check. Save final version becomes available when no flag is left without a fix\nor note.\n\n### Save\n\nPlanning document: no new section. The change log (refresh) and check-in summary are complete.\nProject file: `alignment.final`.\n\n### Go deeper (supplemental)\n\n- `src:guide-grading-weight`\n- `src:guide-large-enrollment`\n\n---\n\n## 8.2 Communication and feedback plan\n\nTime: about 30 minutes\nPattern: interview, then draft (full build) or edit in place (refresh)\n\n### Learn\n\n::: purpose\n**What you'll do:** Plan how you'll communicate with students each week: announcements, feedback,\nand answers to questions.\n\n**Why it matters:** In a Flex Online course the content does the presenting; your weekly job is to\nguide, respond, and give feedback. That's also how you meet RSI week after week.\n:::\n\nPlan it now, so it holds up in week ten, not just week one.\n\n**Announcements.** Plan a sequence for each module:\n\n- **Opening:** welcome to the module, where the story stands, the first thing to do.\n- **Midpoint:** what you're seeing in student work, and the concept people are missing.\n- **Before the cohort session:** what to prepare or bring.\n- **Closing:** what the module added up to and the next decision.\n\nThe opening and closing can be drafted ahead. The midpoint can't, because it responds to what\nstudents actually did; that's what makes it count as RSI. AI can draft any of them quickly. Edit\neach one so it sounds like you and reflects what's happening in your course.\n\n**Feedback.** Students want to know what they did well, what fell short, and what to change, along\nwith the grade. SpeedGrader's comment library, markup, clickable rubrics, and short audio , "title": "Draft Your Change Message", "pages": 2, "rights": "created", "supports": "Change message"}], "review": []}, {"module": 8, "pages": 19, "materials": [{"type": "Article", "title": "Han & Diallo (2023), Structured interviews outperform gut feel", "pages": 10, "rights": "library", "supports": "Scorecard and hiring memo"}, {"type": "Scenario exhibit", "title": "Two candidate files: Luis and the outside finalist", "pages": 2, "rights": "created", "supports": "Scorecard and hiring memo"}, {"type": "Interactive reading", "title": "Potential vs. Proven: Make the Call", "pages": 4, "rights": "created", "supports": "Hiring memo"}], "review": ["Scenario exhibits were missing from the plan for Modules 1, 2, 5, and 8. Resolution: added as created content."]}]}, "mgmt615-media.json": {"about": "Recorded demo data for Module 6 (MGMT 615, fictional). 'media' is each module's produced media after the refresh: kind (welcome, overview, teaching, scenario, closing, graphic, audio), title, minutes, where it's made (xr-stage, media-team, faculty-self), and its storyline connection. Curated videos belong to Module 5, not here. 'review' holds refresh flags and resolutions.", "modules": [{"module": 1, "minutes": 9.5, "media": [{"kind": "welcome", "title": "Welcome to MGMT 615", "minutes": 3, "where": "xr-stage", "story": "Introduces Dana and the drop in on-time shipping that starts the course"}, {"kind": "overview", "title": "Module 1 overview: What Managers Actually Do", "minutes": 2, "where": "xr-stage", "story": "Names Dana's first decision: work the floor or find the cause"}, {"kind": "scenario", "title": "The First Bad Week", "minutes": 2.5, "where": "media-team", "story": "Dana's Monday report and Greg's email, ending at her decision"}, {"kind": "graphic", "title": "Manager vs. individual contributor: where the time goes", "minutes": 0, "where": "media-team", "story": "Used in Dana's first-week case"}], "review": ["No module overview video in the course map for Modules 1 to 8; the first teaching video in each module partly does the job. Resolution: add a 2-minute overview per module, recorded on the XR stage in one session."]}, {"module": 2, "minutes": 10, "media": [{"kind": "overview", "title": "Module 2 overview: Motivating People", "minutes": 2, "where": "xr-stage", "story": "Picks up the bonus problem"}, {"kind": "teaching", "title": "Motivation Isn't One Thing", "minutes": 6, "where": "xr-stage", "story": "Applies expectancy theory to the pick-rate bonus"}, {"kind": "scenario", "title": "The Bonus That Backfired", "minutes": 2, "where": "media-team", "story": "Luis keeps missing the bonus he refuses to chase"}], "review": ["'Discussion Primer: The Incentive Trap' summarized an article without connecting to the story. Resolution: replaced by the scenario video."]}, {"module": 3, "minutes": 14, "media": [{"kind": "overview", "title": "Module 3 overview: Performance Management and Feedback", "minutes": 2, "where": "xr-stage", "story": "Greg wants a formal warning for Jordan"}, {"kind": "teaching", "title": "Giving Feedback That Actually Changes Behavior", "minutes": 7, "where": "xr-stage", "story": "Uses Jordan's handoff habit as the running example"}, {"kind": "scenario", "title": "Role-play: a coaching conversation with Jordan", "minutes": 5, "where": "media-team", "story": "Models the conversation Dana could have"}], "review": ["The 8-minute teaching video runs past 6 minutes. Resolution: kept at 7 minutes in two clearly marked parts."]}, {"module": 4, "minutes": 11, "media": [{"kind": "overview", "title": "Module 4 overview: Building and Leading Teams", "minutes": 2, "where": "xr-stage", "story": "The handoff nobody owns"}, {"kind": "teaching", "title": "Why Some Teams Just Work", "minutes": 6, "where": "xr-stage", "story": "Diagnoses the two-shift handoff with the framework"}, {"kind": "graphic", "title": "The 4:45 p.m. handoff, day shift to night shift", "minutes": 0, "where": "media-team", "story": "Shows what falls between the shifts"}, {"kind": "scenario", "title": "Structural Fixes vs. Pep Talks", "minutes": 3, "where": "media-team", "story": "Greg's team-building lunch against a handoff owner"}], "review": []}, {"module": 5, "minutes": 12, "media": [{"kind": "overview", "title": "Module 5 overview: Managing Conflict and Difficult Conversations", "minutes": 2, "where": "xr-stage", "story": "Greg wants a plan by Friday"}, {"kind": "teaching", "title": "The Conversation Managers Avoid", "minutes": 6, "where": "xr-stage", "story": "Maps Dana's disagreement with Greg to its root cause"}, {"kind": "scenario", "title": "Role-play: telling Greg he's wrong, done well and done badly", "minutes": 4, "where": "media-team", "story": "Two versions of Dana's conversation"}], "review": []}, {"module": 6, "minutes": 11.5, "media": [{"kind": "overview", "title": "Module 6 overview: Delegation and Decision-Making", "minutes": 2, "where": "xr-stage", "story": "Twelve things on Dana's list"}, {"kind": "teaching", "title": "The Delegation Trap", "minutes": 6, "where": "xr-stage", "story": "Sorts Dana's peak-season list"}, {"kind": "teaching", "title": "Where AI Helps, and Where It Doesn't, in Management Decisions", "minutes": 3.5, "where": "faculty-self", "story": "The scheduling tool that says cut a shift"}], "review": []}, {"module": 7, "minutes": 12, "media": [{"kind": "overview", "title": "Module 7 overview: Leading Through Change", "minutes": 2, "where": "xr-stage", "story": "The floor is calling it a pay cut"}, {"kind": "teaching", "title": "Why Change Announcements Fall Flat", "minutes": 6, "where": "xr-stage", "story": "Uses Dana's bonus change as the case"}, {"kind": "teaching", "title": "Rewriting a Change Message, Live", "minutes": 4, "where": "xr-stage", "story": "Rewrites Dana's first draft on screen"}], "review": []}, {"module": 8, "minutes": 13, "media": [{"kind": "overview", "title": "Module 8 overview: Hiring and Building Your Team", "minutes": 2, "where": "xr-stage", "story": "The new shift-lead role"}, {"kind": "teaching", "title": "Stop Hiring on Gut Feel", "minutes": 6, "where": "xr-stage", "story": "Builds the scorecard for Dana's two finalists"}, {"kind": "scenario", "title": "Proven vs. Potential", "minutes": 2.5, "where": "media-team", "story": "Luis and the outside candidate"}, {"kind": "closing", "title": "Course conclusion", "minutes": 2.5, "where": "xr-stage", "story": "Where Dana's story ends and what students take into their own teams"}], "review": []}]}, "mgmt615-scenarios.json": {"about": "Recorded demo data for Module 3, steps 3.2 and 3.3 (MGMT 615, fictional). 'chosen' is the scenario the demo faculty member keeps; 'alternative' is the second option the AI offers. CLO numbers follow the revised CLOs from step 1.4.", "storylinePremise": "MGMT 615 is a story about Dana Ortiz, a newly promoted operations manager, who struggles to find and fix the real causes of her site's slipping performance before peak season, when her director has already decided who to blame.", "modules": [{"module": 1, "chosen": {"title": "The First Bad Week", "premise": "Dana struggles to step back and find out why on-time shipping has dropped, when her instinct is to work extra floor shifts and push the number back up herself.", "clos": ["CLO 1", "CLO 5"], "situation": "Eight months into her first management job, Dana runs a distribution center with three shift leads and about 45 associates. Her job now is to hit site targets through her leads.", "trigger": "The Monday report shows on-time shipping down from 97% to 89%, six weeks before peak season. Her director, Greg, has already named the cause: \"Jordan's shift is the problem.\"", "stakeholders": "Dana; shift leads Jordan Pike and Ray Kowalski; the hourly crew; Greg; customers waiting on late orders.", "decision": "How to spend her week: work the floor to recover the number, accept Greg's read and focus on Jordan, or step back and find out what is driving the drop.", "outcome": "Working the floor would lift the number for a few days and hide the cause. Separating a manager's job from a lead's job shows Dana the habit she has carried over. She pulls the error reports instead, which starts the investigation that runs through the course."}, "alternative": {"title": "The Jammed Sorter", "premise": "Dana struggles to decide whether to clear a sorter jam herself or hand it to Jordan, with trucks waiting and the crew watching."}}, {"module": 2, "chosen": {"title": "The Bonus That Backfired", "premise": "Dana struggles to figure out why a bonus her crew is hitting is making performance worse, and why Luis, one of her most accurate associates, keeps missing it.", "clos": ["CLO 1", "CLO 5"], "situation": "The site pays a pick-rate bonus for speed. The crew is hitting its targets, but on-time shipping keeps falling.", "trigger": "Mis-picks and reworked orders are climbing. Luis keeps missing the bonus because he checks the orders others rush.", "stakeholders": "Luis and the crew who count on the bonus; Jordan and Ray; Greg; customers.", "decision": "Leave the bonus alone and coach for accuracy, add an accuracy threshold, or propose replacing it before peak season.", "outcome": "Expectancy theory explains the drop: the crew believes speed earns the reward, so speed is what they deliver. Dana takes Greg a revised bonus tied to accurate, on-time orders, which sets up Module 7."}, "alternative": {"title": "Luis Checks Out", "premise": "Dana struggles to re-engage Luis, passed over for a lead role last spring, when the only reward the site offers is a bonus he refuses to chase."}}, {"module": 3, "chosen": {"title": "The Conversation With Jordan", "premise": "Dana struggles to run a coaching conversation that changes how Jordan closes out his shift, when her director wants it documented as a formal warning.", "clos": ["CLO 2", "CLO 5"], "situation": "Dana needs Jordan, her day-shift lead, to change how he hands off to night shift. He came up under her and avoids hard conversations with his crew.", "trigger": "Orders keep slipping in the hour around shift change, and Jordan has turned defensive. Greg tells Dana to issue a formal warning.", "stakeholders": "Jordan; Dana; Greg; Ray, whose shift inherits the unfinished work; the day-shift crew.", "decision": "Issue the warning Greg wants, hold a coaching conversation with no record, or coach first and document only the next steps they agree on.", "outcome": "A warning would put Jordan on record without changing how he closes out his shift. Separating coaching from discipline lets Dana name one behavior and the change she expects, while keeping a record Greg can see."}, "alternative": {"title": "The Repeated Shortcut", "premise": "Dana struggles to decide whether a repeated safety shortcut on Ray's shift calls for coaching or for discipline."}}, {"module": 4, "chosen": {"title": "The Handoff Nobody Owns", "premise": "Dana struggles to fix the broken handoff between her two shifts with a structural change, when her director is pushing a team-building lunch.", "clos": ["CLO 3", "CLO 1"], "situation": "The two shifts pass work to each other every afternoon, but no one owns the handoff. Unfinished orders and staffing gaps fall between the leads.", "trigger": "Ray and Jordan now blame each other's shifts for the late orders. Greg suggests a team-building lunch to get everyone on the same page.", "stakeholders": "Jordan and Ray; both crews; Dana; Greg; customers.", "decision": "Host the lunch, hold a joint meeting to air the tension, or change the structure: name a handoff owner and add a shared checklist and an overlap window.", "outcome": "A team-effectiveness framework shows the problem is unclear roles and process, so a lunch won't touch it. Dana proposes the structural fix and has to explain to Greg why it beats his idea."}, "alternative": {"title": "Two Shifts, Two Rulebooks", "premise": "Dana struggles to get day and night shift working from one set of procedures, when each lead insists his shift's way is the reason it performs."}}, {"module": 5, "chosen": {"title": "Telling Greg He's Wrong", "premise": "Dana struggles to disagree with her director, using evidence, before he replaces Jordan for a problem Jordan didn't cause alone.", "clos": ["CLO 3", "CLO 2"], "situation": "Dana has data from Alicia Grant's dashboard showing late orders clustered around shift change on both shifts, and mis-picks rising since the bonus started.", "trigger": "Greg emails: \"Fix him or replace him. I want a plan by Friday.\" On a follow-up call he says he doesn't need a study.", "stakeholders": "Greg; Jordan, whose job is at risk; Dana, whose credibility is on the line; Ray and Alicia, who favor replacing Jordan; the crew.", "decision": "Send the replacement plan, agree to a warning and fix the handoff quietly, or ask for 30 minutes to walk Greg through the data and propose a two-week handoff fix first.", "outcome": "Mapping the conflict shows a process problem, which changes what the conversation is about. A structured plan lets Dana open with evidence instead of defending Jordan."}, "alternative": {"title": "Ray vs. Jordan", "premise": "Dana struggles to settle a floor argument between her shift leads that looks personal but is really about a process neither one owns."}}, {"module": 6, "chosen": {"title": "Twelve Things on Dana's List", "premise": "Dana struggles to decide which of her twelve peak-season responsibilities to keep and which to hand off, after a lead gets an overtime call wrong.", "clos": ["CLO 4", "CLO 5"], "situation": "Peak season has started. Dana has twelve responsibilities, from carrier escalations to overtime approvals, and her first review called her a bottleneck.", "trigger": "In the first week of the peak push, her leads miss an overtime rule. Dana's instinct is to take every overtime call back.", "stakeholders": "Dana; Jordan and Ray; associates working overtime; Greg; Alicia, who delegates heavily.", "decision": "Sort the list into keep, hand off, and hand off with checkpoints. The hardest call is who owns the shift handoff and overtime approvals.", "outcome": "A delegation framework helps Dana hand the shift handoff to one lead with a weekly checkpoint and keep overtime approvals for now, with a date to revisit. She has to justify that trade-off to Greg."}, "alternative": {"title": "The Scheduling Tool Says Cut", "premise": "Dana struggles to decide whether to follow an AI scheduling tool's recommendation to cut a shift, with a carrier deadline in two days and no time to check its assumptions."}}, {"module": 7, "chosen": {"title": "Ending the Bonus", "premise": "Dana struggles to announce a change to the bonus in a way her crew will understand and accept, when the floor already calls it a pay cut.", "clos": ["CLO 5", "CLO 3"], "situation": "Greg has approved Dana's revised bonus, which pays for accurate, on-time orders. It starts next pay period.", "trigger": "The crew likes the old bonus, and the fastest pickers earn more under it. Before Dana says anything, she hears people calling it a pay cut.", "stakeholders": "The crew; Luis, who stands to gain; Jordan and Ray, who will field questions; Greg; Dana.", "decision": "Send a written notice, have her leads announce it at shift start, or meet each shift herself and walk through what changes and why.", "outcome": "Naming the likely sources of resistance, such as lost income and distrust of a new manager, tells Dana what her message has to answer. She drafts it in plain language: what changes, when it starts, and how to earn the new bonus."}, "alternative": {"title": "The Overlap Window", "premise": "Dana struggles to introduce a thirty-minute shift overlap that both crews see as unpaid extra work."}}, {"module": 8, "chosen": {"title": "Proven vs. Potential", "premise": "Dana struggles to choose between an experienced outside candidate and Luis, a high-potential associate, for the new shift-lead role that will own the handoff.", "clos": ["CLO 6", "CLO 1"], "situation": "Dana has approval for a new shift-lead role that owns the handoff between shifts, the permanent fix for the gap that started the story.", "trigger": "Two finalists: an outside candidate who has run shift operations elsewhere, and Luis, highly accurate but never a supervisor. Ray backs the outside hire, and the crew is watching to see whether Luis gets a shot.", "stakeholders": "Luis; the outside candidate; Ray and Jordan; the crew; Greg.", "decision": "Hire the proven candidate, hire Luis, or hire one and build a development path for the other.", "outcome": "A structured scorecard tied to skills from earlier modules, like coaching and owning a handoff, keeps Dana from deciding on experience or loyalty alone. Whichever she picks, she has to justify the trade-off."}, "alternative": {"title": "Twenty Temps in Ten Days", "premise": "Dana struggles to hire twenty seasonal associates in ten days without falling back on gut feel."}}]}}, "sources": {"coursemap-v3": {"title": "Course Map, FODW II V3"}, "template-planning-doc": {"title": "Course Planning Document template"}, "tool-course-creator": {"title": "Course Creator 3.1.28"}, "reading-gs-flex-online-process": {"title": "Engaging in the Flex Online Process"}, "guide-course-development-process": {"title": "Flex Online Course Development Process", "citation": "TLI. (2026). Flex Online Course Development Process [Guide]."}, "ext-garrison-2000": {"title": "Critical inquiry in a text-based environment", "citation": "Garrison, D. R., Anderson, T., & Archer, W. (2000). Critical inquiry in a text-based environment: Computer conferencing in higher education. The Internet and Higher Education, 2(2-3), 87-105."}, "ext-richardson-swan-2003": {"title": "Examining social presence in online courses", "citation": "Richardson, J. C., & Swan, K. (2003). Examining social presence in online courses in relation to students' perceived learning and satisfaction. Journal of Asynchronous Learning Networks, 7(1), 68-88."}, "ext-pacansky-brock-2020": {"title": "How to humanize your online course", "citation": "Pacansky-Brock, M. (2020). How to humanize your online course.", "url": "https://brocansky.com/humanizing"}, "reading-m1-setting-the-foundation": {"title": "Setting the Foundation"}, "guide-course-alignment": {"title": "Course Alignment", "citation": "TLI. (2026). Course Alignment [Guide]."}, "guide-learning-objectives": {"title": "Course-Level Learning Objectives", "citation": "TLI. (2026). Course-Level Learning Objectives [Guide]."}, "assignment-m1-building-the-framework": {"title": "Building the Framework (full build)"}, "assignment-m1-redesign-and-refine": {"title": "Redesign and Refine (refresh)"}, "perusall-m1-clues-to-a-great-story": {"title": "The Clues to a Great Story"}, "ext-knowles-2015": {"title": "The adult learner", "citation": "Knowles, M. S., Holton, E. F., & Swanson, R. A. (2015). The adult learner (8th ed.). Routledge."}, "ext-wiggins-mctighe-2005": {"title": "Understanding by design", "citation": "Wiggins, G., & McTighe, J. (2005). Understanding by design (2nd ed.). ASCD."}, "ext-tamu-asc-bloom": {"title": "Bloom's taxonomy", "citation": "Academic Success Center, Texas A&M University. (n.d.). Bloom's taxonomy.", "url": "https://asc.tamu.edu/tutoring/bloom.html"}, "ext-cast-2018": {"title": "Universal Design for Learning guidelines", "citation": "CAST. (2018). Universal Design for Learning guidelines version 2.2.", "url": "https://udlguidelines.cast.org"}, "ext-anderson-krathwohl-2001": {"title": "A taxonomy for learning, teaching, and assessing", "citation": "Anderson, L. W., & Krathwohl, D. R. (Eds.). (2001). A taxonomy for learning, teaching, and assessing. Longman."}, "ext-freeman-2014": {"title": "Active learning increases student performance", "citation": "Freeman, S., Eddy, S. L., McDonough, M., Smith, M. K., Okoroafor, N., Jordt, H., & Wenderoth, M. P. (2014). Active learning increases student performance in science, engineering, and mathematics. PNAS, 111(23), 8410-84 const KEY = 'course-plan-builder-prototype:state';
let state = { track: null, done: {}, at: 'welcome', showAll: false, pick: {}, mods: {} };

function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) state = Object.assign(state, s); } catch (e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- content parsing ---------- */
// Faculty never see notes for reviewers or the app's builders: "> Review note" and "> App note"
// blocks, Pattern and AI-instructions labels, and project-file or browser storage details.
function stripNotes(text) {
  const out = []; let skipping = false, label = false;
  for (const line of text.split('\n')) {
    if (/^> (Review|App) note/.test(line)) { skipping = true; continue; }
    if (skipping && line.startsWith('>')) continue;
    skipping = false;
    if (/^(Project file|Browser only):/.test(line)) { label = true; continue; }
    if (label && line.trim() && !/^[A-Z][A-Za-z ]+: /.test(line)) continue;
    label = false;
    if (/^Pattern:/.test(line) || /^AI instructions[^:]*:\s*$/.test(line)) continue;
    out.push(line);
  }
  return out.join('\n');
}
function splitBy(text, marker) {
  const parts = []; let cur = { head: null, body: [] };
  for (const line of text.split('\n')) {
    if (line.startsWith(marker)) { parts.push(cur); cur = { head: line.slice(marker.length).trim(), body: [] }; }
    else cur.body.push(line);
  }
  parts.push(cur);
  return parts.map(p => ({ head: p.head, body: p.body.join('\n').trim() }));
}
function parseModule(m) {
  const text = stripNotes(m.raw);
  const title = (text.match(/^# (.+)$/m) || [, m.id])[1];
  const top = splitBy(text, '## ');
  const mod = { id: m.id, title, intro: top[0].body.replace(/^# .+$/m, '').trim(), reflection: null, prep: null, steps: [] };
  for (const sec of top.slice(1)) {
    if (/^Refresh reflection/.test(sec.head)) mod.reflection = sec.body;
    else if (/^Check-in prep/.test(sec.head)) mod.prep = sec.body;
    else {
      const subs = splitBy(sec.body, '### ');
      const lead = subs[0].body;
      const step = { key: sec.head.split(' ')[0], title: sec.head, lead, parts: {} };
      for (const s of subs.slice(1)) step.parts[s.head] = s.body;
      mod.steps.push(step);
    }
  }
  return mod;
}
let MODULES = DATA.modules.map(parseModule);

/* ---------- edit mode ----------

   can be applied to the content files by tools/apply_edits.py. A block is editable only when its
   source text occurs exactly once in its file. */

    if (!hay.includes(JSON.stringify(old)) || landed(hay, JSON.stringify(old), JSON.stringify(nu))) return false;
    const fix = v => Array.isArray(v) ? v.map(fix) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fix(x)])) : v === old ? nu : v;

function toMd(el, kind) {
  if (kind === 'pre') return el.innerText.replace(/ /g, ' ').replace(/\n+$/, '');
  if (kind === 'json') return el.innerText.replace(/ /g, ' ').replace(/\s+/g, ' ').trim();

    if (c.nodeType === 3) return c.nodeValue;

    if (c.dataset.cite) return '`src:' + c.dataset.cite + '`';
    if (!inner.trim()) return inner;

    if (t === 'EM' || t === 'I') return '*' + inner.trim() + '*';
    if (t === 'CODE') return '`' + inner + '`';
    if (t === 'A') return '[' + inner + '](' + c.getAttribute('href') + ')';

function recordEdit(el) {

    const cells = s.old.replace(/^\||\|$/g, '').split('|');
    cells[s.cell] = ' ' + now.replace(/\|/g, '/') + ' ';
    nu = '|' + cells.join('|') + '|';
  }
  if (!patch(s.file, s.kind, s.old, nu)) return;
  const prev = edits.find(e => e.file === s.file && e.kind === s.kind && e.new === s.old);
  if (prev) { prev.new = nu; if (prev.new === prev.old) edits.splice(edits.indexOf(prev), 1); }
  else edits.push({ file: s.file, kind: s.kind, old: s.old, new: nu, marker: s.marker, step: state.at });

function updateBar() {

function downloadEdits() {
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const day = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const blob = new Blob([JSON.stringify({ saved: d.toISOString(), edits }, null, 2)], { type: 'application/json' });

/* ---------- markdown ---------- */
function inline(s) {
  s = esc(s);
  s = s.replace(/`src:([a-z0-9-]+)`/g, (_, id) => {
    const src = DATA.sources[id];
    if (!src) return '<span class="cite" data-cite="' + esc(id) + '">' + esc(id) + '</span>';
    const label = esc(src.citation || src.title);
    return src.url ? '<a class="cite" data-cite="' + esc(id) + '" href="' + esc(src.url) + '" target="_blank" rel="noopener">' + label + '</a>' : '<span class="cite" data-cite="' + esc(id) + '">' + label + '</span>';
  });
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

}
function md(text, opts = {}) {

    '<p class="sub">Build your Course Planning Document, one module a week, with your ID.</p></div></div><div class="welcome">' +
    '<p>This prototype walks through the workshop with MGMT 615: Managing People and Performance, a fictitious course, and plays back recorded AI responses so the demo never depends on a live connection. Every step builds or reviews one section of the Course Planning Document; open it any time with <strong>Planning document</strong>.</p>' +
    '<h3>Choose a track</h3><div class="choice">' +
    '<button type="button" data-track="full" aria-pressed="' + (state.track === 'full') + '"><strong>Full build</strong>A new course, or a course rebuilt from the beginning. Each step drafts its section from your course details.</button>' +
    '<button type="button" data-track="refresh" aria-pressed="' + (state.track === 'refresh') + '"><strong>Refresh</strong>A course already developed and taught in the Flex Online program. You upload its Course Map, and each step reviews your current section with flags and suggested revisions.</button></div>' +
    '<div class="row"><button type="button" class="btn" data-next ' + (state.track ? '' : 'disabled') + '>Start</button>' +
    '<button type="button" class="btn sec" id="reset">Reset the demo</button></div></div>';
}
function findStep(go) {
  const [mid, key] = go.split(':');
  const m = MODULES.find(x => x.id === mid);
  return { m, key, step: m && m.steps.find(s => s.key === key) };
}
function aiPart(title, body) {
  // Setup steps with no AI draft: GS.1's connection test lives in Decide, so the section is dropped;
  // GS.2's course details show as a plain form section, without the AI tag or Draft button.
  if (/no AI draft/i.test(body)) {
    if (/^No AI draft\./.test(body.trim())) return '';
    return '<section class="part"><h3>Your course details</h3>' + md(body.replace(/ There's no AI draft in this step\./, '')) + '</section>';
  }
  // Everything from the first "Demo response" on is the recorded AI output, revealed by the button.
  const at = body.search(/(^|\n)Demo (response|answers)/);
  const before = at < 0 ? body : body.slice(0, at);
  const after = at < 0 ? '' : body.slice(at).replace(/^\n/, '').replace(/^Demo (response|answers)(\s*\([^)]*\))?[^:\n]*:[ \t]*\n?/, '');
  const recorded = after ? '<div class="demo-out" hidden><p class="crumb">Recorded response, MGMT 615</p>' + md(after) + '</div>' : '';
  // GS.2 refresh: the AI sorts an uploaded Course Map rather than reviewing a section.
  const sorting = /upload your Course Map/.test(body);
  if (sorting) title = 'Upload your Course Map';
  let intro = md(before, { hideDemo: true }), prompt = '';
  intro = intro.replace(/<details><summary>What the AI is asked to do<\/summary>[\s\S]*?<\/details>/g, m => { prompt += m; return ''; });
  return '<section class="part ai"><h3>' + esc(title) + ' <span class="tag">AI</span></h3>' + intro + recorded +
    demoFiles(body) +
    '<div class="row"><button type="button" class="btn" data-draft>' + (sorting ? 'Sort with AI' : title === 'Summary for your ID' ? 'Create summary' : state.track === 'refresh' ? 'Review with AI' : 'Draft with AI') + '</button><span class="thinking" hidden>Working…</span></div>' + prompt + '</section>';
}
function demoFiles(body) {
  const files = [...new Set((body.match(/demo\/mgmt615-[a-z]+\.json/g) || []))];
  return files.map(f => {
    const d = DATA.demo[f.replace('demo/', '')]; if (!d) return '';
    const v = d.modules ? d.modules.map(x => { const c = Object.assign({}, x); return c; }) : d;
    const was = CUR; CUR = { file: f, demo: f.replace('demo/', '') };
    const out = '<div class="demo-out" hidden><p class="crumb">Recorded responses, MGMT 615</p>' + renderValue(v) + '</div>';
    CUR = was; return out;
  }).join('');
}
// Refresh reflection: the questions, a box for the faculty member's answers, and the MGMT 615 answers as an example.
function reflectionPart(body) {
  const at = body.search(/(^|\n)Demo answers/);
  const before = at < 0 ? body : body.slice(0, at);
  const after = at < 0 ? '' : body.slice(at).replace(/^\n/, '').replace(/^Demo answers[^\n]*\n?/, '');
  return '<section class="part">' + md(before, { hideDemo: true }) +
    '<div class="field"><label for="refl">Your answers</label><textarea id="refl" rows="6"></textarea></div></section>' +
    (after ? '<section class="part example"><h3>See it <span class="tag">Example: MGMT 615 (fictitious course)</span></h3><p>Here\'s how the MGMT 615 instructor answered.</p>' + md(after) + '</section>' : '');
}
function renderStep(goKey) {
  const { m, key, step } = findStep(goKey);
  const src = DATA.modules.find(x => x.id === m.id);
  CUR = { file: src.file, mod: src };
  const mm = m.title.match(/^Module (\d+)\. (.+)$/);
  const crumb = '<div class="banner thin">' + bannerArt() + '<div class="txt">' + (mm ? '<p class="kicker">Module ' + mm[1] + '</p><p class="name">' + esc(mm[2]) + '</p>' : '<p class="name">' + esc(m.title) + '</p>') + '</div></div>';
  if (key === 'reflection' || key === 'prep') {
    let body = key === 'reflection' ? m.reflection : m.prep;
    // "Same instructions as Module 1." borrows Module 1's AI instructions for the summary.
    if (key === 'prep' && /^\s*Same instructions as Module 1\.\s*\n/.test(body)) {
      const m1 = MODULES.find(x => x.id === 'm1').prep;
      body = body.replace(/^\s*Same instructions as Module 1\.\s*\n/, m1.slice(m1.indexOf('```text'), m1.search(/\nDemo response/)) + '\n');
    }
    const t = key === 'reflection' ? 'Refresh reflection' : 'Check-in prep';
    const done = state.done[goKey];
    return crumb + '<h2 class="step">' + t + '</h2>' +
      (key === 'prep' ? '<section class="part"><div class="purpose"><p><strong>What you\'ll do:</strong> Review a one-minute summary of this module before your weekly check-in: what you built, any flags you kept, and two questions for your ID. Then select Ready for check-in.</p><p><strong>Why it matters:</strong> Your ID sees what changed before you meet, so your check-in time goes to decisions instead of catching up.</p></div></section>' + aiPart('Summary for your ID', body) : reflectionPart(body)) +
      '<div class="row"><button type="button" class="btn" data-save="' + esc(goKey) + '">' + (key === 'prep' ? 'Ready for check-in' : 'Save answers') + '</button>' + (done ? '<span class="done-note">Saved</span>' : '') + '</div>';
  }
  const p = step.parts;
  let h = crumb + '<h2 class="step"' + tag('title', step.title) + '>' + esc(step.title) + '</h2><div class="meta">' + md(step.lead) + '</div>';
  if (p['Learn']) h += '<section class="part"><h3>Learn</h3>' + md(p['Learn']) + '</section>';
  if (p['See it']) h += '<section class="part example"><h3>See it <span class="tag">Example: MGMT 615 (fictitious course)</span></h3>' + md(p['See it']) + '</section>';
  if (p['Write (no AI)']) h += '<section class="part"><h3>Your information <span class="tag">No AI</span></h3>' + md(p['Write (no AI)']) + '</section>';
  // A setup page (GS.1) has "Setup: ..." sections in place of Draft, Decide, and Save.
  const setup = Object.keys(p).filter(k => k.startsWith('Setup: '));
  for (const k of setup) h += '<section class="part"><h3>' + esc(k.slice(7)) + '</h3>' + md(p[k]) + '</section>';
  const both = p['Draft (full build) and Review (refresh)'];
  if (both) h += aiPart(state.track === 'refresh' ? 'Review' : 'Draft', both);
  else if (state.track === 'refresh' && p['Review (refresh)']) {
    if (/no AI draft/i.test(p['Draft (full build)'] || '')) h += aiPart('Draft', p['Draft (full build)']);
    h += aiPart('Review', p['Review (refresh)']);
  }
  else if (p['Draft (full build)']) h += aiPart('Draft', p['Draft (full build)']);
  if (p['Decide']) {
    // Join a list item's indented continuation lines first, so a long checklist item stays one item.
    const dec = p['Decide'].replace(/\n {2,}(?=\S)/g, ' ').replace(/(^|\n)- (.+)/g, '$1[[CHK]]$2');
    const parts = dec.split('\n'); let txt = [], checks = [], block = false;
    // List items inside a ::: block (such as answer boxes) stay in the text; the rest become the checklist.
    for (const l of parts) {
      if (/^:::/.test(l)) block = !block && !/^:::\s*$/.test(l);
      (l.startsWith('[[CHK]]') && !block ? checks : txt).push(block ? l.replace('[[CHK]]', '- ') : l.replace('[[CHK]]', ''));
    }
    // Steps with an AI draft or review let faculty redraft any one Decide box.
    const hasAI = !!(both || p['Review (refresh)'] || (p['Draft (full build)'] && !/no AI draft/i.test(p['Draft (full build)'])));
    h += '<section class="part" id="decide"><h3>Decide</h3>' + md(txt.join('\n').replace(/Checklist[^:\n]*:/, ''), { redraft: hasAI }) +
      (checks.length ? '<div class="checklist" role="group" aria-label="Checklist">' + checks.map((c, i) => '<label><input type="checkbox" id="c' + i + '"> <span' + tag('li', c, { marker: '- ' }) + '>' + inline(c) + '</span></label>').join('') + '</div>' : '') + '</section>';
  }
  if (p['Checks'] && !/^None\.?\s*$/.test(p['Checks'].trim())) h += '<section class="part" id="checks" hidden><h3>Checks <span class="tag">ran on save</span></h3>' + md(p['Checks']) +
    '<div class="flag ok">Every flag is fixed or has a note. This section is ready for your ID.</div></section>';
  if (p['Save']) h += '<section class="part"><h3>Save</h3>' + md(p['Save'].replace(/^Planning document:/gm, 'Goes into your Course Planning Document:').replace(/\s*\((?:[^()]*?;\s*)?see\s+`export\.md`\)/g, '')) + '</section>';
  if (p['Go deeper (supplemental)']) h += '<details class="part"><summary>Go deeper (supplemental)</summary>' + md(p['Go deeper (supplemental)']) + '</details>';
  h += '<div class="row"><button type="button" class="btn" data-save="' + esc(key) + '">' + (setup.length ? 'Finish setup' : 'Save to plan') + '</button>' +
    (state.done[key] ? '<span class="done-note">' + (setup.length ? 'Setup finished' : 'Saved to your planning document') + '</span>' : '') + '</div>';
  return h;
}

// "Use" buttons under an AI draft copy it into the step's final box in Decide, where the faculty member edits it.
let USE_TEXT = [];
function useButtons(sec) {
  const out = sec.querySelector('.demo-out'), key = state.at.split(':')[1], refresh = state.track === 'refresh';
  if (!out || out.dataset.used) return;
  out.dataset.used = '1';
  const btn = (label, text) => '<div class="row use"><button type="button" class="btn sec" data-use="' + (USE_TEXT.push(text) - 1) + '">' + label + '</button></div>';
  if (key === '1.2' && !refresh) out.querySelectorAll('li').forEach(li => li.insertAdjacentHTML('beforeend', btn('Use this version', li.textContent.trim())));
  if (key === '1.2' && refresh) {
    const p = [...out.querySelectorAll('p')].find(x => /^Suggested revision:/.test(x.textContent));
    if (p) p.insertAdjacentHTML('afterend', btn('Use this revision', p.textContent.replace(/^Suggested revision:\s*"?|"\s*$/g, '')));
  }
  if (key === '1.3' && !refresh) out.insertAdjacentHTML('beforeend', btn('Use these CLOs',
    [...out.querySelectorAll('li')].map(li => li.textContent.trim().replace(/^CLO \d+:\s*/, '').replace(/\s*\((Apply|Analyze|Evaluate|Create)\)$/, '')).join('\n')));
  if (key === '1.3' && refresh) out.insertAdjacentHTML('beforeend', btn('Use the suggested CLOs',
    [...out.querySelectorAll('tbody tr')].map(tr => {
      const c = [...tr.cells].map(td => td.textContent.trim());
      return c[2] || c[0].replace(/^CLO \d+:\s*/, '');
    }).join('\n')));
  if (key === '1.4') out.insertAdjacentHTML('beforeend', btn(refresh ? 'Use the suggested modules' : 'Use these modules',
    DATA.demo['mgmt615-foundation.json'].modules.map(m => m.title + '. ' + m.closMet.join(', ') + '. ' + m.topics.join('; ') + '.').join('\n')));
  // Module 2 drafts are labeled ("Statement:", "Performance:"); each label fills its own box under Decide, in order.
  const label = (root, name) => { const el = [...root.querySelectorAll('p, li')].find(x => x.textContent.startsWith(name + ':')); return el ? el.textContent.slice(name.length + 1).trim() : ''; };
  const listAfter = name => {
    const p = [...out.querySelectorAll('p')].find(x => x.textContent.trim() === name + ':'), ul = p && p.nextElementSibling;
    return ul && ul.tagName === 'UL' ? [...ul.children].map(li => li.textContent.trim()).join('\n') : '';
  };
  if (key === '2.1') {
    const p = [...out.querySelectorAll('p')].find(x => /^Statement:/.test(x.textContent));
    if (p) p.insertAdjacentHTML('afterend', btn('Use this statement', label(out, 'Statement').replace(/^"|"$/g, '')));
  }
  if (key === '2.2') out.querySelectorAll('ul').forEach(ul => {
    if (/^Performance:/.test(ul.textContent.trim())) ul.insertAdjacentHTML('afterend', btn('Use this pair', [label(ul, 'Performance'), label(ul, 'Conflict')]));
  });
  if (key === '2.3') out.insertAdjacentHTML('beforeend', btn('Use this profile', [label(out, 'Premise statement'), label(out, 'Position'),
    label(out, 'Conflict'), listAfter('Peers'), label(out, 'Values and fears'), listAfter('Backstory')]));
  if (key === '3.1') { const p = [...out.querySelectorAll('p')].find(x => /^Where pressure peaks:/.test(x.textContent)) || out.lastElementChild;
    p.insertAdjacentHTML('afterend', btn('Use this storyline', [label(out, 'Premise'), listAfter('Arc')])); }
  if (key === '3.2') {
    const c = DATA.demo['mgmt615-scenarios.json'].modules[pickOf('3.2') - 1];
    out.querySelectorAll('.scen-opt').forEach(o => o.insertAdjacentHTML('beforeend', o.dataset.opt === '1'
      ? btn('Use this scenario', SCEN_PARTS.map(([k]) => c.chosen[k] || ''))
      : btn('Use this scenario', [c.alternative.title, c.alternative.premise, '', '', '', '', ''])));
  }
  if (key === '4.1') {
    const m = DATA.demo['mgmt615-activities.json'].modules[pickOf('4.1') - 1], o = out.querySelector('.scen-opt');
    if (o) o.insertAdjacentHTML('beforeend', btn('Use these activities', [m.activities.map(actLine).join('\n')]));
  }
}

function downloadDoc() {

/* ---------- render and events ---------- */
function render() {
  document.querySelectorAll('header [data-track]').forEach(b => b.setAttribute('aria-pressed', String(state.track === b.dataset.track)));
  renderNav();
  SRC = []; CUR = null;
  $('#main').innerHTML = state.at === 'welcome' ? renderWelcome() : renderStep(state.at);
  $('#credits').innerHTML = 'Banner image: ' + credit('Storyline path', '');
  CUR = null;
  if (!$('#doc').hidden) $('#doc').innerHTML = renderDoc();
  decorate();
}
const editable = t => editing && t instanceof Element && t.closest('[data-s]');
document.addEventListener('focusout', e => { const el = editable(e.target); if (el) recordEdit(el); });
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.mfield; if (!k) return;
  const key = stepKey(), n = pickOf(key); state.mods = state.mods || {}; state.mods[key] = state.mods[key] || {};
  state.mods[key][n] = state.mods[key][n] || {}; state.mods[key][n][k] = e.target.value; save();
});
document.addEventListener('keydown', e => {
  const el = editable(e.target);
  if (el && el._s && e.key === 'Enter' && el._s.kind !== 'pre') { e.preventDefault(); el.blur(); }
});
document.addEventListener('paste', e => {
  if (!editable(e.target)) return;
  e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
});
// In edit mode, clicking text places the cursor instead of following a link or ticking a checkbox.
document.addEventListener('click', e => { if (editable(e.target) && e.target.closest('a, label')) e.preventDefault(); }, true);
document.addEventListener('click', e => {
  const t = e.target.closest('button, input'); if (!t) return;
  if (t.dataset.track) { state.track = t.dataset.track; save(); render(); return; }
  if (t.dataset.pickmod) {
    const key = stepKey(); state.pick = state.pick || {}; state.pick[key] = +t.dataset.pickmod; save(); render();
    const pick = document.querySelector('.scen-picker'); if (pick) { pick.scrollIntoView({ block: 'start' }); window.scrollBy(0, -70); document.querySelector('[data-pickmod="' + state.pick[key] + '"]').focus({ preventScroll: true }); }
    return;
  }
  if (t.dataset.mod) { navOpen[t.dataset.mod] = t.getAttribute('aria-expanded') !== 'true'; renderNav(); $('[data-mod="' + t.dataset.mod + '"]').focus(); return; }
  if (t.id === 'stepsBtn') { const open = document.body.classList.toggle('nav-open'); t.setAttribute('aria-expanded', String(open)); return; }
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.hasAttribute('data-next')) { next(); return; }
  if (t.id === 'reset') { state = { track: null, done: {}, at: 'welcome', showAll: false, pick: {}, mods: {} }; save(); render(); return; }
  if (t.hasAttribute('data-draft')) {
    const sec = t.closest('section'); const wait = sec.querySelector('.thinking');
    t.disabled = true; wait.hidden = false;
    setTimeout(() => { wait.hidden = true; t.textContent = 'Ask for another version'; t.disabled = false;
      sec.querySelectorAll('.demo-out').forEach(d => d.hidden = false); useButtons(sec); }, 900);
    return;
  }
  // GS.1 setup controls. The prototype acts them out; nothing is sent or saved.
  if (t.hasAttribute('data-testkey') || t.hasAttribute('data-noai')) {
    const form = t.closest('.form'), msg = form.querySelector('.setup-msg'), key = form.querySelector('#apikey');
    msg.classList.remove('warn');
    if (t.hasAttribute('data-noai')) {
      if (!confirm("Without the AI you'll write every section of your plan yourself. You won't get first drafts, checks on your work, or a review of your existing course. You can connect the AI later from Settings.")) return;
      msg.classList.add('warn'); msg.textContent = 'Continuing without AI. You can connect it later from Settings.'; return;
    }
    if (!key.value.trim()) { msg.classList.add('warn'); msg.textContent = 'Paste your key first. It starts with sk-.'; key.focus(); return; }
    const wait = form.querySelector('.thinking'); t.disabled = true; wait.hidden = false;
    setTimeout(() => { wait.hidden = true; t.disabled = false; msg.textContent = "Connected to TAMU AI Chat. (Demo: the key isn't sent anywhere.)"; }, 900);
    return;
  }
  if (t.hasAttribute('data-folder')) {
    const msg = t.closest('.row').nextElementSibling;
    msg.textContent = "In the finished tool, this opens your computer's folder picker. (Demo: no folder is chosen.)";
    return;
  }
  if (t.hasAttribute('data-check')) {
    const form = t.closest('.form'), box = form.querySelector('textarea'), msg = form.querySelector('.check-msg'), wait = form.querySelector('.thinking');
    if (!box.value.trim()) { msg.textContent = 'Write your answer first.'; box.focus(); return; }
    msg.textContent = ''; t.disabled = true; wait.hidden = false;
    setTimeout(() => { wait.hidden = true; t.disabled = false; form.querySelector('.demo-out').hidden = false; }, 900);
    return;
  }
  // Redraft with AI: a short note on what should change, then a new version of that box only.
  if (t.hasAttribute('data-redraft')) {
    const row = t.closest('.redraft-row'), open = row.nextElementSibling && row.nextElementSibling.classList.contains('redraft-panel');
    if (open) { row.nextElementSibling.remove(); t.setAttribute('aria-expanded', 'false'); return; }
    const id = 'rd' + (++formId);
    row.insertAdjacentHTML('afterend', '<div class="redraft-panel"><label for="' + id + '">What should change? (optional)</label><input id="' + id + '" type="text">' +
      '<p class="hint">For example: shorter, plainer, or more about the decision.</p>' +
      '<div class="row"><button type="button" class="btn sec" data-redraft-go>Redraft</button><button type="button" class="linkbtn" data-redraft-cancel>Cancel</button><span class="thinking" hidden>Working…</span></div>' +
      '<p class="setup-msg" role="status"></p></div>');
    t.setAttribute('aria-expanded', 'true'); document.getElementById(id).focus();
    return;
  }
  if (t.hasAttribute('data-redraft-cancel')) {
    const panel = t.closest('.redraft-panel'); panel.previousElementSibling.querySelector('[data-redraft]').setAttribute('aria-expanded', 'false'); panel.remove(); return;
  }
  if (t.hasAttribute('data-redraft-go')) {
    const panel = t.closest('.redraft-panel'), box = panel.closest('.field').querySelector('textarea'), msg = panel.querySelector('.setup-msg'), wait = panel.querySelector('.thinking');
    msg.classList.remove('warn');
    if (!box.value.trim()) { msg.classList.add('warn'); msg.textContent = 'Nothing to redraft yet. Copy the AI draft into this box, or type your own, first.'; return; }
    t.disabled = true; wait.hidden = false;
    setTimeout(() => { wait.hidden = true; t.disabled = false;
      msg.textContent = "Redrafted. (Demo: recorded responses don't change, so the text stays the same. In the finished tool, the AI rewrites only this box, using your note.)"; }, 900);
    return;
  }
  if (t.dataset.use) {
    // One text fills the first box; a list of texts fills the boxes in order.
    const boxes = [...document.querySelectorAll('#decide textarea')], vals = [].concat(USE_TEXT[+t.dataset.use]), box = boxes[0];
    if (!box) return;
    if (boxes.some((b, i) => i < vals.length && b.value.trim() && b.value !== vals[i]) && !confirm('Replace what is already in your boxes under Decide?')) return;
    vals.forEach((v, i) => { const b = boxes[i]; if (b) { b.value = v; b.rows = Math.max(b.rows, v.split('\n').length + 1, Math.ceil(v.length / 90) + 1); b.dispatchEvent(new Event('input', { bubbles: true })); } });
    let note = document.querySelector('#decide .use-note');
    if (!note) { box.insertAdjacentHTML('afterend', '<p class="use-note" role="status"></p>'); note = document.querySelector('#decide .use-note'); }
    note.textContent = 'Copied. Edit it here until it says what you mean.';
    box.scrollIntoView({ behavior: 'smooth', block: 'center' }); box.focus({ preventScroll: true });
    return;
  }
  if (t.dataset.save) {
    state.done[t.dataset.save] = true; save();
    const checks = $('#checks');
    render();
    const c2 = $('#checks'); if (c2) { c2.hidden = false; c2.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    const row = document.querySelector('[data-save]').parentElement;
    if (!row.querySelector('[data-next]')) row.insertAdjacentHTML('beforeend', '<button type="button" class="btn sec" data-next>Next step</button>');
    return;
  }
  if (t.id === 'docBtn') { const d = $('#doc'); d.hidden = !d.hidden; t.setAttribute('aria-expanded', String(!d.hidden)); if (!d.hidden) { d.innerHTML = renderDoc(); d.focus(); } return; }
  if (t.id === 'closeDoc') { $('#doc').hidden = true; $('#docBtn').setAttribute('aria-expanded', 'false'); $('#docBtn').focus(); return; }
  if (t.id === 'showAll') { state.showAll = t.checked; save(); $('#doc').innerHTML = renderDoc(); return; }
  if (t.id === 'download') { downloadDoc(); return; }
  if (t.id === 'editBtn' || t.id === 'doneEdit') { editing = t.id === 'editBtn' ? !editing : false; render(); return; }
  if (t.id === 'saveEdits') { if (edits.length) downloadEdits(); else alert('No changes to save yet.'); return; }
  if (t.id === 'undoEdits') {
    if (edits.length && confirm('Undo all ' + edits.length + ' changes? This can\'t be reversed.')) { edits = []; saveEdits(); location.reload(); }
    return;
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#doc').hidden) $('#closeDoc').click(); });
$('#doc').tabIndex = -1;
load(); loadEdits(); render();
</script>
</body>
</html>
